/* Módulo 26 · Actuación judicial y concursal */
CAMPUS.content[26] = {
lessons:[
 {lead:"El contador interviene en los juicios como perito, como consultor técnico de una parte o como síndico. Para eso necesita entender cómo funciona un proceso judicial.",
  html:`<h3>Etapas de un juicio ordinario</h3><ol><li><b>Demanda:</b> el actor presenta su reclamo.</li><li><b>Contestación:</b> el demandado responde, puede reconvenir.</li><li><b>Apertura a prueba:</b> el juez ordena producir las pruebas ofrecidas (documental, testimonial, informativa, pericial).</li><li><b>Alegatos:</b> las partes evalúan la prueba.</li><li><b>Sentencia</b> de primera instancia.</li><li><b>Recursos</b> ante la cámara de apelaciones y, eventualmente, ante la Corte Suprema.</li></ol>
  <h3>Roles del contador en un juicio</h3><ul><li><b>Perito de oficio:</b> designado por el juez, por sorteo entre los inscriptos en las listas del tribunal. Es auxiliar de la justicia y debe ser imparcial.</li><li><b>Consultor técnico:</b> propuesto por una de las partes para controlar la pericia y presentar su propio análisis. Defiende la posición de quien lo propone.</li><li><b>Síndico</b> en concursos y quiebras.</li><li>Otros: liquidador, interventor, administrador judicial, partidor.</li></ul>
  <h3>Fueros donde más actúa</h3><p>Comercial (contratos, sociedades, concursos), laboral (diferencias salariales, despidos), civil (daños, sucesiones), penal económico y tributario, contencioso administrativo federal.</p>
  <h3>Inscripción</h3><p>Para ser perito hay que inscribirse en las listas que lleva cada jurisdicción (en la justicia nacional, por intermedio del Consejo Profesional), con matrícula vigente.</p>`,
  ex:[{type:"order",title:"Ordená las etapas del juicio",items:["Demanda","Contestación de la demanda","Apertura a prueba","Producción de la pericia contable","Alegatos","Sentencia"]},
   {type:"pick",title:"¿Perito de oficio o consultor técnico?",options:["Perito de oficio","Consultor técnico"],items:[["Lo designa el juez por sorteo","Perito de oficio"],["Lo propone una de las partes","Consultor técnico"],["Debe ser imparcial","Perito de oficio"],["Defiende la posición de quien lo contrató","Consultor técnico"]]}]},
 {lead:"La pericia contable es el informe técnico que responde las preguntas que las partes y el juez le hacen al perito, sobre la base de libros y documentación.",
  html:`<h3>Puntos de pericia</h3><p>Son las preguntas que proponen las partes al ofrecer la prueba y que el juez fija. Por ejemplo: “Informe el perito si la demandada registró al actor en sus libros laborales y desde qué fecha” o “Determine el saldo de la cuenta corriente entre las partes al 31/12”.</p>
  <h3>Procedimiento</h3><ol><li>El perito acepta el cargo dentro del plazo fijado.</li><li>Fija fecha y lugar para revisar los libros y la documentación, y lo comunica a las partes y consultores.</li><li>Realiza las tareas: revisión de libros (art. 330 del CCyC: eficacia probatoria de la contabilidad), comprobantes, sistemas.</li><li>Presenta el <b>dictamen</b> por escrito dentro del plazo, con las explicaciones de las operaciones técnicas y los principios en que se funda.</li><li>Las partes pueden pedir <b>explicaciones</b> o <b>impugnar</b> la pericia, y el perito debe responder.</li></ol>
  <h3>Estructura del dictamen</h3><ul><li>Encabezado (carátula del expediente, juzgado).</li><li>Tareas realizadas y elementos examinados.</li><li>Respuesta a cada punto de pericia, en orden y con fundamento.</li><li>Conclusión.</li><li>Firma con matrícula.</li></ul>
  <h3>Honorarios</h3><p>Los regula el juez al dictar sentencia, según las leyes de aranceles (en la justicia nacional, la Ley 27.423), y en general los paga la parte condenada en costas.</p>
  <div class="note"><b>Claridad.</b> El juez no es contador. Un buen dictamen responde exactamente lo que se pregunta, con lenguaje claro y cálculos verificables, sin opinar sobre cuestiones jurídicas.</div>`,
  ex:[{type:"tf",items:[["El perito puede opinar sobre quién tiene razón en el juicio","Falso","Responde los puntos técnicos; la decisión jurídica es del juez."],["Las partes pueden pedir explicaciones o impugnar el dictamen","Verdadero"],["Los honorarios del perito los regula el juez","Verdadero"],["La contabilidad llevada en legal forma tiene eficacia probatoria","Verdadero","Art. 330 del CCyC."]]}]},
 {lead:"El concurso preventivo permite a un deudor en cesación de pagos negociar con sus acreedores para evitar la quiebra. Lo regula la Ley 24.522.",
  html:`<h3>Presupuesto: cesación de pagos</h3><p>Es un estado de impotencia patrimonial para atender regularmente las obligaciones exigibles, que se manifiesta con hechos reveladores (incumplimientos, cheques rechazados, cierre del establecimiento, entre otros, art. 79).</p>
  <h3>Requisitos de la presentación (art. 11)</h3><p>Entre otros: causas de la situación, un <b>estado detallado del activo y del pasivo</b> con dictamen de contador público, los estados contables de los últimos 3 ejercicios, la nómina de acreedores con domicilio, monto y privilegios, y los libros.</p>
  <h3>Apertura (art. 14)</h3><p>El juez abre el concurso, designa al <b>síndico</b> y fija las fechas del procedimiento: verificación de créditos, informes y período de exclusividad.</p>
  <h3>Efectos</h3><ul><li>El deudor conserva la administración de su patrimonio, bajo vigilancia del síndico (art. 15).</li><li>Se <b>suspenden</b> los juicios de contenido patrimonial contra él y se atraen al juzgado del concurso (art. 21).</li><li>No puede pagar deudas anteriores a la presentación ni realizar ciertos actos sin autorización (arts. 16 y 17).</li><li>Los intereses de las deudas quirografarias se suspenden (art. 19).</li></ul>
  <h3>El acuerdo (art. 45)</h3><p>En el período de exclusividad el deudor ofrece propuestas por categorías de acreedores. Para aprobarse necesita, en cada categoría, la conformidad de la <b>mayoría absoluta de acreedores</b> que represente las <b>dos terceras partes del capital computable</b>. Luego el juez lo homologa.</p>
  <h3>Salvataje (art. 48)</h3><p>Si el deudor no obtiene las mayorías, en ciertos casos (sociedades de capital y otras), terceros pueden ofrecer comprar las participaciones y negociar el acuerdo (el llamado <i>cramdown</i>).</p>`,
  ex:[{type:"num",items:[{q:"Una categoría tiene 10 acreedores con capital computable de $ 9.000.000. ¿Cuántos acreedores, como mínimo, deben aceptar?",a:6,tol:0},{q:"¿Qué capital mínimo deben representar?",a:6000000,u:"$"}]},
   {type:"tf",items:[["En el concurso preventivo el deudor pierde la administración de sus bienes","Falso","La conserva, bajo vigilancia del síndico."],["La apertura del concurso suspende los juicios patrimoniales contra el deudor","Verdadero"],["El estado de activo y pasivo de la presentación debe tener dictamen de contador público","Verdadero"]]}]},
 {lead:"La verificación de créditos determina quiénes son acreedores, por cuánto y con qué privilegio. El síndico tiene el rol central.",
  html:`<h3>Pasos</h3><ol><li><b>Pedido de verificación</b> (art. 32): cada acreedor presenta ante el síndico su crédito, con monto, causa, privilegio y documentación, hasta la fecha fijada.</li><li><b>Período de observación</b> (art. 34): el deudor y los demás acreedores pueden revisar los legajos y formular observaciones.</li><li><b>Informe individual</b> del síndico (art. 35): opina sobre la procedencia de cada crédito y su privilegio.</li><li><b>Resolución judicial</b> (art. 36): el juez declara verificado, admisible o inadmisible cada crédito.</li><li><b>Revisión</b> (art. 37): quien no está de acuerdo puede promoverla en 20 días.</li><li><b>Informe general</b> del síndico (art. 39): análisis de las causas del desequilibrio, composición del activo y pasivo, estimación de lo que recibirían los acreedores en caso de quiebra, actos que podrían ser revocables, entre otros.</li></ol>
  <h3>Verificación tardía (art. 56)</h3><p>Quien no se presentó a tiempo puede pedir la verificación por vía incidental, con plazos y costas a su cargo.</p>
  <h3>Qué analiza el síndico de cada crédito</h3><ul><li>Su <b>causa</b>: que la deuda exista realmente (factura, remito, contrato), no solo un título.</li><li>Su registración en los libros del deudor y del acreedor.</li><li>El cálculo de intereses hasta la presentación.</li><li>El <b>privilegio</b> invocado.</li></ul>`,
  ex:[{type:"order",title:"Ordená la verificación de créditos",items:["Pedidos de verificación ante el síndico","Período de observación de los créditos","Informe individual del síndico","Resolución del juez sobre cada crédito","Informe general del síndico"]}]},
 {lead:"Si el concurso fracasa, o si la empresa directamente no puede seguir, llega la quiebra: el patrimonio se liquida para pagar a los acreedores.",
  html:`<h3>Cómo se llega</h3><ul><li>Pedido del propio deudor.</li><li>Pedido de un acreedor que demuestra la cesación de pagos.</li><li>Fracaso del concurso preventivo (falta de acuerdo o incumplimiento).</li></ul>
  <h3>Efectos principales</h3><ul><li><b>Desapoderamiento</b> (art. 107): el fallido pierde la administración y la disposición de sus bienes, que pasan a manos del síndico.</li><li>Las deudas se vuelven exigibles y dejan de correr los intereses (con excepciones).</li><li>Inhabilitación del fallido.</li></ul>
  <h3>Período de sospecha (art. 116)</h3><p>Es el lapso entre la fecha en que comenzó la cesación de pagos y la sentencia de quiebra. No puede retrotraerse más de <b>2 años</b> antes de la sentencia o de la presentación en concurso. Algunos actos realizados en ese período son <b>ineficaces</b> frente a los acreedores:</p>
  <ul><li><b>De pleno derecho</b> (art. 118): actos a título gratuito, pagos anticipados de deudas no vencidas, garantías otorgadas para deudas que no las tenían.</li><li><b>Por conocimiento</b> (art. 119): otros actos perjudiciales, si el tercero conocía la cesación de pagos.</li></ul>
  <h3>Liquidación y distribución</h3><p>El síndico realiza los bienes (generalmente por subasta o licitación) y elabora el proyecto de distribución. Se paga en este orden:</p>
  <ol><li>Créditos con <b>privilegio especial</b> sobre bienes determinados (art. 241): hipoteca, prenda, ciertos créditos laborales sobre los bienes del establecimiento.</li><li>Gastos del concurso.</li><li>Créditos con <b>privilegio general</b> (art. 246): créditos laborales por 6 meses de sueldo e indemnizaciones, impuestos y aportes previsionales, con límites.</li><li>Créditos <b>quirografarios</b> (comunes), a prorrata.</li></ol>`,
  ex:[{type:"pick",title:"¿Qué tipo de crédito es en la quiebra?",options:["Privilegio especial","Privilegio general","Quirografario"],items:[["El banco con hipoteca sobre la planta","Privilegio especial"],["Sueldos adeudados a los empleados (dentro del límite legal)","Privilegio general"],["Un proveedor de insumos sin garantía","Quirografario"],["Un acreedor con prenda sobre un camión","Privilegio especial"]]},
   {type:"tf",items:[["El período de sospecha puede ir hasta 5 años antes de la quiebra","Falso","Máximo 2 años."],["Una donación hecha durante el período de sospecha es ineficaz de pleno derecho","Verdadero"]]}]},
 {lead:"El síndico es el órgano técnico del concurso y de la quiebra. Es una función reservada a contadores públicos.",
  html:`<h3>Requisitos (art. 253)</h3><p>Ser contador público con al menos <b>5 años de antigüedad en la matrícula</b>. Las cámaras de apelaciones arman listas cada 4 años con dos categorías:</p>
  <ul><li><b>Categoría A:</b> estudios de contadores (asociaciones profesionales), para los concursos grandes.</li><li><b>Categoría B:</b> profesionales individuales.</li></ul>
  <p>Se designa por sorteo para cada proceso.</p>
  <h3>Funciones principales</h3><div class="tw"><table><thead><tr><th>En el concurso preventivo</th><th>En la quiebra</th></tr></thead><tbody>
  <tr><td>Vigilar la administración del deudor</td><td>Administrar y liquidar los bienes del fallido</td></tr>
  <tr><td>Recibir y analizar los pedidos de verificación</td><td>Igual que en el concurso</td></tr>
  <tr><td>Presentar el informe individual y el general</td><td>Igual, más el proyecto de distribución</td></tr>
  <tr><td>Informar sobre el cumplimiento del acuerdo (control)</td><td>Promover acciones de ineficacia y de responsabilidad contra administradores y terceros</td></tr></tbody></table></div>
  <h3>Honorarios</h3><p>Los regula el juez según escalas del art. 266 y siguientes de la ley (en el concurso preventivo, un porcentaje del pasivo verificado; en la quiebra, del activo realizado).</p>
  <h3>Responsabilidad</h3><p>El síndico responde por mal desempeño y puede ser removido. Es una función de gran exposición: requiere orden, plazos estrictos y criterio técnico.</p>`,

lessons:[
 {lead:"La Ley 20.488 regula el ejercicio de las profesiones en ciencias económicas: contador público, licenciado en administración, licenciado en economía y actuario.",
  html:`<h3>Incumbencias del contador público (art. 13)</h3><p>Se requiere título de contador público para, entre otras cosas:</p>
  <ul><li>Dictaminar sobre estados contables destinados a ser presentados ante terceros (auditoría).</li><li>Actuar como perito en materia contable en la justicia.</li><li>Actuar como síndico en concursos y quiebras.</li><li>Intervenir en la liquidación y partición de sociedades y en las rendiciones de cuentas judiciales.</li><li>Firmar las certificaciones de balances y de información contable.</li><li>Organizar contablemente empresas, asesorar en materia impositiva, de costos y de sistemas.</li><li>Actuar como síndico societario (junto con los abogados).</li></ul>
  <h3>Requisito de matrícula</h3><p>Para ejercer hay que estar <b>inscripto en la matrícula</b> del Consejo Profesional de la jurisdicción donde se trabaja (art. 2). Sin matrícula, la firma no tiene validez y el ejercicio puede ser sancionado.</p>
  <h3>Lo que no es exclusivo</h3><p>Llevar libros, liquidar impuestos o sueldos lo puede hacer otra persona, pero firmar como profesional, emitir dictámenes, certificaciones o actuar como perito o síndico sí es exclusivo.</p>`,
  ex:[{type:"pick",title:"¿Es una incumbencia exclusiva del contador público?",options:["Exclusiva","No exclusiva"],items:[["Firmar el informe de auditoría de un balance","Exclusiva"],["Actuar como síndico en una quiebra","Exclusiva"],["Cargar facturas en un sistema contable","No exclusiva"],["Certificar ingresos de una persona para un banco","Exclusiva"],["Actuar como perito contable en un juicio laboral","Exclusiva"]]}]},
 {lead:"Los Consejos Profesionales controlan la matrícula y la ética en cada jurisdicción. La FACPCE los agrupa a nivel nacional.",
  html:`<h3>Consejos Profesionales de Ciencias Económicas (CPCE)</h3><p>Hay uno en cada provincia y en la Ciudad de Buenos Aires. Son personas de derecho público no estatal. Sus funciones:</p>
  <ul><li>Otorgar y controlar la <b>matrícula</b>.</li><li><b>Legalizar</b> las firmas de los profesionales en sus informes.</li><li>Dictar y aplicar las <b>normas profesionales</b> (adoptando las RT de la FACPCE).</li><li>Ejercer el <b>poder disciplinario</b> mediante el Tribunal de Ética.</li><li>Brindar capacitación, servicios de salud y previsión a los matriculados.</li></ul>
  <h3>FACPCE</h3><p>La Federación Argentina de Consejos Profesionales de Ciencias Económicas coordina a nivel nacional, elabora las normas técnicas por medio del CENCyA y representa a la profesión en organismos internacionales (IFAC).</p>
  <h3>Legalización</h3><p>Cuando un contador firma un informe de auditoría o una certificación, el Consejo lo <b>legaliza</b>: verifica que la firma sea del matriculado, que la matrícula esté vigente y que el trabajo cumpla requisitos formales. Muchos organismos (bancos, IGJ, juzgados) solo aceptan documentos legalizados.</p>
  <h3>Educación continua</h3><p>Las normas y leyes cambian todo el tiempo. Los Consejos promueven la actualización permanente y, en algunas jurisdicciones, la exigen.</p>`,
  ex:[{type:"tf",items:[["Un contador matriculado en Córdoba puede firmar auditorías en CABA sin matricularse allí","Falso","Debe matricularse en la jurisdicción donde ejerce."],["La legalización verifica que la firma sea de un matriculado habilitado","Verdadero"],["La FACPCE elabora las Resoluciones Técnicas","Verdadero"],["El Tribunal de Ética depende de ARCA","Falso","Es un órgano del Consejo Profesional."]]}]},
 {lead:"El código de ética define cómo debe comportarse un profesional. Su violación puede costar la matrícula.",
  html:`<p>Cada Consejo tiene su <b>Código de Ética</b> (la FACPCE aprobó un código unificado que los Consejos adoptan). Se inspira en el Código de Ética de la IFAC.</p>
  <h3>Principios fundamentales</h3><div class="tw"><table><thead><tr><th>Principio</th><th>Qué exige</th></tr></thead><tbody>
  <tr><td><b>Integridad</b></td><td>Ser honesto y franco en todas las relaciones profesionales.</td></tr>
  <tr><td><b>Objetividad</b></td><td>No permitir que sesgos, conflictos de intereses o presiones afecten el juicio.</td></tr>
  <tr><td><b>Independencia</b></td><td>En los trabajos de auditoría, no tener vínculos que afecten la imparcialidad, ni de hecho ni en apariencia.</td></tr>
  <tr><td><b>Competencia y diligencia</b></td><td>Aceptar solo trabajos para los que se está capacitado y hacerlos con cuidado.</td></tr>
  <tr><td><b>Secreto profesional</b></td><td>No revelar información del cliente, salvo obligación legal (por ejemplo, un reporte a la UIF o una orden judicial).</td></tr>
  <tr><td><b>Comportamiento profesional</b></td><td>Cumplir las leyes y no desprestigiar a la profesión.</td></tr></tbody></table></div>
  <h3>Conductas reprochables</h3><ul><li>Firmar trabajos que no hizo o no supervisó.</li><li>Prestar el nombre a personas no habilitadas.</li><li>Publicidad engañosa o que menoscabe a colegas.</li><li>Captar clientes de un colega con métodos desleales o aceptar un cliente sin comunicarse antes con el profesional anterior.</li><li>Cobrar honorarios contingentes en trabajos de auditoría.</li><li>Participar en actos que faciliten la evasión o el fraude.</li></ul>`,
  ex:[{type:"pick",title:"¿Qué principio se viola?",options:["Integridad","Objetividad","Independencia","Competencia","Secreto profesional"],items:[["Le cuenta a un amigo las ventas de un cliente","Secreto profesional"],["Acepta auditar un banco sin conocer las normas del BCRA","Competencia"],["Audita la empresa de su esposa","Independencia"],["Firma un informe sabiendo que los números son falsos","Integridad"],["Cambia su conclusión porque el cliente amenazó con no pagarle","Objetividad"]]}]},
 {lead:"El contador responde por su trabajo en varios planos a la vez: civil, penal, disciplinario y frente a los organismos de control.",
  html:`<div class="tw"><table><thead><tr><th>Tipo</th><th>Fundamento</th><th>Ejemplo</th></tr></thead><tbody>
  <tr><td><b>Civil</b></td><td>Código Civil y Comercial. Los profesionales liberales tienen, en general, una obligación de <b>medios</b>, no de resultado (art. 1768).</td><td>El cliente pierde un beneficio impositivo porque el contador presentó una declaración fuera de término y le reclama los daños.</td></tr>
  <tr><td><b>Penal</b></td><td>Código Penal (por ejemplo, art. 300 inc. 2 sobre balances falsos) y Régimen Penal Tributario (Ley 27.430, Título IX), que prevé penas de inhabilitación para profesionales que intervienen en delitos tributarios.</td><td>Certificar ingresos falsos o armar facturas apócrifas.</td></tr>
  <tr><td><b>Disciplinaria</b></td><td>Ley 20.488 y Código de Ética. Sanciones: advertencia, amonestación, multa, suspensión y cancelación de la matrícula.</td><td>Firmar un informe sin haber hecho el trabajo.</td></tr>
  <tr><td><b>Ante organismos</b></td><td>CNV, BCRA, UIF y otros pueden sancionar a auditores de los entes que controlan.</td><td>No reportar una operación sospechosa a la UIF.</td></tr></tbody></table></div>
  <h3>Cómo protegerse</h3><ul><li><b>Carta de compromiso</b> (propuesta de servicios) por escrito, que defina el alcance del trabajo, lo que se hace y lo que no.</li><li>Papeles de trabajo ordenados y conservados.</li><li>Carta de manifestaciones del cliente.</li><li>Seguro de responsabilidad profesional.</li><li>Rechazar trabajos fuera de la propia competencia o con riesgo ético.</li></ul>`,
  ex:[{type:"pick",title:"¿Qué responsabilidad está en juego principalmente?",options:["Civil","Penal","Disciplinaria"],items:[["El contador se olvidó de presentar una DDJJ y el cliente pagó una multa; el cliente le reclama el resarcimiento","Civil"],["El contador armó facturas falsas para que el cliente evada IVA","Penal"],["El contador publicitó que es “el único contador honesto de la ciudad”","Disciplinaria"]]},
   {type:"tf",items:[["En general, el contador asume una obligación de medios","Verdadero"],["La carta de compromiso ayuda a delimitar la responsabilidad del profesional","Verdadero"]]}]},
 {lead:"Muchos contadores terminan trabajando por su cuenta o en un estudio. Gestionar bien el estudio es tan importante como saber de impuestos.",
  html:`<h3>Servicios típicos de un estudio</h3><ul><li>Contabilidad y estados contables.</li><li>Impuestos: liquidaciones mensuales y anuales, planificación, inspecciones de ARCA.</li><li>Sueldos y cargas sociales.</li><li>Auditoría y certificaciones.</li><li>Sociedades: constituciones, asambleas, trámites ante el Registro Público.</li><li>Consultoría: costos, presupuestos, sistemas, finanzas.</li><li>Actuación judicial.</li></ul>
  <h3>Honorarios</h3><ul><li><b>Abono mensual</b> por servicios recurrentes, según volumen de comprobantes, empleados y complejidad.</li><li><b>Por trabajo</b> para encargos puntuales.</li><li>Los Consejos publican <b>honorarios mínimos sugeridos</b> como referencia.</li></ul>
  <h3>Organización</h3><ul><li><b>Calendario de vencimientos</b> por cliente y por impuesto. Los vencimientos de ARCA dependen de la terminación del CUIT.</li><li>Gestión documental digital y segura (Módulo 12).</li><li>Delegación de claves fiscales por cliente, nunca claves compartidas.</li><li>Procedimientos escritos y control de calidad de lo que sale del estudio.</li><li>Formación continua del equipo.</li></ul>
  <h3>El propio contador como contribuyente</h3><p>El contador independiente suele ser monotributista o responsable inscripto, aporta al régimen de autónomos (o al componente previsional del Monotributo) y en muchas provincias tiene además una caja previsional profesional obligatoria.</p>`,

],

 {lead:"Todo empieza con un contrato. Antes de vender un solo tornillo, la empresa tiene que existir legalmente y estar inscripta ante el fisco.",
  html:`${CASO}
  <h3>Por qué una SRL</h3><p>Ana y Bruno quieren limitar su responsabilidad al capital que aportan y no necesitan salir a buscar inversores. La <b>SRL</b> (LGS 19.550, arts. 146 a 162) encaja: su capital se divide en <b>cuotas</b>, tiene como máximo 50 socios y la administra una <b>gerencia</b>. Una SA tendría más requisitos (directorio, asambleas, en algunos casos fiscalización estatal) y sus acciones se transfieren con más facilidad, cosa que acá no buscan.</p>
  <h3>Capital, suscripción e integración</h3><p>Suscriben un capital de <b>$ 10.000.000</b>: Ana $ 6.000.000 y Bruno $ 4.000.000, todo en dinero. La ley exige integrar al menos el <b>25%</b> de los aportes en dinero al constituir la sociedad y completar el resto en un plazo de hasta dos años (LGS, art. 149). Integran el 25% depositándolo en el Banco Nación.</p>
  <div class="formula">Suscripción: Socios cuenta aporte a Capital social · Integración: Banco a Socios cuenta aporte</div>
  <p>La cuenta <b>Socios cuenta aporte</b> es un crédito de la sociedad contra sus socios: mientras no integren, le deben ese dinero. En el estado de situación patrimonial se muestra restando del patrimonio neto (porque es capital todavía no aportado).</p>
  <h3>El camino hasta abrir la persiana</h3><ul>
  <li><b>Registro Público</b> de la jurisdicción (en CABA, la IGJ): se inscribe el contrato y la sociedad queda regularmente constituida.</li>
  <li><b>ARCA</b>: CUIT, alta en IVA como responsable inscripto, en Ganancias y como empleador. Una sociedad no puede ser monotributista.</li>
  <li><b>Ingresos Brutos</b> en la provincia (o Convenio Multilateral si vende en varias).</li>
  <li><b>Habilitación municipal</b> del local y tasa de seguridad e higiene.</li>

  <tr><td class="mono">28/02</td><td>Cobra al cliente por transferencia.</td></tr>
  <tr><td class="mono">01/03</td><td>Paga 6 meses de alquiler del local por adelantado: $ 1.200.000 (marzo a agosto).</td></tr>
  <tr><td class="mono">01/03</td><td>Recibe un préstamo bancario de $ 5.000.000 a 12 meses, con interés del 36% anual que se paga al vencimiento.</td></tr>
  <tr><td class="mono">25/03</td><td>Paga a los proveedores la compra del 25/01.</td></tr></tbody></table></div>
  <h3>Lo que conviene mirar en cada una</h3><ul>
  <li>El utilitario es un <b>bien de uso</b>: se activa por su costo sin IVA, porque el IVA de la factura A es crédito fiscal.</li>
  <li>En la venta hay dos asientos con inventario permanente: el del precio y el del costo.</li>
  <li>El alquiler pagado por adelantado es un <b>activo</b> que se irá consumiendo mes a mes.</li>
  <li>El préstamo devenga intereses día a día aunque se paguen al final. Eso se reconoce al cierre (lección 4).</li></ul>
  <h3>La primera DDJJ de IVA</h3><p>En enero, la compra del utilitario genera mucho crédito fiscal y casi no hay ventas. El resultado es un <b>saldo técnico a favor</b>, que no se cobra: se traslada a los meses siguientes y se va compensando con los débitos futuros (Ley 23.349, art. 24).</p>`,

 {lead:"Ferretería del Sur contrata a su primer empleado. Desde ahora hay recibos, F.931 y vencimientos todos los meses.",
  html:`${CASO}
  <h3>El primer empleado</h3><p>En marzo entra un vendedor bajo el convenio de comercio, con un sueldo bruto de <b>$ 1.500.000</b> (cifra ilustrativa). Antes de su primer día hay que registrarlo en <b>Simplificación Registral</b> de ARCA y contratar una ART.</p>
  <h3>Del bruto al neto</h3><div class="tw"><table><thead><tr><th>Aportes del trabajador</th><th class="r">%</th><th class="r">$</th></tr></thead><tbody>
  <tr><td>Jubilación (SIPA)</td><td class="r">11</td><td class="r mono">165.000</td></tr>
  <tr><td>INSSJP (PAMI, Ley 19.032)</td><td class="r">3</td><td class="r mono">45.000</td></tr>
  <tr><td>Obra social</td><td class="r">3</td><td class="r mono">45.000</td></tr>
  <tr><td><b>Total retenido</b></td><td class="r"><b>17</b></td><td class="r mono"><b>255.000</b></td></tr></tbody></table></div>
  <p>El trabajador cobra $ 1.245.000 (los aportes sindicales y de convenio se dejan afuera para simplificar). Además, la empresa paga sus propias <b>contribuciones</b>. Para el caso suponemos un 24% en total, incluyendo obra social y ART. Es una tasa ilustrativa: la real depende del tipo de empleador y de la ART.</p>
  <div class="formula">Costo laboral = Bruto + Contribuciones = 1.500.000 + 360.000 = 1.860.000</div>
  <p>Los aportes retenidos y las contribuciones se declaran y pagan con el <b>F.931</b> al mes siguiente. El <b>SAC</b> se paga en dos cuotas, cada una igual al 50% de la mejor remuneración mensual del semestre (Ley 23.041).</p>
  <h3>El calendario mensual</h3><ul>
  <li><b>IVA</b>: DDJJ mensual (F.2002), con vencimiento según la terminación de la CUIT.</li>
  <li><b>Ingresos Brutos</b>: anticipo mensual sobre las ventas netas de IVA, con la alícuota de la provincia.</li>
  <li><b>F.931</b>: cargas sociales del mes anterior.</li>
  <li><b>Ganancias</b>: en el primer ejercicio no hay anticipos, porque se calculan sobre el impuesto del año anterior.</li></ul>`,
  ex:[{type:"asiento",title:"Devengá el sueldo de marzo",accounts:ACC,entries:[
    {t:"31/03 · Devengamiento del sueldo de marzo: bruto $ 1.500.000, aportes 17% y contribuciones 24%.",e:[["Sueldos y jornales",1500000,0],["Cargas sociales",360000,0],["Retenciones y aportes a depositar",0,255000],["Cargas sociales a pagar",0,360000],["Sueldos a pagar",0,1245000]]},
    {t:"03/04 · Pago del sueldo neto por transferencia.",e:[["Sueldos a pagar",1245000,0],["Banco Nación c/c",0,1245000]]},
    {t:"10/04 · Pago del F.931 (aportes retenidos y contribuciones).",e:[["Retenciones y aportes a depositar",255000,0],["Cargas sociales a pagar",360000,0],["Banco Nación c/c",0,615000]]}]},
   {type:"num",items:[{q:"¿Cuál es el costo laboral anual del empleado, contando 12 sueldos y el SAC completo (con sus contribuciones)?",a:24180000,u:"$",ex:"13 × $ 1.860.000. Es la cifra que vas a ver en el estado de resultados."},{q:"¿Cuánto vale cada cuota del SAC?",a:750000,u:"$"},
    {q:"En marzo hay débito fiscal por $ 1.260.000 y crédito por $ 420.000. Si arrastra un saldo a favor de $ 1.890.000, ¿cuánto saldo a favor le queda?",a:1050000,u:"$",ex:"1.890.000 − (1.260.000 − 420.000) = 1.050.000. Todavía no paga IVA."},

   {type:"pick",title:"¿Qué es cada concepto para la empresa?",options:["Aporte (lo paga el trabajador)","Contribución (la paga el empleador)"],items:[["Jubilación 11%","Aporte (lo paga el trabajador)","Se retiene del bruto."],["ART","Contribución (la paga el empleador)","El seguro de riesgos del trabajo lo paga la empresa."],["PAMI 3% del recibo","Aporte (lo paga el trabajador)",""],["Asignaciones familiares (sobre la nómina)","Contribución (la paga el empleador)",""],["Obra social 3% del recibo","Aporte (lo paga el trabajador)",""],["Fondo Nacional de Empleo","Contribución (la paga el empleador)",""]]}]},

 {lead:"Llega el 31 de diciembre. Antes de armar los estados contables hay que ajustar todo lo que el día a día no registró bien.",
  html:`${CASO}
  <h3>Lo que encuentra el contador al cierre</h3><ol>
  <li><b>Amortización</b>: el utilitario ($ 8.000.000) tiene una vida útil de 5 años sin valor residual. Se amortiza en línea recta y se computa el año de alta completo.</li>
  <li><b>Alquiler</b>: el 01/09 se pagaron otros 6 meses ($ 1.200.000, de septiembre a febrero) y se cargó todo a <i>Alquileres perdidos</i>. Enero y febrero del año que viene todavía no se consumieron.</li>
  <li><b>Intereses</b>: el préstamo de $ 5.000.000 al 36% anual lleva 10 meses (marzo a diciembre) y nada se registró.</li>
  <li><b>Incobrables</b>: los deudores suman $ 4.000.000 y, por la experiencia del rubro, se estima que no se cobrará el 3%.</li>
  <li><b>Recuento físico</b>: la ficha de stock dice $ 5.200.000 y el recuento da $ 5.000.000. No aparece ninguna explicación.</li></ol>
  <h3>Del balance de comprobación a los estados</h3><p>El proceso es siempre el mismo: balance de comprobación, asientos de ajuste, balance ajustado, estados contables y, por último, la <b>refundición</b> de las cuentas de resultado contra <i>Resultado del ejercicio</i> y el asiento de cierre. Al día siguiente se reabren las cuentas patrimoniales.</p>
  <div class="note"><b>Inflación.</b> En Argentina, la RT 54 obliga a reexpresar los estados en moneda de cierre cuando la inflación supera los parámetros que ella misma fija. En el caso real, cada partida no monetaria se reexpresaría y aparecería el RECPAM (Módulo 13). Acá lo dejamos fuera para que el caso se pueda seguir a mano.</div>`,
  ex:[{type:"asiento",title:"Registrá los ajustes de cierre",accounts:ACC,entries:[
    {t:"31/12 · Amortización anual del utilitario.",e:[["Amortizaciones rodados",1600000,0],["Amortización acumulada rodados",0,1600000]]},
    {t:"31/12 · Ajuste del alquiler pagado el 01/09.",e:[["Alquileres pagados por adelantado",400000,0],["Alquileres perdidos",0,400000]],why:"Dos meses de $ 200.000 todavía no se consumieron."},
    {t:"31/12 · Intereses devengados del préstamo.",e:[["Intereses perdidos",1500000,0],["Intereses a pagar",0,1500000]],why:"5.000.000 × 36% × 10/12."},
    {t:"31/12 · Previsión para deudores incobrables.",e:[["Deudores incobrables",120000,0],["Previsión para deudores incobrables",0,120000]]},
    {t:"31/12 · Faltante del recuento físico.",e:[["Faltante de mercaderías",200000,0],["Mercaderías",0,200000]]}]},

   {type:"order",title:"Ordená el proceso de cierre",items:["Balance de comprobación de sumas y saldos","Asientos de ajuste","Balance de comprobación ajustado","Preparación de los estados contables","Refundición de las cuentas de resultado","Asiento de cierre","Asiento de reapertura del ejercicio siguiente"]}]},

 {lead:"Con los saldos ajustados se arman los estados contables. Es el producto final del año, el que van a leer los socios, el banco y el fisco.",
  html:`${CASO}${SALDOS}
  <h3>Impuesto a las ganancias</h3><p>Las sociedades tributan con la escala progresiva de la Ley 27.630 (25%, 30% y 35%, con tramos que se actualizan cada año). Con una ganancia de este tamaño, el resultado cae en el primer tramo, así que usamos el <b>25%</b>. Suponemos que el resultado impositivo coincide con el contable. En la vida real hay diferencias (por ejemplo, la previsión para incobrables no siempre es deducible) que dan lugar al impuesto diferido (Módulo 21).</p>
  <h3>Qué estados se presentan</h3><ul>
  <li><b>Estado de situación patrimonial</b>, con activos y pasivos separados en corrientes y no corrientes (los que se realizan o vencen dentro de los 12 meses son corrientes).</li>
  <li><b>Estado de resultados</b>: ventas, costo, resultado bruto, gastos de comercialización y de administración, resultados financieros e impuesto.</li>
  <li><b>Estado de evolución del patrimonio neto</b> y <b>estado de flujo de efectivo</b>.</li>
  <li><b>Notas y anexos</b> (bienes de uso, previsiones, costo de ventas, gastos), con la información comparativa desde el segundo ejercicio.</li></ul>
  <p>Una vez armados, los estados se transcriben al libro Inventarios y Balances, los aprueba la reunión de socios y, si los va a presentar ante terceros, los audita un contador independiente (Módulo 25).</p>`,

   {type:"num",title:"Armá el estado de situación patrimonial",items:[{q:"Activo corriente",a:19960000,u:"$",ex:"10.680.000 + 4.000.000 − 120.000 + 5.000.000 + 400.000."},{q:"Activo no corriente",a:6400000,u:"$"},{q:"Pasivo corriente (incluí el impuesto a pagar)",a:12985000,u:"$",ex:"3.500.000 + 1.860.000 + 5.000.000 + 1.500.000 + 1.125.000. Todo vence dentro de los 12 meses."},{q:"Patrimonio neto al cierre",a:13375000,u:"$",ex:"Capital $ 10.000.000 + resultado $ 3.375.000. Activo $ 26.360.000 = Pasivo $ 12.985.000 + PN $ 13.375.000."}]},

 {lead:"Los números ya están. Ahora hay que explicarles a Ana y a Bruno qué significan y qué conviene hacer el año que viene.",
  html:`${CASO}
  <h3>Los indicadores del primer año</h3><div class="tw"><table><thead><tr><th>Dato</th><th class="r">$</th></tr></thead><tbody>
  <tr><td>Activo corriente</td><td class="r mono">19.960.000</td></tr><tr><td>Mercaderías</td><td class="r mono">5.000.000</td></tr>
  <tr><td>Pasivo corriente (todo el pasivo)</td><td class="r mono">12.985.000</td></tr><tr><td>Patrimonio neto</td><td class="r mono">13.375.000</td></tr>
  <tr><td>Ventas netas de IVA</td><td class="r mono">90.000.000</td></tr><tr><td>Costo de ventas</td><td class="r mono">54.000.000</td></tr><tr><td>Resultado neto</td><td class="r mono">3.375.000</td></tr></tbody></table></div>
  <h3>Qué hay que decidir con las utilidades</h3><ul>
  <li><b>Reserva legal</b>: la ley exige destinar al menos el 5% de la ganancia del ejercicio hasta llegar al 20% del capital (LGS, art. 70).</li>
  <li>El resto puede distribuirse, quedar como <b>resultados no asignados</b> o ir a reservas facultativas razonables.</li>
  <li>Si se distribuyen utilidades a socios que son personas humanas, la sociedad retiene el <b>7%</b> como pago único y definitivo del impuesto sobre dividendos (Ley de Ganancias, según la Ley 27.630).</li></ul>
  <h3>Cómo se escribe el informe a los socios</h3><p>Un buen informe de gestión es corto y directo. Empieza con la conclusión, la respalda con tres o cuatro indicadores comparados contra un parámetro (el rubro, el presupuesto o el año anterior) y termina con recomendaciones concretas. Evitá la jerga: los socios quieren saber si ganaron plata, si la empresa puede pagar lo que debe y qué tienen que decidir.</p>
  <div class="note"><b>Cierre del campus.</b> En este caso usaste casi todo lo que estudiaste: derecho societario, contabilidad, IVA, Ingresos Brutos, sueldos, Ganancias, estados contables y análisis. Así es el trabajo real de un contador: no hay materias separadas, hay una empresa.</div>`,
  ex:[{type:"num",title:"Calculá los indicadores",items:[{q:"Liquidez corriente",a:1.54,tol:0.01,ex:"19.960.000 / 12.985.000 = 1,54."},{q:"Prueba ácida",a:1.15,tol:0.01,ex:"(19.960.000 − 5.000.000) / 12.985.000."},{q:"Endeudamiento (pasivo / PN)",a:0.97,tol:0.01},{q:"Margen neto sobre ventas",a:3.75,u:"%",tol:0.02},{q:"Rentabilidad del PN al cierre (ROE)",a:25.2,u:"%",tol:0.1,ex:"3.375.000 / 13.375.000 = 25,2%. Sobre el capital aportado sería 33,75%."},{q:"Rotación de inventarios (CMV / stock final)",a:10.8,tol:0.05,ex:"Unas 10,8 veces al año: el stock dura unos 34 días."}]},
   {type:"num",title:"Distribución de utilidades",items:[{q:"¿Cuánto debe ir como mínimo a la reserva legal?",a:168750,u:"$",ex:"5% de $ 3.375.000."},{q:"Si se distribuyen $ 2.000.000 entre Ana y Bruno, ¿cuánto le corresponde a Ana antes de la retención?",a:1200000,u:"$"},{q:"¿Cuánto le retiene la sociedad a Ana por el impuesto sobre dividendos?",a:84000,u:"$",ex:"7% de $ 1.200.000."}]},

/* Módulo 29 · Contabilidad social y ambiental */
CAMPUS.content[29] = {
lessons:[
 {lead:"La contabilidad social amplía la mirada: además del resultado para los dueños, informa cómo la organización afecta a sus trabajadores, a la comunidad y al ambiente.",
  html:`<h3>Por qué existe</h3><p>Los estados contables tradicionales miden el patrimonio y el resultado desde el punto de vista de los propietarios. Pero una empresa también genera empleo, paga impuestos, consume recursos naturales y produce residuos. La <b>contabilidad social y ambiental</b> es la rama que mide e informa esos efectos.</p>
  <h3>Conceptos clave</h3><ul><li><b>Responsabilidad social empresaria (RSE):</b> el compromiso voluntario de una organización con el desarrollo sostenible, más allá de lo que exige la ley.</li><li><b>Grupos de interés (stakeholders):</b> todos los que se ven afectados por la organización o la afectan: personal, clientes, proveedores, Estado, comunidad, inversores.</li><li><b>Triple resultado:</b> evaluar la gestión en tres dimensiones a la vez: económica, social y ambiental.</li><li><b>Desarrollo sostenible:</b> satisfacer las necesidades presentes sin comprometer las de las generaciones futuras (Informe Brundtland, ONU, 1987).</li></ul>
  <h3>Dónde aparece en la práctica</h3><div class="tw"><table><thead><tr><th>Informe</th><th>Qué contiene</th></tr></thead><tbody>
  <tr><td>Balance social (RT 36 de la FACPCE)</td><td>Memoria de sustentabilidad y estado de valor económico generado y distribuido</td></tr>
  <tr><td>Reporte de sostenibilidad (estándares GRI)</td><td>Indicadores económicos, sociales y ambientales según los temas materiales</td></tr>
  <tr><td>Información financiera sobre sostenibilidad (NIIF S1 y S2 del ISSB)</td><td>Riesgos y oportunidades de sostenibilidad y del clima que afectan el valor de la empresa</td></tr></tbody></table></div>
  <h3>Materialidad</h3><p>No se informa todo: se informan los temas <b>materiales</b>, es decir, los impactos más significativos de la organización y los que más influyen en las decisiones de los grupos de interés. Definirlos es el primer paso de cualquier reporte.</p>`,
  ex:[{type:"pick",title:"¿Qué dimensión del triple resultado mide?",options:["Económica","Social","Ambiental"],items:[["Toneladas de CO2 emitidas en el año","Ambiental"],["Horas de capacitación por empleado","Social"],["Valor económico distribuido a los proveedores de capital","Económica"],["Accidentes de trabajo con días perdidos","Social"],["Consumo de agua por unidad producida","Ambiental"],["Impuestos pagados al Estado","Económica"]]},
   {type:"tf",items:[["Los grupos de interés incluyen solo a los accionistas.",false,"Incluyen a todos los afectados: personal, clientes, proveedores, Estado, comunidad."],["Un reporte de sostenibilidad informa los temas materiales, no todos los posibles.",true],["La RSE se limita a cumplir la ley.",false,"Es un compromiso que va más allá de lo legal."]]}]},
 {lead:"El balance social es el informe que la profesión contable argentina normalizó con la RT 36 de la FACPCE. Para las empresas grandes, además, lo exige la ley laboral.",
  html:`<h3>La RT 36 (modificada por la RT 44)</h3><p>La FACPCE estableció con la RT 36 las normas para preparar el <b>balance social</b>. Este informe tiene dos partes:</p><ol><li><b>Memoria de sustentabilidad:</b> se prepara siguiendo los lineamientos de la Global Reporting Initiative (GRI). Describe la estrategia, el gobierno, los grupos de interés y los indicadores de desempeño económico, social y ambiental.</li><li><b>Estado de valor económico generado y distribuido (EVEGyD):</b> se prepara a partir de los estados contables y muestra cuánto valor creó el ente y entre quiénes lo repartió.</li></ol>
  <p>El balance social puede ser objeto de un encargo de aseguramiento por parte de un contador independiente, que da credibilidad a la información.</p>
  <h3>La obligación legal (Ley 25.877)</h3><p>La Ley 25.877 de Ordenamiento del Régimen Laboral (2004) obliga a las empresas que ocupan a <b>más de 300 trabajadores</b> a elaborar anualmente un balance social con información sobre empleo, remuneraciones, condiciones de trabajo, capacitación y cambios tecnológicos, y a entregarlo al sindicato con personería gremial. Este balance social laboral es distinto del de la RT 36, aunque pueden coordinarse.</p>
  <h3>Estándares GRI</h3><p>Son el marco más usado en el mundo para reportes de sostenibilidad. Se organizan en estándares universales (cómo reportar, contexto de la organización, temas materiales) y estándares temáticos (economía, ambiente, sociedad), cada uno con indicadores concretos.</p>`,
  ex:[{type:"pick",title:"¿Memoria de sustentabilidad o EVEGyD?",options:["Memoria de sustentabilidad","EVEGyD"],items:[["Política de diversidad del directorio","Memoria de sustentabilidad"],["Valor distribuido al personal en sueldos y cargas sociales","EVEGyD"],["Residuos peligrosos generados","Memoria de sustentabilidad"],["Valor retenido en la empresa como resultados no distribuidos","EVEGyD"],["Programas con la comunidad local","Memoria de sustentabilidad"]]},
   {type:"tf",items:[["La memoria de sustentabilidad de la RT 36 sigue los lineamientos GRI.",true],["El EVEGyD se prepara con información de los estados contables.",true],["La Ley 25.877 exige balance social a todas las empresas, sin importar su tamaño.",false,"Solo a las que ocupan a más de 300 trabajadores."]]}]},
 {lead:"El estado de valor económico generado y distribuido reordena el estado de resultados para mostrar el valor que la empresa creó y quién se lo llevó.",
  html:`<h3>Estructura</h3><div class="tw"><table><tbody>
  <tr><td>Ingresos (ventas, otros ingresos)</td><td>20.000.000</td></tr><tr><td>− Insumos adquiridos a terceros (materias primas, servicios, energía)</td><td>(11.000.000)</td></tr>
  <tr><td><b>= Valor económico generado bruto</b></td><td><b>9.000.000</b></td></tr><tr><td>− Depreciaciones y amortizaciones</td><td>(1.000.000)</td></tr>
  <tr><td><b>= Valor económico generado neto</b></td><td><b>8.000.000</b></td></tr><tr><td>+ Valor recibido en transferencia (resultados de inversiones, intereses ganados)</td><td>500.000</td></tr>
  <tr><td><b>= Valor económico total a distribuir</b></td><td><b>8.500.000</b></td></tr></tbody></table></div>
  <h3>Distribución</h3><div class="tw"><table><thead><tr><th>Destinatario</th><th>Conceptos</th><th>Importe</th><th>%</th></tr></thead><tbody>
  <tr><td>Personal</td><td>Sueldos, cargas sociales, beneficios</td><td>4.250.000</td><td>50%</td></tr>
  <tr><td>Estado</td><td>Impuestos, tasas y contribuciones</td><td>1.700.000</td><td>20%</td></tr>
  <tr><td>Capital de terceros</td><td>Intereses, alquileres</td><td>850.000</td><td>10%</td></tr>
  <tr><td>Capital propio</td><td>Dividendos</td><td>1.000.000</td><td>11,8%</td></tr>
  <tr><td>Retenido</td><td>Resultados no distribuidos</td><td>700.000</td><td>8,2%</td></tr>
  <tr><td colspan="2"><b>Total distribuido</b></td><td><b>8.500.000</b></td><td><b>100%</b></td></tr></tbody></table></div>
  <p>El total distribuido siempre es igual al valor a distribuir: es otra forma de presentar el mismo resultado. Lo que cambia es la pregunta que responde: en lugar de "cuánto ganaron los dueños", responde "cuánta riqueza generó la empresa para la sociedad y cómo se repartió".</p>
  <div class="formula">Control: resultado del ejercicio = dividendos + retenido = 1.000.000 + 700.000 = 1.700.000</div>`,
  ex:[{type:"num",items:[
   {q:"Ingresos $ 50.000.000, insumos de terceros $ 30.000.000. ¿Valor económico generado bruto?",a:20000000,u:"$"},
   {q:"Con depreciaciones de $ 2.000.000 y valor recibido en transferencia de $ 1.000.000, ¿valor total a distribuir?",a:19000000,u:"$"},
   {q:"Si al personal se le distribuyen $ 9.500.000, ¿qué porcentaje del total recibe?",a:50,u:"%",tol:0.01},
   {q:"Del total de $ 19.000.000: personal 9.500.000, Estado 4.000.000, capital de terceros 1.500.000, dividendos 2.000.000. ¿Valor retenido?",a:2000000,u:"$"}]},
   {type:"pick",title:"¿A quién se distribuye?",options:["Personal","Estado","Capital de terceros","Capital propio"],items:[["Contribuciones patronales","Personal"],["Impuesto a las ganancias","Estado"],["Intereses de un préstamo bancario","Capital de terceros"],["Dividendos en efectivo","Capital propio"],["Ingresos Brutos","Estado"],["Alquiler del depósito","Capital de terceros"]]}]},
 {lead:"Los temas ambientales también tienen efecto en los estados contables tradicionales: generan costos, pasivos y contingencias que hay que reconocer o informar.",
  html:`<h3>Costos ambientales</h3><ul><li><b>De prevención:</b> filtros, tratamiento de efluentes, capacitación ambiental.</li><li><b>De control:</b> monitoreos, análisis de laboratorio, auditorías ambientales.</li><li><b>De falla interna:</b> tratamiento de residuos ya generados.</li><li><b>De falla externa:</b> remediación de un daño, multas, juicios.</li></ul>
  <p>Invertir en prevención suele reducir los costos de falla, igual que en la gestión de la calidad.</p>
  <h3>Pasivos y previsiones ambientales</h3><p>Si la empresa tiene una obligación presente (legal o asumida) de remediar un daño, la salida de recursos es probable y se puede estimar, se reconoce una <b>previsión</b> con las reglas generales de la RT 54. Si la obligación es solo posible, se informa en notas. Las obligaciones de desmantelar una planta o restaurar un sitio al final de su vida útil se suman al costo del bien de uso cuando se reconocen.</p>
  <h3>Marco legal</h3><p>La <b>Ley 25.675 General del Ambiente</b> fija los presupuestos mínimos de protección ambiental. Establece la responsabilidad objetiva por daño ambiental (quien lo causa debe restablecerlo al estado anterior o indemnizar) y exige a quienes realizan actividades riesgosas un <b>seguro ambiental</b> de cobertura suficiente (art. 22).</p>
  <h3>Indicadores ambientales típicos</h3><p>Consumo de energía y agua, emisiones de gases de efecto invernadero (alcances 1, 2 y 3), residuos generados y reciclados, incidentes ambientales. Las NIIF S2 piden informar las emisiones y los riesgos climáticos que afectan al negocio.</p>`,
  ex:[{type:"pick",title:"¿Qué tipo de costo ambiental es?",options:["Prevención","Control","Falla interna","Falla externa"],items:[["Instalación de un filtro de emisiones","Prevención"],["Análisis mensual de efluentes","Control"],["Multa por contaminar un arroyo","Falla externa"],["Tratamiento de residuos peligrosos generados en planta","Falla interna"],["Remediación de un terreno vecino contaminado","Falla externa"]]},
   {type:"tf",items:[["Una obligación probable y estimable de remediar un daño se reconoce como previsión.",true],["La Ley 25.675 exige un seguro ambiental a quienes realizan actividades riesgosas.",true],["Los costos de desmantelamiento nunca se agregan al costo del bien de uso.",false,"Se suman al costo cuando se reconoce la obligación."]]}]},
 {lead:"Los reportes de sostenibilidad se están volviendo tan exigidos como los estados contables. El contador participa en prepararlos y en darles seguridad.",
  html:`<h3>Los marcos principales</h3><div class="tw"><table><thead><tr><th>Marco</th><th>Emisor</th><th>Enfoque</th></tr></thead><tbody>
  <tr><td>Estándares GRI</td><td>Global Reporting Initiative</td><td>Impactos de la organización en la economía, el ambiente y las personas</td></tr>
  <tr><td>NIIF S1 y S2 (2023)</td><td>ISSB, dentro de la Fundación IFRS</td><td>Riesgos y oportunidades de sostenibilidad y del clima relevantes para los inversores</td></tr>
  <tr><td>Objetivos de Desarrollo Sostenible (ODS)</td><td>ONU, Agenda 2030</td><td>17 objetivos globales a los que las empresas vinculan sus metas</td></tr>
  <tr><td>RT 36</td><td>FACPCE</td><td>Balance social en Argentina</td></tr></tbody></table></div>
  <h3>Doble materialidad</h3><p>GRI mira hacia afuera (impacto de la empresa en el mundo). Las NIIF S mira hacia adentro (impacto del mundo en el valor de la empresa). Juntas forman lo que se llama <b>doble materialidad</b>.</p>
  <h3>El rol del contador</h3><ul><li>Diseñar el sistema de información que capture los indicadores, con el mismo control interno que la información financiera.</li><li>Preparar el EVEGyD a partir de la contabilidad.</li><li>Como profesional independiente, emitir un <b>informe de aseguramiento</b> sobre el reporte (normas de la FACPCE para otros encargos de aseguramiento).</li></ul>
  <h3>El riesgo de greenwashing</h3><p>Presentar una imagen ambiental mejor que la real es <b>greenwashing</b>. Por eso los reportes deben ser comparables, verificables y equilibrados, mostrando también los impactos negativos.</p>`,
  ex:[{type:"pick",title:"¿Qué marco corresponde?",options:["GRI","NIIF S1 y S2","ODS","RT 36"],items:[["Un inversor quiere saber cómo el cambio climático afecta los flujos de la empresa","NIIF S1 y S2"],["Una empresa argentina prepara su balance social con EVEGyD","RT 36"],["Una empresa vincula su programa de agua potable con la Agenda 2030","ODS"],["Un reporte sobre el impacto de la empresa en las comunidades donde opera","GRI"]]},
   {type:"tf",items:[["La doble materialidad combina el impacto de la empresa en el mundo y el del mundo en la empresa.",true],["El greenwashing consiste en exagerar el desempeño ambiental.",true],["Un contador no puede dar seguridad sobre información no financiera.",false,"Puede hacerlo con un encargo de aseguramiento."]]}]},
],

lessons:[
 {lead:"El Estado nacional administra sus recursos con un sistema integrado que fija la Ley 24.156 de Administración Financiera y de los Sistemas de Control del Sector Público Nacional (1992).",
  html:`<h3>Los sistemas de la administración financiera</h3><div class="tw"><table><thead><tr><th>Sistema</th><th>Órgano rector</th><th>Qué hace</th></tr></thead><tbody>
  <tr><td>Presupuesto</td><td>Oficina Nacional de Presupuesto (ONP)</td><td>Formula y controla la ejecución del presupuesto</td></tr>
  <tr><td>Crédito público</td><td>Oficina Nacional de Crédito Público</td><td>Gestiona el endeudamiento del Estado</td></tr>
  <tr><td>Tesorería</td><td>Tesorería General de la Nación (TGN)</td><td>Administra los fondos y los pagos</td></tr>
  <tr><td>Contabilidad</td><td>Contaduría General de la Nación (CGN)</td><td>Registra las transacciones y prepara la Cuenta de Inversión</td></tr></tbody></table></div>
  <p>Los cuatro sistemas están interrelacionados: cada transacción presupuestaria se registra una sola vez y alimenta a todos (el sistema e-SIDIF).</p>
  <h3>Los sistemas de control</h3><ul><li><b>Control interno:</b> la <b>Sindicatura General de la Nación (SIGEN)</b>, que depende del Poder Ejecutivo, coordina las unidades de auditoría interna de cada organismo.</li><li><b>Control externo:</b> la <b>Auditoría General de la Nación (AGN)</b>, que asiste técnicamente al Congreso. Tiene rango constitucional (art. 85 de la Constitución) y la preside una persona propuesta por el principal partido de la oposición.</li></ul>
  <h3>La Cuenta de Inversión</h3><p>Cada año el Poder Ejecutivo presenta al Congreso la <b>Cuenta de Inversión</b>, que muestra cómo se ejecutó el presupuesto y la situación del Tesoro y de la deuda. El Congreso la aprueba o la rechaza, con el dictamen de la AGN.</p>`,
  ex:[{type:"pick",title:"¿Qué órgano es?",options:["ONP","TGN","CGN","SIGEN","AGN"],items:[["Prepara la Cuenta de Inversión","CGN"],["Asiste al Congreso en el control externo","AGN"],["Coordina las auditorías internas del Poder Ejecutivo","SIGEN"],["Administra los fondos y realiza los pagos","TGN"],["Formula el proyecto de presupuesto","ONP"]]},
   {type:"tf",items:[["La AGN tiene rango constitucional.",true,"Art. 85 de la Constitución Nacional."],["La SIGEN es un órgano de control externo que depende del Congreso.",false,"Es control interno y depende del Poder Ejecutivo."],["La Cuenta de Inversión la aprueba el Congreso.",true]]}]},
 {lead:"El presupuesto público se clasifica de varias formas, y cada una responde a una pregunta distinta: quién gasta, en qué, para qué y con qué fondos.",
  html:`<h3>Clasificadores presupuestarios</h3><div class="tw"><table><thead><tr><th>Clasificador</th><th>Pregunta</th><th>Ejemplo</th></tr></thead><tbody>
  <tr><td>Institucional</td><td>¿Quién gasta?</td><td>Ministerio de Salud</td></tr>
  <tr><td>Por objeto del gasto</td><td>¿En qué se gasta?</td><td>Inciso 1 Gastos en personal; 2 Bienes de consumo; 3 Servicios no personales; 4 Bienes de uso; 5 Transferencias</td></tr>
  <tr><td>Por finalidad y función</td><td>¿Para qué?</td><td>Servicios sociales: salud, educación; Servicios de defensa y seguridad</td></tr>
  <tr><td>Por fuente de financiamiento</td><td>¿Con qué fondos?</td><td>Tesoro nacional, recursos propios, crédito externo</td></tr>
  <tr><td>Económico</td><td>¿Es corriente o de capital?</td><td>Gastos de consumo frente a inversión real</td></tr>
  <tr><td>Programático</td><td>¿Qué producción pública se obtiene?</td><td>Programa de vacunación con sus metas físicas</td></tr></tbody></table></div>
  <h3>Esquema ahorro-inversión-financiamiento</h3><div class="formula">Ingresos corrientes − Gastos corrientes = Resultado económico (ahorro)<br>Ahorro + Ingresos de capital − Gastos de capital = Resultado financiero<br>El resultado financiero se cubre (o se aplica) con fuentes y aplicaciones financieras: deuda, uso de reservas, amortización de deuda.</div>
  <h3>Presupuesto por programas</h3><p>La Ley 24.156 adopta la técnica de <b>presupuesto por programas</b>: cada programa tiene un responsable, recursos asignados y <b>metas físicas</b> (vacunas aplicadas, kilómetros de ruta). Así se puede medir no solo cuánto se gastó sino qué se obtuvo.</p>`,
  ex:[{type:"num",items:[
   {q:"Ingresos corrientes $ 900.000 M y gastos corrientes $ 850.000 M. ¿Resultado económico?",a:50000,u:"$ M"},
   {q:"Con ingresos de capital $ 10.000 M y gastos de capital $ 90.000 M, ¿resultado financiero? (déficit, sin signo)",a:30000,u:"$ M"},
   {q:"Si además hay intereses de la deuda por $ 20.000 M incluidos en los gastos corrientes, ¿resultado primario? (déficit antes de intereses, sin signo)",a:10000,u:"$ M",hint:"Primario = financiero + intereses: −30.000 + 20.000 = −10.000 (déficit)."}]},
   {type:"pick",title:"¿Qué clasificador responde?",options:["Institucional","Por objeto","Por finalidad y función","Por fuente"],items:[["El gasto lo realiza el Ministerio de Educación","Institucional"],["Se compran medicamentos (bienes de consumo)","Por objeto"],["El gasto es para servicios de salud","Por finalidad y función"],["Se financia con un préstamo del BID","Por fuente"]]}]},
 {lead:"El gasto público pasa por etapas que la contabilidad registra una por una. La etapa clave para la contabilidad gubernamental es el devengado.",
  html:`<h3>Etapas del gasto</h3><ol><li><b>Crédito presupuestario:</b> la autorización máxima para gastar que da la ley de presupuesto.</li><li><b>Compromiso:</b> se afecta el crédito con una decisión que obliga a terceros (por ejemplo, la orden de compra adjudicada).</li><li><b>Devengado:</b> nace la obligación de pago porque el proveedor entregó el bien o prestó el servicio, con la conformidad de quien recibe.</li><li><b>Pagado:</b> se cancela la obligación. Antes se emite la orden de pago.</li></ol>
  <div class="formula">Crédito ≥ Compromiso ≥ Devengado ≥ Pagado</div>
  <h3>Deuda exigible</h3><p>La diferencia entre lo devengado y lo pagado es la <b>deuda exigible</b> del Estado con sus proveedores. Al cierre del ejercicio, los gastos devengados y no pagados se cancelan en el ejercicio siguiente con los fondos disponibles.</p>
  <h3>Etapas del recurso</h3><p>Del lado de los ingresos se registra el <b>recurso devengado</b> (nace el derecho de cobro) y el <b>percibido</b> (ingresa a la Tesorería). Para los impuestos, el criterio práctico suele ser el percibido.</p>
  <h3>Diferencias con la contabilidad privada</h3><ul><li>El objetivo no es medir ganancia sino controlar la ejecución del presupuesto y rendir cuentas.</li><li>La contabilidad presupuestaria convive con la patrimonial (activos, pasivos y patrimonio del Estado).</li><li>La referencia internacional son las Normas Internacionales de Contabilidad para el Sector Público (NICSP o IPSAS).</li></ul>`,
  ex:[{type:"order",title:"Ordená las etapas del gasto",items:["Crédito presupuestario","Compromiso","Devengado","Pagado"]},
   {type:"num",items:[
    {q:"Crédito $ 500 M, comprometido $ 420 M, devengado $ 380 M, pagado $ 300 M. ¿Deuda exigible?",a:80,u:"$ M"},
    {q:"En el mismo caso, ¿crédito disponible para nuevos compromisos?",a:80,u:"$ M"},
    {q:"¿Compromisos aún no devengados?",a:40,u:"$ M"}]},
   {type:"pick",title:"¿En qué etapa está?",options:["Compromiso","Devengado","Pagado"],items:[["Se adjudica una licitación y se emite la orden de compra","Compromiso"],["El hospital recibe los insumos de conformidad","Devengado"],["La TGN transfiere el dinero al proveedor","Pagado"],["Se firma un contrato de obra pública","Compromiso"]]}]},
 {lead:"El control de gestión mide si una organización, pública o privada, logra sus objetivos y con qué uso de recursos. Es la otra mitad de esta materia.",
  html:`<h3>Las tres E</h3><div class="tw"><table><thead><tr><th>Concepto</th><th>Pregunta</th><th>Indicador de ejemplo</th></tr></thead><tbody>
  <tr><td><b>Eficacia</b></td><td>¿Se cumplió la meta?</td><td>Vacunas aplicadas / vacunas programadas</td></tr>
  <tr><td><b>Eficiencia</b></td><td>¿Con qué relación entre recursos y resultados?</td><td>Costo por vacuna aplicada</td></tr>
  <tr><td><b>Economía</b></td><td>¿Se obtuvieron los recursos al menor costo, con la calidad debida?</td><td>Precio pagado / precio de referencia</td></tr></tbody></table></div>
  <p>Muchas veces se suma una cuarta E, la <b>efectividad</b> (o impacto): si el programa cambió la realidad que quería cambiar, por ejemplo si bajó la tasa de la enfermedad.</p>
  <h3>Tablero de control</h3><p>Es un conjunto acotado de indicadores clave, con metas y semáforos, que permite a la dirección ver de un vistazo si la gestión va bien. El <b>cuadro de mando integral</b> (Kaplan y Norton) los ordena en cuatro perspectivas: financiera, clientes (o ciudadanos), procesos internos, y aprendizaje y crecimiento.</p>
  <h3>Requisitos de un buen indicador</h3><ul><li>Relevante para un objetivo.</li><li>Medible con datos confiables y a tiempo.</li><li>Comparable con una meta, con períodos anteriores o con otras organizaciones.</li><li>Con un responsable asignado.</li></ul>
  <h3>Auditoría de gestión</h3><p>La AGN y las auditorías internas no solo revisan la legalidad y los números: también hacen <b>auditorías de gestión</b>, que evalúan la eficacia, la eficiencia y la economía de los programas.</p>`,
  ex:[{type:"num",items:[
   {q:"Meta: 200.000 vacunas; aplicadas: 170.000. ¿Eficacia? (en %)",a:85,u:"%",tol:0.01},
   {q:"Costo total del programa $ 340.000.000. ¿Costo por vacuna aplicada?",a:2000,u:"$"},
   {q:"Se pagó $ 1.200 por dosis y el precio de referencia es $ 1.000. ¿Sobreprecio en %?",a:20,u:"%",tol:0.01}]},
   {type:"pick",title:"¿Eficacia, eficiencia o economía?",options:["Eficacia","Eficiencia","Economía"],items:[["Porcentaje de expedientes resueltos sobre los programados","Eficacia"],["Costo por alumno egresado","Eficiencia"],["Precio de compra del papel comparado con el de mercado","Economía"],["Kilómetros de ruta pavimentados sobre la meta anual","Eficacia"],["Horas de trabajo por trámite resuelto","Eficiencia"]]}]},
],

lessons:[
 {lead:"Los títulos valores permiten que un crédito circule de mano en mano con seguridad. El contador los usa a diario: pagarés, letras, cheques y facturas de crédito.",
  html:`<h3>Caracteres de los títulos valores (CCyC, arts. 1815 y siguientes)</h3><ul><li><b>Necesidad:</b> el derecho no existe sin el documento; para cobrar hay que presentarlo.</li><li><b>Literalidad:</b> el derecho es el que surge del texto del título, ni más ni menos.</li><li><b>Autonomía:</b> quien lo adquiere de buena fe tiene un derecho propio, y no le pueden oponer las defensas que había contra los portadores anteriores (art. 1816).</li><li><b>Abstracción:</b> en los títulos cambiarios, el derecho se separa de la causa que les dio origen.</li></ul>
  <h3>Los títulos más usados</h3><div class="tw"><table><thead><tr><th>Título</th><th>Norma</th><th>Quién promete o paga</th></tr></thead><tbody>
  <tr><td>Pagaré</td><td>Decreto-Ley 5965/63</td><td>El propio librador promete pagar</td></tr>
  <tr><td>Letra de cambio</td><td>Decreto-Ley 5965/63</td><td>El librador ordena a un tercero (girado) que pague</td></tr>
  <tr><td>Cheque y ECHEQ</td><td>Ley 24.452</td><td>Orden de pago contra un banco</td></tr>
  <tr><td>Factura de crédito electrónica MiPyME</td><td>Ley 27.440, Título I</td><td>La empresa compradora, una vez aceptada</td></tr></tbody></table></div>
  <h3>Requisitos del pagaré</h3><p>La denominación "pagaré" en el texto, la promesa pura y simple de pagar una suma determinada, el vencimiento, el lugar de pago, el nombre del beneficiario, la fecha y el lugar de creación y la <b>firma</b> del librador. Si falta un requisito esencial, el documento no vale como pagaré (aunque puede servir como prueba de la deuda).</p>
  <h3>Endoso y aval</h3><p>El <b>endoso</b> transmite el título: el endosante firma al dorso y pasa a garantizar el pago. El <b>aval</b> es una garantía cambiaria: el avalista responde igual que el avalado.</p>
  <h3>Factura de crédito electrónica MiPyME</h3><p>Cuando una MiPyME vende a una empresa grande por encima del monto que fija la reglamentación, debe emitir una factura de crédito electrónica. Si la empresa grande no la rechaza en el plazo legal, queda aceptada y se convierte en un título ejecutivo que la MiPyME puede negociar en el mercado de capitales para cobrar antes.</p>`,
  ex:[{type:"pick",title:"¿Qué carácter del título valor se aplica?",options:["Literalidad","Autonomía","Necesidad"],items:[["El tenedor no puede cobrar sin presentar el pagaré","Necesidad"],["El pagaré dice $ 1.000.000; no se puede reclamar más aunque la deuda real fuera mayor","Literalidad"],["El deudor no puede oponerle a un endosatario de buena fe que la mercadería original vino fallada","Autonomía"]]},
   {type:"tf",items:[["En la letra de cambio, el librador ordena a un tercero que pague.",true],["Un pagaré sin firma del librador vale igual como pagaré.",false,"La firma es un requisito esencial."],["El endosante garantiza el pago del título.",true],["Una factura de crédito electrónica aceptada puede negociarse en el mercado de capitales.",true]]}]},
 {lead:"Los bancos financian a las empresas con contratos que el Código Civil y Comercial regula expresamente. Las garantías aseguran que el crédito se cobre.",
  html:`<h3>Contratos bancarios (CCyC, arts. 1378 y siguientes)</h3><div class="tw"><table><thead><tr><th>Contrato</th><th>En qué consiste</th></tr></thead><tbody>
  <tr><td>Cuenta corriente bancaria</td><td>El banco paga los cheques y débitos del cliente con los fondos depositados o con el acuerdo en descubierto</td></tr>
  <tr><td>Préstamo bancario</td><td>El banco entrega dinero y el cliente devuelve capital e intereses</td></tr>
  <tr><td>Descuento bancario</td><td>El cliente cede al banco un crédito a cobrar (cheques, pagarés) y recibe su importe menos los intereses</td></tr>
  <tr><td>Apertura de crédito</td><td>El banco se obliga a tener fondos a disposición del cliente hasta un monto</td></tr>
  <tr><td>Factoraje (factoring)</td><td>Una entidad compra los créditos de la empresa y asume o no el riesgo de cobro</td></tr>
  <tr><td>Leasing</td><td>El dador entrega un bien para su uso a cambio de un canon, con opción de compra al final</td></tr></tbody></table></div>
  <p>El CCyC exige transparencia: el contrato debe informar la tasa de interés y el <b>costo financiero total</b>, y en los contratos con consumidores rigen además las normas de defensa del consumidor.</p>
  <h3>Garantías</h3><ul><li><b>Personales:</b> la <b>fianza</b> (un tercero se obliga a pagar si el deudor no lo hace) y el aval en los títulos.</li><li><b>Reales:</b> la <b>hipoteca</b> (sobre inmuebles), la <b>prenda</b> (sobre cosas muebles; la prenda con registro permite que el deudor siga usando el bien) y la anticresis.</li><li><b>Fideicomiso en garantía:</b> el deudor transfiere bienes a un fiduciario que los vende si no paga.</li></ul>
  <h3>Lectura contable</h3><p>En la contabilidad del deudor, los bienes gravados con hipoteca o prenda se informan en notas como <b>bienes de disponibilidad restringida</b>. En el descuento de documentos, si el banco puede reclamar al cedente cuando el firmante no paga, la empresa mantiene una deuda o un pasivo contingente que debe informar.</p>`,
  ex:[{type:"num",items:[
   {q:"Se descuenta un pagaré de $ 2.000.000 que vence en 60 días, con una tasa de descuento del 3% mensual. ¿Cuánto recibe la empresa? (descuento simple)",a:1880000,u:"$",ex:"Descuento = 2.000.000 × 3% × 2 = 120.000."},
   {q:"En ese caso, ¿cuánto se registra como interés (gasto financiero)?",a:120000,u:"$"}]},
   {type:"pick",title:"¿Garantía personal o real?",options:["Personal","Real"],items:[["Hipoteca sobre la planta","Real"],["Fianza del socio gerente","Personal"],["Prenda con registro sobre un camión","Real"],["Aval en un pagaré","Personal"]]},
   {type:"pick",title:"¿Qué contrato es?",options:["Descuento","Leasing","Factoring","Apertura de crédito"],items:[["La empresa usa una máquina pagando un canon y al final puede comprarla","Leasing"],["El banco adelanta el importe de cheques de clientes cobrando intereses","Descuento"],["Una entidad compra toda la cartera de facturas y asume el riesgo de incobrabilidad","Factoring"],["El banco deja disponible hasta $ 50 millones para que la empresa use cuando quiera","Apertura de crédito"]]}]},
 {lead:"El mercado de capitales permite a las empresas financiarse directamente con inversores. La Ley 26.831, reformada por la Ley 27.440, lo organiza bajo el control de la CNV.",
  html:`<h3>Los actores</h3><ul><li><b>Comisión Nacional de Valores (CNV):</b> la autoridad que autoriza la oferta pública, registra a los agentes y fiscaliza el mercado.</li><li><b>Emisoras:</b> empresas que obtienen fondos emitiendo acciones o deuda.</li><li><b>Mercados:</b> donde se negocian los valores (por ejemplo, Bolsas y Mercados Argentinos, BYMA).</li><li><b>Agentes:</b> los intermediarios registrados en la CNV, como los agentes de liquidación y compensación (ALyC) y los agentes de negociación.</li><li><b>Inversores:</b> personas y entidades que compran los valores.</li></ul>
  <h3>Instrumentos principales</h3><div class="tw"><table><thead><tr><th>Instrumento</th><th>Norma</th><th>Qué es</th></tr></thead><tbody>
  <tr><td>Acciones</td><td>Ley 19.550 y Ley 26.831</td><td>Participación en el capital de una SA</td></tr>
  <tr><td>Obligaciones negociables (ON)</td><td>Ley 23.576</td><td>Deuda emitida por sociedades y cooperativas</td></tr>
  <tr><td>Fondos comunes de inversión (FCI)</td><td>Ley 24.083</td><td>Patrimonio de muchos inversores administrado por una sociedad gerente</td></tr>
  <tr><td>Fideicomisos financieros</td><td>CCyC, arts. 1690 y siguientes</td><td>Títulos respaldados por un conjunto de créditos</td></tr>
  <tr><td>Cheques de pago diferido, pagarés y facturas de crédito</td><td>Normas de la CNV</td><td>Financiamiento de corto plazo, muy usado por las pymes</td></tr></tbody></table></div>
  <h3>Obligaciones de la emisora</h3><ul><li>Publicar estados contables anuales auditados y trimestrales con revisión limitada. Las emisoras aplican, en general, las <b>NIIF</b> (RT 26).</li><li>Informar los <b>hechos relevantes</b> apenas ocurren, porque pueden afectar el precio.</li><li>Tener comité de auditoría y cumplir el régimen de gobierno societario.</li></ul>
  <h3>Abuso de información privilegiada</h3><p>Usar información no pública para operar en el mercado está prohibido y es delito. Quienes acceden a esa información, incluidos los auditores y los asesores contables, tienen deber de reserva.</p>`,
  ex:[{type:"pick",title:"¿Qué instrumento es?",options:["Acción","Obligación negociable","FCI","Fideicomiso financiero"],items:[["Una SA emite deuda a 3 años con interés del 8% anual","Obligación negociable"],["Un banco agrupa préstamos prendarios y emite títulos respaldados por ellos","Fideicomiso financiero"],["Un ahorrista compra cuotapartes administradas por una sociedad gerente","FCI"],["Un inversor se vuelve socio de una empresa que cotiza","Acción"]]},
   {type:"tf",items:[["La CNV autoriza la oferta pública de valores.",true],["Las obligaciones negociables se rigen por la Ley 23.576.",true],["Operar con información privilegiada es una práctica permitida si se informa después.",false],["Las emisoras deben comunicar los hechos relevantes en forma inmediata.",true]]}]},
 {lead:"Cuando una empresa no puede pagar, el derecho ofrece soluciones antes de llegar a la quiebra. Esta lección completa lo visto en el Módulo 26 con el acuerdo preventivo extrajudicial.",
  html:`<h3>La cesación de pagos</h3><p>Es el presupuesto de los concursos (Ley 24.522, art. 1): un estado general y permanente de desequilibrio patrimonial que impide cumplir regularmente las obligaciones. No es lo mismo que un incumplimiento aislado. Se manifiesta por hechos reveladores: reconocimiento judicial o extrajudicial, mora en el cumplimiento, cierre de locales, venta a precio vil, entre otros (art. 79).</p>
  <h3>Las salidas posibles</h3><div class="tw"><table><thead><tr><th>Vía</th><th>Qué es</th><th>Ventaja</th></tr></thead><tbody>
  <tr><td><b>Acuerdo preventivo extrajudicial (APE)</b> (arts. 69 a 76)</td><td>El deudor negocia en privado con sus acreedores y luego pide la homologación judicial</td><td>Más rápido y menos costoso; no hay síndico ni verificación completa</td></tr>
  <tr><td><b>Concurso preventivo</b></td><td>Proceso judicial con síndico, verificación de créditos y propuesta de acuerdo</td><td>Suspende las ejecuciones y ordena a todos los acreedores</td></tr>
  <tr><td><b>Quiebra</b></td><td>Liquidación de los bienes para pagar a los acreedores</td><td>Última instancia</td></tr></tbody></table></div>
  <h3>Mayorías del APE</h3><p>Para homologar el acuerdo hace falta la conformidad de la <b>mayoría absoluta de los acreedores quirografarios</b> que representen las <b>dos terceras partes del pasivo quirografario</b> total (art. 73). El pedido de homologación debe acompañarse de un estado de activos y pasivos y de un listado de acreedores certificados por un <b>contador público</b>.</p>
  <h3>El papel del contador</h3><ul><li>Preparar y certificar el estado patrimonial y el listado de acreedores para el APE.</li><li>Asesorar en la propuesta de pago: quitas, esperas, capitalización de deuda.</li><li>Actuar como síndico en el concurso o la quiebra (Módulo 26).</li></ul>`,
  ex:[{type:"num",items:[
   {q:"Hay 40 acreedores quirografarios con un pasivo de $ 300 M. ¿Cuántos acreedores, como mínimo, deben prestar conformidad al APE?",a:21,tol:0,hint:"Mayoría absoluta: más de la mitad."},
   {q:"¿Qué capital mínimo deben representar esos acreedores?",a:200,u:"$ M",tol:0,hint:"Dos tercios de 300."}]},
   {type:"pick",title:"¿APE, concurso preventivo o quiebra?",options:["APE","Concurso preventivo","Quiebra"],items:[["La empresa negocia en privado con sus acreedores y presenta el acuerdo al juez para homologarlo","APE"],["Se designa un síndico y los acreedores verifican sus créditos para votar una propuesta","Concurso preventivo"],["Se liquidan los bienes del deudor para pagar a los acreedores","Quiebra"]]},
   {type:"tf",items:[["Un único incumplimiento aislado prueba la cesación de pagos.",false,"Debe ser un estado general y permanente."],["El APE requiere un listado de acreedores certificado por contador público.",true]]}]},
],

 html:`<p>Los costos fijos mensuales son $ 200.000 y el costo variable es $ 1.500 por mochila. Al precio actual de $ 2.500, se venden todas las que se fabrican.</p>
 <div class="formula">C(q) = 200.000 + 1.500 q · I(q) = 2.500 q</div>
 <p>Un estudio de mercado estima que, si la empresa fija libremente el precio, la demanda sigue la función <span class="mono">p = 4.000 − 5 q</span>.</p>`,
 ex:[{type:"num",title:"Precio fijo",items:[
   {q:"¿Cuántas mochilas hay que vender para llegar al punto de equilibrio?",a:200,ex:"2.500 q = 200.000 + 1.500 q → q = 200."},
   {q:"¿Cuál es la ganancia si se venden 350?",a:150000,u:"$"}]},
  {type:"num",title:"Precio libre (derivadas)",items:[
   {q:"¿Qué cantidad maximiza el ingreso total I(q) = 4.000 q − 5 q²?",a:400,ex:"I'(q) = 4.000 − 10 q = 0."},
   {q:"¿Qué cantidad maximiza la ganancia, con los costos de arriba?",a:250,ex:"π'(q) = 4.000 − 10 q − 1.500 = 0 → q = 250."},
   {q:"¿A qué precio se venden esas 250 mochilas?",a:2750,u:"$"},
   {q:"¿Cuál es la ganancia máxima?",a:112500,u:"$",ex:"250 × 2.750 − (200.000 + 1.500 × 250) = 687.500 − 575.000."}]},
  {type:"num",title:"Crecimiento compuesto",items:[
   {q:"Si las ventas crecen un 3% por mes, ¿cuánto crecen en 12 meses? (en %)",a:42.58,u:"%",tol:0.05,ex:"1,03¹² − 1 = 42,58%. No es 36%: el crecimiento se compone."}]}]};
