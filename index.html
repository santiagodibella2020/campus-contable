/* Módulo 10 · Sistemas administrativos y control interno */
CAMPUS.content[10] = {
lessons:[
 {lead:"Detrás de cada asiento hay un circuito: una secuencia de pasos, personas y documentos que generan, controlan y registran una operación.",
  html:`<h3>Sistema administrativo</h3><p>Es el conjunto de procedimientos, formularios, personas y sistemas informáticos que procesan las operaciones de la organización y producen información. Un buen sistema es <b>eficaz</b> (logra el objetivo), <b>eficiente</b> (con pocos recursos) y <b>seguro</b> (protege los activos y la confiabilidad de los datos).</p>
  <h3>Elementos de un circuito</h3><ul><li><b>Sectores</b> que intervienen (compras, almacén, contaduría, tesorería).</li><li><b>Documentos</b> que se generan y circulan, con sus copias.</li><li><b>Controles</b> en cada paso.</li><li><b>Archivos y registros</b> donde queda la información.</li></ul>
  <h3>Cursogramas</h3><p>Un cursograma es un diagrama que muestra cómo circulan los documentos entre los sectores. En Argentina se usa la norma IRAM 34.503 para los símbolos: operación, control, archivo, documento, decisión, conector. Se lee por columnas (una por sector) de arriba hacia abajo.</p>
  <h3>Relevamiento y rediseño</h3><p>Para mejorar un circuito: se releva cómo funciona hoy (entrevistas, observación, documentos), se detectan problemas (demoras, duplicaciones, falta de controles), se propone un nuevo diseño y se documenta en un manual de procedimientos.</p>`,
  ex:[{type:"tf",items:[["Un circuito administrativo bien diseñado incluye controles en distintos pasos","Verdadero"],["El cursograma sirve para registrar asientos contables","Falso","Muestra el recorrido de documentos y tareas entre sectores."],["Eficiencia significa lograr el objetivo usando la menor cantidad de recursos","Verdadero"],["Para rediseñar un circuito conviene primero relevar cómo funciona en la realidad","Verdadero"]]}]},
 {lead:"Cada operación queda respaldada por un comprobante. En Argentina, ARCA define qué comprobante emitir y cómo.",
  html:`<div class="tw"><table><thead><tr><th>Comprobante</th><th>Función</th></tr></thead><tbody>
  <tr><td><b>Orden de compra</b></td><td>Pedido formal al proveedor, con precio y condiciones.</td></tr>
  <tr><td><b>Remito</b></td><td>Acompaña el traslado de la mercadería y prueba la entrega.</td></tr>
  <tr><td><b>Factura</b></td><td>Documenta la venta o el servicio y el importe a pagar.</td></tr>
  <tr><td><b>Nota de débito</b></td><td>Aumenta lo facturado (intereses, diferencias de precio).</td></tr>
  <tr><td><b>Nota de crédito</b></td><td>Reduce lo facturado (devoluciones, bonificaciones posteriores).</td></tr>
  <tr><td><b>Recibo</b></td><td>Constancia de que se cobró.</td></tr>
  <tr><td><b>Orden de pago</b></td><td>Documento interno que autoriza un pago.</td></tr></tbody></table></div>
  <h3>Letras de la factura</h3><div class="tw"><table><thead><tr><th>Letra</th><th>Quién la emite</th><th>A quién</th></tr></thead><tbody>
  <tr><td class="mono">A</td><td>Responsable inscripto en IVA</td><td>Otro responsable inscripto (discrimina el IVA, que el comprador computa como crédito fiscal)</td></tr>
  <tr><td class="mono">B</td><td>Responsable inscripto</td><td>Consumidor final, monotributista o exento</td></tr>
  <tr><td class="mono">C</td><td>Monotributista o exento</td><td>Cualquier comprador (no hay IVA que discriminar)</td></tr>
  <tr><td class="mono">M</td><td>Responsable inscripto con observaciones de ARCA</td><td>Responsable inscripto (con retención total del IVA por el comprador)</td></tr>
  <tr><td class="mono">E</td><td>Exportador</td><td>Cliente del exterior</td></tr></tbody></table></div>
  <p>Hoy todos los contribuyentes deben emitir <b>factura electrónica</b>, que se autoriza con un <b>CAE</b> (Código de Autorización Electrónico) otorgado por ARCA. Por el Régimen de Transparencia Fiscal al Consumidor (Ley 27.743), las facturas a consumidores finales deben informar el IVA y otros impuestos nacionales contenidos en el precio.</p>`,
  ex:[{type:"pick",title:"¿Qué letra de factura corresponde?",options:["A","B","C","E"],items:[
   ["Un responsable inscripto le vende a otro responsable inscripto","A"],["Un responsable inscripto le vende a un consumidor final","B"],["Un monotributista le vende a un responsable inscripto","C"],
   ["Un responsable inscripto le vende a un monotributista","B"],["Una empresa exporta servicios de software a un cliente de España","E"]]},
   {type:"pick",title:"¿Qué comprobante se emite?",options:["Remito","Nota de crédito","Nota de débito","Recibo"],items:[["Un cliente devuelve mercadería ya facturada","Nota de crédito"],["Se cobran intereses por pago fuera de término","Nota de débito"],["Se entrega mercadería en el depósito del cliente","Remito"],["Se cobra una factura en efectivo","Recibo"]]}]},
 {lead:"El circuito de compras asegura que se compre lo necesario, al mejor precio, que llegue lo que se pidió y que se pague solo lo que corresponde.",
  html:`<h3>Pasos típicos</h3><ol><li>El sector que necesita algo emite una <b>solicitud de compra</b>.</li><li>Compras pide <b>cotizaciones</b> a varios proveedores y arma un cuadro comparativo.</li><li>Se emite la <b>orden de compra</b>, autorizada según montos.</li>
  <li>Almacén recibe la mercadería con el remito, controla cantidad y calidad, y emite un <b>informe de recepción</b>.</li><li>Cuentas a pagar recibe la factura y hace el <b>control de tres vías</b>: compara orden de compra, informe de recepción y factura.</li>
  <li>Contaduría <b>registra</b> la factura (subdiario de compras y libro IVA Compras).</li><li>Se emite la <b>orden de pago</b>, autorizada por quien corresponda, calculando retenciones impositivas.</li><li>Tesorería <b>paga</b> y archiva el recibo del proveedor.</li></ol>
  <div class="note"><b>El control de tres vías</b> evita pagar mercadería que no llegó, pagar un precio distinto del pactado o pagar dos veces la misma factura. Es uno de los controles más importantes del área.</div>`,
  ex:[{type:"order",title:"Ordená el circuito de compras",items:["Solicitud de compra del sector usuario","Pedido de cotizaciones","Emisión y aprobación de la orden de compra","Recepción de la mercadería e informe de recepción","Control de tres vías con la factura","Registración en el subdiario de compras","Emisión de la orden de pago","Pago al proveedor"]}]},
 {lead:"El circuito de ventas convierte un pedido en dinero cobrado, cuidando que no se venda a quien no va a pagar.",
  html:`<h3>Pasos típicos</h3><ol><li>Se recibe la <b>nota de pedido</b> del cliente.</li><li>Créditos y cobranzas <b>aprueba el crédito</b>: controla el límite y la situación del cliente.</li><li>Depósito prepara la mercadería y emite el <b>remito</b>.</li>
  <li>Facturación emite la <b>factura</b> en base al remito firmado y a la lista de precios vigente.</li><li>Contaduría registra (subdiario de ventas y libro IVA Ventas) y actualiza la cuenta corriente del cliente.</li>
  <li>Cobranzas gestiona el cobro y emite el <b>recibo</b>.</li><li>Tesorería deposita los valores y se concilia con el banco.</li></ol>
  <h3>Cuenta corriente de clientes y antigüedad de saldos</h3><p>El análisis de antigüedad (al día, 1 a 30 días, 31 a 60, más de 90) sirve para gestionar la cobranza y para calcular la previsión de incobrables (Módulo 9).</p>
  <h3>Indicador: días de cobro</h3><div class="formula">Días de cobro = Saldo de deudores / Ventas a crédito anuales × 365</div>`,
  ex:[{type:"order",title:"Ordená el circuito de ventas",items:["Recepción de la nota de pedido","Aprobación del crédito","Preparación y despacho con remito","Emisión de la factura","Registración y cuenta corriente del cliente","Cobranza y emisión del recibo","Depósito y conciliación bancaria"]},
   {type:"num",items:[{q:"Saldo de deudores $ 3.000.000; ventas a crédito anuales $ 36.500.000. ¿Días de cobro?",a:30,tol:0.1}]}]},
 {lead:"Tesorería administra el dinero: recibe, paga, custodia y planifica los fondos.",
  html:`<h3>Funciones</h3><ul><li>Custodia del efectivo y valores.</li><li>Ingresos (depósitos de cobranzas) y egresos (pagos autorizados).</li><li>Manejo de cuentas bancarias, cheques y ECHEQ.</li><li>Presupuesto financiero de corto plazo (flujo de caja).</li></ul>
  <h3>Fondo fijo (caja chica)</h3><p>Una suma fija para gastos menores. Se crea una sola vez y se <b>repone</b> periódicamente por lo gastado, con los comprobantes.</p>
  <div class="tw"><table><thead><tr><th>Momento</th><th>Asiento</th></tr></thead><tbody>
  <tr><td>Creación por $ 100.000</td><td class="mono">Fondo fijo a Banco · 100.000</td></tr>
  <tr><td>Reposición: se gastaron $ 70.000 en librería y movilidad</td><td class="mono">Gastos de librería / Movilidad a Banco · 70.000</td></tr></tbody></table></div>
  <p>El saldo de Fondo fijo no cambia con la reposición: sigue siendo $ 100.000.</p>
  <h3>Arqueo de caja</h3><p>Es el recuento sorpresivo del efectivo y los valores, en presencia del responsable, comparado con el saldo contable. Las diferencias se investigan y se registran.</p>
  <h3>Controles clave</h3><ul><li>Depositar las cobranzas en forma íntegra y diaria (no pagar gastos con cobranzas).</li><li>Firmas conjuntas para pagos importantes.</li><li>Quien maneja el dinero no registra ni concilia.</li></ul>`,
  ex:[{type:"tf",items:[["Al reponer el fondo fijo, se debitan las cuentas de gasto","Verdadero"],["La reposición del fondo fijo disminuye el saldo de la cuenta Fondo fijo","Falso"],["Es buena práctica pagar gastos con el efectivo de las cobranzas antes de depositarlas","Falso","Las cobranzas se depositan íntegras."],["El arqueo de caja debe ser sorpresivo","Verdadero"]]}]},
 {lead:"El control interno es el proceso diseñado para dar seguridad razonable de que la organización cumple sus objetivos operativos, de información y de cumplimiento.",
  html:`<p>El marco más usado es el <b>COSO</b> (Committee of Sponsoring Organizations, actualizado en 2013). Tiene <b>cinco componentes</b>:</p>
  <div class="tw"><table><thead><tr><th>Componente</th><th>Ejemplo</th></tr></thead><tbody>
  <tr><td><b>Entorno de control</b></td><td>Código de conducta, integridad de la dirección, estructura con responsabilidades claras.</td></tr>
  <tr><td><b>Evaluación de riesgos</b></td><td>Identificar qué puede salir mal (fraudes, errores, cambios normativos).</td></tr>
  <tr><td><b>Actividades de control</b></td><td>Autorizaciones, conciliaciones, segregación de funciones, controles de acceso a sistemas.</td></tr>
  <tr><td><b>Información y comunicación</b></td><td>Sistemas que generan datos confiables y los comunican a quien los necesita.</td></tr>
  <tr><td><b>Supervisión (monitoreo)</b></td><td>Auditoría interna, revisiones periódicas de que los controles funcionan.</td></tr></tbody></table></div>
  <h3>Segregación de funciones</h3><p>Ninguna persona debería tener el control de una operación de punta a punta. Se separan cuatro funciones: <b>autorización</b>, <b>custodia</b> de los activos, <b>registración</b> y <b>control</b>.</p>
  <h3>Limitaciones</h3><p>El control interno da seguridad <b>razonable</b>, no absoluta: puede fallar por errores humanos, por colusión entre empleados o porque la dirección pasa por encima de los controles.</p>`,
  ex:[{type:"pick",title:"¿Qué componente del COSO es?",options:["Entorno de control","Evaluación de riesgos","Actividades de control","Información y comunicación","Supervisión"],items:[
   ["La empresa aprueba un código de ética firmado por todos los empleados","Entorno de control"],["Se hace una conciliación bancaria mensual","Actividades de control"],["Auditoría interna revisa cada año si los controles funcionan","Supervisión"],
   ["Se analiza qué procesos tienen más probabilidad de fraude","Evaluación de riesgos"],["El sistema emite un reporte diario de ventas a la gerencia","Información y comunicación"],["El tesorero no puede registrar asientos en el sistema contable","Actividades de control"]]}]},
],

/* Módulo 11 · Cálculo financiero */
CAMPUS.content[11] = {
lessons:[
 {lead:"Con interés simple, los intereses se calculan siempre sobre el capital inicial. Es la lógica de un plazo fijo tradicional a un solo período.",
  html:`<div class="formula">I = C · i · n     ·     M = C · (1 + i · n)</div>
  <ul><li><b>C:</b> capital inicial. <b>M:</b> monto final. <b>I:</b> interés.</li><li><b>i:</b> tasa por período. <b>n:</b> cantidad de períodos, en la misma unidad que la tasa.</li></ul>
  <h3>Tasa anual y plazo en días</h3><p>En Argentina, los bancos expresan la tasa como <b>TNA</b> (tasa nominal anual) y usan año de <b>365 días</b>.</p>
  <div class="formula">I = C · TNA · días / 365</div>
  <p>Ejemplo: $ 100.000 a TNA 36% por 90 días → I = 100.000 × 0,36 × 90/365 = <b>$ 8.876,71</b>.</p>
  <h3>Despejes útiles</h3><ul><li>Capital: C = M / (1 + i·n).</li><li>Tasa: i = (M/C − 1) / n.</li><li>Plazo: n = (M/C − 1) / i.</li></ul>`,
  ex:[{type:"num",items:[
   {q:"$ 500.000 a TNA 40% por 30 días. ¿Cuánto interés se gana?",a:16438.36,u:"$",tol:0.02},
   {q:"¿Qué capital hay que depositar hoy para retirar $ 1.100.000 dentro de un año al 10% simple?",a:1000000,u:"$"},
   {q:"Depositaste $ 200.000 y en 6 meses retiraste $ 230.000. ¿Qué tasa mensual simple ganaste, en %?",a:2.5,u:"%",tol:0.01}]}]},
 {lead:"Con interés compuesto, los intereses se suman al capital y generan nuevos intereses. Es la regla en casi todas las operaciones de más de un período.",
  html:`<div class="formula">M = C · (1 + i)ⁿ     ·     C = M / (1 + i)ⁿ</div>
  <p>Ejemplo: $ 100.000 al 3% mensual durante 12 meses → 100.000 × 1,03¹² = <b>$ 142.576,09</b>. Con interés simple habrían sido $ 136.000: la diferencia es el “interés sobre interés”.</p>
  <h3>Valor actual</h3><p>Traer un importe futuro a hoy se llama <b>actualizar</b> o <b>descontar</b>: C = M / (1+i)ⁿ. Es la base de toda valuación financiera: VAN, valor de un bono, valor de un crédito a largo plazo.</p>
  <h3>Calcular la tasa o el plazo</h3><ul><li>Tasa: i = (M/C)<sup>1/n</sup> − 1.</li><li>Plazo: n = ln(M/C) / ln(1+i).</li></ul>`,
  ex:[{type:"num",items:[
   {q:"$ 100.000 al 3% mensual compuesto durante 12 meses. ¿Monto final?",a:142576.09,u:"$",tol:0.05},
   {q:"¿Cuánto vale hoy un cobro de $ 1.000.000 dentro de 2 años, si la tasa es 20% anual?",a:694444.44,u:"$",tol:0.05,hint:"1.000.000 / 1,2²"},
   {q:"Una inversión de $ 400.000 se transformó en $ 576.000 en 2 años. ¿Tasa anual compuesta, en %?",a:20,u:"%",tol:0.01,hint:"(576/400)^(1/2) − 1"}]}]},
 {lead:"Una misma tasa se puede expresar de muchas formas. Saber convertirlas es indispensable para comparar ofertas de bancos.",
  html:`<ul><li><b>TNA (tasa nominal anual):</b> la tasa “de vidriera”. No tiene en cuenta la capitalización.</li>
  <li><b>TEM (tasa efectiva mensual):</b> la que efectivamente rinde en un período de 30 días. TEM = TNA × 30/365.</li>
  <li><b>TEA (tasa efectiva anual):</b> lo que rinde en un año si reinvertís los intereses. TEA = (1 + TEM)<sup>365/30</sup> − 1.</li></ul>
  <p>Ejemplo: TNA 36% → TEM = 0,36 × 30/365 = 2,959% → TEA = 1,02959<sup>12,1667</sup> − 1 = <b>42,59%</b>.</p>
  <h3>Tasas equivalentes</h3><p>Dos tasas son equivalentes si producen el mismo monto en el mismo tiempo. Para pasar de una tasa efectiva a otra de distinto período:</p>
  <div class="formula">i₂ = (1 + i₁)^(período₂ / período₁) − 1</div>
  <p>Ejemplo: 4% mensual equivale a 1,04¹² − 1 = 60,10% anual. Y una TEA de 60% equivale a una tasa de 30 días de 1,60<sup>30/365</sup> − 1 = 3,94%.</p>
  <div class="note"><b>CFT.</b> En préstamos, el BCRA exige informar el <b>Costo Financiero Total</b>, que suma a la tasa los gastos, seguros, comisiones e impuestos. Es el número que hay que comparar entre bancos.</div>`,
  ex:[{type:"num",items:[
   {q:"TNA 36% para plazos de 30 días. ¿Cuál es la TEM, en %? (tres decimales)",a:2.959,u:"%",tol:0.002},
   {q:"Con esa TEM, ¿cuál es la TEA, en %? (dos decimales)",a:42.59,u:"%",tol:0.02},
   {q:"¿Qué tasa anual efectiva equivale a 4% mensual efectivo? (en %, dos decimales)",a:60.10,u:"%",tol:0.02},
   {q:"Una tarjeta cobra 6% mensual efectivo. ¿Cuál es la tasa efectiva trimestral, en %? (dos decimales)",a:19.10,u:"%",tol:0.02,hint:"1,06³ − 1"}]}]},
 {lead:"Descontar un documento es cobrarlo antes de su vencimiento a cambio de una quita. Es muy común con cheques de pago diferido y facturas de crédito.",
  html:`<h3>Descuento comercial</h3><p>La quita se calcula sobre el <b>valor nominal</b> del documento:</p>
  <div class="formula">D = N · d · n     ·     Valor efectivo = N · (1 − d · n)</div>
  <p>Ejemplo: un cheque de $ 1.000.000 a 60 días, tasa de descuento 30% anual → D = 1.000.000 × 0,30 × 60/365 = <b>$ 49.315,07</b>. Cobrás $ 950.684,93.</p>
  <h3>Tasa de descuento y tasa de interés</h3><p>La tasa de descuento se aplica sobre el valor final; la de interés, sobre el inicial. Por eso, para el mismo plazo, la tasa de interés equivalente es mayor:</p>
  <div class="formula">i = d / (1 − d · n)</div>
  <p>En el ejemplo: i = 0,30 / (1 − 0,30 × 60/365) = 31,56% anual.</p>
  <h3>Descuento racional</h3><p>Se calcula sobre el valor actual: D = N − N/(1 + i·n). Es el “correcto” desde el punto de vista financiero, pero en la práctica bancaria se usa el comercial.</p>
  <h3>Registración</h3><p>Al descontar un documento, la diferencia entre el nominal y lo cobrado es un costo financiero: <span class="mono">Banco + Intereses perdidos (o Descuentos cedidos) a Documentos a cobrar</span>.</p>`,
  ex:[{type:"num",items:[
   {q:"Cheque de $ 1.000.000 a 60 días, tasa de descuento comercial 30% anual (365). ¿Cuánto se cobra?",a:950684.93,u:"$",tol:0.05},
   {q:"¿Qué tasa de interés anual simple equivale a esa operación? (en %, dos decimales)",a:31.56,u:"%",tol:0.02},
   {q:"Un pagaré de $ 500.000 a 90 días se descuenta al 24% anual (comercial, 365). ¿Monto del descuento?",a:29589.04,u:"$",tol:0.05}]}]},
 {lead:"Una renta es una serie de pagos periódicos: cuotas de un préstamo, alquileres, aportes a un plan de ahorro.",
  html:`<h3>Renta vencida (pagos al final de cada período)</h3>
  <div class="formula">VA = c · [1 − (1+i)⁻ⁿ] / i     ·     VF = c · [(1+i)ⁿ − 1] / i</div>
  <p>Ejemplo: 12 cuotas mensuales de $ 10.000 al 2% mensual. Valor actual = 10.000 × 10,5753 = <b>$ 105.753,41</b>. Ese es el precio de contado equivalente.</p>
  <h3>Renta adelantada</h3><p>Si los pagos son al inicio de cada período (como el alquiler), se multiplica la vencida por (1 + i).</p>
  <h3>Perpetuidad</h3><p>Una renta infinita tiene un valor actual finito: <span class="mono">VA = c / i</span>. Se usa para valuar empresas o inmuebles que generan un flujo estable.</p>
  <div class="note"><b>En la hoja de cálculo.</b> Las funciones VA, VF, PAGO, TASA y NPER resuelven estos problemas. Por ejemplo, =VA(2%;12;-10000) devuelve 105.753,41.</div>`,
  ex:[{type:"num",items:[
   {q:"5 cuotas mensuales vencidas de $ 50.000 al 3% mensual. ¿Valor actual?",a:228985.36,u:"$",tol:0.05},
   {q:"Ahorrás $ 10.000 por mes durante 12 meses al 2% mensual. ¿Cuánto tenés al final?",a:134120.90,u:"$",tol:0.05},
   {q:"Un inmueble rinde un alquiler neto de $ 600.000 por año en forma perpetua. Con una tasa del 8% anual, ¿cuánto vale?",a:7500000,u:"$"}]}]},
 {lead:"Un préstamo se devuelve en cuotas que combinan amortización de capital e interés. En Argentina predominan dos sistemas.",
  html:`<h3>Sistema francés (cuota constante)</h3>
  <div class="formula">c = V · i / [1 − (1+i)⁻ⁿ]</div>
  <p>La cuota es fija. Al principio casi todo es interés y poca amortización; al final, al revés. Ejemplo: $ 1.000.000 al 3% mensual en 12 cuotas → cuota <b>$ 100.462,09</b>. En la primera: interés 30.000 y amortización 70.462,09.</p>
  <h3>Sistema alemán (amortización constante)</h3><p>Se devuelve la misma porción de capital en cada cuota (V/n) y el interés se calcula sobre el saldo. Las cuotas son decrecientes. En el ejemplo: amortización 83.333,33 por mes; primera cuota 83.333,33 + 30.000 = <b>113.333,33</b>.</p>
  <div class="tw"><table><thead><tr><th>Concepto</th><th>Francés</th><th>Alemán</th></tr></thead><tbody>
  <tr><td>Cuota</td><td>Constante</td><td>Decreciente</td></tr><tr><td>Amortización</td><td>Creciente</td><td>Constante</td></tr><tr><td>Intereses totales</td><td>Mayores</td><td>Menores</td></tr><tr><td>Primeras cuotas</td><td>Más bajas</td><td>Más altas</td></tr></tbody></table></div>
  <h3>Créditos UVA</h3><p>El capital se expresa en Unidades de Valor Adquisitivo, que se actualizan diariamente por el CER (basado en la inflación). La tasa es baja, pero el saldo en pesos crece con la inflación.</p>`,
  ex:[{type:"num",items:[
   {q:"Préstamo de $ 1.000.000 al 3% mensual, 12 cuotas, sistema francés. ¿Cuota?",a:100462.09,u:"$",tol:0.05},
   {q:"¿Cuánta amortización de capital tiene la primera cuota?",a:70462.09,u:"$",tol:0.05},
   {q:"El mismo préstamo por sistema alemán: ¿cuál es la segunda cuota?",a:110833.33,u:"$",tol:0.05,hint:"Saldo después de la 1.ª: 916.666,67; interés 3% = 27.500"},
   {q:"Préstamo de $ 500.000 al 2% mensual en 6 cuotas, francés. ¿Cuota?",a:89262.91,u:"$",tol:0.05}]}]},
 {lead:"El VAN y la TIR son las dos herramientas clásicas para decidir si un proyecto de inversión conviene.",
  html:`<h3>Valor Actual Neto (VAN)</h3><p>Es la suma de los flujos futuros actualizados a la tasa de costo de capital, menos la inversión inicial.</p>
  <div class="formula">VAN = −I₀ + F₁/(1+k) + F₂/(1+k)² + … + Fₙ/(1+k)ⁿ</div>
  <ul><li>VAN &gt; 0: el proyecto rinde más que la tasa exigida. <b>Conviene.</b></li><li>VAN &lt; 0: no conviene.</li></ul>
  <p>Ejemplo: inversión $ 1.000.000, flujos de $ 450.000 durante 3 años, k = 10% → VAN = 450.000 × 2,4869 − 1.000.000 = <b>$ 119.083,40</b>.</p>
  <h3>Tasa Interna de Retorno (TIR)</h3><p>Es la tasa que hace VAN = 0. Se calcula por prueba y error o con la función TIR de la hoja de cálculo. En el ejemplo, TIR ≈ <b>16,65%</b>. Si la TIR supera el costo de capital, el proyecto conviene.</p>
  <h3>Período de recupero</h3><p>Cuánto tarda en recuperarse la inversión. Es simple pero ignora el valor tiempo y lo que pasa después del recupero.</p>
  <div class="note"><b>VAN o TIR.</b> Si comparan proyectos excluyentes de distinto tamaño, pueden dar órdenes distintos. En ese caso manda el VAN, porque mide la ganancia en pesos.</div>`,
  ex:[{type:"num",items:[
   {q:"Inversión $ 1.000.000; flujos de $ 450.000 por 3 años; k = 10%. ¿VAN?",a:119083.40,u:"$",tol:1},
   {q:"Inversión $ 500.000; flujos de $ 200.000, $ 250.000 y $ 300.000 en los años 1 a 3; k = 12%. ¿VAN?",a:91403.97,u:"$",tol:1},
   {q:"Un proyecto cuesta $ 900.000 y genera $ 300.000 por año. ¿Período de recupero simple, en años?",a:3,tol:0}]},
   {type:"tf",items:[["Si la TIR es menor que el costo de capital, el VAN es negativo","Verdadero"],["El período de recupero tiene en cuenta el valor tiempo del dinero","Falso"]]}]},
 {lead:"En un país con inflación, una tasa alta puede ser negativa en términos reales. La ecuación de Fisher separa las dos cosas.",
  html:`<div class="formula">(1 + tasa nominal) = (1 + tasa real) · (1 + inflación)     →     r = (1 + i) / (1 + π) − 1</div>
  <p>Ejemplo: un plazo fijo con TEA 40% y una inflación anual de 30% → tasa real = 1,40/1,30 − 1 = <b>7,69%</b>. Si la inflación fuera 50%, la tasa real sería −6,67%: perderías poder de compra.</p>
  <p>La aproximación r ≈ i − π solo sirve con tasas bajas. Con las tasas argentinas, siempre usá la fórmula exacta.</p>
  <h3>Instrumentos ajustables</h3><ul><li><b>Plazo fijo UVA:</b> el capital se ajusta por CER más una tasa adicional.</li><li><b>Bonos CER</b> (como los Boncer del Tesoro): ajustan por inflación.</li><li><b>Dólar linked:</b> ajustan por tipo de cambio.</li></ul>
  <h3>Para los estados contables</h3><p>Con inflación, una parte de los intereses nominales es solo compensación por la pérdida del poder adquisitivo. Las normas contables argentinas en moneda homogénea (RT 54) muestran los resultados financieros en términos reales (Módulo 14).</p>`,
  ex:[{type:"num",items:[
   {q:"TEA de un plazo fijo 40%, inflación anual 30%. ¿Tasa real, en %? (dos decimales)",a:7.69,u:"%",tol:0.02},
   {q:"Un préstamo cobra 80% anual y la inflación es 100%. ¿Tasa real, en %? (con signo)",a:-10,u:"%",tol:0.02},
   {q:"Querés ganar 5% real con una inflación esperada de 60%. ¿Qué tasa nominal necesitás, en %?",a:68,u:"%",tol:0.02}]}]},
],

/* Módulo 12 · Tecnología y sistemas de información */
CAMPUS.content[12] = {
lessons:[
 {lead:"El sistema de información contable captura las operaciones, las procesa y entrega informes. Hoy casi siempre es un software, pero la lógica es la misma que aprendiste en papel.",
  html:`<h3>Componentes</h3><ul><li><b>Entrada:</b> comprobantes (facturas, recibos, extractos), cargados a mano, importados o recibidos en forma electrónica.</li><li><b>Proceso:</b> asientos, mayorización automática, cálculos de impuestos y amortizaciones.</li><li><b>Almacenamiento:</b> bases de datos con el plan de cuentas, maestros de clientes, proveedores y artículos.</li><li><b>Salida:</b> libros, estados contables, declaraciones juradas, reportes de gestión.</li></ul>
  <h3>Subsistemas</h3><p>Ventas y cuentas a cobrar, compras y cuentas a pagar, tesorería, inventarios, bienes de uso, sueldos e impuestos. Cada uno genera asientos que se integran en la contabilidad general.</p>
  <h3>Calidad de los datos</h3><p>Un sistema solo es útil si los datos son <b>íntegros</b> (completos), <b>exactos</b>, <b>oportunos</b> y <b>válidos</b> (corresponden a operaciones reales). Los controles de aplicación (validaciones de CUIT, totales de control, numeración correlativa) aseguran estas cualidades.</p>
  <h3>Libros en formato digital</h3><p>Con autorización del Registro Público (art. 329 del CCyC), los libros se pueden llevar en medios digitales. En la Ciudad de Buenos Aires, la Inspección General de Justicia implementó los libros digitales para sociedades, que se presentan por la plataforma de trámites a distancia.</p>`,
  ex:[{type:"pick",title:"¿En qué etapa del sistema está?",options:["Entrada","Proceso","Almacenamiento","Salida"],items:[["Se importa el extracto bancario en el sistema","Entrada"],["El sistema calcula la amortización del mes","Proceso"],["El maestro de proveedores con CUIT y condición frente al IVA","Almacenamiento"],["Se genera el libro IVA Ventas para presentar","Salida"],["El sistema mayoriza todos los asientos del día","Proceso"]]}]},
 {lead:"La hoja de cálculo es la herramienta más usada por los contadores. Dominarla te ahorra horas cada semana.",
  html:`<h3>Funciones esenciales</h3><div class="tw"><table><thead><tr><th>Función</th><th>Para qué</th><th>Ejemplo</th></tr></thead><tbody>
  <tr><td class="mono">SUMA, SUMAR.SI.CONJUNTO</td><td>Totales con condiciones</td><td>Total de ventas de una provincia en un mes</td></tr>
  <tr><td class="mono">BUSCARV / BUSCARX</td><td>Traer datos de otra tabla</td><td>Buscar la razón social a partir del CUIT</td></tr>
  <tr><td class="mono">SI, Y, O</td><td>Condiciones</td><td>Marcar facturas vencidas hace más de 30 días</td></tr>
  <tr><td class="mono">REDONDEAR</td><td>Evitar diferencias de centavos</td><td>IVA de cada factura a dos decimales</td></tr>
  <tr><td class="mono">FECHA, DIAS, FIN.MES</td><td>Cálculos de plazos</td><td>Días de atraso de cada cliente</td></tr>
  <tr><td class="mono">VA, PAGO, TASA, VNA, TIR</td><td>Cálculo financiero</td><td>Cuota de un préstamo, VAN de un proyecto</td></tr></tbody></table></div>
  <h3>Tablas dinámicas</h3><p>Resumen miles de filas en segundos: ventas por cliente y por mes, gastos por centro de costo. Son ideales para analizar los listados que exportás del sistema o de ARCA (por ejemplo, “Mis Comprobantes”).</p>
  <h3>Buenas prácticas</h3><ul><li>Separar datos, cálculos y resultados en distintas hojas.</li><li>No escribir números fijos dentro de las fórmulas: usá celdas de parámetros (alícuota de IVA, tasa).</li><li>Agregar controles cruzados (que la suma de las partes sea igual al total).</li><li>Proteger las celdas con fórmulas y guardar versiones.</li></ul>`,
  ex:[{type:"pick",title:"¿Qué función usarías?",options:["SUMAR.SI.CONJUNTO","BUSCARX","SI","PAGO","Tabla dinámica"],items:[
   ["Traer la condición frente al IVA de cada proveedor desde el maestro","BUSCARX"],["Total facturado a clientes de Córdoba en marzo","SUMAR.SI.CONJUNTO"],["Calcular la cuota de un préstamo francés","PAGO"],
   ["Mostrar “VENCIDA” si pasaron más de 30 días desde la fecha de la factura","SI"],["Resumir 20.000 comprobantes por proveedor y mes","Tabla dinámica"]]}]},
 {lead:"Un software contable o un ERP integra todas las áreas de la empresa en una sola base de datos.",
  html:`<h3>Software contable y ERP</h3><p>Un <b>software contable</b> se enfoca en la contabilidad, los impuestos y los libros. Un <b>ERP</b> (Enterprise Resource Planning) integra además compras, ventas, inventario, producción, sueldos y finanzas: cada operación se carga una sola vez y genera automáticamente sus asientos.</p>
  <h3>Qué evaluar al elegir uno</h3><ul><li>Adaptación a la normativa argentina: factura electrónica, libros IVA digitales, regímenes de retención y percepción, ajuste por inflación.</li><li>Integración con bancos y con los servicios web de ARCA.</li><li>Facilidad de uso y soporte local.</li><li>Seguridad, copias de respaldo y control de accesos por usuario.</li><li>Costo total: licencias, implementación, capacitación y mantenimiento.</li></ul>
  <h3>Implementación</h3><ol><li>Relevar procesos y necesidades.</li><li>Diseñar el plan de cuentas y los centros de costo.</li><li>Migrar saldos y maestros.</li><li>Probar con operaciones reales en paralelo.</li><li>Capacitar a los usuarios.</li><li>Puesta en marcha y seguimiento.</li></ol>
  <div class="note"><b>Asiento automático no significa asiento correcto.</b> Si un artículo está mal configurado, el sistema va a imputar mal cada venta. El contador tiene que revisar las parametrizaciones y conciliar regularmente.</div>`,
  ex:[{type:"tf",items:[["En un ERP, una venta cargada en facturación genera automáticamente su asiento contable","Verdadero"],["Un ERP no necesita revisión contable porque todo es automático","Falso"],["Migrar saldos iniciales es un paso de la implementación","Verdadero"],["Conviene probar el nuevo sistema en paralelo antes de abandonar el anterior","Verdadero"]]}]},
 {lead:"ARCA (ex AFIP) concentra la mayor parte de la relación digital entre el contribuyente y el fisco. Un contador trabaja con sus servicios todos los días.",
  html:`<h3>Clave Fiscal</h3><p>Es la contraseña personal para operar en los servicios de ARCA, con distintos niveles de seguridad. El contribuyente puede <b>delegar</b> servicios en su contador mediante el “Administrador de Relaciones de Clave Fiscal”, sin compartir su clave.</p>
  <h3>Servicios más usados</h3><div class="tw"><table><thead><tr><th>Servicio</th><th>Para qué sirve</th></tr></thead><tbody>
  <tr><td>Comprobantes en línea / Facturación electrónica</td><td>Emitir facturas y obtener el CAE.</td></tr>
  <tr><td>Mis Comprobantes</td><td>Consultar todos los comprobantes emitidos y recibidos.</td></tr>
  <tr><td>Portal IVA / Libro IVA Digital</td><td>Registrar las operaciones y presentar la declaración jurada de IVA.</td></tr>
  <tr><td>Monotributo</td><td>Adhesión, recategorización, pago.</td></tr>
  <tr><td>Declaración en línea (F.931)</td><td>Declaración de aportes y contribuciones de sueldos.</td></tr>
  <tr><td>Sistema de Cuentas Tributarias</td><td>Ver saldos, pagos y deudas.</td></tr>
  <tr><td>Domicilio Fiscal Electrónico</td><td>Recibir notificaciones de ARCA. Es obligatorio y las notificaciones se consideran válidas.</td></tr>
  <tr><td>SIRADIG</td><td>Que los empleados informen sus deducciones de Ganancias.</td></tr></tbody></table></div>
  <div class="note"><b>Domicilio fiscal electrónico.</b> Una notificación de ARCA se tiene por recibida aunque nadie la abra. Revisarlo con frecuencia es parte del trabajo del contador.</div>`,
  ex:[{type:"pick",title:"¿Qué servicio de ARCA usarías?",options:["Facturación electrónica","Mis Comprobantes","Portal IVA","Declaración en línea (F.931)","Administrador de Relaciones"],items:[
   ["Emitir una factura con CAE","Facturación electrónica"],["Bajar todas las facturas que recibió el cliente en el mes","Mis Comprobantes"],["Presentar la DDJJ mensual de IVA","Portal IVA"],["Presentar los aportes y contribuciones del mes","Declaración en línea (F.931)"],["Que tu cliente te habilite a operar en su nombre","Administrador de Relaciones"]]}]},
 {lead:"La automatización y el análisis de datos están cambiando qué hace un contador: menos carga manual, más revisión y análisis.",
  html:`<h3>Qué se puede automatizar</h3><ul><li><b>Conciliaciones</b> bancarias y de tarjetas con reglas de coincidencia.</li><li><b>Carga de comprobantes</b> descargados de ARCA en lugar de tipearlos.</li><li><b>Controles cruzados:</b> comparar IVA Compras con Mis Comprobantes, detectar facturas duplicadas o de proveedores apócrifos.</li><li><b>Reportes</b> periódicos que se actualizan solos.</li></ul>
  <h3>Análisis de datos para contadores</h3><p>Herramientas como Power BI, Power Query o Python permiten trabajar con todas las operaciones (no solo una muestra) y encontrar anomalías: pagos en fines de semana, importes redondos repetidos, proveedores sin empleados.</p>
  <h3>La Ley de Benford</h3><p>En muchos conjuntos de datos naturales (facturas, gastos), el primer dígito no se distribuye de manera uniforme: el 1 aparece cerca del 30% de las veces y el 9 menos del 5%. Una distribución muy distinta puede indicar datos inventados. Se usa en auditoría forense.</p>
  <h3>Inteligencia artificial</h3><p>Asistentes que leen comprobantes, clasifican gastos o redactan informes. Su resultado siempre tiene que ser revisado por el profesional, que es quien firma y responde.</p>`,
  ex:[{type:"tf",items:[["Según la Ley de Benford, el dígito 1 aparece como primer dígito más seguido que el 9","Verdadero"],["Analizar el 100% de las operaciones es imposible con herramientas actuales","Falso"],["Comparar el libro IVA Compras con Mis Comprobantes ayuda a detectar facturas no registradas","Verdadero"],["Si una herramienta de IA prepara un informe, el contador ya no es responsable","Falso"]]}]},
 {lead:"Un contador maneja información confidencial de sus clientes. Protegerla es una obligación profesional y legal.",
  html:`<h3>Principios de seguridad</h3><ul><li><b>Confidencialidad:</b> solo accede quien debe.</li><li><b>Integridad:</b> los datos no se alteran sin autorización.</li><li><b>Disponibilidad:</b> la información está cuando se necesita.</li></ul>
  <h3>Riesgos comunes</h3><ul><li><b>Phishing:</b> correos falsos que imitan a ARCA o a un banco para robar claves.</li><li><b>Ransomware:</b> programas que cifran los archivos y piden rescate.</li><li><b>Fraude del CEO o de cambio de CBU:</b> alguien se hace pasar por un directivo o un proveedor y pide transferir a otra cuenta.</li><li>Claves compartidas, equipos sin actualizar, copias de respaldo inexistentes.</li></ul>
  <h3>Buenas prácticas</h3><ul><li>Doble factor de autenticación en correo, bancos y servicios fiscales.</li><li>Copias de respaldo automáticas, con una copia fuera de línea (regla 3-2-1: 3 copias, 2 medios, 1 fuera del lugar).</li><li>Confirmar por otro canal cualquier cambio de datos bancarios de un proveedor.</li><li>Usuarios individuales con permisos mínimos.</li></ul>
  <div class="note"><b>Protección de datos personales.</b> La Ley 25.326 regula el tratamiento de datos personales. Los legajos de empleados y los datos de clientes que maneja un estudio están alcanzados. Además, el Código de Ética profesional exige el secreto profesional (Módulo 27).</div>`,
  ex:[{type:"pick",title:"Identificá el riesgo",options:["Phishing","Ransomware","Fraude de cambio de CBU","Falta de respaldo"],items:[
   ["Un correo con logo de ARCA pide ingresar la clave fiscal en un enlace","Phishing"],["Todos los archivos del estudio aparecen cifrados con un pedido de pago","Ransomware"],["Un “proveedor” avisa por correo que cambió su cuenta bancaria","Fraude de cambio de CBU"],["Se rompe el disco de la única computadora con la contabilidad","Falta de respaldo"]]}]},
],

(function(){
const ACC = ["Caja","Caja moneda extranjera","Banco Nación c/c","Deudores por ventas","Intereses a devengar (regularizadora)","Mercaderías","Rodados","Maquinarias","Amortización acumulada maquinarias","Desvalorización de bienes de uso (regularizadora)",
 "Proveedores del exterior","Préstamos bancarios","Previsión para juicios","Capital social","Aportes irrevocables","Resultados no asignados","Ventas","Diferencia de cambio","Resultado por tenencia","Intereses ganados","Pérdida por desvalorización de bienes de uso","Juicios perdidos","Intereses perdidos","Resultado venta de bienes de uso"];
CAMPUS.content[13] = {
lessons:[
 {lead:"Medir es asignarle un importe en pesos a cada activo y pasivo. Las normas contables definen qué criterio usar en cada caso.",
  html:`<h3>Reconocimiento</h3><p>Un elemento se incorpora a los estados contables cuando cumple la definición de activo o pasivo, su medición es confiable y es probable que genere (o consuma) beneficios.</p>
  <h3>Criterios de medición</h3><div class="tw"><table><thead><tr><th>Criterio</th><th>Qué mide</th><th>Ejemplo</th></tr></thead><tbody>
  <tr><td><b>Costo histórico</b></td><td>Lo que se pagó al adquirir</td><td>Una máquina comprada hace 3 años</td></tr>
  <tr><td><b>Costo de reposición</b></td><td>Lo que costaría comprarlo hoy</td><td>Mercaderías al precio actual del proveedor</td></tr>
  <tr><td><b>Valor neto de realización (VNR)</b></td><td>Precio de venta menos gastos de venta</td><td>Granos con cotización, mercadería obsoleta</td></tr>
  <tr><td><b>Valor razonable</b></td><td>Precio que se recibiría entre partes independientes</td><td>Acciones con cotización, propiedades de inversión</td></tr>
  <tr><td><b>Valor descontado</b></td><td>Flujos futuros traídos a hoy con una tasa</td><td>Créditos y deudas a largo plazo</td></tr></tbody></table></div>
  <h3>El límite: valor recuperable</h3><p>Ningún activo puede figurar por más de lo que se espera recuperar de él. El <b>valor recuperable</b> es el mayor entre el VNR (vendiéndolo) y el valor de uso (usándolo). Si la medición contable lo supera, se registra una <b>desvalorización</b>.</p>
  <h3>Normas aplicables</h3><p>En Argentina, la <b>RT 54</b> de la FACPCE (Norma Unificada Argentina de Contabilidad) rige para los ejercicios iniciados desde el 1/1/2025 y reemplazó a las RT 6, 8, 9, 11, 14, 17, 18, 21, 22, 23 y 41, entre otras (hoy rige con el texto ordenado por la RT 59). Mantiene la lógica de medición inicial al costo, mediciones periódicas según el rubro y el límite del valor recuperable, e incorporó simplificaciones según el tamaño del ente.</p>
  <h3>Categorías de entes en la RT 54</h3><div class="tw"><table><thead><tr><th>Categoría</th><th>Consecuencia práctica</th></tr></thead><tbody>
  <tr><td><b>Pequeños</b></td><td>Máximo de simplificaciones: por ejemplo, comparan con el valor recuperable solo si hay indicios de desvalorización y tienen opciones para no segregar componentes financieros.</td></tr>
  <tr><td><b>Medianos</b></td><td>Algunas simplificaciones, menos que los pequeños.</td></tr>
  <tr><td><b>Restantes</b></td><td>Aplican la norma completa (los que superan los parámetros de pequeños y medianos).</td></tr></tbody></table></div>
  <p>Los parámetros que definen cada categoría (ingresos, actividad, oferta pública) están en la propia RT 54 y se actualizan: consultalos en el texto ordenado vigente.</p>
  <h3>Conceptos nuevos que conviene dominar</h3><ul><li><b>Probable</b>: la RT 54 lo define como una probabilidad de ocurrencia <b>mayor al 50%</b> ("más probable que no").</li><li><b>Costo o esfuerzo desproporcionado</b>: permite no aplicar un requerimiento cuando obtener la información costaría más que el beneficio para los usuarios. Hay que justificarlo.</li><li><b>Resultados extraordinarios</b>: la RT 54 los eliminó. Todos los resultados se presentan como ordinarios, sin una línea separada de "extraordinarios".</li></ul>
  <p>Antes de aplicar un criterio concreto, revisá el texto vigente en la web de la FACPCE.</p>`,
  ex:[{type:"pick",title:"¿Qué criterio de medición se describe?",options:["Costo histórico","Costo de reposición","VNR","Valor descontado"],items:[
   ["Una deuda a pagar en 3 años se trae a hoy con una tasa de mercado","Valor descontado"],["Se mide el stock de soja por su cotización menos los gastos de venta","VNR"],["Se mide la mercadería al precio que hoy cobra el proveedor","Costo de reposición"],["Un terreno se mide por lo que se pagó en la escritura","Costo histórico"]]},
   {type:"num",items:[{q:"Una máquina tiene valor contable de $ 5.000.000. Su VNR es $ 3.800.000 y su valor de uso $ 4.200.000. ¿Cuál es su valor recuperable?",a:4200000,u:"$"},{q:"¿Por cuánto hay que registrar la desvalorización?",a:800000,u:"$"}]}]},
 {lead:"El efectivo es el rubro más simple de medir, salvo cuando está en moneda extranjera.",
  html:`<h3>Caja y bancos en moneda nacional</h3><p>Se miden por su valor nominal. Incluye efectivo, fondos fijos, cuentas corrientes y cajas de ahorro, y valores a depositar (cheques de terceros recibidos).</p>
  <h3>Moneda extranjera</h3><p>Al cierre, los saldos en moneda extranjera se convierten al <b>tipo de cambio de cierre</b>. Por convención, los activos se miden al tipo <b>comprador</b> y los pasivos al tipo <b>vendedor</b>, normalmente del Banco de la Nación Argentina.</p>
  <p>La diferencia con el valor contable anterior es una <b>diferencia de cambio</b>, que integra los resultados financieros.</p>
  <div class="formula">Diferencia de cambio = Moneda extranjera × (TC de cierre − TC contabilizado)</div>
  <p>Ejemplo: US$ 5.000 en caja contabilizados a $ 1.000. Al cierre, el comprador es $ 1.150 → nuevo valor $ 5.750.000; diferencia de cambio positiva de <b>$ 750.000</b>.</p>
  <h3>Equivalentes de efectivo</h3><p>Inversiones de muy alta liquidez, fácilmente convertibles en efectivo y con riesgo insignificante de cambio de valor, típicamente con vencimiento de hasta tres meses (por ejemplo, un plazo fijo a 30 días). Importan para el estado de flujo de efectivo (Módulo 15).</p>`,
  ex:[{type:"num",items:[{q:"US$ 5.000 contabilizados a $ 1.000; tipo comprador al cierre $ 1.150. ¿Diferencia de cambio?",a:750000,u:"$"},{q:"Una deuda de US$ 2.000 contabilizada a $ 1.050; vendedor al cierre $ 1.200. ¿Diferencia de cambio (pérdida, sin signo)?",a:300000,u:"$"}]},
   {type:"asiento",accounts:ACC,entries:[{t:"31/12 · Registrá la diferencia de cambio de los US$ 5.000 en caja.",e:[["Caja moneda extranjera",750000,0],["Diferencia de cambio",0,750000]]},{t:"31/12 · Registrá la diferencia de cambio de la deuda de US$ 2.000 con un proveedor del exterior.",e:[["Diferencia de cambio",300000,0],["Proveedores del exterior",0,300000]]}]}]},
 {lead:"Los créditos son derechos a cobrar. Se miden por lo que se espera cobrar, descontado si el plazo es largo y neto de incobrables.",
  html:`<h3>Créditos por ventas y otros créditos</h3><ul><li><b>Créditos por ventas:</b> deudores por ventas, documentos a cobrar, tarjetas de crédito a cobrar.</li><li><b>Otros créditos:</b> anticipos a proveedores, créditos fiscales (saldo a favor de IVA, anticipos de Ganancias), préstamos al personal, depósitos en garantía.</li></ul>
  <h3>Componentes financieros implícitos</h3><p>Si una venta a plazo largo incluye intereses, el crédito se mide al <b>valor descontado</b> y los intereses se reconocen a medida que transcurre el tiempo. Ejemplo: se vende a cobrar $ 1.100.000 dentro de un año, con tasa de mercado 10% → la venta se reconoce por $ 1.000.000 y los $ 100.000 son intereses ganados a devengar.</p>
  <p><b>Simplificación de la RT 54:</b> si todas las cuotas o el saldo vencen dentro de los <b>12 meses</b> desde la operación, el ente puede optar por <b>no segregar</b> los componentes financieros implícitos y registrar el crédito por su valor nominal.</p>
  <h3>Previsión para incobrables</h3><p>Se resta del rubro (Módulo 9). En los estados contables se informa el crédito neto de previsión.</p>
  <h3>Corriente y no corriente</h3><p>Un crédito es <b>corriente</b> si se espera cobrar dentro de los 12 meses desde el cierre. Si no, es no corriente.</p>`,
  ex:[{type:"num",items:[{q:"Se vende un equipo a cobrar $ 1.210.000 dentro de 2 años. La tasa de mercado es 10% anual. ¿Por cuánto se reconoce la venta?",a:1000000,u:"$",hint:"1.210.000 / 1,1²"},{q:"¿Cuántos intereses se devengan durante el primer año?",a:100000,u:"$",hint:"10% sobre 1.000.000"}]},
   {type:"pick",title:"¿Créditos por ventas u otros créditos?",options:["Créditos por ventas","Otros créditos"],items:[["Factura a cobrar a un cliente","Créditos por ventas"],["Saldo a favor de IVA","Otros créditos"],["Cupones de tarjetas de crédito a cobrar","Créditos por ventas"],["Anticipo pagado a un proveedor","Otros créditos"],["Préstamo a un empleado","Otros créditos"]]}]},
 {lead:"Los bienes de cambio son los que se compran o producen para vender. Su medición afecta directamente el resultado bruto.",
  html:`<h3>Medición inicial</h3><p>Al costo: precio de compra más fletes, seguros y gastos necesarios para tenerlos en condiciones de venta, menos descuentos. El IVA crédito fiscal recuperable <b>no</b> forma parte del costo.</p>
  <h3>Medición al cierre</h3><p>Con la RT 54 cualquier ente puede elegir, para medir sus bienes de cambio al cierre, uno de estos criterios:</p><ul><li><b>Costo</b> (costo histórico, con el método de asignación elegido: PEPS o PPP).</li><li><b>Costo de reposición</b>: lo que costaría comprarlos o producirlos hoy.</li><li><b>Costo de la última compra</b>: una aproximación práctica al costo de reposición.</li></ul>
  <p>Para los bienes <b>fungibles con mercado activo</b> (granos, hacienda, commodities) también se puede optar por el <b>valor neto de realización</b> (precio de venta menos gastos de venta). El criterio elegido se aplica en forma <b>uniforme</b> a los bienes similares y se mantiene en el tiempo; cambiarlo es un cambio de política contable.</p>
  <p>Si se usa un valor corriente, la diferencia con el costo es un <b>resultado por tenencia</b>. En todos los casos rige el límite del <b>valor recuperable</b>: si el valor contable lo supera, se desvaloriza. Los entes pequeños y medianos hacen esa comparación solo cuando hay indicios de desvalorización.</p>
  <div class="formula">Ejemplo: 100 unidades, costo $ 1.000 c/u, última compra $ 1.150 c/u. Medidas a costo de última compra: $ 115.000, resultado por tenencia $ 15.000.</div>
  <p>Siempre con el <b>límite del valor recuperable</b>: si la mercadería se volvió obsoleta o bajó su precio de venta, se mide por su VNR.</p>
  <h3>Ejemplo</h3><p>Mercadería con costo $ 100.000. Al cierre: costo de reposición $ 120.000; VNR $ 110.000. Se mide a <b>$ 110.000</b> (el límite) y se reconoce un resultado por tenencia de $ 10.000.</p>
  <h3>Bienes en producción y obras en construcción</h3><p>Se miden a su costo de producción. Las obras de construcción a largo plazo pueden reconocer resultados según el grado de avance cuando se cumplen ciertas condiciones.</p>`,
  ex:[{type:"num",items:[{q:"La empresa mide sus bienes de cambio a costo de reposición. Costo $ 100.000; costo de reposición al cierre $ 120.000; valor recuperable (VNR) $ 110.000. ¿A qué valor se mide?",a:110000,u:"$",hint:"El valor recuperable es el tope.",ex:"El costo de reposición ($ 120.000) supera al valor recuperable, así que se mide a $ 110.000."},{q:"Criterio elegido: costo de reposición. Costo $ 80.000; costo de reposición $ 95.000; VNR $ 150.000. ¿Resultado por tenencia?",a:15000,u:"$"},{q:"Criterio elegido: costo de la última compra. Hay 400 unidades a un costo promedio de $ 2.500 y la última compra fue a $ 2.800 c/u. ¿Resultado por tenencia?",a:120000,u:"$",ex:"400 × (2.800 − 2.500) = $ 120.000."},{q:"Compraste mercadería por $ 500.000 + IVA 21%, más un flete de $ 20.000 + IVA. ¿Cuál es el costo de la mercadería?",a:520000,u:"$",hint:"El IVA crédito fiscal no es costo."}]},
   {type:"asiento",accounts:ACC,entries:[{t:"31/12 · La mercadería con costo contable de $ 80.000 tiene un costo de reposición de $ 95.000 (y un VNR mayor). Registrá el resultado por tenencia.",e:[["Mercaderías",15000,0],["Resultado por tenencia",0,15000]]}]},
   {type:"tf",items:[["Con la RT 54 cualquier ente puede medir sus bienes de cambio al costo, al costo de reposición o al costo de la última compra.",true,"Es una opción para todos los entes, que se aplica en forma uniforme."],["El VNR puede usarse para cualquier bien de cambio, aunque no tenga mercado activo.",false,"La opción del VNR es para bienes fungibles con mercado activo."],["Aunque se elija el costo, los bienes de cambio no pueden superar su valor recuperable.","Verdadero","El límite del valor recuperable rige siempre."],["Un ente pequeño debe comparar todos sus activos con el valor recuperable en cada cierre, haya o no indicios de desvalorización.",false,"Los pequeños y medianos solo lo hacen cuando hay indicios."]]}]},
 {lead:"Los bienes de uso son los que se usan en la actividad (máquinas, rodados, edificios). Las propiedades de inversión se tienen para alquilar o por valorización.",
  html:`<h3>Bienes de uso</h3><p>Se miden inicialmente al costo de adquisición o construcción, más los gastos para ponerlos en condiciones de uso (instalación, fletes, honorarios). Después:</p>
  <ul><li><b>Modelo del costo:</b> costo menos amortizaciones acumuladas y desvalorizaciones.</li><li><b>Modelo de revaluación</b> (previsto en la RT 54, que lo heredó de la RT 31): a valor razonable a la fecha de la revaluación, por clases de bienes. El mayor valor va a un <b>saldo por revaluación</b> dentro del patrimonio neto, no a resultados.</li></ul>
  <h3>Baja y venta</h3><p>Al vender un bien de uso, se dan de baja su costo y su amortización acumulada. La diferencia entre el precio de venta y el valor residual contable es un resultado.</p>
  <div class="formula">Resultado de la venta = Precio − (Valor de origen − Amortización acumulada)</div>
  <h3>Propiedades de inversión</h3><p>Inmuebles que se tienen para obtener rentas o por su valorización, no para usarlos en la actividad principal. En la RT 54 la categoría comprende solo <b>inmuebles</b>. Se pueden medir al costo o a su <b>valor razonable</b> (sin deducir los costos de venta); si se usa valor razonable, los cambios van a resultados y se presentan por separado en el estado de resultados.</p>
  <h3>Activos biológicos</h3><p>Hacienda, cultivos, plantaciones. Tienen reglas específicas, antes en la RT 22 y hoy en el capítulo de actividad agropecuaria de la RT 54, que privilegian el VNR.</p>`,
  ex:[{type:"num",items:[{q:"Una máquina costó $ 6.000.000 y tiene amortización acumulada de $ 4.000.000. Se vende en $ 2.500.000. ¿Resultado de la venta?",a:500000,u:"$"}]},
   {type:"asiento",accounts:ACC,entries:[{t:"30/06 · Se vende la máquina anterior (costo $ 6.000.000, amortización acumulada $ 4.000.000) en $ 2.500.000 cobrados por banco (ignorá el IVA).",e:[["Banco Nación c/c",2500000,0],["Amortización acumulada maquinarias",4000000,0],["Maquinarias",0,6000000],["Resultado venta de bienes de uso",0,500000]]},
    {t:"31/12 · Una máquina con valor residual contable de $ 5.000.000 tiene un valor recuperable de $ 4.200.000. Registrá la desvalorización.",e:[["Pérdida por desvalorización de bienes de uso",800000,0],["Desvalorización de bienes de uso (regularizadora)",0,800000]]}]}]},
 {lead:"Los intangibles son activos sin sustancia física: software, marcas, patentes, licencias. Solo se reconocen si cumplen requisitos estrictos.",
  html:`<h3>Requisitos para reconocer un intangible</h3><ul><li>Es <b>identificable</b> (se puede separar o surge de un derecho legal).</li><li>La empresa lo <b>controla</b>.</li><li>Es probable que genere beneficios futuros.</li><li>Su costo se puede medir de manera confiable.</li></ul>
  <h3>Qué se activa y qué no</h3><div class="tw"><table><thead><tr><th>Concepto</th><th>Tratamiento</th></tr></thead><tbody>
  <tr><td>Software comprado o licencias</td><td>Se activa y se amortiza</td></tr><tr><td>Marca o patente comprada</td><td>Se activa</td></tr>
  <tr><td>Gastos de <b>investigación</b></td><td>Gasto del período</td></tr><tr><td>Gastos de <b>desarrollo</b></td><td>Se pueden activar si se demuestra factibilidad técnica, intención, capacidad de uso o venta y beneficios probables</td></tr>
  <tr><td>Publicidad, capacitación, reorganización</td><td>Gasto del período</td></tr><tr><td>Marca o llave de negocio generadas internamente</td><td>No se reconocen</td></tr>
  <tr><td><b>Criptoactivos</b> (bitcoin, otras criptomonedas) que no son moneda de curso legal</td><td>Según la RT 54 se tratan como <b>activos intangibles</b>, no como caja ni como inversiones</td></tr></tbody></table></div>
  <h3>Llave de negocio</h3><p>Surge solo cuando se <b>compra</b> una empresa y se paga más que el valor de sus activos netos identificables. Esa diferencia representa clientela, reputación y sinergias. Se trata con reglas específicas (RT 18 y RT 21, hoy en la RT 54).</p>
  <h3>Vida útil</h3><p>Los intangibles con vida útil definida se amortizan. Los de vida útil indefinida no se amortizan pero se someten a pruebas de desvalorización.</p>`,
  ex:[{type:"pick",title:"¿Se activa como intangible o es gasto?",options:["Se activa","Es gasto"],items:[["Compra de una licencia de software por 3 años","Se activa"],["Campaña publicitaria de lanzamiento","Es gasto"],["Investigación básica de un nuevo material","Es gasto"],["Compra de la marca de un competidor","Se activa"],["Prestigio que la empresa construyó en 20 años","Es gasto","No se reconoce un intangible generado internamente."],["Capacitación del personal","Es gasto"]]},
   {type:"num",items:[{q:"Se compra una empresa en $ 50.000.000. Sus activos identificables valen $ 70.000.000 y sus pasivos $ 30.000.000. ¿Llave de negocio?",a:10000000,u:"$"}]}]},
 {lead:"Los pasivos son obligaciones presentes que van a requerir recursos. Algunas son ciertas, otras dependen de hechos futuros.",
  html:`<h3>Deudas</h3><p>Comerciales, bancarias y financieras, remuneraciones y cargas sociales, cargas fiscales, anticipos de clientes, dividendos a pagar. Se miden por lo que se va a pagar, descontado si el plazo es largo. Las deudas en moneda extranjera se convierten al tipo vendedor al cierre.</p>
  <h3>Previsiones y contingencias</h3><div class="tw"><table><thead><tr><th>Probabilidad de la pérdida</th><th>Tratamiento</th></tr></thead><tbody>
  <tr><td><b>Probable</b> (más del 50%) y cuantificable</td><td>Se registra una previsión</td></tr><tr><td><b>Probable</b> pero no cuantificable</td><td>Se informa en notas</td></tr>
  <tr><td><b>Posible</b> (ni probable ni remota)</td><td>Se informa en notas</td></tr><tr><td><b>Remota</b></td><td>No se informa</td></tr></tbody></table></div>
  <p>Las contingencias <b>positivas</b> (por ejemplo, un juicio que la empresa probablemente gane) no se registran hasta que se realizan.</p>
  <h3>Ejemplo</h3><p>Un ex empleado demanda a la empresa por $ 3.000.000. Los abogados estiman que es probable perder y que la condena rondaría $ 2.000.000: se registra una previsión por $ 2.000.000.</p>
  <h3>Hechos posteriores al cierre</h3><p>Si un hecho ocurrido después del cierre (pero antes de emitir los estados) aporta evidencia sobre una situación que ya existía al cierre, se ajustan los estados. Si es un hecho nuevo, se informa en notas si es significativo.</p>`,
  ex:[{type:"pick",title:"¿Cómo se trata cada contingencia?",options:["Previsión","Nota","Nada"],items:[["Juicio laboral con pérdida probable estimada en $ 2 millones","Previsión"],["Reclamo de un cliente con probabilidad posible de pérdida","Nota"],["Demanda sin fundamento con probabilidad remota","Nada"],["Juicio que la empresa probablemente gane por $ 5 millones","Nada","Las contingencias positivas no se registran."],["Pérdida probable que no se puede estimar razonablemente","Nota"]]},
   {type:"asiento",accounts:ACC,entries:[{t:"31/12 · Registrá la previsión del juicio laboral estimada en $ 2.000.000.",e:[["Juicios perdidos",2000000,0],["Previsión para juicios",0,2000000]]}]}]},
 {lead:"El patrimonio neto es lo que les corresponde a los dueños. Se divide entre lo que aportaron y lo que la empresa generó.",
  html:`<div class="tw"><table><thead><tr><th>Grupo</th><th>Cuentas</th></tr></thead><tbody>
  <tr><td><b>Aportes de los propietarios</b></td><td>Capital suscripto, ajuste de capital (por inflación), aportes irrevocables para futuras suscripciones, primas de emisión</td></tr>
  <tr><td><b>Resultados acumulados</b></td><td>Ganancias reservadas (reserva legal, estatutaria, facultativa), resultados no asignados, saldo por revaluación y otros resultados diferidos</td></tr></tbody></table></div>
  <h3>Aportes irrevocables</h3><p>Dinero que los socios entregan a cuenta de un futuro aumento de capital. Para clasificarse en el PN, el aporte debe estar aceptado por el órgano de administración, ser irrevocable y tener un plazo para que la asamblea lo capitalice. Si no cumple las condiciones, es un pasivo con los socios.</p>
  <h3>Ajuste de capital</h3><p>Cuando se aplica el ajuste por inflación, el capital se mantiene a su valor nominal (el que figura en el estatuto) y la reexpresión se muestra en la cuenta Ajuste de capital (Módulo 14).</p>
  <h3>Restricciones a la distribución</h3><p>No se pueden distribuir dividendos sin ganancias realizadas y líquidas (art. 68 de la Ley General de Sociedades) y hay que constituir la reserva legal (art. 70), como vemos en el Módulo 16.</p>`,
  ex:[{type:"pick",title:"¿Aporte de los propietarios o resultado acumulado?",options:["Aporte","Resultado acumulado"],items:[["Capital suscripto","Aporte"],["Reserva legal","Resultado acumulado"],["Ajuste de capital","Aporte"],["Resultados no asignados","Resultado acumulado"],["Aportes irrevocables","Aporte"],["Prima de emisión","Aporte"]]},

lessons:[
 {lead:"La contabilidad es una disciplina técnica con su propia teoría. Entenderla te permite resolver casos que ninguna norma prevé.",
  html:`<h3>¿Ciencia, técnica o tecnología?</h3><p>El debate es clásico. La corriente que predomina en Argentina (con autores como Carlos García Casella y Juan Carlos Viegas) entiende la contabilidad como una <b>disciplina</b> que estudia la realidad patrimonial y no patrimonial de los entes, con una <b>teoría general</b> y distintos <b>modelos</b> aplicables según los usuarios.</p>
  <h3>Segmentos contables</h3><ul><li><b>Patrimonial o financiera:</b> para usuarios externos, regulada por normas profesionales.</li><li><b>Gerencial:</b> para la dirección, sin normas obligatorias.</li><li><b>Gubernamental:</b> el patrimonio y el presupuesto del Estado.</li><li><b>Social y ambiental:</b> impacto en la comunidad y el ambiente.</li><li><b>Económica:</b> las cuentas nacionales a nivel país.</li></ul>
  <h3>Modelos contables</h3><p>Un modelo contable resulta de combinar tres decisiones:</p>
  <ol><li><b>Unidad de medida:</b> moneda nominal o moneda homogénea (ajustada por inflación).</li><li><b>Criterios de medición:</b> costos históricos o valores corrientes.</li><li><b>Capital a mantener:</b> financiero o físico.</li></ol>
  <p>Las normas argentinas adoptan, en general, un modelo mixto: moneda homogénea cuando hay inflación significativa, una combinación de costos y valores corrientes según el rubro, y capital financiero.</p>`,
  ex:[{type:"pick",title:"¿Qué segmento contable es?",options:["Patrimonial","Gerencial","Gubernamental","Social y ambiental"],items:[["Estados contables presentados a un banco","Patrimonial"],["Informe de costos por línea de producto para el directorio","Gerencial"],["Cuenta de inversión del Estado nacional","Gubernamental"],["Reporte de emisiones de carbono de la empresa","Social y ambiental"]]}]},
 {lead:"El marco conceptual define para qué sirve la información contable, qué elementos tiene y qué cualidades debe reunir.",
  html:`<p>En Argentina, el marco conceptual estaba en la <b>RT 16</b> y hoy está integrado en la <b>RT 54</b>. Las NIIF tienen su propio Marco Conceptual (IASB, revisado en 2018), muy similar en lo esencial.</p>
  <h3>Objetivo</h3><p>Brindar información sobre el patrimonio del ente, su evolución y sus flujos de efectivo, útil para que los usuarios tomen decisiones económicas (invertir, prestar, controlar a la administración).</p>
  <h3>Elementos de los estados contables</h3><div class="tw"><table><thead><tr><th>Elemento</th><th>Definición resumida</th></tr></thead><tbody>
  <tr><td><b>Activo</b></td><td>Recurso controlado por el ente, del que se esperan beneficios económicos futuros, como resultado de hechos pasados.</td></tr>
  <tr><td><b>Pasivo</b></td><td>Obligación presente del ente, que probablemente requiera entregar recursos, como resultado de hechos pasados.</td></tr>
  <tr><td><b>Patrimonio neto</b></td><td>Activo menos pasivo.</td></tr>
  <tr><td><b>Ingresos y gastos</b></td><td>Aumentos y disminuciones del PN vinculados con las actividades principales.</td></tr>
  <tr><td><b>Ganancias y pérdidas</b></td><td>Aumentos y disminuciones del PN por actividades secundarias o hechos ajenos a la voluntad del ente.</td></tr>
  <tr><td><b>Aportes y retiros de los propietarios</b></td><td>Cambios en el PN por transacciones con los dueños.</td></tr></tbody></table></div>
  <h3>Supuestos</h3><p><b>Empresa en marcha:</b> se supone que el ente seguirá operando. Si no, los activos se miden a valores de liquidación. <b>Devengamiento:</b> los efectos se reconocen cuando ocurren, no cuando se cobran o pagan.</p>`,
  ex:[{type:"tf",items:[["Para ser activo, un recurso tiene que ser propiedad legal del ente","Falso","Alcanza con que lo controle (por ejemplo, un bien en leasing)."],["Un pasivo surge de hechos pasados","Verdadero"],["Una pérdida por un incendio es un “gasto”","Falso","Es una pérdida: un hecho ajeno a las actividades principales."],["Si una empresa va a liquidarse, el supuesto de empresa en marcha no aplica","Verdadero"]]}]},
 {lead:"Para que sirva, la información contable tiene que reunir ciertas cualidades. Son los criterios con que se juzga cualquier norma.",
  html:`<div class="tw"><table><thead><tr><th>Requisito</th><th>Qué significa</th></tr></thead><tbody>
  <tr><td><b>Pertinencia</b></td><td>Es útil para las decisiones del usuario: tiene valor predictivo o confirmatorio.</td></tr>
  <tr><td><b>Confiabilidad</b></td><td>Es creíble. Incluye <i>aproximación a la realidad</i> (esencialidad, neutralidad, integridad) y <i>verificabilidad</i>.</td></tr>
  <tr><td><b>Esencialidad</b></td><td>Prevalece la sustancia económica sobre la forma legal.</td></tr>
  <tr><td><b>Neutralidad</b></td><td>No está sesgada para inducir una decisión.</td></tr>
  <tr><td><b>Integridad</b></td><td>No omite nada significativo.</td></tr>
  <tr><td><b>Sistematicidad</b></td><td>Se elabora con un sistema ordenado de reglas.</td></tr>
  <tr><td><b>Comparabilidad</b></td><td>Se puede comparar con otros períodos y otros entes. Por eso se presentan cifras comparativas.</td></tr>
  <tr><td><b>Claridad</b></td><td>Se entiende con un esfuerzo razonable.</td></tr></tbody></table></div>
  <h3>Restricciones</h3><ul><li><b>Oportunidad:</b> información tardía pierde utilidad.</li><li><b>Equilibrio entre costo y beneficio.</b></li><li><b>Significación (materialidad):</b> se pueden simplificar los temas cuyo efecto no cambiaría las decisiones.</li></ul>
  <div class="note"><b>¿Y la prudencia?</b> La prudencia no es un requisito que habilite subvaluar activos: eso violaría la neutralidad. Se acepta como actitud ante la incertidumbre, por ejemplo al no reconocer ganancias que todavía no se realizaron.</div>`,
  ex:[{type:"pick",title:"¿Qué requisito está en juego?",options:["Esencialidad","Neutralidad","Integridad","Comparabilidad","Significación"],items:[
   ["Un bien en leasing se registra como activo aunque legalmente sea del banco","Esencialidad"],["Se omite informar un juicio importante en las notas","Integridad"],["Se cambia de método de inventario cada año sin explicarlo","Comparabilidad"],
   ["Se subvaluan los activos para mostrar menos ganancia","Neutralidad"],["Se registra como gasto una calculadora de $ 15.000 aunque dure años","Significación"]]}]},
 {lead:"En Argentina las normas contables las elabora la FACPCE, pero cada Consejo Profesional las pone en vigencia en su jurisdicción.",
  html:`<h3>Actores</h3><ul><li><b>FACPCE</b> (Federación Argentina de Consejos Profesionales de Ciencias Económicas): aprueba las Resoluciones Técnicas (RT), con proyectos del CENCyA (Consejo Elaborador de Normas de Contabilidad y Auditoría).</li><li><b>Consejos Profesionales</b> provinciales y de CABA (CPCE): adoptan las RT en su jurisdicción. Las normas obligan a los matriculados de ese Consejo.</li><li><b>Organismos de control</b> con facultades propias: CNV (sociedades con oferta pública), BCRA (bancos), Superintendencia de Seguros, IGJ (sociedades en CABA), INAES (cooperativas y mutuales).</li></ul>
  <h3>Resoluciones Técnicas más importantes</h3><div class="tw"><table><thead><tr><th>RT</th><th>Tema</th></tr></thead><tbody>
  <tr><td class="mono">RT 54</td><td>Norma Unificada Argentina de Contabilidad: marco conceptual, unidad de medida y ajuste por inflación, reconocimiento, medición, presentación, y normas específicas para actividad agropecuaria, negocios conjuntos y cooperativas. Rige para ejercicios iniciados desde el 1/1/2025, con el texto ordenado por la RT 59 y modificaciones posteriores (RT 62).</td></tr>
  <tr><td class="mono">RT 26</td><td>Adopción de las NIIF y de la NIIF para PyMEs.</td></tr>
  <tr><td class="mono">RT 37</td><td>Normas de auditoría, revisión, otros encargos de aseguramiento, certificación y servicios relacionados.</td></tr></tbody></table></div>
  <p>La RT 54 reemplazó a las RT 6 (moneda homogénea), 8 y 9 (presentación), 11, 14, 17 (medición), 18, 21, 22 (agropecuaria), 23, 41 (entes pequeños y medianos) y a parte de la 24 (cooperativas). El marco conceptual de la RT 16 también quedó integrado.</p><p> Vas a encontrar referencias a ellas en balances de ejercicios anteriores a 2025.</p>`,
  ex:[{type:"tf",items:[["Las RT de la FACPCE rigen automáticamente en todo el país, sin intervención de los Consejos","Falso","Cada CPCE las adopta para su jurisdicción."],["La CNV puede exigir normas específicas a las sociedades que cotizan","Verdadero"],["El ajuste por inflación contable hoy está regulado dentro de la RT 54","Verdadero","Antes estaba en la RT 6, que la RT 54 reemplazó."],["La RT 54 unificó en una sola norma el marco conceptual, la medición y la presentación","Verdadero"]]}]},
 {lead:"Las NIIF son las normas contables internacionales del IASB. En Argentina son obligatorias para algunas entidades y optativas para el resto.",
  html:`<h3>Quién las aplica en Argentina</h3><ul><li><b>Obligatorias</b> (RT 26 y normas de la CNV): las sociedades con oferta pública de acciones u obligaciones negociables, salvo algunas exceptuadas.</li><li><b>Bancos:</b> el BCRA las adoptó con algunas excepciones propias.</li><li><b>Optativas:</b> cualquier otra entidad puede elegir NIIF completas o la NIIF para PyMEs, en lugar de las normas argentinas.</li></ul>
  <h3>Algunas normas NIIF clave</h3><div class="tw"><table><thead><tr><th>Norma</th><th>Tema</th></tr></thead><tbody>
  <tr><td class="mono">NIC 1</td><td>Presentación de estados financieros</td></tr><tr><td class="mono">NIC 2</td><td>Inventarios (al menor entre costo y VNR)</td></tr>
  <tr><td class="mono">NIC 16</td><td>Propiedades, planta y equipo</td></tr><tr><td class="mono">NIC 29</td><td>Información financiera en economías hiperinflacionarias</td></tr>
  <tr><td class="mono">NIIF 9</td><td>Instrumentos financieros</td></tr><tr><td class="mono">NIIF 15</td><td>Ingresos de contratos con clientes</td></tr><tr><td class="mono">NIIF 16</td><td>Arrendamientos (casi todos los alquileres se registran como activo y pasivo)</td></tr></tbody></table></div>
  <h3>Diferencias frecuentes con las normas argentinas</h3><ul><li><b>Inventarios:</b> NIIF usa el menor entre costo y VNR; la tradición argentina, el costo de reposición.</li><li><b>Arrendamientos:</b> NIIF 16 obliga a reconocer el derecho de uso y el pasivo; las normas argentinas mantienen un enfoque más simple para los arrendatarios.</li><li><b>Terminología:</b> “estados financieros” en NIIF, “estados contables” en las RT.</li></ul>`,
  ex:[{type:"tf",items:[["Una sociedad que emite obligaciones negociables en la bolsa debe aplicar NIIF","Verdadero"],["Una PyME argentina no puede aplicar NIIF aunque quiera","Falso","Puede optar por NIIF completas o NIIF para PyMEs."],["La NIC 29 trata de las economías hiperinflacionarias","Verdadero"],["Según NIIF, los inventarios se miden al mayor entre costo y VNR","Falso","Al menor."]]}]},
 {lead:"Con inflación, sumar pesos de distintas fechas es como sumar monedas distintas. El ajuste por inflación expresa todo en moneda de poder adquisitivo de cierre.",
  html:`<h3>Cuándo se aplica</h3><p>La RT 54 (que reemplazó a la RT 6) exige reexpresar los estados en moneda de cierre cuando el contexto es de inflación alta. El indicador principal es que la inflación acumulada de tres años alcance o supere el <b>100%</b>. La FACPCE declaró que esa condición se cumplía desde los cierres del 1/7/2018 (Resolución JG 539/18). El índice que se usa es una serie que combina IPIM e IPC del INDEC.</p>
  <h3>Partidas monetarias y no monetarias</h3><ul><li><b>Monetarias:</b> están expresadas en moneda de cierre por su naturaleza (caja, créditos y deudas en pesos sin cláusula de ajuste). No se reexpresan, pero generan un resultado por la pérdida del poder adquisitivo.</li><li><b>No monetarias:</b> mercaderías, bienes de uso, capital. Se reexpresan con el coeficiente desde su fecha de origen.</li></ul>
  <div class="formula">Coeficiente = Índice de cierre / Índice de la fecha de origen</div>
  <h3>RECPAM</h3><p>El <b>Resultado por Exposición al Cambio en el Poder Adquisitivo de la Moneda</b> surge por tener partidas monetarias. Tener efectivo o créditos en pesos genera una <b>pérdida</b>; tener deudas en pesos, una <b>ganancia</b>.</p>
  <p>Ejemplo: tenés $ 1.000.000 en caja todo el año y la inflación fue 50%. Al cierre seguís teniendo $ 1.000.000, pero al inicio esos pesos valían lo que hoy valen $ 1.500.000: la pérdida por exposición es <b>$ 500.000</b>.</p>
  <h3>Capital</h3><p>El capital social se mantiene a su valor nominal y la reexpresión se muestra en <b>Ajuste de capital</b>. Capital $ 2.000.000 aportado cuando el índice era 100, con índice de cierre 180 → reexpresado $ 3.600.000, ajuste de capital $ 1.600.000.</p>`,
  ex:[{type:"num",items:[{q:"Un terreno se compró a $ 5.000.000 cuando el índice era 200. Al cierre el índice es 350. ¿Valor reexpresado?",a:8750000,u:"$"},{q:"Capital de $ 2.000.000 suscripto con índice 100; índice de cierre 180. ¿Ajuste de capital?",a:1600000,u:"$"},{q:"Una deuda en pesos de $ 800.000 se mantuvo todo el año con inflación del 25%. ¿RECPAM? (ganancia, sin signo)",a:200000,u:"$"}]},
   {type:"pick",title:"¿Partida monetaria o no monetaria?",options:["Monetaria","No monetaria"],items:[["Caja en pesos","Monetaria"],["Mercaderías","No monetaria"],["Deudores por ventas en pesos","Monetaria"],["Rodados","No monetaria"],["Proveedores en pesos","Monetaria"],["Capital social","No monetaria"]]}]},
 {lead:"Para saber si una empresa ganó, primero hay que definir qué capital tiene que mantener intacto. Recién lo que sobra es ganancia.",
  html:`<h3>Capital financiero y capital físico</h3><ul><li><b>Capital financiero:</b> hay ganancia si el PN al cierre (en moneda homogénea) supera al del inicio, sin contar aportes y retiros. Es el que adoptan las normas argentinas.</li><li><b>Capital físico:</b> hay ganancia solo si, además, la empresa mantiene su capacidad operativa (puede reponer sus bienes). Los resultados por tenencia quedan en el PN como ajuste.</li></ul>
  <h3>Tipos de resultados</h3><ul><li><b>Operativos:</b> ventas menos costos de la actividad principal.</li><li><b>Resultados por tenencia:</b> cambios en el valor de los activos mientras se tienen (por ejemplo, la mercadería que se encarece antes de venderla).</li><li><b>Resultados financieros:</b> intereses, diferencias de cambio, RECPAM.</li></ul>
  <h3>Ejemplo integrador</h3><p>Compraste mercadería a $ 100. Al momento de venderla, su costo de reposición es $ 130 y la vendés a $ 160. Con valores corrientes:</p>
  <ul><li>Resultado operativo (venta menos costo de reposición): 160 − 130 = <b>30</b>.</li><li>Resultado por tenencia: 130 − 100 = <b>30</b>.</li><li>Resultado total: 60 (igual que con costo histórico, pero mejor explicado).</li></ul>
  <p>La separación muestra que la mitad de la ganancia vino de “comprar bien” y no de “vender bien”: información muy útil para la gestión.</p>`,
  ex:[{type:"num",items:[{q:"Mercadería comprada a $ 200; al vender, costo de reposición $ 260; precio de venta $ 300. ¿Resultado operativo con valores corrientes?",a:40,u:"$"},{q:"¿Resultado por tenencia?",a:60,u:"$"},{q:"PN al inicio $ 10.000.000 (moneda de cierre), al cierre $ 12.500.000, aportes del año $ 1.000.000, dividendos $ 300.000. ¿Resultado del ejercicio con capital financiero?",a:1800000,u:"$",hint:"12.500.000 − 10.000.000 − 1.000.000 + 300.000"}]}]},
