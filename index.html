 {lead:"La Ley General de Sociedades (Ley 19.550, con las reformas de la Ley 26.994) regula cómo se constituyen, funcionan y se disuelven las sociedades.",
  html:`<h3>Concepto (art. 1)</h3><p>Hay sociedad si una o más personas, en forma organizada conforme a uno de los tipos previstos en la ley, se obligan a realizar aportes para aplicarlos a la producción o intercambio de bienes o servicios, participando de los beneficios y soportando las pérdidas. Desde 2015 se admite la <b>sociedad unipersonal</b>, solo como sociedad anónima (SAU).</p>
  <h3>Elementos</h3><ul><li><b>Pluralidad</b> de socios (salvo la SAU).</li><li><b>Tipicidad:</b> adoptar uno de los tipos de la ley.</li><li><b>Aportes</b> de los socios.</li><li><b>Participación en beneficios y pérdidas.</b></li><li><b>Organización</b> (órganos de administración, gobierno y fiscalización).</li></ul>
  <h3>Contenido del instrumento constitutivo (art. 11)</h3><p>Datos de los socios, razón social o denominación, domicilio, objeto, capital, plazo de duración, organización de la administración y fiscalización, reglas para distribuir utilidades y soportar pérdidas, cláusulas sobre funcionamiento, disolución y liquidación.</p>
  <h3>Sociedades de la Sección IV (arts. 21 a 26)</h3><p>Las que no se constituyen con sujeción a un tipo, omiten requisitos esenciales o no se inscriben. Los socios responden frente a terceros como obligados <b>simplemente mancomunados</b> (por partes iguales), salvo que se pacte otra cosa. Reemplazaron a las antiguas “sociedades de hecho” e “irregulares”.</p>
  <h3>Inscripción</h3><p>Las sociedades se inscriben en el Registro Público de su jurisdicción (en CABA, la Inspección General de Justicia; en otras provincias, la Dirección de Personas Jurídicas o el Registro Público de Comercio).</p>`,
  ex:[{type:"tf",items:[["Una sola persona puede constituir una SRL unipersonal","Falso","La ley solo admite la unipersonal bajo el tipo SA (SAU) y la SAS."],["Una sociedad no inscripta queda incluida en la Sección IV","Verdadero"],["En la Sección IV los socios responden, en principio, en forma simplemente mancomunada","Verdadero"],["El objeto social es un requisito del instrumento constitutivo","Verdadero"]]}]},
 {lead:"Elegir el tipo societario define la responsabilidad de los socios, cómo se representa el capital y cuán compleja es la administración.",
  html:`<div class="tw"><table><thead><tr><th>Tipo</th><th>Capital</th><th>Responsabilidad</th><th>Administración</th><th>Rasgos</th></tr></thead><tbody>
  <tr><td><b>SRL</b> (arts. 146 a 162)</td><td>Cuotas</td><td>Limitada a la integración de las cuotas; garantía solidaria por la integración</td><td>Gerencia (uno o más gerentes)</td><td>Máximo 50 socios. La transmisión de cuotas se puede limitar.</td></tr>
  <tr><td><b>SA</b> (arts. 163 a 307)</td><td>Acciones</td><td>Limitada a las acciones suscriptas</td><td>Directorio</td><td>Capital mínimo legal. Asamblea, sindicatura (obligatoria en algunos casos).</td></tr>
  <tr><td><b>SAU</b></td><td>Acciones</td><td>Limitada</td><td>Directorio de 3 miembros como mínimo</td><td>Un solo accionista. Sindicatura plural obligatoria (art. 299).</td></tr>
  <tr><td><b>SAS</b> (Ley 27.349)</td><td>Acciones</td><td>Limitada a la integración de las acciones</td><td>Administradores</td><td>Uno o más socios. Constitución simplificada, capital mínimo de 2 salarios mínimos.</td></tr>
  <tr><td>Colectiva</td><td>Partes de interés</td><td>Solidaria, subsidiaria e ilimitada</td><td>Cualquier socio</td><td>Muy poco usada hoy.</td></tr>
  <tr><td>En comandita simple / por acciones, de capital e industria</td><td>Mixto</td><td>Distinta según la clase de socio</td><td>Socios comanditados</td><td>Muy poco usadas.</td></tr></tbody></table></div>
  <h3>Sociedades del art. 299</h3><p>Están sujetas a fiscalización estatal permanente: las que hacen oferta pública, tienen capital superior al monto que fija la ley, son de economía mixta, explotan concesiones o servicios públicos, realizan operaciones de capitalización o ahorro, o son controlantes de otra sociedad del art. 299. Deben tener directorio y sindicatura plurales.</p>`,
  ex:[{type:"pick",title:"¿Qué tipo societario conviene o corresponde?",options:["SRL","SA","SAS","SAU"],items:[["Un emprendedor solo quiere constituir rápido y por internet una sociedad","SAS"],["Una empresa familiar de 4 socios que quiere limitar el ingreso de terceros","SRL"],["Una empresa que quiere cotizar en bolsa","SA"],["Una multinacional que crea una filial argentina con un único accionista y directorio","SAU"]]}]},
 {lead:"Los socios se obligan a aportar. La ley fija cuánto hay que integrar al constituir y en qué plazo el resto.",
  html:`<h3>Suscripción e integración</h3><ul><li><b>Suscribir</b> es comprometerse a aportar.</li><li><b>Integrar</b> es aportar efectivamente.</li></ul>
  <p>En la SRL (art. 149), la SA (art. 187) y la SAS (Ley 27.349, art. 41): los aportes en <b>dinero</b> se integran como mínimo en un <b>25%</b> al constituir y el saldo dentro de los <b>2 años</b>. Los aportes en <b>especie</b> (bienes) se integran totalmente al constituir.</p>
  <h3>Aportes en especie</h3><p>Deben ser bienes determinados y susceptibles de ejecución forzada. Se valúan según lo previsto en el contrato, por valores de plaza o por perito.</p>
  <h3>Registración en una SA</h3><ol><li>Suscripción: <span class="mono">Accionistas a Capital social</span> (o a Capital suscripto).</li><li>Integración: <span class="mono">Banco / Bienes a Accionistas</span>.</li></ol>
  <p>El saldo pendiente de Accionistas es un crédito de la sociedad contra sus socios. En el estado de situación patrimonial se presenta en Otros créditos o restando del PN, según el criterio aplicable.</p>`,
  ex:[{type:"num",items:[{q:"Se constituye una SA con capital de $ 10.000.000 aportado en dinero. ¿Cuánto hay que integrar como mínimo al constituir?",a:2500000,u:"$"},{q:"Si un socio aporta un rodado valuado en $ 6.000.000 y el resto en dinero, sobre un capital de $ 10.000.000, ¿cuánto dinero se integra como mínimo al constituir?",a:1000000,u:"$",hint:"El rodado se integra totalmente; del dinero (4 millones), el 25%."}]},
   {type:"asiento",accounts:ACC,entries:[
    {t:"02/01 · Se constituye Andina SA con capital de $ 10.000.000, suscripto totalmente por los accionistas.",e:[["Accionistas",10000000,0],["Capital social",0,10000000]]},
    {t:"02/01 · Un accionista integra un rodado valuado en $ 6.000.000 y los demás integran $ 1.000.000 en efectivo depositado en el Banco Nación.",e:[["Rodados",6000000,0],["Banco Nación c/c",1000000,0],["Accionistas",0,7000000]]},
    {t:"30/11 · Los accionistas integran el saldo pendiente por transferencia bancaria.",e:[["Banco Nación c/c",3000000,0],["Accionistas",0,3000000]]}]}]},
 {lead:"Toda sociedad tiene un órgano que decide (gobierno), uno que ejecuta (administración) y, a veces, uno que controla (fiscalización).",
  html:`<div class="tw"><table><thead><tr><th>Órgano</th><th>SRL</th><th>SA</th></tr></thead><tbody>
  <tr><td><b>Gobierno</b></td><td>Reunión de socios</td><td>Asamblea de accionistas</td></tr>
  <tr><td><b>Administración y representación</b></td><td>Gerencia</td><td>Directorio (con su presidente como representante legal)</td></tr>
  <tr><td><b>Fiscalización</b></td><td>Optativa (obligatoria si el capital alcanza el monto del art. 299)</td><td>Sindicatura o consejo de vigilancia; obligatoria en las del art. 299</td></tr></tbody></table></div>
  <h3>Asambleas en la SA</h3><ul><li><b>Ordinaria</b> (art. 234): aprueba los estados contables, la memoria y la gestión de directores y síndicos, distribuye utilidades, elige autoridades y fija sus honorarios. Se convoca dentro de los 4 meses del cierre del ejercicio.</li><li><b>Extraordinaria</b> (art. 235): reforma del estatuto, aumento de capital fuera del quíntuplo, reducción, fusión, transformación, disolución, emisión de obligaciones negociables convertibles.</li></ul>
  <h3>La sindicatura</h3><p>El síndico debe ser <b>abogado o contador público</b> con título habilitante (art. 285). Controla la legalidad de la administración, revisa los libros y la documentación, asiste a las reuniones del directorio y presenta a la asamblea un informe sobre los estados contables (art. 294).</p>
  <h3>Responsabilidad de los administradores (art. 59)</h3><p>Deben obrar con lealtad y con la diligencia de un buen hombre de negocios. Si faltan a sus obligaciones, responden ilimitada y solidariamente por los daños causados.</p>`,
  ex:[{type:"pick",title:"¿Qué órgano lo decide en una SA?",options:["Asamblea ordinaria","Asamblea extraordinaria","Directorio","Sindicatura"],items:[["Aprobar los estados contables del ejercicio","Asamblea ordinaria"],["Fusionarse con otra sociedad","Asamblea extraordinaria"],["Contratar a un nuevo gerente comercial","Directorio"],["Emitir un informe sobre los estados contables para los accionistas","Sindicatura"],["Distribuir dividendos","Asamblea ordinaria"],["Cambiar el objeto social del estatuto","Asamblea extraordinaria"]]}]},
 {lead:"Las ganancias no se pueden repartir libremente. La ley obliga a reservar una parte y solo permite distribuir lo que realmente se ganó.",
  html:`<h3>Reglas principales</h3><ul><li><b>Art. 68:</b> los dividendos solo pueden aprobarse sobre ganancias <b>realizadas y líquidas</b> resultantes de un balance aprobado.</li>
  <li><b>Art. 70:</b> las SRL y SA deben destinar a <b>reserva legal</b> no menos del <b>5%</b> de las ganancias del ejercicio hasta alcanzar el <b>20%</b> del capital social. Si hay pérdidas acumuladas, primero se absorben.</li>
  <li><b>Art. 261:</b> la remuneración total de los directores no puede superar el <b>25%</b> de las ganancias si se distribuyen dividendos, o el <b>5%</b> si no se distribuyen, salvo aprobación especial de la asamblea por funciones técnico-administrativas.</li></ul>
  <h3>Otras reservas</h3><p><b>Estatutarias</b> (las que prevé el estatuto) y <b>facultativas</b> (las que decide la asamblea con una razón justificada, art. 70).</p>
  <h3>Dividendos en acciones</h3><p>En lugar de pagar en efectivo, la sociedad puede capitalizar resultados y entregar nuevas acciones. El PN total no cambia; solo se reclasifica de resultados a capital.</p>
  <h3>Ejemplo</h3><p>Resultados no asignados $ 1.000.000; capital $ 2.000.000; reserva legal existente $ 300.000. La asamblea decide: reserva legal 5% (50.000; el tope del 20% es 400.000, así que entra completa), honorarios a directores 100.000, dividendos en efectivo 600.000. El resto (250.000) queda sin asignar.</p>`,
  ex:[{type:"num",items:[{q:"Ganancia del ejercicio $ 2.000.000; capital $ 5.000.000; reserva legal acumulada $ 950.000. ¿Cuánto se destina como mínimo a reserva legal?",a:50000,u:"$",hint:"5% sería 100.000, pero el tope del 20% del capital es 1.000.000 y faltan solo 50.000."},{q:"Ganancia $ 4.000.000, capital $ 10.000.000, sin reserva previa. ¿Reserva legal mínima?",a:200000,u:"$"}]},
   {type:"asiento",accounts:ACC,entries:[{t:"20/04 · La asamblea distribuye los resultados del ejemplo: reserva legal $ 50.000, honorarios a directores $ 100.000 y dividendos en efectivo $ 600.000.",e:[["Resultados no asignados",750000,0],["Reserva legal",0,50000],["Honorarios directores a pagar",0,100000],["Dividendos a pagar",0,600000]]}]}]},
 {lead:"El capital puede aumentar con nuevos aportes o capitalizando partidas del patrimonio neto, y puede reducirse de forma voluntaria u obligatoria.",
  html:`<h3>Aumento de capital</h3><ul><li><b>Con nuevos aportes:</b> en dinero o en especie. Los accionistas tienen <b>derecho de preferencia</b> (art. 194) para suscribir en proporción a sus tenencias.</li><li><b>Por capitalización:</b> de reservas, de resultados (dividendos en acciones), del ajuste de capital o de aportes irrevocables.</li><li><b>Por conversión de deudas</b> (por ejemplo, obligaciones negociables convertibles).</li></ul>
  <p>En la SA, la asamblea ordinaria puede aumentar el capital hasta el <b>quíntuplo</b> si el estatuto lo prevé (art. 188). Por encima, se requiere asamblea extraordinaria.</p>
  <h3>Prima de emisión</h3><p>Si las nuevas acciones se emiten por encima de su valor nominal, la diferencia es una prima de emisión, que forma parte de los aportes en el PN.</p>
  <h3>Reducción de capital</h3><ul><li><b>Voluntaria</b> (art. 203): la decide la asamblea extraordinaria, con derecho de oposición de los acreedores.</li><li><b>Obligatoria</b> (art. 206): cuando las pérdidas consumen las reservas y el <b>50% del capital</b>.</li></ul>
  <div class="note"><b>Pérdida total del capital.</b> Es causal de disolución (art. 94 inc. 5), salvo que los socios reintegren o aumenten el capital.</div>`,
  ex:[{type:"asiento",accounts:ACC,entries:[
    {t:"10/05 · La asamblea capitaliza el Ajuste de capital por $ 1.600.000 y emite acciones liberadas.",e:[["Ajuste de capital",1600000,0],["Capital social",0,1600000]]},
    {t:"10/06 · La asamblea capitaliza los Aportes irrevocables de $ 3.000.000 que estaban en el PN.",e:[["Aportes irrevocables",3000000,0],["Capital social",0,3000000]]}]},
   {type:"num",items:[{q:"Una SA tiene capital $ 4.000.000 y reservas $ 500.000. ¿A partir de qué pérdida acumulada (en $) queda obligada a reducir el capital?",a:2500000,u:"$",hint:"Reservas + 50% del capital"}]}]},
 {lead:"Las sociedades pueden cambiar de tipo, unirse, dividirse y, finalmente, disolverse y liquidarse.",
  html:`<div class="tw"><table><thead><tr><th>Figura</th><th>Qué es</th></tr></thead><tbody>
  <tr><td><b>Transformación</b> (art. 74)</td><td>Adoptar otro tipo societario sin disolverse. Ejemplo: de SRL a SA. Se mantienen los derechos y obligaciones.</td></tr>
  <tr><td><b>Fusión</b> (art. 82)</td><td>Por <b>absorción</b> (una sociedad incorpora a otra, que se disuelve sin liquidarse) o por <b>consolidación</b> (dos o más se disuelven y crean una nueva). La resultante asume los derechos y obligaciones.</td></tr>
  <tr><td><b>Escisión</b> (art. 88)</td><td>Una sociedad destina parte de su patrimonio a otra existente o a una nueva, o se divide en varias.</td></tr></tbody></table></div>
  <h3>Causales de disolución (art. 94)</h3><ul><li>Decisión de los socios.</li><li>Expiración del plazo.</li><li>Cumplimiento de la condición o del objeto, o imposibilidad de lograrlo.</li><li>Pérdida del capital social.</li><li>Declaración en quiebra.</li><li>Fusión.</li><li>Sanción firme de cancelación de oferta pública o retiro de la autorización.</li></ul>
  <p>La reducción a uno de los socios ya no es causal de disolución: si no se recompone la pluralidad en 3 meses, la sociedad se transforma de pleno derecho en SAU en los casos que prevé el art. 94 bis.</p>
  <h3>Liquidación</h3><p>Disuelta la sociedad, el liquidador (en general, los administradores) realiza el activo, cancela el pasivo, confecciona el balance final y el proyecto de distribución, y reparte el remanente entre los socios. Durante la liquidación la sociedad conserva su personalidad, agregando “en liquidación” a su nombre.</p>`,
  ex:[{type:"pick",title:"¿Qué figura es?",options:["Transformación","Fusión por absorción","Fusión por consolidación","Escisión","Disolución"],items:[["Una SRL pasa a ser SA","Transformación"],["A incorpora a B; B se disuelve sin liquidarse","Fusión por absorción"],["A y B desaparecen y forman la nueva C","Fusión por consolidación"],["A separa su división agro y crea una nueva sociedad con esos bienes","Escisión"],["Los socios deciden terminar la sociedad","Disolución"]]}]},
],

lessons:[
 {lead:"El costo es el valor de los recursos sacrificados para obtener un bien o servicio. Clasificarlo bien es el primer paso para usarlo.",
  html:`<h3>Elementos del costo de producción</h3><ul><li><b>Materia prima (MP):</b> los materiales que forman parte del producto.</li><li><b>Mano de obra directa (MOD):</b> el trabajo de quienes transforman la materia prima.</li><li><b>Carga fabril o costos indirectos de fabricación (CIF):</b> todo lo demás de la fábrica (supervisión, energía, mantenimiento, amortización de máquinas, materiales indirectos).</li></ul>
  <div class="formula">Costo primo = MP + MOD   ·   Costo de conversión = MOD + CIF</div>
  <h3>Clasificaciones</h3><div class="tw"><table><thead><tr><th>Criterio</th><th>Clases</th></tr></thead><tbody>
  <tr><td>Comportamiento</td><td><b>Variables</b> (cambian con el volumen) · <b>Fijos</b> (no cambian en un rango) · <b>Semivariables</b></td></tr>
  <tr><td>Asignación</td><td><b>Directos</b> (identificables con el producto) · <b>Indirectos</b> (se prorratean)</td></tr>
  <tr><td>Función</td><td><b>De producción</b> · <b>De comercialización</b> · <b>De administración</b> · <b>Financieros</b></td></tr>
  <tr><td>Imputación</td><td><b>Del producto</b> (se activan en el inventario hasta la venta) · <b>Del período</b> (van a resultados)</td></tr>
  <tr><td>Decisión</td><td><b>Relevantes</b> (cambian según la alternativa) · <b>Hundidos</b> (ya incurridos, irrelevantes)</td></tr></tbody></table></div>
  <h3>Costo y gasto</h3><p>Los costos de producción se acumulan en el inventario y se convierten en <b>costo de ventas</b> cuando se vende. Los gastos de comercialización y administración van directo a resultados.</p>
  <div class="note"><b>La escuela argentina de costos.</b> El Instituto Argentino de Profesores Universitarios de Costos (IAPUCo) desarrolló la <b>teoría general del costo</b>, que distingue entre componentes físicos (cantidad de factor consumido) y monetarios (precio del factor). Es la base de la enseñanza universitaria en el país.</div>`,
  ex:[{type:"pick",title:"Clasificá cada costo de una fábrica de muebles",options:["MP","MOD","CIF","Gasto del período"],items:[["Madera usada en las sillas","MP"],["Sueldo del carpintero que arma las sillas","MOD"],["Sueldo del supervisor de planta","CIF"],["Energía eléctrica de la fábrica","CIF"],["Comisión del vendedor","Gasto del período"],["Amortización de la sierra industrial","CIF"],["Honorarios del estudio contable","Gasto del período"],["Clavos y pegamento (insignificantes por unidad)","CIF"]]},
   {type:"pick",title:"¿Fijo o variable respecto del volumen de producción?",options:["Fijo","Variable"],items:[["Alquiler de la planta","Fijo"],["Materia prima","Variable"],["Seguro de la fábrica","Fijo"],["Energía de las máquinas de producción","Variable"],["Sueldo del jefe de planta","Fijo"]]}]},
 {lead:"La materia prima es, en muchas industrias, el componente más grande del costo. Controlar su compra, uso y desperdicio es clave.",
  html:`<h3>Costo de la materia prima</h3><p>Precio de compra + fletes, seguros y gastos de recepción − descuentos. El IVA crédito fiscal no forma parte del costo.</p>
  <h3>Consumo</h3><p>Se valúa con el método de inventario elegido (PEPS o PPP, Módulo 9). El consumo se documenta con la <b>orden de entrega de materiales</b> (vale de salida del almacén), imputada a una orden o a un proceso.</p>
  <h3>Pérdidas de materiales</h3><ul><li><b>Normales</b> (inevitables por el proceso: recortes, evaporación): forman parte del costo del producto.</li><li><b>Anormales</b> (por errores, accidentes): son pérdida del período, no se cargan al producto.</li></ul>
  <h3>Registración</h3><ol><li>Compra: <span class="mono">Materias primas a Proveedores</span>.</li><li>Consumo para producción: <span class="mono">Producción en proceso a Materias primas</span>.</li></ol>
  <div class="formula">Consumo de MP = Existencia inicial + Compras − Existencia final</div>`,
  ex:[{type:"num",items:[{q:"EI de MP $ 200.000; compras $ 1.500.000; EF $ 300.000. ¿Consumo de materia prima?",a:1400000,u:"$"},{q:"Para fabricar una mesa se necesitan 10 kg de madera y se pierde normalmente un 20% del material comprado. ¿Cuántos kg hay que comprar por mesa?",a:12.5,u:"kg",tol:0.01,hint:"10 / 0,80"},{q:"Si el kg cuesta $ 3.000, ¿cuánto es el costo de MP por mesa?",a:37500,u:"$"}]},
   {type:"asiento",accounts:ACC,entries:[{t:"Se entregan a producción materias primas por $ 1.400.000.",e:[["Producción en proceso",1400000,0],["Materias primas",0,1400000]]}]}]},
 {lead:"El costo de la mano de obra no es solo el sueldo por hora: incluye cargas sociales, aguinaldo, vacaciones y horas no productivas.",
  html:`<h3>Componentes del costo laboral</h3><ul><li>Remuneración por hora o mensual según el convenio colectivo.</li><li><b>SAC</b> (aguinaldo): un sueldo extra por año, aproximadamente 8,33%.</li><li><b>Vacaciones, feriados y licencias</b> pagas: horas pagadas que no se trabajan.</li><li><b>Contribuciones patronales</b> (jubilación, PAMI, asignaciones familiares, fondo de empleo, obra social), ART y seguro de vida obligatorio.</li></ul>
  <p>En la práctica se calcula un <b>coeficiente de cargas sociales</b> que se aplica sobre la hora trabajada. Es común que el costo real de una hora productiva sea entre un 40% y un 80% más alto que el salario básico por hora, según el convenio y el ausentismo.</p>
  <div class="formula">Costo hora MOD = Salario hora × (1 + coeficiente de cargas)</div>
  <h3>Directa e indirecta</h3><p>La <b>MOD</b> se imputa a las órdenes o procesos con las tarjetas de tiempo. El tiempo improductivo (esperas, reparaciones) y el de supervisores es <b>mano de obra indirecta</b>, que forma parte de la carga fabril.</p>`,
  ex:[{type:"num",items:[{q:"Salario $ 4.000 por hora y coeficiente de cargas del 45%. ¿Costo hora de MOD?",a:5800,u:"$"},{q:"Un operario trabaja 160 horas en el mes a ese costo. ¿Costo mensual de MOD?",a:928000,u:"$"},{q:"Si 10 de esas 160 horas fueron esperas por falta de material, ¿cuánto se imputa como MOD a los productos?",a:870000,u:"$",hint:"150 horas productivas"}]}]},
 {lead:"La carga fabril no se puede identificar con cada producto. Se asigna mediante una tasa predeterminada.",
  html:`<h3>Por qué una tasa predeterminada</h3><p>Muchos costos indirectos se conocen recién a fin de mes o varían por estación (calefacción en invierno). Para costear cada producto en el momento, se usa una tasa calculada con el presupuesto:</p>
  <div class="formula">Tasa predeterminada = Carga fabril presupuestada / Nivel de actividad presupuestado (horas MOD, horas máquina, etc.)</div>
  <p>Ejemplo: carga fabril presupuestada anual $ 36.000.000 y 12.000 horas MOD → <b>$ 3.000 por hora MOD</b>.</p>
  <h3>Aplicación y variaciones</h3><ul><li>Se <b>aplica</b> a la producción: horas reales × tasa.</li><li>Al final del período se compara con la carga fabril <b>real</b>.</li><li>Si la aplicada supera a la real hay <b>sobreaplicación</b>; si es menor, <b>subaplicación</b>.</li></ul>
  <p>La variación se analiza (¿cambió el gasto o el nivel de actividad?) y, al cierre, se ajusta contra el costo de ventas o se prorratea entre inventarios y costo de ventas si es significativa.</p>
  <h3>Departamentalización</h3><p>En empresas grandes, los costos se asignan primero a departamentos productivos y de servicio, los de servicio se redistribuyen a los productivos, y cada departamento productivo tiene su propia tasa.</p>`,
  ex:[{type:"num",items:[{q:"Carga fabril presupuestada $ 2.400.000; 12.000 horas máquina presupuestadas. ¿Tasa por hora máquina?",a:200,u:"$"},{q:"En el mes se usaron 1.100 horas máquina. ¿Carga fabril aplicada?",a:220000,u:"$"},{q:"La carga fabril real del mes fue $ 210.000. ¿Cuánto se sobreaplicó?",a:10000,u:"$"}]},
   {type:"asiento",accounts:ACC,entries:[{t:"Aplicá la carga fabril del mes a la producción ($ 220.000).",e:[["Producción en proceso",220000,0],["Carga fabril aplicada",0,220000]]}]}]},
 {lead:"El costeo por órdenes se usa cuando cada trabajo es distinto: muebles a medida, imprentas, obras, estudios profesionales.",
  html:`<p>Cada pedido tiene una <b>orden de trabajo</b> (OT) y una <b>hoja de costos</b> donde se acumulan:</p><ul><li>MP: según los vales de materiales imputados a la OT.</li><li>MOD: horas de cada operario en la OT × costo hora.</li><li>Carga fabril: base real de la OT × tasa predeterminada.</li></ul>
  <h3>Ejemplo · OT 101</h3><div class="tw"><table><thead><tr><th>Elemento</th><th>Cálculo</th><th class="r">Importe</th></tr></thead><tbody>
  <tr><td>Materia prima</td><td>Vales de almacén</td><td class="r num">300.000</td></tr><tr><td>Mano de obra directa</td><td>40 h × $ 5.800</td><td class="r num">232.000</td></tr><tr><td>Carga fabril</td><td>40 h MOD × $ 3.000</td><td class="r num">120.000</td></tr><tr><td><b>Costo total de la OT</b></td><td></td><td class="r num"><b>652.000</b></td></tr></tbody></table></div>
  <h3>Flujo contable</h3><ol><li>Los tres elementos se debitan en <i>Producción en proceso</i> (con el detalle por OT).</li><li>Al terminar: <span class="mono">Productos terminados a Producción en proceso</span>.</li><li>Al vender: <span class="mono">Costo de ventas a Productos terminados</span>.</li></ol>`,
  ex:[{type:"num",items:[{q:"OT 202: MP $ 450.000; 25 horas MOD a $ 6.000; carga fabril $ 3.000 por hora MOD. ¿Costo total?",a:675000,u:"$"},{q:"Si se cotiza con un markup del 40% sobre el costo, ¿cuál es el precio (sin IVA)?",a:945000,u:"$"}]},
   {type:"asiento",accounts:ACC,entries:[{t:"Se termina la OT 101 (costo $ 652.000) y pasa al depósito de productos terminados.",e:[["Productos terminados",652000,0],["Producción en proceso",0,652000]]},{t:"Se entrega la OT 101 al cliente. Registrá su costo.",e:[["Costo de ventas",652000,0],["Productos terminados",0,652000]]}]}]},
 {lead:"Cuando la producción es continua y homogénea (bebidas, cemento, alimentos), el costo se calcula por proceso y por período.",
  html:`<p>Los costos se acumulan por <b>departamento o proceso</b> durante el mes y se dividen por la producción del período. El problema son las unidades que quedan a medio terminar.</p>
  <h3>Unidades equivalentes</h3><p>Expresan la producción en proceso como si fueran unidades terminadas. 200 unidades con el 50% de avance equivalen a 100 unidades terminadas, para ese elemento del costo.</p>
  <p>Como la materia prima suele agregarse al principio y la conversión a lo largo del proceso, se calculan por separado.</p>
  <h3>Pasos</h3><ol><li>Flujo físico de unidades.</li><li>Unidades equivalentes por elemento.</li><li>Costo unitario por elemento = costo del período / unidades equivalentes.</li><li>Asignar el costo a las unidades terminadas y a la producción en proceso final.</li></ol>
  <p>Cuando hay producción en proceso al inicio, se usa el método PEPS o el de promedio ponderado para tratar los costos que venían del mes anterior.</p>`,
  ex:[{type:"custom",title:"Costeo por procesos",render:procesos}]},
 {lead:"El costo estándar es lo que un producto debería costar en condiciones eficientes. Compararlo con el real muestra dónde se gana o se pierde.",
  html:`<p>Para cada elemento se fija un estándar de <b>cantidad</b> (kg, horas) y de <b>precio</b>. Ejemplo: cada unidad necesita 2 kg de MP a $ 100 el kg → estándar $ 200 por unidad.</p>
  <h3>Desvíos de materia prima</h3><div class="formula">Desvío de precio = (Precio real − Precio estándar) × Cantidad real<br>Desvío de cantidad = (Cantidad real − Cantidad estándar permitida) × Precio estándar</div>
  <p>Se produjeron 1.000 unidades y se usaron 2.100 kg comprados a $ 95.</p>
  <ul><li>Desvío de precio: (95 − 100) × 2.100 = <b>−10.500</b>, favorable (compras compró más barato).</li><li>Desvío de cantidad: (2.100 − 2.000) × 100 = <b>+10.000</b>, desfavorable (producción usó más material).</li><li>Desvío total: −500 favorable. Costo real 199.500 frente a estándar 200.000.</li></ul>
  <p>El mismo análisis se hace con la mano de obra (desvío de tarifa y de eficiencia) y con la carga fabril (desvíos de presupuesto, de capacidad y de eficiencia).</p>
  <div class="note"><b>Para qué sirve.</b> Separar los desvíos permite asignar responsabilidades: el de precio es de compras; el de cantidad, de producción. Un desvío favorable no siempre es bueno: comprar material más barato puede causar más desperdicio.</div>`,
  ex:[{type:"num",items:[{q:"Estándar: 3 kg a $ 50 por unidad. Se produjeron 500 unidades usando 1.600 kg comprados a $ 52. ¿Desvío de precio? (positivo si es desfavorable)",a:3200,u:"$"},{q:"¿Desvío de cantidad? (positivo si es desfavorable)",a:5000,u:"$",hint:"(1.600 − 1.500) × 50"},{q:"Estándar MOD: 2 h a $ 6.000 por unidad. Se produjeron 400 unidades con 780 horas pagadas a $ 6.200. ¿Desvío de eficiencia? (con signo; negativo si es favorable)",a:-120000,u:"$",hint:"(780 − 800) × 6.000"}]}]},
],

/* Módulo 18 · Costos II: gestión y decisiones */
CAMPUS.content[18] = {
lessons:[
 {lead:"Hay dos formas de calcular el costo de un producto: incluyendo o no los costos fijos de producción. El resultado del período cambia según el método.",
  html:`<ul><li><b>Costeo por absorción (completo):</b> el costo del producto incluye MP, MOD, carga fabril variable y fija. Es el que exigen las normas contables y el impuesto a las Ganancias.</li><li><b>Costeo variable (directo):</b> solo los costos variables forman el producto. Los fijos de producción van a resultados del período. Es el más útil para decidir.</li></ul>
  <h3>Ejemplo</h3><p>Producción 10.000 u, ventas 8.000 u, precio $ 100, costo variable $ 40, costo fijo de producción $ 200.000 ($ 20 por unidad producida), gastos fijos de administración $ 100.000.</p>
  <div class="tw"><table><thead><tr><th>Concepto</th><th class="r">Variable</th><th class="r">Absorción</th></tr></thead><tbody>
  <tr><td>Ventas</td><td class="r num">800.000</td><td class="r num">800.000</td></tr><tr><td>Costo de ventas</td><td class="r num">(320.000)</td><td class="r num">(480.000)</td></tr>
  <tr><td>Fijos de producción</td><td class="r num">(200.000)</td><td class="r num">—</td></tr><tr><td>Administración</td><td class="r num">(100.000)</td><td class="r num">(100.000)</td></tr>
  <tr><td><b>Resultado</b></td><td class="r num"><b>180.000</b></td><td class="r num"><b>220.000</b></td></tr></tbody></table></div>
  <p>La diferencia (40.000) son los fijos que absorción dejó “guardados” en las 2.000 unidades del stock final (2.000 × 20). Con absorción, producir más que lo que se vende mejora el resultado contable aunque no se haya vendido más: por eso no conviene usarlo para evaluar gestión.</p>
  <h3>Contribución marginal</h3><div class="formula">Contribución marginal unitaria = Precio − Costo variable unitario</div>`,
  ex:[{type:"num",items:[{q:"Producción 5.000 u, ventas 5.000 u, precio $ 200, cv $ 120, CF de producción $ 150.000. ¿Diferencia entre el resultado por absorción y el variable?",a:0,u:"$",tol:0,hint:"Si no hay variación de stock, no hay diferencia."},{q:"Producción 6.000 u, ventas 5.000 u, CF de producción $ 150.000. ¿Cuánto mayor es el resultado por absorción?",a:25000,u:"$",hint:"1.000 u en stock × (150.000 / 6.000)"}]}]},
 {lead:"El punto de equilibrio es el nivel de ventas en que la empresa no gana ni pierde. Es la base del análisis costo-volumen-utilidad.",
  html:`<div class="formula">Q equilibrio = CF / (p − cv)   ·   $ equilibrio = CF / razón de contribución   ·   razón de contribución = (p − cv) / p</div>
  <p>Ejemplo: CF $ 1.200.000; precio $ 500; cv $ 300. Contribución unitaria $ 200 → equilibrio en <b>6.000 unidades</b>, es decir, $ 3.000.000 de ventas (razón 40%).</p>
  <h3>Utilidad deseada</h3><div class="formula">Q = (CF + Utilidad deseada) / (p − cv)</div><p>Para ganar $ 400.000: (1.200.000 + 400.000) / 200 = <b>8.000 unidades</b>.</p>
  <h3>Margen de seguridad</h3><p>Cuánto pueden caer las ventas antes de entrar en pérdida: (ventas actuales − ventas de equilibrio) / ventas actuales. Con ventas de 7.500 u: (7.500 − 6.000) / 7.500 = <b>20%</b>.</p>
  <h3>Varios productos</h3><p>Se calcula con la <b>contribución marginal ponderada</b> según la mezcla de ventas. Si la mezcla cambia, cambia el punto de equilibrio.</p>
  <div class="note"><b>Supuestos.</b> Precio y costo variable constantes, costos fijos constantes en el rango relevante, mezcla de ventas estable, producción igual a ventas. Si alguno cambia, hay que recalcular.</div>`,
  ex:[{type:"num",items:[{q:"CF $ 900.000; precio $ 250; cv $ 100. ¿Punto de equilibrio en unidades?",a:6000},{q:"¿Y en pesos de ventas?",a:1500000,u:"$"},{q:"¿Cuántas unidades para ganar $ 300.000?",a:8000},{q:"Si se venden 7.500 u, ¿margen de seguridad en %?",a:20,u:"%",tol:0.05},{q:"Dos productos: A (contribución $ 100) es el 60% de las unidades y B (contribución $ 50), el 40%. CF $ 400.000. ¿Equilibrio en unidades totales?",a:5000,hint:"Contribución ponderada = 0,6×100 + 0,4×50 = 80"}]}]},
 {lead:"Para decidir entre alternativas solo importan los costos e ingresos que cambian. Todo lo demás es ruido.",
  html:`<h3>Costos relevantes</h3><p>Son los <b>futuros</b> y <b>diferentes</b> entre las alternativas. Los costos <b>hundidos</b> (ya incurridos) y los que no cambian (fijos inevitables) no importan para la decisión.</p>
  <h3>Pedido especial</h3><p>Un cliente ofrece comprar 1.500 u a $ 380. Tu costo total unitario es $ 420 (cv $ 300 + fijos $ 120), y tenés capacidad ociosa. ¿Aceptás?</p>
  <p>Los fijos ya se pagan igual. Lo relevante: 380 − 300 = 80 de contribución × 1.500 = <b>$ 120.000 más de ganancia</b>. Conviene, si no afecta los precios a los otros clientes y hay capacidad.</p>
  <h3>Hacer o comprar</h3><p>Comparar el costo de comprar con los costos <b>evitables</b> de fabricar (variables + fijos que desaparecerían). Considerar también calidad, plazos y qué otro uso tendría la capacidad liberada (costo de oportunidad).</p>
  <h3>Eliminar una línea</h3><p>Una línea con pérdida contable puede convenir mantenerla si su contribución marginal es positiva y sus fijos no se evitan al cerrarla.</p>
  <h3>Factor restrictivo</h3><p>Si hay un recurso escaso (horas máquina), se prioriza el producto con mayor <b>contribución por unidad del recurso escaso</b>, no el de mayor contribución unitaria.</p>`,
  ex:[{type:"num",items:[{q:"Pedido especial de 1.500 u a $ 380; cv $ 300; capacidad ociosa suficiente. ¿Cuánto aumenta la ganancia?",a:120000,u:"$"},{q:"Fabricar una pieza: cv $ 250 por unidad y fijos evitables $ 100.000 para 2.000 u. Comprarla cuesta $ 280. ¿Cuánto se ahorra comprando?",a:40000,u:"$",hint:"Costo evitable de fabricar = 250 × 2.000 + 100.000"},{q:"Producto X: contribución $ 600, usa 3 h máquina. Producto Y: contribución $ 400, usa 1 h máquina. ¿Contribución por hora del producto más conveniente?",a:400,u:"$"}]},
   {type:"pick",title:"¿Es relevante para decidir si aceptar un pedido especial (con capacidad ociosa)?",options:["Relevante","Irrelevante"],items:[["Costo de la materia prima del pedido","Relevante"],["Alquiler de la planta","Irrelevante"],["Comisión de venta del pedido","Relevante"],["Lo que se pagó el año pasado por la máquina","Irrelevante"],["Precio ofrecido por el cliente","Relevante"]]}]},
 {lead:"El precio no sale solo del costo. Hay que mirar el mercado, la competencia y lo que el cliente está dispuesto a pagar.",
  html:`<h3>Métodos</h3><ul><li><b>Costo más margen:</b> precio = costo × (1 + markup). Simple, pero ignora la demanda.</li><li><b>Precio de mercado:</b> en mercados competitivos el precio está dado; la empresa decide si le conviene producir.</li><li><b>Costo meta (target costing):</b> se parte del precio que acepta el mercado, se resta el margen deseado y se obtiene el costo máximo admisible. Se rediseña el producto para alcanzarlo.</li><li><b>Por valor percibido:</b> según el valor que el cliente le asigna.</li></ul>
  <div class="formula">Costo meta = Precio de mercado × (1 − margen deseado sobre ventas)</div>
  <h3>El precio y los impuestos</h3><p>Para llegar al precio de lista hay que sumar los impuestos que gravan la venta: IVA (que no es costo para el responsable inscripto pero sí para el consumidor final), Ingresos Brutos, el impuesto a los débitos y créditos bancarios, las comisiones de tarjetas y medios de pago.</p>
  <h3>Ejemplo</h3><p>Costo $ 1.000, se quiere un margen neto del 20% sobre el precio neto, y la venta paga 3% de Ingresos Brutos y 2% de comisión de tarjeta (sobre el neto). Precio neto = 1.000 / (1 − 0,20 − 0,03 − 0,02) = <b>$ 1.333,33</b>; con IVA 21%, $ 1.613,33.</p>`,
  ex:[{type:"num",items:[{q:"Precio de mercado $ 1.500 y margen deseado del 20% sobre ventas. ¿Costo meta?",a:1200,u:"$"},{q:"Costo $ 2.000; margen 15%, IIBB 3,5% y comisiones 1,5% sobre el precio neto. ¿Precio neto?",a:2500,u:"$",hint:"2.000 / (1 − 0,15 − 0,035 − 0,015)"},{q:"¿Y el precio final con IVA 21%?",a:3025,u:"$"}]}]},
 {lead:"El presupuesto integral traduce los planes de la empresa en números para el año siguiente.",
  html:`<h3>Secuencia</h3><ol><li><b>Presupuesto de ventas</b> (unidades y pesos). Es el punto de partida.</li><li><b>Producción:</b> unidades a producir = ventas + inventario final deseado − inventario inicial.</li><li><b>Materias primas:</b> consumo y compras.</li><li><b>Mano de obra</b> y <b>carga fabril</b>.</li><li><b>Gastos</b> de comercialización y administración.</li><li><b>Presupuesto financiero</b> (de caja): cobros y pagos según las condiciones de venta y compra.</li><li><b>Estados proyectados:</b> resultados y situación patrimonial.</li></ol>
  <div class="formula">Compras de MP = Consumo + Existencia final deseada − Existencia inicial</div>
  <h3>Presupuesto de caja</h3><p>Muestra si va a faltar o sobrar dinero cada mes. Si las ventas son a 60 días, el cobro de enero entra en marzo: una empresa que crece mucho puede quedarse sin caja aunque gane.</p>
  <h3>Presupuesto flexible</h3><p>Ajusta el presupuesto al nivel de actividad real. Así se comparan costos reales con lo que deberían haber sido para ese volumen.</p>`,
  ex:[{type:"num",items:[{q:"Ventas presupuestadas 10.000 u; inventario final deseado 2.000 u; inventario inicial 1.500 u. ¿Unidades a producir?",a:10500},{q:"Cada unidad usa 2 kg de MP. Existencia final deseada de MP 3.000 kg; inicial 2.500 kg. ¿Kg a comprar?",a:21500,u:"kg"},{q:"Ventas de enero $ 1.000.000 y febrero $ 1.200.000. Se cobra 40% en el mes y 60% al mes siguiente. ¿Cobranza de febrero?",a:1080000,u:"$"}]}]},
 {lead:"Comparar lo real con lo presupuestado y explicar las diferencias es el corazón del control de gestión.",
  html:`<h3>Desvíos de ventas</h3><div class="formula">Desvío de precio = (Precio real − Precio presupuestado) × Cantidad real<br>Desvío de volumen = (Cantidad real − Cantidad presupuestada) × Precio presupuestado</div>
  <p>Presupuesto: 1.000 u a $ 200 = $ 200.000. Real: 1.100 u a $ 190 = $ 209.000.</p>
  <ul><li>Precio: (190 − 200) × 1.100 = <b>−11.000</b> desfavorable.</li><li>Volumen: (1.100 − 1.000) × 200 = <b>+20.000</b> favorable.</li><li>Total: +9.000 favorable.</li></ul>
  <p>En la práctica conviene analizar los desvíos en términos de <b>contribución marginal</b>, no solo de ventas: vender más de un producto de bajo margen puede empeorar el resultado (desvío de mezcla).</p>
  <h3>Informe de desvíos</h3><p>Un buen informe muestra el presupuesto, lo real, el desvío en pesos y en porcentaje, la causa y quién es responsable. Se concentra en los desvíos significativos (gestión por excepción).</p>`,
  ex:[{type:"num",items:[{q:"Presupuesto: 2.000 u a $ 500. Real: 1.800 u a $ 540. ¿Desvío de precio? (con signo)",a:72000,u:"$"},{q:"¿Desvío de volumen? (con signo)",a:-100000,u:"$"},{q:"¿Desvío total de ventas? (con signo)",a:-28000,u:"$"}]}]},
],

 {lead:"Las finanzas públicas estudian cómo obtiene recursos el Estado, cómo los gasta y qué efectos tiene eso sobre la economía.",
  html:`<h3>Funciones del Estado (Musgrave)</h3><ul><li><b>Asignación:</b> proveer bienes públicos y corregir fallas de mercado (Módulo 4).</li><li><b>Distribución:</b> modificar la distribución del ingreso con impuestos progresivos y transferencias.</li><li><b>Estabilización:</b> moderar los ciclos económicos con política fiscal y monetaria.</li></ul>
  <h3>Sector público</h3><ul><li><b>Sector público nacional no financiero:</b> administración central, organismos descentralizados, instituciones de seguridad social (ANSES), empresas y sociedades del Estado.</li><li><b>Provincias y municipios</b>, cada uno con su propio presupuesto.</li></ul>

 {lead:"El presupuesto es la ley que autoriza cuánto puede gastar el Estado y estima cuánto va a recaudar.",
  html:`<h3>Principios presupuestarios</h3><ul><li><b>Anualidad:</b> rige por un año calendario.</li><li><b>Universalidad:</b> incluye todos los recursos y gastos.</li><li><b>Unidad:</b> un solo documento.</li><li><b>Especificación:</b> los gastos se autorizan con un destino determinado.</li><li><b>Equilibrio</b> entre recursos y gastos (o cómo se financia la diferencia).</li><li><b>Publicidad.</b></li></ul>
  <h3>Ciclo presupuestario</h3><ol><li><b>Formulación:</b> el Poder Ejecutivo elabora el proyecto.</li><li><b>Aprobación:</b> el Congreso lo sanciona como ley (art. 75 inc. 8 de la Constitución). El proyecto se presenta antes del 15 de septiembre.</li><li><b>Ejecución:</b> los organismos gastan dentro de los créditos autorizados.</li><li><b>Control y evaluación:</b> Cuenta de Inversión, SIGEN y AGN.</li></ol>
  <h3>Etapas del gasto</h3><div class="tw"><table><thead><tr><th>Etapa</th><th>Qué significa</th></tr></thead><tbody>
  <tr><td><b>Crédito</b></td><td>La autorización para gastar en el presupuesto</td></tr><tr><td><b>Compromiso</b></td><td>Se decide el gasto y se reserva el crédito (por ejemplo, se adjudica una licitación)</td></tr>
  <tr><td><b>Devengado</b></td><td>Nace la obligación de pagar porque se recibió el bien o servicio</td></tr><tr><td><b>Ordenado a pagar</b></td><td>Se emite la orden de pago</td></tr><tr><td><b>Pagado</b></td><td>Sale el dinero</td></tr></tbody></table></div>
  <h3>Clasificaciones del gasto</h3><p>Institucional (quién gasta), por objeto (en qué: personal, bienes, transferencias), por finalidad y función (para qué: salud, educación, defensa) y económica (corriente o de capital).</p>`,
  ex:[{type:"order",title:"Ordená las etapas del gasto público",items:["Crédito presupuestario","Compromiso","Devengado","Ordenado a pagar","Pagado"]},
   {type:"pick",title:"¿Qué clasificación del gasto se usa?",options:["Institucional","Por objeto","Finalidad y función","Económica"],items:[["Gasto del Ministerio de Salud","Institucional"],["Gasto en sueldos del personal","Por objeto"],["Gasto en educación y cultura","Finalidad y función"],["Gasto de capital en obra pública","Económica"]]}]},
 {lead:"Cuánto gasta el Estado, en qué y con qué eficiencia es una discusión central de cualquier economía.",
  html:`<h3>Tipos de gasto</h3><ul><li><b>Corriente:</b> sueldos, bienes de consumo, intereses, jubilaciones y transferencias.</li><li><b>De capital:</b> inversión real directa (obras), transferencias de capital, inversión financiera.</li></ul>
  <p>En Argentina, el componente más grande del gasto nacional es la <b>seguridad social</b> (jubilaciones, pensiones y asignaciones), seguido por subsidios económicos, transferencias a provincias, salarios e intereses de la deuda.</p>
  <h3>Por qué crece el gasto</h3><p>La <b>ley de Wagner</b> sostiene que, a medida que una economía se desarrolla, el gasto público crece más que proporcionalmente al ingreso: más demanda de educación, salud, infraestructura y regulación.</p>
  <h3>Evaluación del gasto</h3><ul><li><b>Eficiencia:</b> obtener el mayor resultado con los recursos.</li><li><b>Eficacia:</b> cumplir los objetivos.</li><li><b>Equidad:</b> a quién beneficia.</li></ul>
  <p>La evaluación de proyectos públicos usa las mismas herramientas que la privada (VAN, TIR, Módulo 11), pero con <b>precios sociales</b>: incluye beneficios y costos para toda la sociedad, como el tiempo de viaje ahorrado por una ruta.</p>
  <h3>Subsidios</h3><p>Pueden ser a la oferta (tarifas por debajo del costo) o a la demanda (transferencias a personas). Los subsidios generalizados a la oferta suelen beneficiar más a quienes más consumen, que no siempre son los más pobres.</p>`,
  ex:[{type:"pick",title:"¿Gasto corriente o de capital?",options:["Corriente","De capital"],items:[["Sueldos docentes","Corriente"],["Construcción de un hospital","De capital"],["Intereses de la deuda pública","Corriente"],["Jubilaciones","Corriente"],["Compra de trenes nuevos","De capital"]]}]},
 {lead:"¿Cómo debería ser un buen impuesto? La teoría de la imposición busca combinar recaudación, equidad y eficiencia.",
  html:`<h3>Principios clásicos (Adam Smith)</h3><ul><li><b>Equidad:</b> contribuir según la capacidad.</li><li><b>Certeza:</b> que el contribuyente sepa cuánto, cuándo y cómo pagar.</li><li><b>Comodidad</b> en la forma de pago.</li><li><b>Economía:</b> que cueste poco recaudarlo.</li></ul>
  <h3>Equidad horizontal y vertical</h3><p><b>Horizontal:</b> quienes están en igual situación pagan igual. <b>Vertical:</b> quienes tienen más capacidad pagan más.</p>
  <h3>Progresivo, proporcional y regresivo</h3><div class="tw"><table><thead><tr><th>Tipo</th><th>Qué pasa al crecer el ingreso</th><th>Ejemplo</th></tr></thead><tbody>
  <tr><td><b>Progresivo</b></td><td>Se paga una proporción mayor</td><td>Ganancias de personas humanas (escala 5% a 35%)</td></tr>
  <tr><td><b>Proporcional</b></td><td>Se paga la misma proporción</td><td>Una alícuota única sobre la renta</td></tr>
  <tr><td><b>Regresivo</b></td><td>Se paga una proporción menor del ingreso</td><td>El IVA, medido sobre el ingreso: los hogares pobres consumen casi todo lo que ganan</td></tr></tbody></table></div>
  <h3>Incidencia</h3><p>Quien paga legalmente un impuesto (incidencia legal) no siempre es quien lo soporta (incidencia económica). El impuesto se <b>traslada</b> hacia adelante (al comprador, subiendo el precio) o hacia atrás (al proveedor o al trabajador), según las elasticidades.</p>
  <h3>Curva de Laffer</h3><p>Más allá de cierta alícuota, subir el impuesto reduce la recaudación porque desalienta la actividad o promueve la evasión.</p>
  <h3>Presión tributaria</h3><div class="formula">Presión tributaria = Recaudación total / PBI</div>`,
  ex:[{type:"num",items:[{q:"Una persona gana $ 1.000.000 y paga $ 100.000 de impuesto. Otra gana $ 5.000.000 y paga $ 1.000.000. ¿Qué alícuota efectiva paga la segunda, en %?",a:20,u:"%",tol:0.05,ex:"La primera paga 10%: el impuesto es progresivo."},{q:"Un hogar gana $ 800.000, consume todo y paga 21% de IVA sobre ese consumo neto, es decir $ 138.843. ¿Qué % de su ingreso representa? (dos decimales)",a:17.36,u:"%",tol:0.02,hint:"138.843 / 800.000"},{q:"Recaudación $ 290 billones y PBI $ 1.000 billones. ¿Presión tributaria, en %?",a:29,u:"%",tol:0.05}]},
   {type:"pick",title:"¿Progresivo, proporcional o regresivo respecto del ingreso?",options:["Progresivo","Proporcional","Regresivo"],items:[["Ganancias con escala de alícuotas crecientes","Progresivo"],["IVA sobre el consumo","Regresivo"],["Una tasa fija del 10% sobre toda renta","Proporcional"],["Un impuesto de suma fija igual para todos","Regresivo"]]}]},
 {lead:"El sistema tributario argentino combina impuestos nacionales, provinciales y municipales. Conocer su estructura es la puerta de entrada a los módulos de impuestos.",
  html:`<h3>Principales tributos por nivel</h3><div class="tw"><table><thead><tr><th>Nivel</th><th>Tributo</th><th>Base</th></tr></thead><tbody>
  <tr><td rowspan="6">Nacional (ARCA)</td><td>IVA</td><td>Consumo</td></tr><tr><td>Ganancias</td><td>Renta</td></tr><tr><td>Créditos y débitos bancarios</td><td>Transacciones financieras</td></tr><tr><td>Bienes Personales</td><td>Patrimonio</td></tr><tr><td>Derechos de exportación e importación</td><td>Comercio exterior</td></tr><tr><td>Aportes y contribuciones a la seguridad social</td><td>Salarios</td></tr>
  <tr><td rowspan="3">Provincial</td><td>Ingresos Brutos</td><td>Facturación</td></tr><tr><td>Sellos</td><td>Instrumentos (contratos)</td></tr><tr><td>Inmobiliario y Automotor</td><td>Propiedad</td></tr>
  <tr><td>Municipal</td><td>Tasas (seguridad e higiene, ABL)</td><td>Servicios</td></tr></tbody></table></div>
  <h3>Rasgos del sistema</h3><ul><li><b>Peso de los impuestos al consumo y a la facturación</b> (IVA e Ingresos Brutos), lo que lo hace regresivo en conjunto.</li><li><b>Impuestos distorsivos</b> que se aplican “en cascada”: Ingresos Brutos y el impuesto a los créditos y débitos gravan cada etapa sin descontar la anterior.</li><li><b>Alta informalidad</b> y evasión.</li><li><b>Complejidad:</b> cientos de regímenes de retención y percepción nacionales y provinciales.</li></ul>
  <h3>Evasión y elusión</h3><p><b>Evasión:</b> no pagar lo que corresponde violando la ley (es ilícita). <b>Elusión:</b> usar formas legales para pagar menos, a veces abusando de la norma. <b>Planificación fiscal legítima:</b> elegir, entre opciones legales, la de menor carga sin abuso. Lo vemos en el Módulo 21.</p>`,

 {lead:"Cuando el Estado gasta más de lo que recauda, se endeuda. La sostenibilidad de esa deuda es uno de los problemas recurrentes de la Argentina.",
  html:`<h3>Clasificación</h3><ul><li>Por moneda: en pesos o en moneda extranjera.</li><li>Por legislación: local o extranjera (jurisdicción de Nueva York, por ejemplo).</li><li>Por acreedor: privados (bonistas), organismos multilaterales (FMI, Banco Mundial, BID), otros países (Club de París), el propio sector público (BCRA, ANSES).</li></ul>

lessons:[
 {lead:"Un tributo es una prestación en dinero que el Estado exige en ejercicio de su poder de imperio, establecida por ley, para cubrir sus gastos.",
  html:`<h3>Especies de tributos</h3><ul><li><b>Impuesto:</b> el hecho imponible no depende de ninguna actividad estatal hacia el contribuyente (Ganancias, IVA).</li><li><b>Tasa:</b> retribuye un servicio público individualizado (tasa de justicia, ABL).</li><li><b>Contribución especial:</b> se cobra por un beneficio derivado de una obra o actividad estatal (contribución de mejoras), o con destino a un fin (aportes a la seguridad social).</li></ul>
  <h3>Elementos de la obligación tributaria</h3><div class="tw"><table><thead><tr><th>Elemento</th><th>Qué es</th><th>Ejemplo en IVA</th></tr></thead><tbody>
  <tr><td><b>Hecho imponible</b></td><td>La situación que hace nacer la obligación</td><td>Vender cosas muebles en el país</td></tr>
  <tr><td><b>Sujeto activo</b></td><td>Quien cobra</td><td>El Estado nacional, por medio de ARCA</td></tr>
  <tr><td><b>Sujeto pasivo</b></td><td>Quien debe pagar</td><td>El vendedor responsable inscripto</td></tr>
  <tr><td><b>Base imponible</b></td><td>Sobre qué se calcula</td><td>El precio neto de venta</td></tr>
  <tr><td><b>Alícuota</b></td><td>El porcentaje</td><td>21%</td></tr>
  <tr><td><b>Exenciones</b></td><td>Casos que la ley libera</td><td>Venta de libros</td></tr></tbody></table></div>
  <h3>Sujetos pasivos (Ley 11.683)</h3><ul><li><b>Contribuyentes</b> (art. 5): quienes realizan el hecho imponible.</li><li><b>Responsables por deuda ajena</b> (art. 6): administradores, directores, gerentes, síndicos, agentes de retención y de percepción, entre otros.</li><li><b>Responsables solidarios</b> (art. 8): los responsables del art. 6 responden con sus bienes propios si no cumplen sus deberes, por ejemplo si no pagan el tributo de la empresa que administran luego de ser intimada.</li></ul>`,

 {lead:"La Ley 11.683 de Procedimiento Tributario regula la relación entre el contribuyente y ARCA: domicilio, determinación, intereses, sanciones y recursos.",
  html:`<h3>Domicilio fiscal</h3><p>El domicilio fiscal (art. 3) y el <b>domicilio fiscal electrónico</b> (art. 3.1), obligatorio, donde se notifican válidamente los actos de ARCA.</p>
  <h3>Determinación de la deuda</h3><ul><li>Como regla, por <b>declaración jurada</b> del propio contribuyente.</li><li>Si ARCA impugna la declaración o el contribuyente no la presenta, hace una <b>determinación de oficio</b> (arts. 16 y siguientes): corre una <b>vista</b> por 15 días hábiles para que el contribuyente se defienda y luego dicta una resolución.</li></ul>
  <h3>Intereses</h3><ul><li><b>Resarcitorios</b> (art. 37): por pagar fuera de término, aunque no haya reclamo.</li><li><b>Punitorios</b> (art. 52): cuando ARCA tiene que ir a juicio de ejecución fiscal.</li></ul>
  <h3>Infracciones principales</h3><div class="tw"><table><thead><tr><th>Infracción</th><th>Conducta</th></tr></thead><tbody>
  <tr><td>Formales</td><td>No presentar declaraciones juradas, no cumplir requerimientos</td></tr>
  <tr><td>Clausura (art. 40)</td><td>No emitir factura, no estar inscripto, no tener registradas las mercaderías o los empleados</td></tr>
  <tr><td>Omisión (art. 45)</td><td>Dejar de pagar por declaración inexacta, sin dolo</td></tr>
  <tr><td>Defraudación (art. 46)</td><td>Dejar de pagar mediante maniobras engañosas</td></tr></tbody></table></div>
  <p>Por encima de los montos que fija el Régimen Penal Tributario (Título IX de la Ley 27.430), la evasión es un delito con penas de prisión. La Ley 27.799 de Inocencia Fiscal (B.O. 2/1/2026) elevó esos umbrales a $ 100.000.000 por tributo y por ejercicio para la evasión simple y $ 1.000.000.000 para la agravada, y desde 2027 se actualizan por UVA. También permite extinguir la acción penal pagando lo evadido, los intereses y un 50% adicional dentro de los 30 días hábiles de notificada la imputación.</p>
  <h3>Recursos (art. 76)</h3><p>Contra determinaciones de oficio y multas, dentro de los <b>15 días hábiles</b>: recurso de <b>reconsideración</b> ante el superior de ARCA, o <b>apelación ante el Tribunal Fiscal de la Nación</b> si el monto supera el mínimo legal. Son excluyentes.</p>
  <h3>Prescripción (art. 56)</h3><p>5 años para inscriptos; 10 años para no inscriptos. Corre desde el 1 de enero siguiente al año del vencimiento de la declaración jurada.</p>`,
  ex:[{type:"tf",items:[["Las notificaciones en el domicilio fiscal electrónico son válidas aunque el contribuyente no las abra","Verdadero"],["La vista en la determinación de oficio dura 15 días hábiles","Verdadero"],["Contra una determinación de oficio se puede presentar al mismo tiempo reconsideración y apelación al Tribunal Fiscal","Falso","Son vías excluyentes."],["Pagar un impuesto un mes tarde genera intereses resarcitorios","Verdadero"],["La prescripción para un contribuyente inscripto es, como regla, de 10 años","Falso","Es de 5 años (10 para no inscriptos), y puede bajar a 3 años con la Ley 27.799 si presentó y pagó en término."]]},
   {type:"num",items:[{q:"La DDJJ de Ganancias del período fiscal 2023 venció en junio de 2024. Para un inscripto, ¿en qué año se completa la prescripción? (el plazo corre desde el 1/1/2025)",a:2029,tol:0,hint:"5 años desde el 1/1/2025 → termina el 31/12/2029"}]}]},
 {lead:"El IVA grava el consumo en cada etapa, pero cada uno paga solo sobre el valor que agrega, porque descuenta lo que pagó al comprar.",
  html:`<p>Se rige por la Ley 23.349 (texto ordenado en 1997) y su decreto reglamentario.</p>
  <h3>Objeto (art. 1)</h3><ul><li>Las ventas de cosas muebles situadas en el país.</li><li>Las obras, locaciones y prestaciones de servicios del art. 3, realizadas en el país.</li><li>Las importaciones definitivas de cosas muebles.</li><li>Las prestaciones realizadas en el exterior cuya utilización efectiva se lleve a cabo en el país (por ejemplo, servicios digitales del exterior).</li></ul>
  <h3>Sujetos (art. 4)</h3><p>Quienes hacen habitualmente ventas de cosas muebles, realizan obras o prestan servicios gravados, importan, entre otros. Se inscriben como <b>responsables inscriptos</b>. Los monotributistas no son sujetos de IVA: el impuesto está incluido en su cuota.</p>
  <h3>Nacimiento del hecho imponible (art. 5)</h3><ul><li><b>Venta de cosas:</b> con la entrega del bien, la emisión de la factura o un acto equivalente, lo que ocurra primero.</li><li><b>Servicios:</b> al terminar la prestación o al percibir el precio, lo que ocurra primero.</li><li><b>Importación:</b> al momento en que la importación es definitiva.</li></ul>
  <h3>Alícuotas (art. 28)</h3><div class="tw"><table><thead><tr><th>Alícuota</th><th>Ejemplos</th></tr></thead><tbody>
  <tr><td class="mono">21%</td><td>Tasa general</td></tr><tr><td class="mono">10,5%</td><td>Ciertos alimentos (carne, frutas, verduras), bienes de capital incluidos en la ley, construcción de viviendas, algunos intereses de préstamos, transporte de pasajeros de más de 100 km</td></tr>
  <tr><td class="mono">27%</td><td>Servicios de telecomunicaciones, gas, energía eléctrica y agua cuando el comprador es responsable inscripto y no es para uso doméstico</td></tr></tbody></table></div>
  <p>Hay <b>exenciones</b> (art. 7), como los libros, la leche fluida sin aditivos para consumidores finales, los servicios educativos de establecimientos con programas oficiales o el transporte de pasajeros de hasta 100 km, entre otras. Las <b>exportaciones</b> están exentas, pero el exportador puede recuperar el crédito fiscal (art. 43).</p>`,
  ex:[{type:"pick",title:"¿Qué alícuota o tratamiento corresponde?",options:["21%","10,5%","27%","Exento"],items:[["Venta de una heladera","21%"],["Venta de carne vacuna","10,5%"],["Factura de luz a una fábrica responsable inscripta","27%"],["Venta de libros","Exento"],["Honorarios de un contador","21%"],["Venta de un torno industrial nuevo incluido como bien de capital","10,5%"]]},
   {type:"pick",title:"¿Cuándo nace el hecho imponible?",options:["Entrega","Factura","Fin del servicio","Cobro"],items:[["Se factura el 3/05 y se entrega la mercadería el 10/05","Factura"],["Se entrega el 2/06 y se factura el 5/06","Entrega"],["Servicio terminado el 30/06, cobrado el 15/07","Fin del servicio"],["Anticipo cobrado el 1/08 por un servicio que se presta en septiembre","Cobro"]]}]},
 {lead:"Cada mes, el responsable inscripto presenta una declaración jurada: débito fiscal menos crédito fiscal.",
  html:`<div class="formula">Saldo técnico = Débito fiscal − Crédito fiscal (− saldo técnico a favor del mes anterior)</div>
  <ul><li><b>Débito fiscal:</b> el IVA de las ventas, aplicando la alícuota sobre el precio neto.</li><li><b>Crédito fiscal:</b> el IVA facturado en las compras, importaciones y servicios, si está vinculado con operaciones gravadas y documentado con comprobante válido (factura A o equivalente).</li></ul>
  <h3>Dos tipos de saldo a favor</h3><ul><li><b>Saldo técnico a favor:</b> cuando el crédito fiscal supera al débito. Solo se puede usar contra débitos futuros de IVA.</li><li><b>Saldo de libre disponibilidad:</b> surge de retenciones, percepciones y pagos a cuenta que superan el impuesto. Se puede usar para pagar otros impuestos o pedir su devolución.</li></ul>
  <h3>Requisitos del crédito fiscal</h3><ul><li>Que el vendedor sea responsable inscripto y discrimine el IVA.</li><li>Que la compra esté vinculada con operaciones gravadas.</li><li>Que el comprobante sea válido (CAE, CUIT activa, sin irregularidades).</li><li>Hay limitaciones: por ejemplo, compras de automóviles por encima de cierto valor, o gastos de bares, restaurantes y hoteles (con excepciones).</li></ul>
  <h3>Registración de la posición mensual</h3><p>Se cancelan las cuentas de IVA del mes contra IVA a pagar o IVA saldo técnico a favor.</p>`,
  ex:[{type:"custom",title:"Liquidá el IVA de junio",render:liquidarIVA},
   {type:"asiento",title:"Registrá la posición de IVA de junio",accounts:ACC,entries:[{t:"30/06 · Cancelá las cuentas de IVA del mes con los datos del ejercicio anterior (débito 231.000; crédito 126.000; saldo técnico a favor anterior 10.000; retenciones y percepciones sufridas 15.000).",e:[["IVA Débito Fiscal",231000,0],["IVA Crédito Fiscal",0,126000],["IVA Saldo técnico a favor",0,10000],["IVA Retenciones y percepciones sufridas",0,15000],["IVA a pagar",0,80000]]}]}]},
 {lead:"Buena parte de la recaudación no la paga el contribuyente directamente: se la retienen o perciben otros. Para el contador, administrarlas es trabajo diario.",
  html:`<h3>Retención y percepción</h3><ul><li><b>Retención:</b> quien <b>paga</b> se queda con una parte del importe y la deposita al fisco. Ejemplo: una empresa paga honorarios y retiene Ganancias.</li><li><b>Percepción:</b> quien <b>cobra</b> agrega un importe al precio y lo deposita al fisco. Ejemplo: una distribuidora cobra una percepción de IVA o de Ingresos Brutos en la factura.</li></ul>
  <p>Para quien la sufre, la retención o percepción es un <b>pago a cuenta</b> del impuesto: se registra como un crédito (activo) y se descuenta en la declaración jurada. Para el agente, es una deuda con el fisco hasta que la deposita.</p>
  <h3>Regímenes frecuentes</h3><ul><li>Nacionales: retenciones de Ganancias (RG 830 sobre pagos), retenciones y percepciones de IVA, SICORE para informar y depositar.</li><li>Provinciales: retenciones y percepciones de Ingresos Brutos, y <b>SIRCREB</b>, que retiene sobre las acreditaciones bancarias.</li></ul>
  <h3>Certificados</h3><p>El agente debe entregar un certificado con cada retención. Sin él (o sin que figure en los sistemas de ARCA o de la provincia), el que la sufrió puede tener problemas para computarla.</p>
  <h3>Riesgo para el contribuyente</h3><p>Si las retenciones y percepciones superan el impuesto que corresponde, se acumulan <b>saldos a favor</b>. Hay que gestionar certificados de exclusión o reducción para no inmovilizar fondos.</p>`,
  ex:[{type:"pick",title:"¿Retención o percepción?",options:["Retención","Percepción"],items:[["El cliente te paga $ 1.000.000 y te descuenta $ 20.000 de Ganancias","Retención"],["El proveedor te factura con un adicional de IIBB","Percepción"],["El banco descuenta IIBB de una acreditación en tu cuenta (SIRCREB)","Retención"],["La aduana cobra un adicional de IVA al importar","Percepción"]]},
   {type:"asiento",accounts:ACC,entries:[{t:"Un cliente cancela una factura de $ 1.210.000 por transferencia y te retiene $ 30.000 de IVA.",e:[["Banco Nación c/c",1180000,0],["IVA Retenciones y percepciones sufridas",30000,0],["Deudores por ventas",0,1210000]]}]}]},
 {lead:"Ingresos Brutos es el principal impuesto provincial. Grava la facturación de cualquier actividad habitual y onerosa.",
  html:`<h3>Características</h3><ul><li><b>Hecho imponible:</b> el ejercicio habitual y a título oneroso de una actividad en la jurisdicción (comercio, industria, profesión, servicios).</li><li><b>Base imponible:</b> los ingresos brutos devengados del período. Para responsables inscriptos en IVA, sin incluir el IVA débito fiscal.</li><li><b>Alícuotas:</b> las fija cada provincia por actividad en su ley impositiva anual. Varían mucho: suelen ser más bajas para la industria y más altas para la intermediación financiera.</li><li>Se liquida por <b>anticipos mensuales</b> y una declaración jurada anual, según la jurisdicción.</li></ul>
  <h3>Convenio Multilateral</h3><p>Si una empresa actúa en varias provincias, el Convenio Multilateral (de 1977) distribuye la base imponible entre ellas para evitar la doble imposición.</p>
  <p><b>Régimen general (art. 2):</b> 50% de la base se distribuye en proporción a los <b>ingresos</b> obtenidos en cada jurisdicción y 50% en proporción a los <b>gastos</b> soportados en cada una, según el último balance cerrado.</p>
  <div class="formula">Coeficiente provincia = 0,5 × (ingresos en la provincia / ingresos totales) + 0,5 × (gastos en la provincia / gastos totales)</div>
  <p>Hay <b>regímenes especiales</b> (arts. 6 a 13) para actividades como la construcción, el transporte, los seguros, los profesionales y la industria.</p>
  <h3>Registración contable</h3><p>Ingresos Brutos es un gasto de comercialización o se resta de las ventas, según el criterio adoptado: <span class="mono">Impuesto sobre los Ingresos Brutos a IIBB a pagar</span>.</p>`,
  ex:[{type:"num",items:[{q:"Ingresos: 60% en Córdoba y 40% en Santa Fe. Gastos: 40% en Córdoba y 60% en Santa Fe. ¿Coeficiente unificado de Córdoba?",a:0.5,tol:0.001},{q:"Base imponible total del mes $ 10.000.000 y alícuota de Córdoba 3,5%. ¿Impuesto de Córdoba?",a:175000,u:"$"},{q:"Una empresa vende $ 2.420.000 con IVA incluido (21%). Alícuota de IIBB 3%. ¿Impuesto del mes?",a:60000,u:"$",hint:"La base no incluye el IVA: 2.420.000 / 1,21 = 2.000.000"}]},
   {type:"asiento",accounts:ACC,entries:[{t:"30/06 · Registrá el Ingresos Brutos devengado en el mes: $ 60.000.",e:[["Impuesto sobre los Ingresos Brutos",60000,0],["IIBB a pagar",0,60000]]}]}]},
 {lead:"El Monotributo es un régimen simplificado para pequeños contribuyentes: reemplaza IVA, Ganancias y los aportes por una cuota mensual.",
  html:`<p>Lo regula el Anexo de la Ley 24.977 (Régimen Simplificado para Pequeños Contribuyentes), con sus modificaciones.</p>
  <h3>Quiénes pueden adherir</h3><p>Personas humanas que realizan venta de cosas muebles, locaciones y prestaciones de servicios, y sucesiones indivisas, cuyos <b>ingresos brutos de los últimos 12 meses</b> no superen el tope de la categoría máxima, y que cumplan los demás requisitos (precio unitario máximo de venta de bienes, cantidad de actividades, no realizar importaciones para comercializar, entre otros).</p>
  <h3>Componentes de la cuota</h3><ul><li><b>Impositivo:</b> reemplaza IVA y Ganancias.</li><li><b>Previsional:</b> aporte al sistema jubilatorio (SIPA).</li><li><b>Obra social.</b></li></ul>
  <h3>Categorías</h3><p>Van de la <b>A</b> a la <b>K</b>, según los ingresos brutos anuales, la superficie afectada, la energía eléctrica consumida y los alquileres pagados. Los montos se actualizan semestralmente por inflación: consultalos siempre en la web de ARCA.</p>
  <h3>Recategorización</h3><p>Es <b>semestral</b> (en enero y julio), según los parámetros de los últimos 12 meses.</p>
  <h3>Exclusión</h3><p>Si se superan los topes o se incumplen requisitos (por ejemplo, gastos personales incompatibles con los ingresos declarados), ARCA excluye al contribuyente, que pasa al régimen general como responsable inscripto desde el día siguiente a la causal.</p>
  <h3>Comprobantes</h3><p>El monotributista emite factura <b>C</b> y no discrimina IVA. Sus clientes responsables inscriptos no pueden computar crédito fiscal por esas compras.</p>`,
  ex:[{type:"tf",items:[["La cuota del Monotributo incluye un componente jubilatorio","Verdadero"],["La recategorización es anual, en diciembre","Falso","Es semestral, en enero y julio."],["Un monotributista emite factura A a sus clientes inscriptos","Falso","Emite factura C."],["Si un monotributista supera el tope de ingresos de la categoría máxima queda excluido","Verdadero"],["Las sociedades anónimas pueden adherir al Monotributo","Falso"]]}]},
],
