add(9, "Documentos y valores: cheques, ECHEQ y pagarés", {
 lead:"Buena parte de los cobros y pagos de una empresa no son en efectivo ni por transferencia, sino con documentos que se cobran más adelante. Cada uno tiene su tratamiento contable.",
 src:["ccyc","bcra"],
 cite:["Ley 24.452 de Cheques.","Decreto-Ley 5965/63 (letra de cambio y pagaré).","BCRA, normativa sobre cheques electrónicos (ECHEQ)."],
 html:`<h3>Los documentos más usados</h3><div class="tw"><table><thead><tr><th>Documento</th><th>Qué es</th><th>Dato clave</th></tr></thead><tbody>
 <tr><td><b>Cheque común</b></td><td>Orden de pago a la vista contra un banco.</td><td>Se presenta dentro de los 30 días de su fecha si es del país (Ley 24.452, art. 25).</td></tr>
 <tr><td><b>Cheque de pago diferido</b></td><td>Orden de pago a una fecha futura.</td><td>Hasta 360 días desde su emisión (art. 54).</td></tr>
 <tr><td><b>ECHEQ</b></td><td>Cheque electrónico, común o diferido, que se emite, endosa y deposita desde el home banking.</td><td>Mismas reglas de fondo, sin papel.</td></tr>
 <tr><td><b>Pagaré</b></td><td>Promesa de pago del propio deudor.</td><td>Título valor regido por el Decreto-Ley 5965/63.</td></tr></tbody></table></div>
 <h3>Cómo se registran</h3><ul>
 <li>Un cheque al día recibido de un cliente se registra en <b>Valores a depositar</b> (es casi efectivo). Al depositarlo pasa a Banco.</li>
 <li>Un cheque diferido recibido es un crédito: <b>Documentos a cobrar</b> o <b>Valores diferidos a depositar</b>, según el plan de cuentas.</li>
 <li>Un cheque diferido emitido es una deuda: <b>Documentos a pagar</b> (o Cheques diferidos a pagar) hasta que el banco lo debita.</li>
 <li>Si el documento incluye intereses, se separan y se devengan mes a mes (Módulo 13).</li></ul>
 <h3>Descontar y endosar</h3><p>La empresa puede <b>endosar</b> un cheque recibido para pagar a un proveedor, o <b>descontarlo</b> en un banco o en el mercado de capitales para cobrarlo antes. En el descuento recibe menos que el valor nominal: la diferencia es un gasto financiero (intereses y comisiones), y mientras el cheque no se cobre la empresa sigue respondiendo si el librador no paga.</p>
 <div class="note"><b>Impuesto a los débitos y créditos.</b> Los movimientos en cuentas bancarias pagan el impuesto de la Ley 25.413. Una parte puede computarse a cuenta de Ganancias según el tipo de contribuyente: verificá el porcentaje vigente en ARCA.</div>`,
 ex:[{type:"asiento",accounts:["Banco Nación c/c","Valores a depositar","Documentos a cobrar","Deudores por ventas","Proveedores","Documentos a pagar","Intereses perdidos"],entries:[
   {t:"Un cliente cancela su deuda de $ 500.000 con un cheque al día.",e:[["Valores a depositar",500000,0],["Deudores por ventas",0,500000]]},
   {t:"Se deposita el cheque.",e:[["Banco Nación c/c",500000,0],["Valores a depositar",0,500000]]},
   {t:"Otro cliente entrega un ECHEQ diferido a 60 días por $ 300.000 para cancelar su deuda.",e:[["Documentos a cobrar",300000,0],["Deudores por ventas",0,300000]]},
   {t:"Se descuenta ese ECHEQ en el banco; acreditan $ 285.000.",e:[["Banco Nación c/c",285000,0],["Intereses perdidos",15000,0],["Documentos a cobrar",0,300000]]},
   {t:"Se paga a un proveedor $ 400.000 con un cheque de pago diferido propio a 30 días.",e:[["Proveedores",400000,0],["Documentos a pagar",0,400000]]}]},
  {type:"tf",items:[["Un cheque de pago diferido puede emitirse a 2 años",false,"El plazo máximo es de 360 días."],["El ECHEQ es un cheque electrónico con las mismas reglas de fondo que el de papel",true],["Al descontar un cheque, la diferencia con el valor nominal es un gasto financiero",true]]}]});

add(13, "Inversiones y participaciones en otras sociedades", {
 lead:"Una empresa puede invertir su dinero en plazos fijos, bonos o acciones. Cómo se miden depende de la intención y de la influencia que la inversión le da sobre la otra sociedad.",
 src:["rt54","facpce","cnv"],
 cite:["Fowler Newton, E., Contabilidad Superior, capítulos sobre inversiones permanentes."],
 html:`<h3>Inversiones temporarias</h3><p>Son las que se mantienen para obtener una renta o una diferencia de precio en el corto plazo: plazos fijos, fondos comunes de inversión, títulos públicos o acciones con cotización. Al cierre:</p><ul>
 <li><b>Plazo fijo:</b> capital más los intereses devengados hasta el cierre.</li>
 <li><b>Títulos y acciones con cotización:</b> a su valor neto de realización (cotización menos gastos de venta). La diferencia con la medición anterior es un resultado.</li>
 <li><b>Cuotapartes de fondos comunes:</b> al valor de la cuotaparte al cierre.</li></ul>
 <h3>Participaciones permanentes</h3><p>Cuando una sociedad compra acciones de otra para quedarse con ellas, lo que importa es el grado de influencia:</p>
 <div class="tw"><table><thead><tr><th>Situación</th><th>Referencia habitual</th><th>Medición</th></tr></thead><tbody>
 <tr><td>Sin influencia significativa</td><td>Menos del 20% de los votos</td><td>Costo o valor razonable, con el límite del valor recuperable</td></tr>
 <tr><td>Influencia significativa</td><td>20% o más de los votos, o representación en el directorio</td><td>Valor patrimonial proporcional (VPP)</td></tr>
 <tr><td>Control</td><td>Más del 50% de los votos</td><td>VPP en los estados individuales y, además, estados consolidados</td></tr></tbody></table></div>
 <h3>El método del VPP</h3><p>La inversión se mide como el porcentaje de participación sobre el patrimonio neto de la emisora. Cada año se reconoce la parte del resultado de la emisora como resultado propio, y los dividendos cobrados reducen la inversión (no son ganancia, porque ya se reconocieron al devengarse el resultado).</p>
 <div class="formula">Inversión = % de participación × patrimonio neto de la emisora</div>
 <p>Si se pagó más que la proporción del patrimonio, la diferencia puede corresponder a una <b>llave de negocio</b>, que se trata según la norma aplicable.</p>
 <div class="note"><b>Fuentes.</b> Estos criterios venían de la RT 21 y hoy se encuentran en la normativa vigente de la FACPCE. Para entes que aplican NIIF rigen la NIC 28 y la NIIF 10. Antes de un caso real, verificá el texto ordenado vigente.</div>`,
 ex:[{type:"num",title:"VPP",items:[
   {q:"Alfa SA compra el 30% de Beta SA, cuyo patrimonio neto es $ 10.000.000. ¿Cuánto vale la inversión por VPP?",a:3000000,u:"$"},
   {q:"Beta gana $ 2.000.000 en el año. ¿Qué resultado reconoce Alfa?",a:600000,u:"$"},
   {q:"Beta distribuye dividendos por $ 1.000.000. ¿Cuánto cobra Alfa?",a:300000,u:"$"},
   {q:"¿Cuánto vale la inversión después del resultado y los dividendos?",a:3300000,u:"$",ex:"3.000.000 + 600.000 − 300.000."}]},
  {type:"pick",title:"¿Cómo se mide?",options:["VNR o cotización","VPP","VPP y consolidación","Capital más intereses devengados"],items:[["Plazo fijo a 30 días","Capital más intereses devengados"],["Acciones con cotización compradas para vender en semanas","VNR o cotización"],["Participación del 35% con un director en la emisora","VPP"],["Participación del 70% en una controlada","VPP y consolidación"]]}]});

add(15, "Cambios de criterio, errores y hechos posteriores", {
 lead:"Los estados contables de un año pueden verse afectados por decisiones o hechos de otros años. La norma dice cómo corregirlos sin distorsionar la comparación.",
 src:["rt54","facpce"],
 cite:["Fowler Newton, E., Contabilidad Superior, capítulos sobre ajustes de ejercicios anteriores."],
 html:`<h3>Ajustes de resultados de ejercicios anteriores (AREA)</h3><p>Cuando se descubre un <b>error</b> en estados ya emitidos, o se hace un <b>cambio de criterio contable</b> (por ejemplo, de un método de medición a otro), el efecto que corresponde a años anteriores no pasa por el resultado del año. Se registra directamente en <b>Resultados no asignados</b>, como ajuste del saldo inicial, y se reexpresan las cifras comparativas.</p>
 <div class="note"><b>Lo que no es un AREA.</b> Un cambio en una <b>estimación</b> (la vida útil de un bien, el porcentaje de incobrables) no es un error: se aplica hacia adelante, en el ejercicio del cambio y los siguientes.</div>
 <h3>Hechos posteriores al cierre</h3><p>Son los que ocurren entre la fecha de cierre y la fecha de emisión de los estados:</p><ul>
 <li><b>Los que dan evidencia sobre situaciones que ya existían al cierre</b> se ajustan. Ejemplo: en febrero quiebra un cliente que ya tenía problemas al 31/12. Hay que ajustar la previsión.</li>
 <li><b>Los que muestran situaciones nuevas</b> no se ajustan, pero se informan en notas si son significativos. Ejemplo: un incendio en marzo destruye el depósito.</li></ul>
 <h3>Empresa en marcha</h3><p>Si después del cierre la dirección decide liquidar la empresa o no tiene alternativa realista, los estados no se preparan sobre la base de empresa en marcha y hay que revelarlo.</p>`,
 ex:[{type:"pick",title:"¿Qué tratamiento corresponde?",options:["AREA (contra Resultados no asignados)","Hacia adelante (cambio de estimación)","Ajustar los estados del año","Solo informar en notas"],items:[
   ["Se descubre que el año pasado no se registró una factura de compra","AREA (contra Resultados no asignados)"],
   ["Se revisa la vida útil de una máquina de 10 a 8 años","Hacia adelante (cambio de estimación)"],
   ["En enero se cobra solo el 40% de un crédito que al cierre ya estaba en gestión judicial","Ajustar los estados del año"],
   ["En marzo, antes de emitir los estados, un incendio destruye el depósito","Solo informar en notas"],
   ["Se cambia el método de medición de inventarios para mejorar la información","AREA (contra Resultados no asignados)"]]},
  {type:"num",items:[{q:"Una amortización de $ 120.000 del año anterior no se registró. Si se corrige este año, ¿cuánto se debita en Resultados no asignados?",a:120000,u:"$"}]}]});

add(17, "Costeo basado en actividades (ABC)", {
 lead:"Repartir los costos indirectos con una sola base, como las horas de mano de obra, distorsiona el costo cuando los productos usan los recursos de forma muy distinta. El costeo ABC asigna esos costos por actividades.",
 cite:["Horngren, C., Datar, S. y Rajan, M., Contabilidad de costos, capítulo sobre costeo basado en actividades.","Kaplan, R. y Cooper, R., Coste y efecto, Gestión 2000."],
 html:`<h3>La idea</h3><p>Los productos no consumen costos indirectos directamente: consumen <b>actividades</b> (preparar máquinas, inspeccionar, mover materiales), y las actividades consumen recursos. ABC sigue esa cadena en dos etapas:</p><ol>
 <li>Se agrupan los costos indirectos por actividad.</li><li>Se elige un <b>generador de costo</b> (cost driver) para cada actividad y se calcula una tasa.</li><li>Cada producto recibe costo según cuántas unidades del generador usó.</li></ol>
 <div class="formula">Tasa de la actividad = costo de la actividad / cantidad total del generador</div>
 <h3>Ejemplo</h3><div class="tw"><table><thead><tr><th>Actividad</th><th class="r">Costo</th><th>Generador</th><th class="r">Total</th></tr></thead><tbody>
 <tr><td>Preparación de máquinas</td><td class="r mono">400.000</td><td>Preparaciones</td><td class="r mono">40</td></tr>
 <tr><td>Control de calidad</td><td class="r mono">300.000</td><td>Inspecciones</td><td class="r mono">100</td></tr></tbody></table></div>
 <p>El producto A (lotes chicos) usa 30 preparaciones y 60 inspecciones; el B (lotes grandes), 10 preparaciones y 40 inspecciones. Con una sola base de horas, B, que usa más horas, cargaría con la mayor parte. Con ABC se ve que A es el que consume la mayoría de las actividades.</p>
 <h3>Ventajas y límites</h3><ul><li>Mejora el costo de productos diversos y ayuda a fijar precios y eliminar actividades que no agregan valor.</li><li>Es más caro de implementar y mantener, y sigue habiendo costos difíciles de asignar.</li></ul>`,
 ex:[{type:"num",items:[
   {q:"Tasa por preparación",a:10000,u:"$"},{q:"Tasa por inspección",a:3000,u:"$"},
   {q:"Costo indirecto asignado a A",a:480000,u:"$",ex:"30 × 10.000 + 60 × 3.000."},
   {q:"Costo indirecto asignado a B",a:220000,u:"$"}]},
  {type:"pick",title:"Elegí el generador de costo",options:["Cantidad de preparaciones","Cantidad de pedidos de compra","Horas máquina","Cantidad de envíos"],items:[["Configurar la máquina para un nuevo lote","Cantidad de preparaciones"],["Gestionar compras a proveedores","Cantidad de pedidos de compra"],["Energía de las máquinas","Horas máquina"],["Despacho de productos a clientes","Cantidad de envíos"]]}]});

add(20, "Régimen penal tributario e Inocencia Fiscal", {
 lead:"Por debajo de ciertos montos, no pagar un impuesto es una infracción con multa. Por encima, y con engaño, es un delito. En 2026 la Ley de Inocencia Fiscal cambió buena parte de esas reglas.",
 src:["rpt","inoc","inoc2","lpt"],
 html:`<h3>Los delitos principales (Título IX, Ley 27.430)</h3><div class="tw"><table><thead><tr><th>Delito</th><th>Conducta</th><th class="r">Monto desde la Ley 27.799</th></tr></thead><tbody>
 <tr><td>Evasión simple (art. 1)</td><td>Evadir con declaraciones engañosas, ocultación maliciosa u otro ardid</td><td class="r">más de $ 100.000.000 por tributo y ejercicio</td></tr>
 <tr><td>Evasión agravada (art. 2)</td><td>Evasión por montos mayores o con agravantes (interpósitas personas, facturas apócrifas, etc.)</td><td class="r">desde $ 1.000.000.000 en el caso del inciso a)</td></tr>
 <tr><td>Apropiación indebida de tributos (art. 4)</td><td>El agente de retención o percepción no deposita lo retenido o percibido</td><td class="r">más de $ 10.000.000 por mes</td></tr></tbody></table></div>
 <p>Los montos se actualizan por UVA desde el 1/1/2027 (art. 43 del régimen), y para saber si hubo delito se toma el monto vigente al vencimiento de la declaración jurada.</p>
 <h3>Extinción de la acción penal</h3><p>Si la acción ya empezó, se extingue cuando el imputado acepta y paga en forma total e incondicional lo adeudado, los intereses y un <b>50% adicional</b>, dentro de los 30 días hábiles de notificada la imputación (art. 16). Es un beneficio que se usa una sola vez por persona.</p>
 <h3>Prescripción más corta y discrepancia significativa</h3><p>La Ley 27.799 redujo de 5 a <b>3 años</b> la prescripción del inscripto que presentó su declaración jurada en término y pagó el saldo, siempre que ARCA no detecte una <b>discrepancia significativa</b>: un aumento de al menos el 15% sobre lo declarado, una diferencia mayor al umbral de evasión simple, o el uso de facturas apócrifas.</p>
 <h3>Inocencia Fiscal II (Ley 27.826)</h3><p>Publicada el 9/10/2026, agregó una reducción automática del 25% de ciertas multas formales para MiPyMEs, personas humanas, sucesiones indivisas y entidades sin fines de lucro que no sean grandes contribuyentes (art. 49 bis de la Ley 11.683), y amplió el régimen simplificado de Ganancias. Parte de la ley todavía requiere reglamentación.</p>
 <div class="note"><b>Lo que no hace.</b> No es una moratoria ni un blanqueo: los impuestos y los intereses se siguen debiendo, y ARCA puede fiscalizar.</div>`,
 ex:[{type:"tf",items:[["Evadir $ 50.000.000 en un año, con ardid, configura evasión simple desde la Ley 27.799",false,"El umbral es de más de $ 100.000.000."],["No depositar retenciones por más de $ 10.000.000 en un mes puede ser apropiación indebida",true],["La acción penal se extingue pagando solo el capital adeudado",false,"Hay que pagar capital, intereses y un 50% adicional."],["La Ley de Inocencia Fiscal condona los impuestos adeudados",false],["Una diferencia del 20% sobre lo declarado es una discrepancia significativa",true]]},
  {type:"num",items:[{q:"Un imputado debe $ 200.000.000 de impuesto y $ 60.000.000 de intereses. ¿Cuánto debe pagar para extinguir la acción penal?",a:390000000,u:"$",ex:"(200 + 60) × 1,5 millones."}]}]});

add(21, "Régimen simplificado de Ganancias", {
 lead:"Desde 2026 las personas humanas pueden presentar Ganancias con una declaración jurada simplificada que, si se cumple, les da presunción de exactitud.",
 src:["inoc","inoc2","gan","arca"],
 html:`<h3>Quiénes pueden usarlo</h3><p>Personas humanas y sucesiones indivisas que hayan sido residentes fiscales durante todo el período (art. 38 de la Ley 27.799), para períodos iniciados desde el 1/1/2025. La Ley 27.826 eliminó los topes de ingresos y patrimonio que tenía al principio, y permitió que también adhieran los grandes contribuyentes, aunque sin los beneficios.</p>
 <h3>Qué da</h3><ul>
 <li><b>Efecto liberatorio:</b> si el contribuyente acepta la declaración propuesta y paga en término, se considera cumplida su obligación de Ganancias del período (art. 39).</li>
 <li><b>Presunción de exactitud:</b> las declaraciones de Ganancias e IVA de los períodos no prescriptos se presumen exactas. ARCA solo puede cuestionarlas si prueba una discrepancia significativa (art. 40).</li>
 <li><b>Sin presunciones patrimoniales:</b> no se aplican las del art. 18 incisos f y g de la Ley 11.683 (incrementos patrimoniales no justificados y depósitos bancarios).</li>
 <li><b>Prescripción de 3 años</b> si presentó y pagó en término.</li></ul>
 <h3>Cómo se adhiere</h3><p>Con clave fiscal nivel 3, en el servicio de ARCA para la declaración simplificada (RG 5820/2026). La declaración se puede rectificar y pagar dentro de los 15 días hábiles de una notificación sin perder los beneficios (Ley 27.826).</p>
 <div class="note"><b>Para el contador.</b> El régimen simplifica la presentación, pero no elimina la obligación de calcular bien el impuesto. Una diferencia que supere los parámetros hace caer los beneficios y permite a ARCA fiscalizar períodos anteriores no prescriptos (art. 42).</div>`,
 ex:[{type:"tf",items:[["Una SA puede adherir al régimen simplificado de Ganancias",false,"Es para personas humanas y sucesiones indivisas residentes."],["Si el contribuyente adhiere y paga en término, ARCA no puede usar la presunción por depósitos bancarios",true],["La Ley 27.826 mantuvo los topes de ingresos y patrimonio",false,"Los eliminó."],["Una discrepancia significativa hace caer la presunción de exactitud",true]]},
  {type:"mc",items:[{q:"¿Qué tiene que probar ARCA para cuestionar la declaración de un adherido?",o:["Nada","Una discrepancia significativa","Que el contribuyente tiene cuenta bancaria","Que tiene un auto"],a:1}]}]});

add(25, "Otros encargos: revisión, certificación y compilación", {
 lead:"El contador no solo audita. La RT 37 regula otros servicios con distinto nivel de seguridad, y es clave no confundirlos al firmar.",
 src:["facpce","cpce"],
 cite:["RT 37 de la FACPCE (normas de auditoría, revisión, otros encargos de aseguramiento, certificación y servicios relacionados)."],
 html:`<div class="tw"><table><thead><tr><th>Encargo</th><th>Seguridad</th><th>Qué hace el contador</th><th>Ejemplo</th></tr></thead><tbody>
 <tr><td><b>Auditoría</b></td><td>Razonable</td><td>Obtiene evidencia suficiente para opinar sobre los estados en su conjunto.</td><td>Estados contables anuales para el banco</td></tr>
 <tr><td><b>Revisión</b></td><td>Limitada</td><td>Indagaciones y procedimientos analíticos; concluye que no conoció nada que indique errores.</td><td>Estados de períodos intermedios</td></tr>
 <tr><td><b>Certificación</b></td><td>Sobre hechos concretos</td><td>Constata que cierta información coincide con registros o documentos.</td><td>Certificación de ingresos para un trámite</td></tr>
 <tr><td><b>Compilación</b></td><td>Ninguna</td><td>Ayuda a preparar información sin verificarla.</td><td>Armar los estados con datos que entrega el cliente</td></tr></tbody></table></div>
 <h3>Por qué importa</h3><p>Quien lee un informe confía según lo que el contador dice haber hecho. Firmar una certificación con lenguaje de auditoría, o una compilación como si fuera una revisión, expone al profesional a responsabilidad civil y disciplinaria. Por eso cada encargo tiene su modelo de informe y su carta de compromiso.</p>
 <h3>Legalización</h3><p>Los informes y certificaciones que se presentan ante terceros se legalizan en el Consejo Profesional, que verifica la matrícula y la firma, no el contenido del trabajo.</p>`,

   ["Una sociedad que cotiza presenta estados trimestrales","Revisión"],

  {type:"tf",items:[["La revisión da la misma seguridad que la auditoría",false],["En una compilación el contador no expresa seguridad",true],["El Consejo Profesional, al legalizar, controla que las cifras sean correctas",false,"Controla matrícula y firma."]]}]});

add(20, "IVA: prorrateo del crédito fiscal y comprobantes", {
 lead:"Cuando una empresa vende a la vez cosas gravadas y exentas, no todo el IVA de sus compras es computable. Y el tipo de comprobante que emite o recibe define si hay crédito fiscal.",
 src:["iva","arca"],
 cite:["Ley 23.349 de IVA (t.o. 1997), arts. 12 y 13.","Ley 27.743, Título VII: Régimen de Transparencia Fiscal al Consumidor.","ARCA, RG 1415 (emisión de comprobantes), RG 5003/2021 (factura A a monotributistas), RG 5614/2024 (transparencia fiscal) y RG 4597 (Libro IVA Digital)."],
 html:`<h3>El crédito fiscal se vincula con operaciones gravadas</h3><p>El art. 12 de la ley permite computar el IVA de las compras, importaciones y servicios <b>en la medida en que se vinculen con operaciones gravadas</b>. El análisis tiene tres pasos:</p>
 <ol><li><b>Asignación directa a gravadas:</b> el crédito de lo que se usa solo para operaciones gravadas se computa entero.</li><li><b>Asignación directa a exentas:</b> el crédito de lo que se usa solo para operaciones exentas o no gravadas no se computa: es mayor costo o gasto.</li><li><b>Prorrateo (art. 13):</b> el crédito común a ambas (alquiler del local, luz, honorarios contables) que no se puede asignar se computa en la proporción de las operaciones gravadas sobre el total.</li></ol>
 <div class="formula">Coeficiente de prorrata = Operaciones netas gravadas / Total de operaciones netas (gravadas + exentas + no gravadas)</div>
 <p>El decreto reglamentario prevé aplicar el coeficiente durante el año y hacer un <b>ajuste al cierre del ejercicio</b> con las operaciones reales del período. Las exportaciones cuentan como gravadas a este efecto, porque su crédito fiscal es recuperable.</p>
 <h3>Ejemplo</h3><p>Una distribuidora vende en el mes $ 7.000.000 gravados y $ 3.000.000 exentos (libros). Su crédito fiscal de compras de mercadería gravada es $ 500.000 (asignación directa). El IVA de gastos comunes es $ 200.000.</p>
 <div class="formula">Coeficiente = 7.000.000 / 10.000.000 = 70%  →  Crédito computable = 500.000 + 200.000 × 70% = $ 640.000</div>
 <p>Los $ 60.000 no computables se suman al gasto que los originó.</p>
 <h3>Qué comprobante corresponde</h3><div class="tw"><table><thead><tr><th>Emisor</th><th>Receptor</th><th>Comprobante</th><th>¿Da crédito fiscal?</th></tr></thead><tbody>
 <tr><td>Responsable inscripto</td><td>Responsable inscripto</td><td><b>Factura A</b> (IVA discriminado)</td><td>Sí</td></tr>
 <tr><td>Responsable inscripto</td><td>Monotributista</td><td><b>Factura A</b> (desde la RG 5003/2021)</td><td>No: el monotributista no es sujeto de IVA</td></tr>
 <tr><td>Responsable inscripto</td><td>Consumidor final o exento</td><td><b>Factura B</b></td><td>No</td></tr>
 <tr><td>Responsable inscripto con inconsistencias que detecta ARCA</td><td>Responsable inscripto</td><td><b>Factura M</b> (o A con la leyenda "operación sujeta a retención")</td><td>Sí, pero el comprador debe retener</td></tr>
 <tr><td>Monotributista o exento</td><td>Cualquiera</td><td><b>Factura C</b></td><td>No</td></tr>
 <tr><td>Exportador</td><td>Cliente del exterior</td><td><b>Factura E</b></td><td>Sin IVA (exportación)</td></tr></tbody></table></div>
 <h3>Transparencia fiscal al consumidor</h3><p>La Ley 27.743 (Título VII) obliga a quienes venden a consumidores finales a informar en la factura o ticket el <b>IVA contenido</b> y los <b>otros impuestos nacionales indirectos</b> incluidos en el precio. ARCA lo reglamentó con la RG 5614/2024 y es obligatorio en general desde 2025. Ese dato es informativo: el consumidor final no computa crédito fiscal.</p>
 <h3>Libro IVA Digital</h3><p>Los responsables inscriptos informan cada mes sus comprobantes emitidos y recibidos en el <b>Libro IVA Digital</b> (RG 4597), desde el cual se genera la declaración jurada mensual. Los comprobantes electrónicos con CAE ya aparecen precargados; hay que controlar que coincidan con la contabilidad antes de presentar.</p>`,
 ex:[{type:"num",items:[
   {q:"Ventas gravadas $ 7.000.000 y exentas $ 3.000.000. ¿Coeficiente de prorrata? (en %)",a:70,u:"%",tol:0.01},
   {q:"Con ese coeficiente, crédito fiscal directo de gravadas $ 500.000 y crédito común $ 200.000. ¿Crédito computable?",a:640000,u:"$"},
   {q:"Ventas gravadas $ 4.500.000, exportaciones $ 1.500.000 y exentas $ 2.000.000. IVA de gastos comunes $ 160.000. ¿Cuánto de ese IVA es computable?",a:120000,u:"$",hint:"Las exportaciones cuentan como gravadas: (4,5 + 1,5) / 8 = 75%.",ex:"160.000 × 75% = $ 120.000."},
   {q:"Un gasto común de $ 1.000.000 + IVA $ 210.000; coeficiente 70%. ¿Cuánto IVA se suma al gasto por no ser computable?",a:63000,u:"$",ex:"210.000 × 30% = $ 63.000."}]},
  {type:"asiento",accounts:["Banco Nación c/c","Gastos generales","IVA Crédito Fiscal","Proveedores","Mercaderías"],entries:[
   {t:"Se paga por transferencia el alquiler del local, usado para ventas gravadas y exentas: $ 1.000.000 + IVA $ 210.000. Coeficiente de prorrata 70%.",e:[["Gastos generales",1063000,0],["IVA Crédito Fiscal",147000,0],["Banco Nación c/c",0,1210000]],why:"Se computa el 70% del IVA (147.000); el 30% restante (63.000) es mayor gasto."}]},
  {type:"pick",title:"¿Qué comprobante emite?",options:["Factura A","Factura B","Factura C","Factura E"],items:[
   ["Responsable inscripto que vende a otro responsable inscripto","Factura A"],
   ["Responsable inscripto que vende a un consumidor final","Factura B"],
   ["Responsable inscripto que vende a un monotributista","Factura A","Así lo dispone la RG 5003/2021."],
   ["Monotributista que presta un servicio a una empresa","Factura C"],
   ["Empresa que exporta mercadería a Chile","Factura E"],
   ["Asociación civil exenta en IVA que cobra una cuota","Factura C"]]},
  {type:"tf",items:[
   ["El IVA de una compra usada solo para operaciones exentas se puede computar como crédito fiscal.",false,"Se vincula con exentas: es mayor costo o gasto."],
   ["El monotributista que recibe una factura A puede computar el IVA discriminado.",false,"No es sujeto de IVA."],
   ["El IVA contenido que figura en un ticket de consumidor final es solo informativo.",true],
   ["Las exportaciones se tratan como gravadas para calcular la prorrata.",true,"Su crédito fiscal es recuperable (art. 43)."]]}]
});

add(20, "Convenio Multilateral: gastos, regímenes especiales y casos", {
 lead:"El coeficiente del Convenio Multilateral decide cuánto Ingresos Brutos cobra cada provincia. Calcularlo bien requiere saber qué gastos cuentan y cuándo se aplica un régimen especial.",
 src:["ca"],
 cite:["Convenio Multilateral del 18/8/1977, arts. 1 a 14.","Comisión Arbitral, Resoluciones Generales (texto ordenado vigente)."],
 html:`<h3>Cuándo se aplica</h3><p>Cuando una actividad se ejerce en dos o más jurisdicciones como un <b>proceso único y económicamente inseparable</b> (art. 1). También cuando se vende a distancia (por teléfono, correo, internet) a clientes de otra provincia, si hay gastos vinculados con esa actividad, aunque sean no computables. En ese caso los ingresos se atribuyen a la jurisdicción del <b>domicilio del adquirente</b> (art. 2).</p>
 <h3>Régimen general (arts. 2 a 5)</h3><p>El 50% de la base se distribuye por ingresos y el 50% por gastos, usando los datos del <b>último balance cerrado en el año calendario anterior</b> (art. 5). Si no hay balance, se usan los del año calendario anterior. El coeficiente se aplica a la base de cada mes del año.</p>
 <div class="formula">Coeficiente = 0,5 × ingresos de la jurisdicción / ingresos totales + 0,5 × gastos computables de la jurisdicción / gastos computables totales</div>
 <h3>Gastos computables y no computables (arts. 3 y 4)</h3><div class="tw"><table><thead><tr><th>Computables</th><th>No computables</th></tr></thead><tbody>
 <tr><td>Sueldos, jornales, cargas sociales</td><td>Costo de las mercaderías y materias primas</td></tr>
 <tr><td>Alquileres, energía, combustibles</td><td>Costo de obras o servicios contratados para revender</td></tr>
 <tr><td>Amortizaciones, reparaciones, seguros</td><td>Gastos de propaganda y publicidad</td></tr>
 <tr><td>Fletes (por partes iguales entre las jurisdicciones de origen y destino)</td><td>Tributos e intereses</td></tr>
 <tr><td>Honorarios y sueldos de directores y socios hasta el 1% de la utilidad del balance</td><td>Lo que exceda ese 1%</td></tr></tbody></table></div>
 <p>Un gasto se atribuye a la jurisdicción donde se desarrolla la actividad con la que tiene relación directa (art. 4).</p>
 <h3>Regímenes especiales</h3><div class="tw"><table><thead><tr><th>Actividad</th><th>Artículo</th><th>Distribución</th></tr></thead><tbody>
 <tr><td>Construcción</td><td>6</td><td>10% a la jurisdicción de la sede (oficina, administración) y 90% a la de la obra</td></tr>
 <tr><td>Seguros, capitalización, créditos</td><td>7</td><td>80% a la jurisdicción de la operación y 20% a la de la sede central</td></tr>
 <tr><td>Transporte de pasajeros o cargas</td><td>9</td><td>A la jurisdicción de origen del viaje, por los pasajes y fletes</td></tr>
 <tr><td>Profesiones liberales</td><td>10</td><td>80% a la jurisdicción donde se realiza la actividad y 20% a la del estudio u oficina</td></tr></tbody></table></div>
 <h3>Inicio y cese (art. 14)</h3><p>Si se <b>inicia</b> actividad en una jurisdicción nueva, esa jurisdicción grava el total de los ingresos obtenidos en ella hasta que haya un balance que permita aplicar el coeficiente. Si se <b>cesa</b> en una jurisdicción, se recalculan los coeficientes sin ella.</p>
 <h3>Cómo se declara</h3><p>Los contribuyentes del Convenio presentan sus anticipos mensuales (formulario CM03) y la declaración jurada anual (CM05) con el sistema <b>SIFERE</b> de la Comisión Arbitral. Las alícuotas son las de cada provincia; el Convenio solo reparte la base.</p>`,
 ex:[{type:"num",items:[
   {q:"Ingresos: Buenos Aires $ 6.000.000 y CABA $ 4.000.000. Gastos computables: Buenos Aires $ 1.500.000 y CABA $ 2.500.000. ¿Coeficiente de Buenos Aires? (con 4 decimales)",a:0.4875,tol:0.0001,ex:"0,5 × 0,6 + 0,5 × 0,375 = 0,4875."},
   {q:"Con ese coeficiente y una base del mes de $ 3.000.000, ¿base imponible de CABA?",a:1537500,u:"$",ex:"Coeficiente de CABA = 1 − 0,4875 = 0,5125; 3.000.000 × 0,5125."},
   {q:"Una constructora con sede en Córdoba cobra $ 20.000.000 por una obra en Mendoza. ¿Base atribuible a Mendoza?",a:18000000,u:"$"},
   {q:"Una contadora con estudio en CABA devenga honorarios por $ 5.000.000 por un trabajo hecho en Santa Fe. ¿Base atribuible a CABA?",a:1000000,u:"$",ex:"Art. 10: 80% a Santa Fe y 20% a la jurisdicción del estudio."},
   {q:"Gastos totales del balance: sueldos $ 4.000.000, alquileres $ 1.000.000, costo de mercaderías $ 9.000.000, publicidad $ 800.000, intereses $ 500.000. ¿Total de gastos computables?",a:5000000,u:"$",hint:"Solo sueldos y alquileres."}]},
  {type:"pick",title:"¿Gasto computable o no computable?",options:["Computable","No computable"],items:[
   ["Sueldos del personal de la sucursal","Computable"],["Costo de la mercadería vendida","No computable"],["Campaña publicitaria en redes","No computable"],
   ["Amortización del rodado","Computable"],["Intereses de un préstamo bancario","No computable"],["Tasa municipal de seguridad e higiene","No computable","Es un tributo."],["Energía eléctrica del depósito","Computable"]]},
  {type:"pick",title:"¿Qué régimen corresponde?",options:["Régimen general","Construcción (art. 6)","Transporte (art. 9)","Profesiones liberales (art. 10)"],items:[
   ["Un estudio jurídico de Rosario que atiende un juicio en Córdoba","Profesiones liberales (art. 10)"],
   ["Una empresa de micros de larga distancia","Transporte (art. 9)"],
   ["Una fábrica de muebles con planta en Buenos Aires que vende en todo el país","Régimen general"],
   ["Una empresa que pavimenta rutas en tres provincias","Construcción (art. 6)"]]}]
});

add(21, "Caso completo: declaración jurada de una persona humana", {
 lead:"Un caso de punta a punta: una profesional independiente que además alquila un departamento. Los importes de deducciones y escala son ilustrativos; para un caso real se usan las tablas que publica ARCA para cada período.",
 src:["gan","gandr","arca"],
 cite:["Ley de Impuesto a las Ganancias (t.o. Decreto 824/2019), arts. 30, 83, 85, 86, 94 y concordantes.","Ley 27.743 (2024), Título V: modificaciones al impuesto.","ARCA: tablas de deducciones personales y escala del art. 94 vigentes para cada período."],
 html:`<h3>Datos del caso (año calendario)</h3><ul><li><b>Primera categoría:</b> cobra alquileres por $ 6.000.000. El edificio del departamento vale $ 50.000.000 (sin el terreno).</li><li><b>Cuarta categoría:</b> honorarios por $ 18.000.000 y gastos del estudio deducibles por $ 3.000.000.</li><li><b>Pagó:</b> aportes de autónomos $ 1.200.000 y medicina prepaga $ 1.500.000.</li><li><b>Familia:</b> un hijo menor a cargo.</li><li><b>Pagos a cuenta:</b> anticipos $ 600.000 y retenciones sufridas $ 150.000.</li></ul>
 <h3>Paso 1: ganancia neta de cada categoría</h3><div class="tw"><table><thead><tr><th>Concepto</th><th>Primera</th><th>Cuarta</th></tr></thead><tbody>
 <tr><td>Ganancia bruta</td><td>6.000.000</td><td>18.000.000</td></tr>
 <tr><td>− Amortización del edificio (2% anual)</td><td>1.000.000</td><td></td></tr>
 <tr><td>− Gastos de mantenimiento: opción presunta del 5% de la renta bruta</td><td>300.000</td><td></td></tr>
 <tr><td>− Gastos deducibles de la actividad</td><td></td><td>3.000.000</td></tr>
 <tr><td><b>= Ganancia neta</b></td><td><b>4.700.000</b></td><td><b>15.000.000</b></td></tr></tbody></table></div>
 <p>Para los inmuebles alquilados la ley permite deducir los gastos reales de mantenimiento o un importe presunto del 5% de la renta bruta. La amortización se calcula sobre el valor del edificio, nunca sobre el terreno.</p>
 <h3>Paso 2: deducciones generales</h3><p>Ganancia neta total: 4.700.000 + 15.000.000 = <b>19.700.000</b>. Los aportes jubilatorios se deducen enteros: 19.700.000 − 1.200.000 = 18.500.000.</p>
 <p>La prepaga tiene un tope del <b>5% de la ganancia neta</b> calculada antes de deducirla (junto con donaciones, honorarios médicos y deducciones personales). Tope: 5% × 18.500.000 = 925.000. Pagó 1.500.000, así que deduce <b>925.000</b>.</p>
 <div class="formula">Ganancia neta después de deducciones generales = 18.500.000 − 925.000 = 17.575.000</div>
 <h3>Paso 3: deducciones personales (art. 30, valores ilustrativos)</h3><div class="tw"><table><thead><tr><th>Deducción</th><th>Importe</th></tr></thead><tbody>
 <tr><td>Ganancia no imponible</td><td>4.000.000</td></tr><tr><td>Deducción especial (autónomo con aportes al día)</td><td>4.000.000</td></tr><tr><td>Hijo menor a cargo</td><td>2.000.000</td></tr><tr><td><b>Total</b></td><td><b>10.000.000</b></td></tr></tbody></table></div>
 <div class="formula">Ganancia neta sujeta a impuesto = 17.575.000 − 10.000.000 = 7.575.000</div>
 <h3>Paso 4: escala progresiva (ilustrativa)</h3><div class="tw"><table><thead><tr><th>Tramo</th><th>Alícuota</th><th>Impuesto del tramo</th></tr></thead><tbody>
 <tr><td>0 a 2.000.000</td><td>5%</td><td>100.000</td></tr><tr><td>2.000.000 a 6.000.000</td><td>15%</td><td>600.000</td></tr><tr><td>Más de 6.000.000 (1.575.000)</td><td>27%</td><td>425.250</td></tr><tr><td colspan="2"><b>Impuesto determinado</b></td><td><b>1.125.250</b></td></tr></tbody></table></div>
 <h3>Paso 5: saldo de la declaración jurada</h3><div class="formula">1.125.250 − 600.000 (anticipos) − 150.000 (retenciones) = $ 375.250 a pagar</div>
 <p>Además de Ganancias, la misma persona presenta la declaración de <b>Bienes Personales</b> por sus bienes al 31 de diciembre, y las dos se cruzan: el aumento de patrimonio del año tiene que poder explicarse con las ganancias declaradas (justificación patrimonial).</p>`,
 ex:[{type:"num",items:[

add(21, "Impuesto diferido: del impuesto a pagar al gasto contable", {
 lead:"El impuesto que se paga y el gasto por impuesto del estado de resultados no coinciden. La diferencia son las diferencias temporarias, que se registran como impuesto diferido.",
 src:["rt54","rt54g","gan"],
 cite:["RT 54 (t.o. RT 59), sección de impuesto a las ganancias (párr. 573 y 594).","CPCECABA, Guía de preguntas y respuestas sobre la RT 54."],
 html:`<h3>Dos tipos de diferencias</h3><div class="tw"><table><thead><tr><th>Tipo</th><th>Qué son</th><th>Ejemplos</th><th>¿Genera diferido?</th></tr></thead><tbody>
 <tr><td><b>Permanentes</b></td><td>Partidas que nunca serán gravadas o deducibles</td><td>Multas fiscales, dividendos de sociedades argentinas</td><td>No</td></tr>
 <tr><td><b>Temporarias</b></td><td>Partidas que se reconocen en un ejercicio para la contabilidad y en otro para el fisco</td><td>Previsiones no deducibles hasta su uso, amortizaciones distintas</td><td>Sí</td></tr></tbody></table></div>
 <h3>Activo o pasivo diferido</h3><ul><li>Si hoy se paga <b>más</b> impuesto y se deducirá en el futuro (previsión para juicios no deducible), hay un <b>activo por impuesto diferido</b>.</li><li>Si hoy se paga <b>menos</b> y se pagará en el futuro (amortización impositiva mayor que la contable), hay un <b>pasivo por impuesto diferido</b>.</li></ul>
 <div class="formula">Impuesto diferido = Diferencia temporaria × Alícuota que se espera aplicar al revertirse</div>
 <h3>Caso: Andina SA (alícuota ilustrativa 30%)</h3><p>Se retoma la conciliación de la lección "Ganancias de sociedades": impuesto corriente de $ 2.970.000.</p>
 <div class="tw"><table><thead><tr><th>Diferencia temporaria</th><th>Importe</th><th>Diferido al 30%</th></tr></thead><tbody>
 <tr><td>Previsión para juicios no deducible</td><td>300.000</td><td>Activo 90.000</td></tr>
 <tr><td>Amortización impositiva mayor que la contable</td><td>100.000</td><td>Pasivo 30.000</td></tr>
 <tr><td colspan="2"><b>Neto</b></td><td><b>Activo 60.000</b></td></tr></tbody></table></div>
 <div class="formula">Gasto por impuesto del ejercicio = Corriente 2.970.000 − Diferido 60.000 = $ 2.910.000</div>
 <p>Control: resultado contable 10.000.000 + multas 200.000 − dividendos 500.000 = 9.700.000; 9.700.000 × 30% = 2.910.000. Con el impuesto diferido, el gasto refleja la alícuota sobre el resultado contable corregido solo por las diferencias permanentes.</p>
 <h3>Qué dice la RT 54</h3><p>La regla es aplicar el <b>método del impuesto diferido</b>. El activo por impuesto diferido se presenta separado y el gasto total se muestra en la línea de impuesto a las ganancias del estado de resultados. La norma prevé excepciones según el tamaño: por ejemplo, los entes medianos pueden discontinuar el método si justifican un <b>costo o esfuerzo desproporcionado</b> (párr. 573), y deben informarlo en notas. Antes de aplicar una opción, verificá en el texto qué permite la categoría del ente.</p>`,
 ex:[{type:"pick",title:"¿Diferencia permanente o temporaria?",options:["Permanente","Temporaria"],items:[
   ["Multa pagada a ARCA","Permanente"],["Previsión para despidos no deducible hasta el pago","Temporaria"],["Dividendos cobrados de una SA argentina","Permanente"],["Amortización acelerada impositiva","Temporaria"],["Previsión para incobrables que el fisco admite recién al cumplirse los índices de incobrabilidad","Temporaria"]]},
  {type:"num",items:[
   {q:"Previsión para juicios no deducible $ 500.000; alícuota 30%. ¿Activo por impuesto diferido?",a:150000,u:"$"},
   {q:"Impuesto corriente $ 4.000.000; aumento neto del activo diferido $ 150.000. ¿Gasto por impuesto del ejercicio?",a:3850000,u:"$"},
   {q:"Amortización impositiva $ 1.400.000 y contable $ 1.000.000; alícuota 35%. ¿Pasivo por impuesto diferido generado?",a:140000,u:"$"}]},
  {type:"asiento",accounts:["Impuesto a las ganancias (resultado)","Activo por impuesto diferido","Pasivo por impuesto diferido","Impuesto a las ganancias a pagar","Anticipos de impuesto a las ganancias"],entries:[
   {t:"Cierre · Andina SA registra el efecto del impuesto diferido: activo por la previsión $ 90.000 y pasivo por amortizaciones $ 30.000.",e:[["Activo por impuesto diferido",90000,0],["Pasivo por impuesto diferido",0,30000],["Impuesto a las ganancias (resultado)",0,60000]],why:"El diferido neto (activo 60.000) reduce el gasto del ejercicio."}]}]

add(22, "Caso completo: liquidación final por despido sin causa", {
 lead:"Una liquidación final real junta todos los rubros: días trabajados, indemnizaciones, preaviso, integración, SAC y vacaciones. Este caso los calcula uno por uno, con las reglas de la LCT según la Ley 27.802.",
 src:["lct","modlab","sipa"],
 cite:["Ley 20.744 de Contrato de Trabajo, arts. 156, 231, 232, 233 y 245 (texto según Ley 27.802).","Ley 23.041 (SAC).","Ley 24.241, art. 7 (conceptos que no son remuneración).","Ley de Impuesto a las Ganancias, art. 26 inc. i) (exención de indemnizaciones)."],
 html:`<h3>Datos</h3><ul><li>Ingreso: 1/3/2019. Despido sin causa notificado el <b>10/9/2026</b>, sin preaviso.</li><li>Mejor remuneración mensual, normal y habitual del último año: <b>$ 1.500.000</b> (sueldo fijo, sin variables). Se supone que no opera el tope del convenio.</li><li>No gozó vacaciones de 2026.</li></ul>
 <h3>Rubros y cálculo</h3><div class="tw"><table><thead><tr><th>Rubro</th><th>Cálculo</th><th>Importe</th></tr></thead><tbody>
 <tr><td>Días trabajados de septiembre</td><td>1.500.000 / 30 × 10</td><td>500.000,00</td></tr>
 <tr><td>SAC proporcional (2.º semestre)</td><td>1.500.000 / 2 × 72 / 184 días</td><td>293.478,26</td></tr>
 <tr><td>Indemnización por antigüedad (art. 245)</td><td>7 años y 6 meses → 8 períodos × 1.500.000</td><td>12.000.000,00</td></tr>
 <tr><td>Indemnización sustitutiva de preaviso (art. 232)</td><td>Más de 5 años: 2 meses</td><td>3.000.000,00</td></tr>
 <tr><td>SAC sobre preaviso</td><td>3.000.000 / 12</td><td>250.000,00</td></tr>
 <tr><td>Integración del mes de despido (art. 233)</td><td>1.500.000 / 30 × 20 días restantes</td><td>1.000.000,00</td></tr>
 <tr><td>SAC sobre integración</td><td>1.000.000 / 12</td><td>83.333,33</td></tr>
 <tr><td>Vacaciones no gozadas (art. 156)</td><td>21 días × 253 / 365 = 14,56 días × (1.500.000 / 25)</td><td>873.600,00</td></tr>
 <tr><td>SAC sobre vacaciones no gozadas</td><td>873.600 / 12</td><td>72.800,00</td></tr></tbody></table></div>
 <h3>Cómo se llega a cada número</h3><ul>
 <li><b>Antigüedad:</b> del 1/3/2019 al 10/9/2026 hay 7 años, 6 meses y 10 días. La fracción mayor de 3 meses cuenta como un año más: 8 períodos.</li>
 <li><b>Base del art. 245:</b> con la Ley 27.802 no incluye SAC, vacaciones ni premios no mensuales. Si hubiera tope de convenio, la base no podría quedar por debajo del 67% de la mejor remuneración.</li>
 <li><b>SAC proporcional:</b> del 1/7 al 10/9 son 72 días (31 + 31 + 10) sobre 184 del semestre.</li>
 <li><b>Vacaciones:</b> la antigüedad al 31/12/2026 sería de 7 años y 10 meses, así que corresponden 21 días. Como el contrato termina en el año, se pagan en proporción a los días trabajados (253 sobre 365), con el divisor 25.</li>
 <li><b>SAC sobre preaviso, integración y vacaciones no gozadas:</b> es el criterio mayoritario de la jurisprudencia, porque esos rubros reemplazan salarios que se habrían devengado.</li></ul>
 <h3>Aportes y Ganancias</h3><p>Solo los rubros <b>remunerativos</b> (días trabajados y SAC proporcional) llevan aportes y contribuciones. Las indemnizaciones por antigüedad, preaviso, integración y vacaciones no gozadas no son remuneración a esos efectos (Ley 24.241, art. 7), y la indemnización por antigüedad está <b>exenta de Ganancias</b>.</p>
 <div class="formula">Remunerativo: 500.000 + 293.478,26 = 793.478,26  →  Aportes 17% = 134.891,30</div>
 <div class="formula">Total de la liquidación = 18.073.211,59 bruto − 134.891,30 de aportes = 17.938.320,29 neto</div>
 <h3>Plazos</h3><p>La liquidación final se paga dentro de los 4 días hábiles de la extinción (art. 128, art. 255 bis). Los certificados del art. 80 se entregan dentro de los 45 días hábiles. El FAL, si el empleador está adherido, financia el pago, pero la deuda sigue siendo del empleador.</p>`,
 ex:[{type:"num",items:[
   {q:"Antigüedad de 4 años y 2 meses, mejor remuneración $ 2.000.000. ¿Indemnización por antigüedad?",a:8000000,u:"$",hint:"2 meses no supera los 3 meses: cuenta 4."},
   {q:"Mismo caso, despido sin preaviso. ¿Indemnización sustitutiva de preaviso?",a:2000000,u:"$",hint:"Hasta 5 años: 1 mes."},
   {q:"Despido notificado el 20/6 (mes de 30 días), sueldo $ 2.000.000. ¿Integración del mes de despido?",a:666666.67,u:"$",tol:1,ex:"2.000.000 / 30 × 10 días."},
   {q:"Mejor remuneración del semestre $ 2.000.000; trabajó 90 de los 181 días del primer semestre. ¿SAC proporcional?",a:497237.57,u:"$",tol:1},
   {q:"Le correspondían 14 días de vacaciones por año y trabajó 146 de 365 días. Sueldo $ 2.000.000. ¿Vacaciones no gozadas? (días con dos decimales)",a:448000,u:"$",tol:1,ex:"14 × 146 / 365 = 5,60 días × 80.000 = $ 448.000."},
   {q:"En el caso de la lección, ¿cuál es el total de rubros remunerativos?",a:793478.26,u:"$",tol:0.02}]},
  {type:"pick",title:"¿Lleva aportes?",options:["Sí","No"],items:[
   ["Días trabajados del mes del despido","Sí"],["SAC proporcional","Sí"],["Indemnización por antigüedad","No"],["Indemnización sustitutiva de preaviso","No"],["Vacaciones no gozadas","No"],["Integración del mes de despido","No"]]},
  {type:"tf",items:[
   ["La indemnización por antigüedad está exenta de Ganancias.",true,"Art. 26 inc. i) de la ley del impuesto."],
   ["Una antigüedad de 6 años y 2 meses da 7 períodos para el art. 245.",false,"2 meses no es fracción mayor de 3 meses: son 6."],
   ["Si el despido se notifica el último día del mes, no hay integración.",true],

add(22, "Bases de aportes, Libro de Sueldos Digital y retención de Ganancias", {
 lead:"Liquidar bien no termina en el recibo: hay que respetar las bases de aportes, informar todo en el Libro de Sueldos Digital y el F.931, y retener Ganancias cuando corresponde.",
 src:["sipa","arca","gan"],
 cite:["Ley 24.241, art. 9 (bases imponibles mínima y máxima).","ARCA: Libro de Sueldos Digital y Declaración en línea (F.931).","ARCA: régimen de retención de Ganancias sobre rentas del trabajo personal y SIRADIG (F.572 web)."],
 html:`<h3>Bases imponibles mínima y máxima</h3><p>Los <b>aportes</b> del trabajador se calculan sobre la remuneración, pero con un <b>tope máximo</b>: lo que exceda la base máxima no lleva aportes personales. También hay una <b>base mínima</b>. Las <b>contribuciones</b> del empleador, en cambio, se calculan sobre toda la remuneración, sin tope. Las bases se actualizan con la movilidad jubilatoria y ARCA y ANSES publican los valores vigentes.</p>
 <div class="formula">Aportes = 17% × menor entre (remuneración, base máxima)  ·  Contribuciones = alícuota × remuneración total</div>
 <h3>Libro de Sueldos Digital</h3><p>Cada mes el empleador carga en el sistema de ARCA los conceptos liquidados a cada empleado, asociados a los conceptos de la seguridad social. Desde ahí se genera la declaración jurada F.931 de aportes y contribuciones. Con la Ley 27.802, el registro digital de ARCA es el registro único de la relación laboral y reemplaza a los libros en papel.</p>
 <h3>Asignaciones familiares</h3><p>Las paga en general <b>ANSES</b> en forma directa (Sistema Único de Asignaciones Familiares), no el empleador. No son remuneración y no llevan aportes. El empleador debe informar bien los datos del trabajador para que ANSES liquide.</p>
 <h3>Retención de Ganancias al empleado</h3><p>Con la Ley 27.743 (2024) los sueldos volvieron a estar alcanzados por Ganancias con la escala del art. 94 y las deducciones del art. 30. El empleador es <b>agente de retención</b>: cada mes acumula la ganancia del año, resta las deducciones que el empleado informó en <b>SIRADIG</b> (F.572 web) y retiene la diferencia entre el impuesto acumulado y lo ya retenido.</p>
 <div class="formula">Retención del mes = Impuesto acumulado al mes − Retenciones de meses anteriores</div>
 <p>En marzo del año siguiente el empleador hace la liquidación anual y entrega al empleado el formulario 1357. Si el empleado tiene otros ingresos o supera ciertos montos, además presenta su propia declaración jurada.</p>`,
 ex:[{type:"num",items:[
   {q:"Sueldo de $ 8.000.000 y base máxima ilustrativa de $ 5.000.000. ¿Aportes personales (17%)?",a:850000,u:"$"},
   {q:"Mismo sueldo, contribuciones del 24% sin tope. ¿Contribuciones del empleador?",a:1920000,u:"$"},
   {q:"Impuesto acumulado a octubre $ 1.300.000; retenciones de enero a septiembre $ 1.150.000. ¿Retención de octubre?",a:150000,u:"$"}]},
  {type:"tf",items:[
   ["Las contribuciones patronales tienen el mismo tope que los aportes.",false,"El tope de la base máxima rige para los aportes personales."],
   ["Las asignaciones familiares las paga en general ANSES directamente.",true],
   ["El empleado informa sus deducciones de Ganancias en SIRADIG.",true],
   ["El F.931 se genera a partir de lo cargado en el Libro de Sueldos Digital.",true]]}]
});

 <h3>3. Evolución del patrimonio neto</h3><div class="tw"><table><thead><tr><th></th><th>Capital</th><th>Reserva legal</th><th>RNA</th><th>Total</th></tr></thead><tbody>
 <tr><td>Saldo al inicio</td><td>5.000.000</td><td>300.000</td><td>900.000</td><td>6.200.000</td></tr><tr><td>Resultado del ejercicio</td><td></td><td></td><td>1.500.000</td><td>1.500.000</td></tr>
 <tr><td><b>Saldo al cierre</b></td><td><b>5.000.000</b></td><td><b>300.000</b></td><td><b>2.400.000</b></td><td><b>7.700.000</b></td></tr></tbody></table></div>
 <p>Si la asamblea aprueba después del cierre una reserva legal del 5% del resultado (art. 70 LGS: hasta alcanzar el 20% del capital), eso se registra en el ejercicio siguiente: es un hecho posterior que no modifica estas cifras.</p>
 <h3>4. Flujo de efectivo de las operaciones (método indirecto)</h3><p>Datos adicionales respecto del cierre anterior: los deudores por ventas (netos) aumentaron $ 400.000, las mercaderías disminuyeron $ 200.000, los proveedores aumentaron $ 300.000 y el impuesto a pagar aumentó $ 100.000. Los intereses se pagaron en el ejercicio.</p>

add(17, "Estado de costos: de la materia prima al costo de ventas", {
 lead:"El estado de costos resume en un cuadro cómo los consumos de una fábrica se convierten en productos terminados y después en costo de ventas. Es la pieza que une la contabilidad de costos con el estado de resultados.",
 src:["rt54"],
 cite:["Giménez, C. M. y colaboradores, Tratado de contabilidad de costos, Macchi.","Instituto Argentino de Profesores Universitarios de Costos (IAPUCo), material de cátedra."],
 html:`<h3>Datos de Metalúrgica Sur SA (mes de mayo)</h3><div class="tw"><table><thead><tr><th>Concepto</th><th>Inicial</th><th>Final</th></tr></thead><tbody>
 <tr><td>Materia prima</td><td>400.000</td><td>500.000</td></tr><tr><td>Producción en proceso</td><td>300.000</td><td>800.000</td></tr><tr><td>Productos terminados</td><td>1.000.000</td><td>1.500.000</td></tr></tbody></table></div>
 <p>Compras de materia prima: $ 2.600.000. Mano de obra directa: $ 1.800.000. Carga fabril aplicada con una tasa predeterminada: $ 1.200.000 (la real fue $ 1.300.000).</p>
 <h3>El estado de costos</h3><div class="tw"><table><tbody>
 <tr><td>Inventario inicial de materia prima</td><td>400.000</td></tr><tr><td>+ Compras</td><td>2.600.000</td></tr><tr><td>− Inventario final de materia prima</td><td>(500.000)</td></tr><tr><td><b>= Materia prima consumida</b></td><td><b>2.500.000</b></td></tr>
 <tr><td>+ Mano de obra directa</td><td>1.800.000</td></tr><tr><td>+ Carga fabril aplicada</td><td>1.200.000</td></tr><tr><td><b>= Costo de producción del período</b></td><td><b>5.500.000</b></td></tr>
 <tr><td>+ Producción en proceso inicial</td><td>300.000</td></tr><tr><td>− Producción en proceso final</td><td>(800.000)</td></tr><tr><td><b>= Costo de la producción terminada</b></td><td><b>5.000.000</b></td></tr>
 <tr><td>+ Productos terminados iniciales</td><td>1.000.000</td></tr><tr><td>− Productos terminados finales</td><td>(1.500.000)</td></tr><tr><td><b>= Costo de ventas (antes de ajustar la carga fabril)</b></td><td><b>4.500.000</b></td></tr></tbody></table></div>
 <h3>Costo primo y costo de conversión</h3><div class="formula">Costo primo = MP consumida + MOD = 4.300.000  ·  Costo de conversión = MOD + carga fabril = 3.000.000</div>
 <h3>Carga fabril sub o sobreaplicada</h3><p>La carga fabril se aplica durante el mes con una tasa predeterminada, porque la real se conoce recién al cierre. Aquí la real ($ 1.300.000) superó a la aplicada ($ 1.200.000): hay una <b>subaplicación de $ 100.000</b>. Si no es significativa, se imputa al costo de ventas, que queda en $ 4.600.000. Si lo es, se reparte entre producción en proceso, productos terminados y costo de ventas. La parte que corresponde a capacidad ociosa no es costo del producto: va a resultados del período.</p>
 <h3>Registración del flujo de costos</h3><p>Producción en proceso recibe la MP consumida, la MOD y la carga aplicada; de ahí pasa a Productos terminados y, con la venta, a Costo de ventas.</p>`,
 ex:[{type:"num",items:[
   {q:"MP inicial $ 200.000, compras $ 1.500.000, MP final $ 300.000. ¿MP consumida?",a:1400000,u:"$"},
   {q:"Con MOD $ 900.000 y carga aplicada $ 700.000, ¿costo de producción del período?",a:3000000,u:"$"},
   {q:"PP inicial $ 100.000 y PP final $ 400.000. ¿Costo de la producción terminada?",a:2700000,u:"$"},
   {q:"PT inicial $ 500.000 y PT final $ 200.000. ¿Costo de ventas?",a:3000000,u:"$"},
   {q:"En ese caso, ¿costo de conversión?",a:1600000,u:"$"},
   {q:"Carga real $ 650.000 y aplicada $ 700.000. ¿Sobreaplicación? (sin signo)",a:50000,u:"$"}]},
  {type:"order",title:"Ordená el estado de costos",items:["Materia prima consumida","Costo de producción del período","Costo de la producción terminada","Costo de ventas"]},
  {type:"asiento",accounts:["Materia prima","Producción en proceso","Productos terminados","Costo de ventas","Sueldos y jornales de fábrica","Carga fabril aplicada","Carga fabril real"],entries:[
   {t:"Mayo · Se transfiere a terminados el costo de la producción terminada: $ 5.000.000.",e:[["Productos terminados",5000000,0],["Producción en proceso",0,5000000]]},
   {t:"Mayo · Se registra el costo de las unidades vendidas: $ 4.500.000.",e:[["Costo de ventas",4500000,0],["Productos terminados",0,4500000]]},
   {t:"31/05 · Se cierra la carga fabril: aplicada $ 1.200.000, real $ 1.300.000; la subaplicación no es significativa.",e:[["Carga fabril aplicada",1200000,0],["Costo de ventas",100000,0],["Carga fabril real",0,1300000]]}]}]
});

["Riesgo de auditoría","Riesgo de emitir una opinión inadecuada cuando los estados contienen errores significativos.",25],
["ROE","Rentabilidad del patrimonio neto: resultado del ejercicio sobre patrimonio neto.",24],
["RT 37","Resolución Técnica de la FACPCE con las normas de auditoría, revisión, aseguramiento, certificación y servicios relacionados.",25],
["RT 54","Norma Unificada Argentina de Contabilidad de la FACPCE. Rige para ejercicios iniciados desde el 1/1/2025, con el texto ordenado por la RT 59.",14],
["SAS","Sociedad por acciones simplificada (Ley 27.349).",16],
["SIFERE","Sistema de la Comisión Arbitral para presentar las declaraciones del Convenio Multilateral (CM03 mensual y CM05 anual).",20],
["Significatividad","Importe o naturaleza de un error a partir del cual puede influir en las decisiones de los usuarios.",25],
["Síndico concursal","Contador público designado por el juez en un concurso o quiebra para verificar créditos, informar y, en la quiebra, liquidar.",26],
["Sociedad anónima","Tipo social con capital representado por acciones y responsabilidad limitada a la integración de lo suscripto (LGS, art. 163).",16],
["SRL","Sociedad de responsabilidad limitada: capital en cuotas, hasta 50 socios (LGS, arts. 146 y siguientes).",16],
["Tasa efectiva","Tasa que efectivamente se gana o paga en un período, considerando la capitalización.",11],
["Tasa real","Tasa de interés descontada la inflación: (1 + nominal) / (1 + inflación) − 1.",11],
["TIR","Tasa interna de retorno: la tasa que hace cero el VAN de un proyecto.",11],

["Valor recuperable","Mayor entre el valor neto de realización y el valor de uso. Es el límite de la medición de un activo.",13],

["Verificación de créditos","Etapa del concurso en la que los acreedores presentan sus créditos ante el síndico.",26],
