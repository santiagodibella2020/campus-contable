lessons:[
 {lead:"El Impuesto a las Ganancias grava la renta. Lo regula la Ley 20.628 (texto ordenado por el Decreto 824/2019) y su reglamentación.",
  html:`<h3>Qué es ganancia (art. 2)</h3><ul><li><b>Personas humanas y sucesiones indivisas:</b> los rendimientos, rentas o enriquecimientos que sean <b>periódicos</b> e impliquen la <b>permanencia de la fuente</b> que los produce (teoría de la fuente), más los resultados que la ley incluye expresamente (por ejemplo, la venta de acciones, monedas digitales o inmuebles).</li><li><b>Sociedades y empresas:</b> todos los beneficios, sean o no periódicos (teoría del balance).</li></ul>
  <h3>Criterio de vinculación</h3><ul><li><b>Residentes</b> en el país: tributan por sus ganancias de fuente argentina y extranjera (renta mundial). Pueden computar como pago a cuenta el impuesto análogo pagado en el exterior, con límites.</li><li><b>No residentes:</b> solo por su ganancia de fuente argentina, normalmente mediante retención.</li></ul>
  <h3>Sujetos</h3><ul><li>Personas humanas y sucesiones indivisas.</li><li>Sociedades de capital (SA, SRL, SAS, sociedades en comandita), fideicomisos y fondos comunes de inversión no cerrados en ciertos casos, establecimientos permanentes de empresas extranjeras.</li></ul>
  <h3>Período fiscal</h3><p>Para personas humanas, el año calendario. Para sociedades, su ejercicio comercial. La declaración jurada anual de personas humanas vence a mitad del año siguiente.</p>
  <h3>Exenciones (art. 26)</h3><p>Entre otras: las ganancias de entidades sin fines de lucro que cumplan requisitos, ciertos intereses de depósitos en entidades financieras para personas humanas residentes, y otras que la ley enumera con condiciones.</p>`,
  ex:[{type:"tf",items:[["Para una sociedad anónima, la venta ocasional de un terreno genera ganancia gravada","Verdadero","Las sociedades aplican la teoría del balance."],["Un residente argentino solo tributa por ganancias de fuente argentina","Falso","Tributa por su renta mundial."],["El período fiscal de una persona humana es el año calendario","Verdadero"],["Un no residente tributa sobre sus ganancias de fuente argentina, generalmente por retención","Verdadero"]]}]},
 {lead:"Las ganancias de las personas humanas se clasifican en cuatro categorías según su origen. Cada una tiene sus propias reglas.",
  html:`<div class="tw"><table><thead><tr><th>Categoría</th><th>Origen</th><th>Ejemplos</th><th>Imputación (regla general)</th></tr></thead><tbody>
  <tr><td><b>Primera</b></td><td>Renta del suelo</td><td>Alquileres de inmuebles</td><td>Devengado</td></tr>
  <tr><td><b>Segunda</b></td><td>Rentas del capital</td><td>Intereses, dividendos, regalías, venta de acciones y títulos</td><td>Percibido</td></tr>
  <tr><td><b>Tercera</b></td><td>Beneficios de empresas y ciertos auxiliares del comercio</td><td>Sociedades, empresas unipersonales, comisionistas</td><td>Devengado</td></tr>
  <tr><td><b>Cuarta</b></td><td>Trabajo personal</td><td>Sueldos, jubilaciones, honorarios de profesionales, directores</td><td>Percibido</td></tr></tbody></table></div>
  <h3>Impuesto cedular</h3><p>Desde 2018, algunas rentas de capital y la venta de inmuebles adquiridos desde ese año tributan por separado, con alícuotas propias (por ejemplo, 15% para la venta de inmuebles), en lo que se llama <b>impuesto cedular</b>.</p>
  <h3>Dividendos</h3><p>Cuando una sociedad argentina distribuye dividendos a personas humanas residentes, retiene un <b>7%</b> como pago único y definitivo.</p>
  <h3>Gastos deducibles</h3><p>En general, se deducen los gastos necesarios para obtener, mantener y conservar la ganancia gravada (art. 83). La ley detalla deducciones admitidas (art. 85 y siguientes) y prohibidas (art. 92), como los gastos personales y de sustento del contribuyente o las multas.</p>`,
  ex:[{type:"pick",title:"¿A qué categoría pertenece?",options:["Primera","Segunda","Tercera","Cuarta"],items:[["Un médico cobra honorarios por consultas","Cuarta"],["Una persona alquila un departamento de su propiedad","Primera"],["Dividendos de acciones de una SA","Segunda"],["Una empresa unipersonal de venta de repuestos","Tercera"],["Un empleado en relación de dependencia cobra su sueldo","Cuarta"],["Intereses de un préstamo hecho a un tercero","Segunda"]]},
   {type:"num",items:[{q:"Una SA distribuye $ 1.000.000 de dividendos a un accionista persona humana residente. ¿Cuánto le retiene?",a:70000,u:"$"}]}]},
 {lead:"Para una persona humana, a la ganancia neta se le restan deducciones personales antes de aplicar una escala progresiva.",
  html:`<h3>Esquema de liquidación</h3><ol><li>Ganancia bruta por categoría.</li><li>− Gastos deducibles de cada categoría.</li><li>= Ganancia neta.</li><li>− Deducciones generales (art. 85): aportes jubilatorios y de obra social, cuota de medicina prepaga (con tope), honorarios médicos (con tope), donaciones (con tope), intereses de créditos hipotecarios para la vivienda (con tope), servicio doméstico, alquiler de la vivienda (con tope), seguros de vida y de retiro, entre otros.</li><li>− Deducciones personales (art. 30): ganancia no imponible, cargas de familia (cónyuge, hijos), deducción especial para trabajadores en relación de dependencia y autónomos.</li><li>= Ganancia neta sujeta a impuesto.</li><li>Se aplica la <b>escala progresiva</b> del art. 94, con alícuotas marginales que van del <b>5% al 35%</b>.</li><li>− Retenciones y anticipos.</li><li>= Saldo a pagar o a favor.</li></ol>
  <p>Los montos de las deducciones y de los tramos de la escala se actualizan por inflación. Para liquidar un caso real, consultá las tablas vigentes publicadas por ARCA.</p>
  <h3>Empleados en relación de dependencia</h3><p>El empleador actúa como <b>agente de retención</b>: calcula el impuesto mes a mes sobre el sueldo y lo retiene. El empleado informa sus deducciones (alquiler, prepaga, cargas de familia) por el sistema <b>SIRADIG</b>.</p>
  <h3>Alícuota marginal y efectiva</h3><p>La <b>marginal</b> es la que se aplica al último peso ganado. La <b>efectiva</b> es el impuesto total dividido por la ganancia. Con una escala progresiva, la efectiva siempre es menor que la marginal más alta alcanzada.</p>`,
  ex:[{type:"num",items:[{q:"Escala ilustrativa: 5% sobre los primeros $ 1.000.000 y 15% sobre el excedente. Ganancia neta sujeta a impuesto $ 3.000.000. ¿Impuesto?",a:350000,u:"$",hint:"50.000 + 15% de 2.000.000"},{q:"¿Alícuota efectiva, en %? (dos decimales)",a:11.67,u:"%",tol:0.02},{q:"¿Alícuota marginal, en %?",a:15,u:"%",tol:0}]},
   {type:"pick",title:"¿Deducción general, personal o no deducible?",options:["General","Personal","No deducible"],items:[["Cuota de la medicina prepaga","General"],["Ganancia no imponible","Personal"],["Hijo menor a cargo","Personal"],["Gastos del supermercado de la familia","No deducible"],["Aportes jubilatorios","General"],["Multa de tránsito","No deducible"]]}]},
 {lead:"Las sociedades pagan Ganancias sobre su resultado impositivo, que se calcula a partir del resultado contable con ajustes.",
  html:`<h3>Alícuotas</h3><p>Desde la Ley 27.630 (2021), las sociedades de capital tributan con <b>alícuotas escalonadas</b> del <b>25%, 30% y 35%</b> según tramos de ganancia neta imponible acumulada, cuyos montos se actualizan anualmente por inflación.</p>
  <h3>Del resultado contable al impositivo</h3><p>Se parte del resultado contable antes de impuestos y se hacen ajustes:</p>
  <div class="tw"><table><thead><tr><th>Ajuste</th><th>Ejemplos</th><th>Efecto</th></tr></thead><tbody>
  <tr><td>Gastos contables no deducibles</td><td>Multas fiscales, el propio impuesto a las ganancias, excedentes sobre topes (por ejemplo, de gastos de automóviles)</td><td>Se suman</td></tr>
  <tr><td>Ingresos contables no gravados o no computables</td><td>Dividendos de sociedades argentinas, ingresos exentos</td><td>Se restan</td></tr>
  <tr><td>Diferencias temporarias</td><td>Previsiones no deducibles hasta su uso, amortizaciones distintas, diferencias de valuación</td><td>Se suman o restan; se revierten en otros ejercicios</td></tr></tbody></table></div>
  <h3>Pagos a cuenta</h3><p>Anticipos (en general, 10 anticipos sobre el impuesto del año anterior), retenciones sufridas y una parte del impuesto a los créditos y débitos bancarios.</p>
  <h3>Impuesto diferido</h3><p>Contablemente, las diferencias temporarias generan activos o pasivos por impuesto diferido: el gasto por impuesto del estado de resultados se acerca a “resultado contable × alícuota”, aunque el impuesto a pagar del año sea otro.</p>
  <h3>Quebrantos</h3><p>Si el resultado impositivo es negativo, el quebranto se puede compensar con ganancias de los <b>5 ejercicios siguientes</b>.</p>`,
  ex:[{type:"custom",title:"Conciliá el resultado contable con el impositivo",render:conciliacionFiscal},
   {type:"asiento",accounts:ACC,entries:[{t:"Cierre · Registrá el impuesto determinado de $ 2.970.000, cancelando los anticipos ($ 2.000.000) y las retenciones sufridas ($ 150.000).",e:[["Impuesto a las ganancias (resultado)",2970000,0],["Anticipos de impuesto a las ganancias",0,2000000],["Retenciones de ganancias sufridas",0,150000],["Impuesto a las ganancias a pagar",0,820000]]}]}]},
 {lead:"Con inflación alta, un impuesto sobre resultados nominales grava ganancias ficticias. Por eso la ley de Ganancias tiene su propio ajuste por inflación.",
  html:`<h3>Dos ajustes en el Título VI de la ley</h3><ul><li><b>Ajuste estático:</b> se calcula sobre la posición monetaria del inicio del ejercicio. Tener activos monetarios (caja, créditos) genera un ajuste negativo (menos impuesto); tener pasivos monetarios genera un ajuste positivo.</li><li><b>Ajuste dinámico:</b> por los movimientos del ejercicio (retiros de socios, dividendos, aportes, compras y ventas de bienes) desde su fecha hasta el cierre.</li></ul>
  <h3>Cuándo se aplica</h3><p>Cuando la variación del IPC acumulada en los 36 meses anteriores al cierre supera el <b>100%</b>. Durante la transición (2018 a 2020) los umbrales fueron menores. Se aplica también la actualización de las amortizaciones y del costo de los bienes vendidos.</p>
  <h3>Diferencias con el ajuste contable</h3><p>El ajuste impositivo no es igual al ajuste contable de la RT 54: usa reglas propias para definir qué partidas son monetarias, cómo se computan los bienes de cambio y qué se excluye. Por eso el resultado impositivo ajustado difiere del contable.</p>
  <div class="note"><b>Por qué importa.</b> En los años de alta inflación, una empresa con mucha caja puede tener un ajuste negativo importante que reduce el impuesto; una muy endeudada en pesos, un ajuste positivo que lo aumenta.</div>`,
  ex:[{type:"pick",title:"¿El ajuste estático aumenta o disminuye la ganancia impositiva?",options:["Aumenta","Disminuye"],items:[["Empresa con mucho efectivo y créditos en pesos al inicio","Disminuye"],["Empresa con grandes deudas en pesos al inicio","Aumenta"]]},
   {type:"tf",items:[["El ajuste por inflación impositivo es idéntico al contable de la RT 54","Falso"],["El ajuste impositivo procede si el IPC acumulado de 36 meses supera el 100%","Verdadero"]]}]},
 {lead:"Bienes Personales es un impuesto anual sobre el patrimonio de las personas humanas, regulado por la Ley 23.966.",
  html:`<h3>Características</h3><ul><li><b>Sujetos:</b> personas humanas y sucesiones indivisas. Los residentes, por sus bienes en el país y en el exterior; los no residentes, por sus bienes en el país.</li><li><b>Momento:</b> los bienes que se tienen al <b>31 de diciembre</b> de cada año.</li><li><b>Base:</b> el valor de los bienes según las reglas de valuación de la ley (inmuebles, automotores, depósitos, títulos, participaciones, moneda extranjera al tipo de cambio de cierre).</li><li><b>Mínimo no imponible:</b> si el total no lo supera, no se paga. La casa habitación tiene un tratamiento especial. Los montos se actualizan.</li><li><b>Alícuotas</b> progresivas sobre el excedente del mínimo.</li></ul>
  <h3>Acciones y participaciones</h3><p>Las acciones y cuotas de sociedades argentinas en manos de personas humanas no las declara cada socio: las paga la sociedad como <b>responsable sustituto</b>, con una alícuota sobre el valor patrimonial proporcional, que puede recuperar de sus socios.</p>
  <h3>Cambios recientes</h3><p>La Ley 27.743 (2024) dispuso una reducción gradual de las alícuotas y creó el <b>Régimen Especial de Ingreso del impuesto sobre los Bienes Personales (REIBP)</b>, que permitió pagar por adelantado varios períodos a cambio de estabilidad fiscal. Antes de liquidar, revisá alícuotas y mínimos del período.</p>`,
  ex:[{type:"tf",items:[["Bienes Personales se calcula sobre los bienes al 31 de diciembre","Verdadero"],["Una sociedad anónima es sujeto de Bienes Personales por sus propios bienes","Falso","Solo personas humanas y sucesiones indivisas; la sociedad paga como responsable sustituto por las acciones de sus socios."],["Un residente debe declarar también los bienes que tiene en el exterior","Verdadero"],["Si el patrimonio no supera el mínimo no imponible, no se paga","Verdadero"]]}]},
 {lead:"Además de los grandes impuestos, hay otros que aparecen todos los días en la contabilidad de una empresa.",
  html:`<div class="tw"><table><thead><tr><th>Impuesto</th><th>Qué grava</th><th>Puntos clave</th></tr></thead><tbody>
  <tr><td><b>Créditos y débitos en cuentas bancarias</b> (Ley 25.413)</td><td>Cada acreditación y cada débito en cuenta corriente</td><td>Alícuota general de 0,6% sobre créditos y 0,6% sobre débitos. Una parte se puede computar como pago a cuenta de Ganancias (porcentaje mayor para MiPyMEs).</td></tr>
  <tr><td><b>Impuestos internos</b></td><td>Bienes específicos: tabaco, bebidas alcohólicas, ciertos bienes</td><td>Se aplican en una sola etapa.</td></tr>
  <tr><td><b>Combustibles líquidos y al dióxido de carbono</b></td><td>La transferencia de combustibles</td><td>Montos fijos por litro, actualizables.</td></tr>
  <tr><td><b>Derechos de exportación</b></td><td>Las exportaciones de ciertos productos</td><td>Alícuotas que fija el Poder Ejecutivo por posición arancelaria.</td></tr>
  <tr><td><b>Sellos</b> (provincial)</td><td>Contratos e instrumentos onerosos</td><td>Cada provincia fija alícuotas y exenciones.</td></tr></tbody></table></div>
  <h3>Ética y planificación fiscal</h3><p>El contador puede y debe buscar la opción legal de menor carga para su cliente: elegir bien la forma jurídica, aprovechar beneficios, imputar en el período correcto. No puede participar en maniobras de evasión: además de la responsabilidad del cliente, el profesional que colabora puede ser sancionado penal y profesionalmente (Módulo 27).</p>
  <p>La ley de procedimiento tiene una <b>cláusula antiabuso</b> (principio de la realidad económica, arts. 1 y 2 de la Ley 11.683): ARCA puede prescindir de las formas jurídicas que no se correspondan con la realidad de la operación.</p>`,
  ex:[{type:"num",items:[{q:"Se acreditan $ 10.000.000 en la cuenta corriente con alícuota de 0,6%. ¿Impuesto sobre los créditos?",a:60000,u:"$"},{q:"Si se puede computar el 33% de ese impuesto como pago a cuenta de Ganancias, ¿cuánto se computa?",a:19800,u:"$"}]},
   {type:"tf",items:[["El principio de la realidad económica permite a ARCA desconocer formas jurídicas que no reflejan la operación real","Verdadero"],["El impuesto de Sellos es nacional","Falso","Es provincial."]]}]},
],

lessons:[
 {lead:"La Ley de Contrato de Trabajo (LCT, Ley 20.744) regula la relación entre empleador y trabajador en relación de dependencia.",
  html:`<h3>El contrato de trabajo (art. 21)</h3><p>Hay contrato de trabajo cuando una persona se obliga a realizar actos, ejecutar obras o prestar servicios a favor de otra, bajo su dependencia, durante un tiempo, a cambio de una remuneración.</p>
  <h3>Notas de la dependencia</h3><ul><li><b>Técnica:</b> el empleador dirige cómo se hace el trabajo.</li><li><b>Económica:</b> el trabajador recibe una remuneración y no asume el riesgo del negocio.</li><li><b>Jurídica:</b> el empleador tiene poder de dirección y disciplinario.</li></ul>
  <h3>Presunción (art. 23)</h3><p>La prestación de servicios hace presumir la existencia de un contrato de trabajo, salvo que se demuestre lo contrario. La Ley 27.742 (2024) aclaró que la presunción no opera cuando la relación se instrumenta con facturas y pagos bancarios de servicios profesionales u oficios.</p>
  <h3>Período de prueba (art. 92 bis)</h3><p>Los contratos por tiempo indeterminado se entienden celebrados a prueba durante los primeros <b>6 meses</b> (plazo fijado por la Ley 27.742; los convenios colectivos pueden extenderlo en ciertos casos). Durante ese período cualquiera de las partes puede extinguir la relación sin indemnización. Desde la <b>Ley 27.802 de Modernización Laboral</b> (B.O. 6/3/2026) tampoco se debe preaviso (art. 231). El trabajador tiene que estar registrado desde el primer día y el empleador no puede usar el período de prueba más de una vez con la misma persona.</p>
  <h3>Modalidades</h3><ul><li><b>Tiempo indeterminado</b> (la regla).</li><li><b>Plazo fijo</b>, <b>eventual</b>, <b>de temporada</b> y <b>a tiempo parcial</b>, con requisitos específicos.</li></ul>
  <h3>Registración</h3><p>El empleador debe registrar al trabajador antes de que empiece a trabajar, con el alta en el sistema “Simplificación Registral” de ARCA. Con la Ley 27.802, ARCA pasó a ser el <b>registro único</b> de la relación laboral (arts. 52 y 55 LCT): el registro digital reemplaza a los libros laborales, que igual se conservan 10 años si ya existían. Si falta la registración, la ley presume a favor de lo que declare el trabajador.</p>
  <h3>Convenios colectivos</h3><p>Además de la LCT, cada actividad tiene su <b>convenio colectivo de trabajo</b> (por ejemplo, el CCT 130/75 de Empleados de Comercio), con escalas salariales, adicionales y categorías.</p>`,
  ex:[{type:"tf",items:[["La prestación de servicios hace presumir, en principio, un contrato de trabajo","Verdadero"],["El período de prueba permite despedir sin indemnización","Verdadero"],["El alta del trabajador se puede hacer después del primer mes","Falso","Debe ser previa al inicio de la prestación."],["Los convenios colectivos fijan escalas salariales por actividad","Verdadero"]]}]},
 {lead:"La ley limita cuánto se puede trabajar y garantiza descansos y licencias pagas.",
  html:`<h3>Jornada (Ley 11.544)</h3><ul><li>Máximo <b>8 horas diarias</b> o <b>48 semanales</b>.</li><li>Jornada nocturna (entre las 21 y las 6): 7 horas.</li><li>Horas extra: recargo del <b>50%</b> en días comunes y del <b>100%</b> los sábados después de las 13, domingos y feriados (art. 201 LCT).</li></ul>
  <h3>Descansos</h3><p>Descanso semanal desde el sábado a las 13 hasta el domingo a las 24 (art. 204), y 12 horas como mínimo entre jornadas.</p>
  <h3>Vacaciones (art. 150)</h3><div class="tw"><table><thead><tr><th>Antigüedad al 31/12</th><th class="r">Días corridos</th></tr></thead><tbody>
  <tr><td>Hasta 5 años</td><td class="r num">14</td></tr><tr><td>Más de 5 y hasta 10</td><td class="r num">21</td></tr><tr><td>Más de 10 y hasta 20</td><td class="r num">28</td></tr><tr><td>Más de 20</td><td class="r num">35</td></tr></tbody></table></div>
  <p>Para tener derecho al período completo hay que haber trabajado al menos la mitad de los días hábiles del año; si no, corresponde un día de vacaciones cada 20 trabajados.</p><p><b>Cómo se otorgan (art. 154, texto de la Ley 27.802).</b> El empleador las da entre el 1 de octubre y el 30 de abril, salvo acuerdo distinto, y las avisa por escrito con 30 días de anticipación. Se pueden fraccionar en tramos de al menos 7 días, y cada trabajador tiene que gozarlas en verano al menos una vez cada 3 años.</p><p><b>Banco de horas (art. 197 bis).</b> Por acuerdo escrito, las horas extra pueden compensarse con descanso en lugar de pagarse, respetando los descansos mínimos. Los convenios colectivos pueden calcular la jornada máxima como promedio.</p>
  <h3>Licencias especiales (art. 158)</h3><ul><li>Nacimiento de hijo: 2 días corridos (para el progenitor no gestante).</li><li>Matrimonio: 10 días corridos.</li><li>Fallecimiento de cónyuge, hijos o padres: 3 días corridos.</li><li>Fallecimiento de hermano: 1 día.</li><li>Examen: 2 días corridos por examen, hasta 10 días por año.</li></ul>
  <p>La licencia por <b>maternidad</b> es de 90 días (art. 177), y durante ella la trabajadora cobra una asignación de la seguridad social.</p>`,
  ex:[{type:"num",items:[{q:"Una empleada ingresó el 1/03/2018. ¿Cuántos días de vacaciones le corresponden por el año 2024? (antigüedad al 31/12/2024)",a:21,tol:0,hint:"Tiene 6 años y 10 meses"},{q:"Un empleado gana $ 6.000 por hora y hace 4 horas extra un martes. ¿Cuánto cobra por esas horas?",a:36000,u:"$"},{q:"¿Y si las hace un domingo?",a:48000,u:"$"},{q:"¿Cuántos días corridos de licencia corresponden por matrimonio?",a:10,tol:0}]}]},
 {lead:"La remuneración es todo lo que el trabajador recibe por su trabajo. Lo que se considere remunerativo define los aportes, las contribuciones y las indemnizaciones.",
  html:`<h3>Conceptos remunerativos y no remunerativos</h3><ul><li><b>Remunerativos:</b> sueldo básico, adicionales (antigüedad, presentismo, título), horas extra, comisiones, premios, SAC, vacaciones. Llevan aportes y contribuciones.</li><li><b>No remunerativos:</b> los que la ley expresamente excluye, como ciertas asignaciones familiares, algunos beneficios sociales (art. 103 bis) y sumas que los convenios colectivos declaran no remunerativas por un tiempo. No llevan (o llevan parcialmente) aportes.</li></ul>
  <h3>Formas de pago</h3><ul><li>Por tiempo (mensual, quincenal, por hora o jornal).</li><li>Por rendimiento (a destajo, comisiones).</li></ul>
  <h3>Salario mínimo vital y móvil</h3><p>Lo fija el Consejo Nacional del Empleo, la Productividad y el Salario Mínimo. Ningún trabajador de jornada completa puede cobrar menos. También se usa como referencia en otras normas (por ejemplo, el capital mínimo de la SAS).</p>
  <h3>Plazo de pago (art. 128)</h3><p>Los sueldos mensuales se pagan dentro de los <b>4 días hábiles</b> del mes siguiente; los quincenales y semanales, dentro de los 3 días hábiles.</p>
  <h3>Recibo de sueldo (art. 140)</h3><p>Debe contener los datos del empleador y del trabajador, la fecha de ingreso, la categoría, el período, la remuneración y cada concepto, los descuentos, el neto a cobrar y la constancia del último depósito de aportes.</p>`,
  ex:[{type:"pick",title:"¿Remunerativo o no remunerativo (en principio)?",options:["Remunerativo","No remunerativo"],items:[["Sueldo básico","Remunerativo"],["Horas extra","Remunerativo"],["Asignación familiar por hijo pagada por ANSES","No remunerativo"],["Comisiones por ventas","Remunerativo"],["Aguinaldo","Remunerativo"],["Reintegro de gastos de guardería con comprobantes (art. 103 bis)","No remunerativo"]]}]},
 {lead:"Del sueldo bruto se descuentan los aportes del trabajador, y el empleador paga además sus contribuciones. Todo se declara en el formulario 931.",
  html:`<h3>Aportes del trabajador</h3><div class="tw"><table><thead><tr><th>Concepto</th><th class="r">%</th></tr></thead><tbody>
  <tr><td>Jubilación (SIPA)</td><td class="r num">11%</td></tr><tr><td>Ley 19.032 (INSSJP, PAMI)</td><td class="r num">3%</td></tr><tr><td>Obra social</td><td class="r num">3%</td></tr><tr><td><b>Total de aportes de ley</b></td><td class="r num"><b>17%</b></td></tr></tbody></table></div>
  <p>Además puede haber cuota sindical y aportes solidarios del convenio colectivo.</p>
  <h3>Contribuciones del empleador</h3><p>Financian jubilación, PAMI, asignaciones familiares y el Fondo Nacional de Empleo. Según la Ley 27.541, la alícuota global es de <b>20,40%</b> para empleadores de los sectores de servicios o comercio que superen ciertos montos de ventas, y de <b>18%</b> para el resto, sobre las que puede haber detracciones. A eso se suman el <b>6% de obra social</b>, la cuota de la <b>ART</b> (aseguradora de riesgos del trabajo) y el seguro de vida obligatorio.</p>
  <h3>Declaración y pago</h3><p>Se declaran por el sistema “Declaración en línea” (F.931) de ARCA y se pagan mensualmente. El empleador actúa como agente de retención de los aportes: si los retiene y no los deposita, comete un delito (apropiación indebida de recursos de la seguridad social).</p>
  <h3>Registración</h3><ol><li>Devengamiento: <span class="mono">Sueldos y jornales (bruto) a Retenciones a depositar (aportes) y a Sueldos a pagar (neto)</span>.</li><li>Contribuciones: <span class="mono">Contribuciones patronales a Cargas sociales a pagar</span>.</li><li>Pago: se cancelan los pasivos contra el banco.</li></ol>`,
  ex:[{type:"num",items:[{q:"Sueldo bruto $ 2.000.000. ¿Total de aportes del trabajador (17%)?",a:340000,u:"$"},{q:"¿Neto a cobrar?",a:1660000,u:"$"},{q:"Con contribuciones de 18% + 6% de obra social, ¿cuánto paga el empleador además del bruto?",a:480000,u:"$"},{q:"¿Cuál es el costo laboral total del mes, sin ART ni seguro?",a:2480000,u:"$"}]},
   {type:"asiento",accounts:ACC,entries:[{t:"31/05 · Devengá el sueldo bruto de $ 1.137.465 con aportes de $ 193.369,05.",e:[["Sueldos y jornales",1137465,0],["Retenciones a depositar",0,193369.05],["Sueldos a pagar",0,944095.95]]},{t:"31/05 · Registrá las contribuciones patronales del mes (24% ilustrativo): $ 272.991,60.",e:[["Contribuciones patronales",272991.6,0],["Cargas sociales a pagar",0,272991.6]]}]}]},
 {lead:"Liquidar un recibo de sueldo es combinar el convenio colectivo, la ley y los datos del trabajador.",
  html:`<h3>Pasos</h3><ol><li>Sueldo básico de la categoría según la escala vigente del convenio.</li><li>Adicionales del convenio (antigüedad, presentismo, título, zona).</li><li>Horas extra, comisiones, premios.</li><li>Ausencias sin goce de sueldo (se descuentan).</li><li>Total remunerativo.</li><li>Conceptos no remunerativos (si los hay).</li><li>Descuentos: aportes de ley, sindicales, retención de Ganancias si corresponde.</li><li>Neto a cobrar.</li></ol>
  <div class="note"><b>Ejemplo de convenio.</b> En el CCT 130/75 de Empleados de Comercio, la antigüedad es el 1% del básico por cada año y el presentismo (acuerdo de asistencia y puntualidad) equivale a 8,33% de la remuneración. Los valores exactos se actualizan con cada acuerdo paritario.</div>`,
  ex:[{type:"custom",title:"Liquidá el recibo de mayo",render:recibo}]},
 {lead:"El aguinaldo y las vacaciones son dos conceptos que todo liquidador calcula varias veces por año.",
  html:`<h3>Sueldo Anual Complementario (SAC, Ley 23.041)</h3><p>Es el <b>50% de la mayor remuneración mensual devengada</b> por todo concepto en cada semestre (enero a junio y julio a diciembre). Se paga en dos cuotas: la primera hasta el 30 de junio y la segunda hasta el 18 de diciembre, con un plazo de gracia de 4 días hábiles.</p>
  <p>Si el trabajador no trabajó el semestre completo, se paga en proporción al tiempo trabajado.</p>
  <div class="formula">SAC proporcional = Mejor remuneración / 2 × días trabajados en el semestre / días del semestre</div>
  <h3>Vacaciones (art. 155)</h3><p>Se pagan <b>antes</b> de que el trabajador empiece a gozarlas. Para mensualizados, el valor del día de vacaciones es el sueldo dividido por <b>25</b> (no por 30), lo que hace que cobrar vacaciones dé un poco más que el sueldo normal.</p>
  <div class="formula">Plus vacacional = Sueldo / 25 × días de vacaciones</div>
  <p>Ejemplo: sueldo $ 1.200.000 y 21 días de vacaciones: 1.200.000 / 25 × 21 = <b>$ 1.008.000</b> por los días de vacaciones (en lugar de los $ 840.000 que corresponderían a 21/30 del sueldo).</p>
  <h3>Provisión contable</h3><p>Como el SAC y las vacaciones se devengan mes a mes, se registra una provisión mensual (aproximadamente 1/12 del sueldo para el SAC) con sus cargas sociales.</p>`,
  ex:[{type:"num",items:[{q:"La mejor remuneración del primer semestre fue $ 1.500.000. ¿SAC del semestre completo?",a:750000,u:"$"},{q:"Si ingresó el 1/03 (122 días trabajados sobre 181), ¿SAC proporcional? (sin decimales)",a:505525,u:"$",tol:2,hint:"750.000 × 122 / 181"},{q:"Sueldo $ 1.200.000 y 14 días de vacaciones. ¿Pago por vacaciones?",a:672000,u:"$"}]}]},
 {lead:"Cuando termina la relación laboral, lo que se paga depende de cómo termina. El despido sin causa es el caso que más indemnización genera.",
  html:`<h3>Formas de extinción</h3><ul><li><b>Renuncia:</b> el trabajador debe dar 15 días de preaviso. No hay indemnización.</li><li><b>Mutuo acuerdo</b> (art. 241), ante escribano o autoridad.</li><li><b>Despido con justa causa:</b> por una injuria grave del trabajador. No hay indemnización.</li><li><b>Despido sin causa:</b> corresponden indemnizaciones.</li><li><b>Otras:</b> jubilación, fallecimiento, fuerza mayor.</li></ul>
  <h3>Liquidación final por despido sin causa</h3><div class="tw"><table><thead><tr><th>Rubro</th><th>Cálculo</th></tr></thead><tbody>
  <tr><td><b>Indemnización por antigüedad</b> (art. 245)</td><td>1 mes de la mejor remuneración mensual, normal y habitual del último año, por cada año de servicio o fracción mayor de 3 meses, con un mínimo de 1 mes. Desde la Ley 27.802 la base <b>excluye el SAC, las vacaciones y los premios no mensuales</b>; es “habitual” lo que se cobró en al menos 6 de los últimos 12 meses, y los variables se promedian. El tope es 3 veces el salario promedio del convenio, pero no puede reducir la base a menos del 67% (criterio de la Corte en “Vizzoti”, 2004, que ahora está en la ley).</td></tr>
  <tr><td><b>Preaviso</b> (art. 231)</td><td>Si no se avisó: 1 mes con antigüedad de hasta 5 años y 2 meses con más de 5 años. En el período de prueba no corresponde preaviso (Ley 27.802).</td></tr>
  <tr><td><b>Integración del mes de despido</b> (art. 233)</td><td>Los días que faltan hasta fin de mes, si el despido no coincide con el último día.</td></tr>
  <tr><td><b>Vacaciones no gozadas</b> y <b>SAC proporcional</b></td><td>Lo devengado hasta la fecha, más el SAC sobre el preaviso y la integración.</td></tr></tbody></table></div>
  <h3>El Fondo de Asistencia Laboral (FAL)</h3><p>La Ley 27.802 creó el <b>FAL</b>, reglamentado por el Decreto 408/2026. No cambia cuánto cobra el trabajador despedido: cambia cómo se financia. Cada empleador aporta todos los meses un porcentaje de la nómina (1% las grandes empresas y 2,5% las MiPyMEs, según la reglamentación), y ese aporte se descuenta de sus contribuciones patronales. El fondo se invierte en fondos comunes o fideicomisos regulados por la CNV, y cubre la indemnización de trabajadores registrados con al menos 12 meses de antigüedad.</p>
  <h3>Después de la extinción</h3><ul><li><b>Certificados de trabajo (art. 80):</b> el empleador tiene 45 días hábiles para entregarlos, y cumple si los pone a disposición en forma física, digital o a través de ARCA.</li><li><b>Actualización de créditos laborales (art. 276):</b> las deudas laborales se actualizan por IPC del INDEC más un 3% anual.</li><li><b>Multas por falta de registración:</b> la Ley 27.742 (Ley Bases, 2024) derogó las multas de los arts. 8, 9, 10 y 15 de la Ley 24.013 y las de los arts. 1 y 2 de la Ley 25.323. Para relaciones y despidos anteriores a julio de 2024 los tribunales están divididos: algunos las siguen aplicando y otros no. La falta de registración sigue teniendo consecuencias: deuda de aportes y contribuciones, sanciones administrativas y presunciones a favor del trabajador.</li></ul>
  <div class="note"><b>Norma nueva.</b> La Ley 27.802 tiene 218 artículos, varios con reglamentación reciente y algunos cuestionados judicialmente (por ejemplo, el pago en moneda extranjera). Antes de liquidar un caso real, revisá el texto actualizado de la LCT y la reglamentación vigente.</div>`,
  ex:[{type:"num",items:[{q:"Un empleado con 7 años y 4 meses de antigüedad y mejor remuneración de $ 1.200.000 es despedido sin causa. ¿Indemnización por antigüedad (sin tope)?",a:9600000,u:"$",hint:"4 meses es fracción mayor a 3: cuenta como año → 8 años"},{q:"Sin preaviso, ¿cuánto corresponde por indemnización sustitutiva de preaviso?",a:2400000,u:"$",hint:"Más de 5 años: 2 meses"},{q:"Otro empleado con 2 años y 2 meses, mejor sueldo $ 900.000. ¿Indemnización por antigüedad?",a:1800000,u:"$"}]},
   {type:"pick",title:"¿Corresponde indemnización por antigüedad?",options:["Sí","No"],items:[["Renuncia del trabajador","No"],["Despido sin causa después de 3 años","Sí"],["Despido con justa causa probada","No"],["Despido durante el período de prueba","No"]]},
   {type:"tf",title:"Lo que cambió con la Ley 27.802",items:[["En el período de prueba ya no corresponde preaviso",true],["El SAC integra la base de la indemnización del art. 245",false,"La Ley 27.802 lo excluye expresamente, igual que las vacaciones y los premios no mensuales."],["El FAL reduce lo que cobra el trabajador despedido",false,"Cambia el financiamiento, no el monto."],["Las vacaciones se pueden fraccionar en tramos de al menos 7 días",true],["Las multas de la Ley 24.013 por falta de registración fueron derogadas",true,"Las derogó la Ley 27.742 (2024); hay discusión judicial sobre los casos anteriores."]]}]},

/* Módulo 23 · Administración financiera */
CAMPUS.content[23] = {
lessons:[
 {lead:"La administración financiera decide en qué invertir, cómo financiarlo y cómo manejar el dinero del día a día, con el objetivo de crear valor.",
  html:`<h3>Las tres grandes decisiones</h3><ul><li><b>Inversión:</b> en qué activos poner los recursos (máquinas, nuevas sucursales, capital de trabajo).</li><li><b>Financiamiento:</b> de dónde sacar los fondos (capital propio, deuda, proveedores) y en qué proporción.</li><li><b>Dividendos:</b> cuánto distribuir y cuánto reinvertir.</li></ul>
  <h3>Objetivo</h3><p>El objetivo financiero clásico es <b>maximizar el valor de la empresa</b> para sus dueños, que no es lo mismo que maximizar la ganancia contable del año: importan también el tiempo en que llegan los flujos y su riesgo.</p>
  <h3>Resultado contable y flujo de fondos</h3><p>Las decisiones financieras se toman con <b>flujos de fondos</b>, no con resultados contables. Una amortización reduce la ganancia pero no es una salida de dinero; una compra de stock no es gasto pero sí consume caja.</p>
  <h3>Problemas de agencia</h3><p>Los administradores (agentes) pueden tener intereses distintos de los dueños (principales). Se alinean con buen gobierno corporativo, incentivos atados al valor, auditoría y control.</p>
  <h3>El administrador financiero en Argentina</h3><p>Trabaja con alta inflación, controles cambiarios en distintos períodos, tasas volátiles y un mercado de capitales chico. Por eso pesan mucho la gestión del capital de trabajo, la cobertura del riesgo cambiario y el uso de instrumentos de corto plazo.</p>`,
  ex:[{type:"pick",title:"¿Qué tipo de decisión financiera es?",options:["Inversión","Financiamiento","Dividendos"],items:[["Comprar una nueva línea de producción","Inversión"],["Emitir obligaciones negociables","Financiamiento"],["Repartir el 40% de las ganancias a los accionistas","Dividendos"],["Tomar un préstamo bancario a 3 años","Financiamiento"],["Abrir una sucursal en Mendoza","Inversión"]]}]},
 {lead:"A mayor riesgo, mayor rendimiento exigido. Medir esa relación es la base de toda valuación.",
  html:`<h3>Rendimiento esperado y riesgo</h3><p>El <b>rendimiento esperado</b> es el promedio ponderado por probabilidad de los rendimientos posibles. El <b>riesgo</b> se mide con el desvío estándar de esos rendimientos (Módulo 3).</p>
  <h3>Diversificación</h3><p>Combinar activos cuyos rendimientos no se mueven igual reduce el riesgo total. Se puede eliminar el <b>riesgo específico</b> (de cada empresa), pero no el <b>riesgo sistemático</b> o de mercado (inflación, recesión, tasas).</p>
  <h3>CAPM (modelo de valuación de activos de capital)</h3><div class="formula">Rendimiento exigido = Tasa libre de riesgo + β × (Rendimiento del mercado − Tasa libre de riesgo)</div>
  <p>El <b>beta (β)</b> mide cuánto se mueve una acción respecto del mercado: β = 1 se mueve igual; β = 1,5 se mueve 50% más; β = 0,5 se mueve la mitad.</p>
  <p>Ejemplo: tasa libre de riesgo 5%, rendimiento del mercado 12%, β = 1,2 → 5% + 1,2 × 7% = <b>13,4%</b>.</p>
  <div class="note"><b>Riesgo país.</b> Para valuar empresas argentinas en dólares se suele sumar el <b>riesgo país</b> (el diferencial de tasa de los bonos argentinos sobre los del Tesoro de EE. UU., medido por el índice EMBI) a la tasa libre de riesgo.</div>`,
  ex:[{type:"num",items:[{q:"Tasa libre de riesgo 5%, mercado 12%, β 1,2. ¿Rendimiento exigido, en %?",a:13.4,u:"%",tol:0.01},{q:"Una cartera tiene 50% en un activo que rinde 10% y 50% en otro que rinde 20%. ¿Rendimiento esperado de la cartera, en %?",a:15,u:"%",tol:0.01},{q:"Escenarios: 30% de probabilidad de rendir 25%, 50% de rendir 10% y 20% de perder 5%. ¿Rendimiento esperado, en %?",a:11.5,u:"%",tol:0.01}]},
   {type:"tf",items:[["La diversificación puede eliminar el riesgo sistemático","Falso"],["Un activo con β = 0 no tiene riesgo de mercado","Verdadero"]]}]},
 {lead:"El capital de trabajo financia el día a día. Muchas empresas rentables quiebran por no administrarlo bien.",
  html:`<div class="formula">Capital de trabajo = Activo corriente − Pasivo corriente</div>
  <h3>Ciclo operativo y ciclo de efectivo</h3><ul><li><b>Días de inventario</b> = Bienes de cambio / CMV × 365.</li><li><b>Días de cobro</b> = Créditos por ventas / Ventas × 365.</li><li><b>Días de pago</b> = Deudas comerciales / Compras × 365.</li></ul>
  <div class="formula">Ciclo de conversión del efectivo = Días de inventario + Días de cobro − Días de pago</div>
  <p>Es la cantidad de días que la empresa tiene que financiar con fondos propios o préstamos. Si inventario son 50 días, cobro 45 y pago 40, el ciclo es <b>55 días</b>.</p>
  <h3>Cómo reducirlo</h3><ul><li>Rotar más rápido el inventario (menos stock inmovilizado).</li><li>Cobrar antes: descuentos por pronto pago, cobro con tarjeta o transferencia, factoring.</li><li>Negociar plazos más largos con proveedores, sin perder descuentos convenientes.</li></ul>
  <h3>Costo de no tomar un descuento</h3><p>Si un proveedor ofrece 2% de descuento por pagar a 10 días en lugar de a 30, no tomarlo equivale a financiarse 20 días al 2%, es decir, 0,02 / 0,98 × 365/20 = <b>37,2% anual</b>.</p>
  <h3>Administración del efectivo</h3><p>Presupuesto de caja (Módulo 18), colocación de excedentes en instrumentos líquidos (plazo fijo, cauciones, fondos comunes de money market) y líneas de crédito para faltantes.</p>`,
  ex:[{type:"num",items:[{q:"Días de inventario 60, días de cobro 30, días de pago 45. ¿Ciclo de conversión del efectivo?",a:45,u:"días",tol:0},{q:"Activo corriente $ 3.000.000, pasivo corriente $ 2.000.000. ¿Capital de trabajo?",a:1000000,u:"$"},{q:"Un proveedor ofrece 3% de descuento por pagar a 10 días en lugar de 40. ¿Costo anual simple de no tomarlo, en %? (una decimal)",a:37.6,u:"%",tol:0.1,hint:"0,03 / 0,97 × 365 / 30"}]}]},
 {lead:"El presupuesto de capital evalúa inversiones de largo plazo con flujos de fondos incrementales.",
  html:`<h3>Flujos relevantes</h3><ul><li><b>Inversión inicial:</b> el activo, su instalación y el capital de trabajo adicional que requiere.</li><li><b>Flujos operativos:</b> ingresos menos costos en efectivo, menos el impuesto a las ganancias. La amortización se considera solo por su ahorro de impuesto.</li><li><b>Valor terminal:</b> recupero del capital de trabajo y valor de rezago de los activos.</li></ul>
  <div class="formula">Flujo operativo = (Ingresos − Costos − Amortización) × (1 − t) + Amortización</div>
  <p>Solo cuentan los flujos <b>incrementales</b>: los que aparecen o cambian por hacer el proyecto. No se cuentan los costos hundidos, sí los costos de oportunidad (por ejemplo, un depósito propio que se podría alquilar).</p>
  <h3>Criterios de decisión</h3><p>VAN y TIR (Módulo 11), período de recupero, índice de rentabilidad (VA de los flujos / inversión).</p>
  <h3>Análisis de sensibilidad y escenarios</h3><p>Se recalcula el VAN cambiando una variable por vez (precio, volumen, tipo de cambio) y armando escenarios pesimista, base y optimista. Muestra qué supuesto es crítico.</p>`,
  ex:[{type:"num",items:[{q:"Ingresos $ 1.000.000, costos en efectivo $ 400.000, amortización $ 200.000, impuesto 30%. ¿Flujo operativo anual?",a:480000,u:"$",hint:"(1.000.000 − 400.000 − 200.000) × 0,7 + 200.000"},{q:"El VA de los flujos de un proyecto es $ 1.300.000 y la inversión $ 1.000.000. ¿Índice de rentabilidad?",a:1.3,tol:0.001}]},
   {type:"pick",title:"¿Se incluye en el flujo del proyecto?",options:["Se incluye","No se incluye"],items:[["El estudio de mercado ya pagado el año pasado","No se incluye"],["El capital de trabajo adicional que requiere el proyecto","Se incluye"],["El alquiler que se dejaría de cobrar por usar un local propio","Se incluye"],["El ahorro de impuesto por la amortización del equipo","Se incluye"]]}]},
 {lead:"El costo de capital es la tasa mínima que tiene que rendir una inversión. Combina el costo de la deuda y el del capital propio.",
  html:`<h3>Costo de la deuda</h3><p>Es la tasa que se paga por los préstamos. Como los intereses son deducibles en Ganancias, el costo efectivo es menor: <span class="mono">kd × (1 − t)</span>.</p>
  <h3>Costo del capital propio</h3><p>Es el rendimiento que exigen los accionistas. Se estima con el CAPM o con modelos de dividendos. Siempre es mayor que el costo de la deuda, porque el accionista cobra después de los acreedores y asume más riesgo.</p>
  <h3>Costo promedio ponderado del capital (WACC)</h3><div class="formula">WACC = E/V × ke + D/V × kd × (1 − t)</div>
  <p>Ejemplo: 60% capital propio con ke 15% y 40% deuda con kd 10%, impuesto 35% → 0,6 × 15% + 0,4 × 10% × 0,65 = <b>11,6%</b>.</p>
  <h3>Apalancamiento financiero</h3><p>Endeudarse aumenta la rentabilidad del capital propio si la empresa gana con sus activos más de lo que paga por la deuda. Si gana menos, la reduce. Por eso la deuda amplifica tanto las ganancias como las pérdidas.</p>
  <div class="formula">ROE = ROA + (ROA − costo de la deuda) × D/E</div>`,
  ex:[{type:"num",items:[{q:"E 60%, ke 15%; D 40%, kd 10%; t 35%. ¿WACC, en %?",a:11.6,u:"%",tol:0.01},{q:"Una deuda al 20% con impuesto del 30%. ¿Costo después de impuestos, en %?",a:14,u:"%",tol:0.01},{q:"ROA 12% (después de impuestos), costo de la deuda después de impuestos 8%, deuda / capital propio = 1. ¿ROE, en %?",a:16,u:"%",tol:0.01}]}]},
 {lead:"Las empresas argentinas se financian con bancos, proveedores y, cada vez más, en el mercado de capitales.",
  html:`<h3>Fuentes de corto plazo</h3><ul><li><b>Crédito comercial</b> de proveedores.</li><li><b>Descubierto</b> en cuenta corriente (caro y a muy corto plazo).</li><li><b>Descuento de cheques</b> y de facturas de crédito electrónicas (FCE MiPyME).</li><li><b>Factoring:</b> cesión de créditos a una entidad que los cobra.</li><li><b>Pagarés bursátiles</b> y <b>cheques de pago diferido</b> negociados en el mercado.</li></ul>
  <h3>Fuentes de largo plazo</h3><ul><li><b>Préstamos bancarios</b> (francés o alemán, Módulo 11).</li><li><b>Leasing</b> de equipos.</li><li><b>Obligaciones negociables</b> (Ley 23.576): títulos de deuda emitidos por la empresa. Hay un régimen simplificado para PyMEs.</li><li><b>Fideicomisos financieros:</b> se securitizan flujos futuros (por ejemplo, cupones de tarjeta).</li><li><b>Emisión de acciones</b> en la bolsa.</li></ul>
  <h3>Actores del mercado de capitales</h3><ul><li><b>CNV</b> (Comisión Nacional de Valores): regula y controla (Ley 26.831 de Mercado de Capitales).</li><li><b>Mercados:</b> BYMA (Bolsas y Mercados Argentinos), MAV (Mercado Argentino de Valores, especializado en PyMEs), A3 Mercados.</li><li><b>Agentes</b> de liquidación y compensación (ALyC), que intermedian.</li><li><b>Sociedades de Garantía Recíproca</b> (SGR, Ley 24.467): avalan a las PyMEs para que consigan mejores tasas.</li></ul>`,
  ex:[{type:"pick",title:"¿Qué instrumento es?",options:["Obligación negociable","Factoring","Fideicomiso financiero","Descubierto","Aval de SGR"],items:[["La empresa emite títulos de deuda que compran inversores","Obligación negociable"],["Se venden las facturas a cobrar a una entidad","Factoring"],["Se cede el flujo de cuotas de clientes a un vehículo que emite títulos","Fideicomiso financiero"],["El banco permite girar en rojo unos días","Descubierto"],["Una entidad garantiza el cheque de una PyME para que se descuente a menor tasa","Aval de SGR"]]}]},
],

(function(){

<tr><td>Caja y bancos</td><td class="r num">500</td><td class="r num">400</td></tr><tr><td>Créditos por ventas</td><td class="r num">1.500</td><td class="r num">1.100</td></tr><tr><td>Bienes de cambio</td><td class="r num">1.000</td><td class="r num">900</td></tr>
<tr><td><b>Activo corriente</b></td><td class="r num"><b>3.000</b></td><td class="r num"><b>2.400</b></td></tr><tr><td>Bienes de uso</td><td class="r num">5.000</td><td class="r num">4.600</td></tr><tr><td><b>Activo total</b></td><td class="r num"><b>8.000</b></td><td class="r num"><b>7.000</b></td></tr>

CAMPUS.content[24] = {
lessons:[
 {lead:"Analizar estados contables es transformar números en opinión: ¿la empresa puede pagar sus deudas? ¿es rentable? ¿cómo evoluciona?",
  html:`<p>Usamos los datos de Andina SA en todo el módulo:</p>${DATA}
  <h3>Análisis vertical</h3><p>Cada rubro como porcentaje de un total del mismo estado: del activo total en el balance, de las ventas en el estado de resultados. Muestra la <b>estructura</b>. Por ejemplo, el costo de ventas es 60% de las ventas en el año 2 (7.200 / 12.000) y 58% en el año 1.</p>
  <h3>Análisis horizontal</h3><p>La variación de cada rubro entre períodos, en pesos y en porcentaje. Muestra la <b>tendencia</b>. Las ventas crecieron 20%; los créditos por ventas, 36%: los clientes están tardando más en pagar.</p>
  <div class="note"><b>Antes de calcular.</b> Los estados tienen que estar en moneda homogénea (RT 54), si no las comparaciones entre años no sirven. Y conviene leer las notas: un cambio de criterio contable puede explicar una variación.</div>`,
  ex:[{type:"num",items:[{q:"Análisis vertical: ¿qué % del activo total representan los bienes de uso en el año 2?",a:62.5,u:"%",tol:0.05},{q:"Análisis horizontal: ¿cuánto crecieron las ventas, en %?",a:20,u:"%",tol:0.05},{q:"¿Cuánto crecieron los créditos por ventas, en %? (una decimal)",a:36.4,u:"%",tol:0.1},{q:"Margen bruto del año 2 sobre ventas, en %",a:40,u:"%",tol:0.05}]}]},
 {lead:"Los indicadores de liquidez miden la capacidad de pagar las deudas de corto plazo.",
  html:`<div class="tw"><table><thead><tr><th>Indicador</th><th>Fórmula</th><th>Lectura</th></tr></thead><tbody>
  <tr><td><b>Liquidez corriente</b></td><td class="mono">Activo corriente / Pasivo corriente</td><td>Cuántos pesos de activo corriente hay por cada peso de deuda corriente</td></tr>
  <tr><td><b>Prueba ácida</b></td><td class="mono">(Activo corriente − Bienes de cambio) / Pasivo corriente</td><td>Lo mismo, sin el stock, que es lo menos líquido</td></tr>
  <tr><td><b>Liquidez inmediata</b></td><td class="mono">Caja y bancos / Pasivo corriente</td><td>Con qué se puede pagar hoy mismo</td></tr></tbody></table></div>
  <p>No hay un valor “correcto” universal: depende de la actividad. Un supermercado cobra al contado y paga a 60 días, y puede funcionar con liquidez menor a 1. Una constructora necesita más. Hay que comparar con el sector y con la propia historia.</p>
  <div class="note"><b>Cuidado con la calidad.</b> Una liquidez alta puede esconder créditos incobrables o stock obsoleto. Siempre mirá también los días de cobro y de inventario.</div>`,
  ex:[{type:"num",prompt:"Con los datos del año 2 de Andina SA:",items:[{q:"Liquidez corriente",a:1.5,tol:0.005},{q:"Prueba ácida",a:1,tol:0.005},{q:"Liquidez inmediata",a:0.25,tol:0.005},{q:"Liquidez corriente del año 1",a:1.5,tol:0.005}]}]},
 {lead:"Los indicadores de endeudamiento muestran cómo se financia la empresa y cuánto riesgo financiero asume.",
  html:`<div class="tw"><table><thead><tr><th>Indicador</th><th>Fórmula</th></tr></thead><tbody>
  <tr><td><b>Endeudamiento</b></td><td class="mono">Pasivo / Patrimonio neto</td></tr><tr><td><b>Solvencia</b></td><td class="mono">Patrimonio neto / Pasivo</td></tr>
  <tr><td><b>Autonomía</b></td><td class="mono">Patrimonio neto / Activo</td></tr><tr><td><b>Inmovilización</b></td><td class="mono">Activo no corriente / Activo</td></tr>
  <tr><td><b>Cobertura de intereses</b></td><td class="mono">Resultado operativo / Intereses</td></tr></tbody></table></div>
  <p>Un endeudamiento alto no es malo en sí mismo (puede apalancar la rentabilidad, Módulo 23), pero aumenta el riesgo: si caen las ventas, los intereses siguen.</p>
  <h3>Regla de financiamiento</h3><p>Los activos no corrientes (que se recuperan lentamente) deberían financiarse con fondos de largo plazo: patrimonio neto más pasivo no corriente. Si se financian con deuda de corto plazo, la empresa vive refinanciando.</p>`,
  ex:[{type:"num",prompt:"Con los datos del año 2:",items:[{q:"Endeudamiento (Pasivo / PN, dos decimales)",a:1.67,tol:0.005},{q:"Solvencia (PN / Pasivo)",a:0.6,tol:0.005},{q:"Autonomía, en %",a:37.5,u:"%",tol:0.05},{q:"¿Los fondos de largo plazo (PN + pasivo no corriente) alcanzan para cubrir el activo no corriente? Respondé el excedente en miles (con signo)",a:1000,u:"miles",hint:"PN 3.000 + pasivo no corriente 3.000 − activo no corriente 5.000"}]}]},
 {lead:"La rentabilidad mide cuánto gana la empresa en relación con lo que invierte. El modelo Du Pont explica de dónde viene.",
  html:`<div class="tw"><table><thead><tr><th>Indicador</th><th>Fórmula</th></tr></thead><tbody>
  <tr><td><b>Rentabilidad del PN (ROE)</b></td><td class="mono">Resultado neto / PN</td></tr><tr><td><b>Rentabilidad del activo (ROA)</b></td><td class="mono">Resultado (antes de intereses) / Activo</td></tr>
  <tr><td><b>Margen neto</b></td><td class="mono">Resultado neto / Ventas</td></tr><tr><td><b>Rotación del activo</b></td><td class="mono">Ventas / Activo</td></tr></tbody></table></div>
  <h3>Modelo Du Pont</h3><div class="formula">ROE = Margen neto × Rotación del activo × Apalancamiento (Activo / PN)</div>
  <p>Andina SA, año 2: 3,75% × 1,5 × 2,667 = <b>15%</b>. Se puede ganar lo mismo con mucho margen y poca rotación (una joyería) o con poco margen y mucha rotación (un supermercado).</p>
  <p>En el año 1 el ROE fue 500 / 2.700 = 18,5%. Bajó, aunque las ventas crecieron: el margen cayó de 5% a 3,75%.</p>
  <div class="note"><b>PN promedio.</b> Para mayor precisión se usa el PN (o el activo) promedio del ejercicio. En este módulo usamos el saldo de cierre para simplificar.</div>`,
  ex:[{type:"num",prompt:"Con los datos del año 2:",items:[{q:"Margen neto, en %",a:3.75,u:"%",tol:0.01},{q:"Rotación del activo",a:1.5,tol:0.005},{q:"Apalancamiento (Activo / PN, tres decimales)",a:2.667,tol:0.002},{q:"ROE, en %",a:15,u:"%",tol:0.05}]}]},
 {lead:"Los indicadores de gestión miden qué tan rápido se mueve el dinero: cuánto se tarda en vender, en cobrar y en pagar.",
  html:`<div class="tw"><table><thead><tr><th>Indicador</th><th>Fórmula</th></tr></thead><tbody>
  <tr><td><b>Días de inventario</b></td><td class="mono">Bienes de cambio / Costo de ventas × 365</td></tr><tr><td><b>Días de cobro</b></td><td class="mono">Créditos por ventas / Ventas (con IVA si los créditos lo incluyen) × 365</td></tr>
  <tr><td><b>Días de pago</b></td><td class="mono">Deudas comerciales / Compras × 365</td></tr><tr><td><b>Ciclo operativo</b></td><td class="mono">Días de inventario + Días de cobro</td></tr><tr><td><b>Ciclo de efectivo</b></td><td class="mono">Ciclo operativo − Días de pago</td></tr></tbody></table></div>
  <p>Si los créditos incluyen IVA y las ventas no, conviene sumarle el IVA a las ventas para que el cálculo sea homogéneo. En este módulo simplificamos usando las ventas netas.</p>
  <p>En Andina SA los días de cobro pasaron de 40 a casi 46: la empresa está financiando más a sus clientes. Junto con la caída del margen, sugiere que creció vendiendo con más plazo y menos precio.</p>`,
  ex:[{type:"num",prompt:"Con los datos del año 2 (una decimal):",items:[{q:"Días de cobro",a:45.6,u:"días",tol:0.1},{q:"Días de inventario",a:50.7,u:"días",tol:0.1},{q:"Días de pago",a:45,u:"días",tol:0.1},{q:"Ciclo de efectivo",a:51.3,u:"días",tol:0.2}]}]},
 {lead:"El análisis termina en un informe: un diagnóstico claro con fundamentos y recomendaciones.",
  html:`<h3>Estructura de un informe de análisis</h3><ol><li><b>Objetivo y destinatario:</b> no es lo mismo un banco que evalúa un préstamo que un inversor o el directorio.</li><li><b>Información utilizada</b> y sus limitaciones.</li><li><b>Situación financiera de corto plazo:</b> liquidez y ciclo de efectivo.</li><li><b>Situación patrimonial:</b> endeudamiento y estructura de financiamiento.</li><li><b>Situación económica:</b> rentabilidad y sus causas (Du Pont).</li><li><b>Conclusiones y recomendaciones.</b></li></ol>
  <h3>Ejemplo de conclusión para Andina SA</h3><div class="note">Andina SA creció 20% en ventas, pero su rentabilidad sobre el patrimonio bajó de 18,5% a 15% por la caída del margen neto (de 5% a 3,75%). Los días de cobro aumentaron, lo que indica que el crecimiento se logró extendiendo plazos. La liquidez se mantiene estable (1,5) y el endeudamiento es elevado (1,67 veces el PN), pero los activos fijos están cubiertos con fondos de largo plazo. Se recomienda revisar la política de precios y de crédito a clientes antes de seguir creciendo.</div>
  <h3>Limitaciones</h3><ul><li>Los estados son históricos.</li><li>Las cifras de cierre pueden no representar el año (estacionalidad).</li><li>Los criterios contables distintos dificultan comparar empresas.</li><li>Hay información relevante que no está en los estados (calidad de la gestión, mercado).</li></ul>`,
  ex:[{type:"mc",items:[
   {q:"Las ventas crecen 20% y los créditos por ventas 36%. ¿Qué sugiere?",o:["Mejoró la cobranza","Se está dando más plazo a los clientes","Bajó el stock","Aumentó la rentabilidad"],a:1},
   {q:"El ROE baja aunque las ventas suben. Con Du Pont, la primera causa a investigar es…",o:["La rotación","El margen","La inflación","El capital social"],a:1,ex:"El margen neto cayó de 5% a 3,75%."},
   {q:"Un banco evalúa un préstamo a 90 días. ¿Qué indicadores mirará primero?",o:["Rentabilidad sobre el PN","Liquidez y ciclo de efectivo","Inmovilización","Dividendos pagados"],a:1}]}]},
],

/* Módulo 25 · Auditoría */
CAMPUS.content[25] = {
lessons:[
 {lead:"La auditoría de estados contables es el examen que hace un contador independiente para opinar si esos estados presentan razonablemente la situación del ente.",
  html:`<h3>Para qué sirve</h3><p>Los estados contables los prepara la dirección, que tiene interés en mostrar buenos resultados. La opinión de un profesional independiente da <b>credibilidad</b> a esa información para bancos, inversores, socios y organismos de control.</p>
  <h3>Tipos de auditoría</h3><ul><li><b>Externa de estados contables:</b> la que firma un contador público independiente. Es una incumbencia exclusiva del contador (Ley 20.488).</li><li><b>Interna:</b> la realizan empleados o consultores de la propia organización para evaluar controles y procesos. Reporta a la dirección o al comité de auditoría.</li><li><b>Operativa o de gestión:</b> evalúa eficiencia y eficacia.</li><li><b>De cumplimiento:</b> verifica el cumplimiento de normas (impositivas, laborales, contractuales).</li><li><b>Forense:</b> investiga fraudes para uso judicial.</li><li><b>Gubernamental:</b> la que hacen la SIGEN, la AGN y los tribunales de cuentas.</li></ul>
  <h3>Seguridad razonable</h3><p>El auditor no revisa el 100% de las operaciones ni garantiza que no haya errores. Busca una <b>seguridad razonable</b> de que los estados no contienen <b>incorrecciones significativas</b>, debidas a error o fraude.</p>
  <h3>Responsabilidades</h3><p>La dirección es responsable de preparar los estados y de su control interno. El auditor es responsable de su opinión.</p>`,
  ex:[{type:"pick",title:"¿Qué tipo de auditoría es?",options:["Externa","Interna","Cumplimiento","Forense"],items:[["Un contador independiente dictamina sobre el balance anual para presentar al banco","Externa"],["Un área de la empresa revisa cada trimestre los controles de compras","Interna"],["Se revisa si la empresa liquidó bien las cargas sociales","Cumplimiento"],["Se investiga un desvío de fondos para presentar en un juicio","Forense"]]},
   {type:"tf",items:[["El auditor externo garantiza que los estados no tienen ningún error","Falso","Da seguridad razonable, no absoluta."],["La preparación de los estados contables es responsabilidad de la dirección","Verdadero"]]}]},
 {lead:"En Argentina, la auditoría se rige por la RT 37 de la FACPCE. Fija requisitos personales, normas para el trabajo y normas sobre el informe.",
  html:`<h3>Estructura de la RT 37</h3><p>Normas de auditoría, revisión, otros encargos de aseguramiento, certificación y servicios relacionados. Fue actualizada por resoluciones posteriores. Para entidades que aplican NIIF, la RT 32 adoptó las Normas Internacionales de Auditoría (NIA) del IAASB.</p>
  <h3>Independencia</h3><p>Es la condición esencial del auditor. La RT 37 enumera situaciones en que <b>no hay independencia</b>, entre otras:</p>
  <ul><li>Ser propietario, socio, director o administrador del ente, o tenerlo su cónyuge o parientes cercanos.</li><li>Estar en relación de dependencia con el ente.</li><li>Tener intereses económicos significativos en el ente.</li><li>Que los honorarios dependan del resultado del trabajo o de las conclusiones del informe.</li></ul>
  <h3>Otros requisitos</h3><ul><li><b>Competencia:</b> conocimientos y experiencia para el encargo.</li><li><b>Escepticismo profesional:</b> actitud de alerta ante posibles incorrecciones.</li><li><b>Juicio profesional</b> en cada decisión.</li><li><b>Control de calidad</b> en el estudio.</li></ul>
  <h3>Encargos que regula</h3><div class="tw"><table><thead><tr><th>Encargo</th><th>Nivel de seguridad</th></tr></thead><tbody>
  <tr><td>Auditoría</td><td>Razonable (opinión)</td></tr><tr><td>Revisión de estados de períodos intermedios</td><td>Limitada (conclusión negativa: “no tomamos conocimiento de…”)</td></tr><tr><td>Certificación</td><td>Constatación de hechos con registros</td></tr><tr><td>Compilación y procedimientos acordados</td><td>Sin seguridad</td></tr></tbody></table></div>`,
  ex:[{type:"pick",title:"¿El contador es independiente para auditar?",options:["Independiente","No independiente"],items:[["Su hermano es director de la sociedad","No independiente"],["Cobra honorarios fijos acordados por el trabajo","Independiente"],["Cobrará un plus si el balance muestra ganancias","No independiente"],["Es empleado del área de administración de la empresa","No independiente"],["No tiene vínculos con la empresa ni con sus dueños","Independiente"]]}]},
 {lead:"Planificar es decidir qué revisar, cuánto y cuándo. El enfoque moderno se basa en el riesgo.",
  html:`<h3>Conocimiento del ente</h3><p>Actividad, mercado, normas que lo afectan, estructura, sistemas, control interno, partes relacionadas, situación financiera.</p>
  <h3>Significatividad (materialidad)</h3><p>Es el importe a partir del cual una incorrección podría cambiar las decisiones de los usuarios. Se fija con juicio profesional, a menudo como un porcentaje de una base: 5% del resultado antes de impuestos, 1% a 2% de las ventas o del activo.</p>
  <h3>Riesgo de auditoría</h3><div class="formula">Riesgo de auditoría = Riesgo inherente × Riesgo de control × Riesgo de detección</div>
  <ul><li><b>Inherente:</b> la probabilidad de que una cuenta tenga errores por su naturaleza (estimaciones complejas, mucho efectivo).</li><li><b>De control:</b> la probabilidad de que el control interno no lo detecte.</li><li><b>De detección:</b> la probabilidad de que los procedimientos del auditor no lo encuentren. Es el único que el auditor controla.</li></ul>
  <p>Si el riesgo inherente y el de control son altos, el auditor tiene que bajar el riesgo de detección haciendo <b>más y mejores pruebas</b>.</p>
  <h3>Aseveraciones</h3><p>Lo que la dirección afirma implícitamente en los estados: <b>existencia u ocurrencia</b>, <b>integridad</b>, <b>exactitud y valuación</b>, <b>corte</b> (en el período correcto), <b>derechos y obligaciones</b> y <b>presentación</b>.</p>`,
  ex:[{type:"num",items:[{q:"Resultado antes de impuestos $ 20.000.000. Si la significatividad se fija en 5%, ¿cuánto es?",a:1000000,u:"$"},{q:"Riesgo de auditoría aceptable 5%, riesgo inherente 80% y riesgo de control 50%. ¿Riesgo de detección máximo, en %?",a:12.5,u:"%",tol:0.05,hint:"0,05 / (0,8 × 0,5)"}]},
   {type:"pick",title:"¿Qué aseveración se prueba?",options:["Existencia","Integridad","Valuación","Corte"],items:[["Contar físicamente el stock que figura en el balance","Existencia"],["Buscar facturas de proveedores recibidas en enero que corresponden a diciembre","Integridad"],["Verificar que la previsión de incobrables sea suficiente","Valuación"],["Revisar que las ventas de los últimos días del año se registraron en el ejercicio correcto","Corte"]]}]},
 {lead:"Antes de decidir cuánto probar, el auditor evalúa si los controles de la empresa funcionan.",
  html:`<h3>Pasos</h3><ol><li><b>Relevar</b> los controles de cada ciclo (ventas, compras, sueldos, tesorería) con entrevistas, cursogramas y cuestionarios.</li><li><b>Prueba de recorrido:</b> seguir una operación de punta a punta para confirmar que el sistema funciona como se describió.</li><li><b>Evaluar el diseño:</b> ¿el control, si funciona, previene o detecta errores?</li><li><b>Pruebas de controles:</b> si el auditor quiere confiar en un control, verifica que operó durante todo el período.</li></ol>
  <h3>Debilidades típicas</h3><ul><li>Falta de segregación de funciones.</li><li>Conciliaciones bancarias atrasadas o sin revisión.</li><li>Accesos al sistema sin restricciones.</li><li>Pagos sin control de tres vías.</li><li>Ausencia de recuentos físicos.</li></ul>
  <p>Las debilidades significativas se comunican a la dirección en una <b>carta de recomendaciones</b> (o informe de control interno), aunque no afecten la opinión.</p>
  <h3>El marco COSO</h3><p>El auditor evalúa los cinco componentes que vimos en el Módulo 10: entorno, riesgos, actividades de control, información y comunicación, y supervisión.</p>`,
  ex:[{type:"order",title:"Ordená la evaluación del control interno",items:["Relevar los controles del ciclo","Hacer una prueba de recorrido","Evaluar el diseño de los controles","Probar que los controles operaron en el período","Definir el alcance de las pruebas sustantivas","Comunicar las debilidades a la dirección"]}]},
 {lead:"La opinión del auditor tiene que apoyarse en evidencia suficiente y adecuada. Los procedimientos son las herramientas para obtenerla.",
  html:`<h3>Procedimientos de auditoría</h3><div class="tw"><table><thead><tr><th>Procedimiento</th><th>Ejemplo</th></tr></thead><tbody>
  <tr><td><b>Inspección</b> de documentos o activos</td><td>Revisar escrituras, contratos, facturas; ver un bien de uso</td></tr>
  <tr><td><b>Observación</b></td><td>Presenciar el recuento de inventario</td></tr>
  <tr><td><b>Confirmación externa</b> (circularización)</td><td>Pedir a bancos, clientes, proveedores y abogados que confirmen saldos y juicios</td></tr>
  <tr><td><b>Recálculo</b></td><td>Recalcular amortizaciones, intereses, impuestos</td></tr>
  <tr><td><b>Reejecución</b></td><td>Hacer de nuevo una conciliación bancaria</td></tr>
  <tr><td><b>Procedimientos analíticos</b></td><td>Comparar márgenes y ratios con años anteriores y con expectativas</td></tr>
  <tr><td><b>Indagación</b></td><td>Preguntar a la dirección y al personal</td></tr></tbody></table></div>
  <h3>Calidad de la evidencia</h3><p>La evidencia es más confiable si es <b>externa</b> (una confirmación del banco) que interna, si la obtiene el auditor directamente, si es documental y si es original.</p>
  <h3>Papeles de trabajo</h3><p>Documentan lo planificado, lo hecho, la evidencia y las conclusiones. Son propiedad del auditor y deben conservarse (en general, 10 años).</p>
  <h3>Al final del trabajo</h3><ul><li>Revisar <b>hechos posteriores</b> al cierre.</li><li>Obtener la <b>carta de manifestaciones</b> de la dirección (declara que entregó toda la información).</li><li>Evaluar si la empresa puede seguir como empresa en marcha.</li></ul>`,
  ex:[{type:"pick",title:"¿Qué procedimiento es?",options:["Inspección","Observación","Confirmación","Recálculo","Analítico"],items:[["Enviar una carta al banco para que confirme el saldo al cierre","Confirmación"],["Estar presente cuando la empresa cuenta su stock","Observación"],["Revisar el contrato de un préstamo","Inspección"],["Calcular de nuevo la amortización de los rodados","Recálculo"],["Comparar el margen bruto de cada mes con el del año anterior","Analítico"]]}]},
 {lead:"El auditor revisa muestras. El muestreo de auditoría permite sacar conclusiones sobre toda la población.",
  html:`<h3>Estadístico y no estadístico</h3><p>El <b>estadístico</b> usa la probabilidad para seleccionar la muestra y evaluar los resultados, y permite medir el riesgo de muestreo. El <b>no estadístico</b> se basa en el juicio del auditor.</p>
  <h3>Selección</h3><ul><li><b>Aleatoria</b> (Módulo 3).</li><li><b>Sistemática:</b> un intervalo fijo desde un punto al azar.</li><li><b>Por unidad monetaria (MUS):</b> cada peso es una unidad; las partidas grandes tienen más probabilidad de salir. El intervalo es población / tamaño de muestra.</li><li><b>Partidas clave:</b> se revisan al 100% las partidas grandes o inusuales y se muestrea el resto.</li></ul>
  <h3>Evaluación</h3><p>Los errores de la muestra se <b>proyectan</b> a la población. Si el error proyectado supera la significatividad, el auditor amplía las pruebas o pide ajustes.</p>
  <div class="formula">Error proyectado (método de la razón) = Error en la muestra / Valor de la muestra × Valor de la población</div>`,
  ex:[{type:"num",items:[{q:"Saldo de deudores $ 50.000.000 y muestra MUS de 100 unidades. ¿Intervalo de selección?",a:500000,u:"$"},{q:"Una muestra de $ 5.000.000 tiene errores por $ 50.000. La población es $ 80.000.000. ¿Error proyectado?",a:800000,u:"$"},{q:"Si la significatividad es $ 1.000.000, ¿el error proyectado la supera? Respondé 1 si sí y 0 si no.",a:0,tol:0}]}]},
 {lead:"El informe del auditor es el producto final: una opinión breve y estandarizada que cualquier lector puede interpretar.",
  html:`<h3>Tipos de opinión</h3><div class="tw"><table><thead><tr><th>Opinión</th><th>Cuándo</th></tr></thead><tbody>
  <tr><td><b>Favorable sin salvedades</b> (no modificada)</td><td>Los estados presentan razonablemente la situación, en todos los aspectos significativos.</td></tr>
  <tr><td><b>Con salvedades</b></td><td>Hay incorrecciones o limitaciones significativas, pero no generalizadas: “excepto por…”.</td></tr>
  <tr><td><b>Adversa</b></td><td>Las incorrecciones son significativas y generalizadas: los estados no presentan razonablemente.</td></tr>
  <tr><td><b>Abstención</b></td><td>El auditor no pudo obtener evidencia suficiente y el posible efecto es significativo y generalizado.</td></tr></tbody></table></div>
  <h3>Párrafos adicionales</h3><ul><li><b>Énfasis:</b> llama la atención sobre algo correctamente presentado pero importante (por ejemplo, una incertidumbre sobre la empresa en marcha).</li><li><b>Otras cuestiones.</b></li><li><b>Información requerida por disposiciones legales:</b> en Argentina el informe incluye, entre otros, que los estados surgen de registros llevados de acuerdo con las normas legales, la deuda devengada con el sistema previsional al cierre y si se aplicaron procedimientos de prevención del lavado de activos.</li></ul>
  <h3>Firma y legalización</h3><p>El informe lo firma el contador con su matrícula, y la firma se <b>legaliza</b> en el Consejo Profesional, que verifica que el profesional esté matriculado y habilitado.</p>`,
  ex:[{type:"pick",title:"¿Qué opinión corresponde?",options:["Sin salvedades","Con salvedades","Adversa","Abstención"],items:[["Todo está razonablemente presentado","Sin salvedades"],["La previsión para juicios está subestimada en un monto significativo, pero el resto está bien","Con salvedades"],["La empresa no aplicó el ajuste por inflación y eso distorsiona todos los rubros","Adversa"],["La empresa no permitió revisar ningún registro y se perdieron los libros","Abstención"]]}]},
 {lead:"Los contadores son sujetos obligados del sistema de prevención del lavado de activos y la financiación del terrorismo.",
  html:`<h3>Marco legal</h3><p>La <b>Ley 25.246</b> creó la <b>Unidad de Información Financiera (UIF)</b> y define a los sujetos obligados a informar. Entre ellos están los profesionales en ciencias económicas cuando realizan auditorías de estados contables o sindicaturas, en entes que superan determinados parámetros que fija la UIF.</p>
  <h3>Obligaciones del contador</h3><ul><li><b>Conocer al cliente:</b> identificarlo, entender su actividad y el origen de los fondos.</li><li><b>Analizar</b> las operaciones y detectar las inusuales.</li><li><b>Reportar operaciones sospechosas (ROS)</b> a la UIF dentro de los plazos que fija su normativa.</li><li><b>No revelar</b> al cliente que se hizo un reporte.</li><li><b>Conservar</b> la documentación.</li></ul>
  <p>Las normas profesionales (por ejemplo, las resoluciones de la FACPCE y de cada Consejo) detallan los procedimientos mínimos que el auditor debe aplicar y que menciona en su informe.</p>
  <h3>Señales de alerta</h3><ul><li>Operaciones en efectivo por montos inusuales para la actividad.</li><li>Aportes de capital de origen no justificado.</li><li>Uso de sociedades sin actividad real.</li><li>Clientes o proveedores en jurisdicciones de alto riesgo.</li><li>Cambios bruscos en el volumen de operaciones sin razón aparente.</li></ul>`,
  ex:[{type:"tf",items:[["El contador que hizo un reporte de operación sospechosa debe avisarle al cliente","Falso","Está prohibido revelarlo."],["Los contadores que auditan a ciertos entes son sujetos obligados ante la UIF","Verdadero"],["Un aporte de capital importante sin documentación de origen es una señal de alerta","Verdadero"],["La UIF fue creada por la Ley 25.246","Verdadero"]]}]},
],
