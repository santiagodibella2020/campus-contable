lessons:[
 {lead:"El Producto Bruto Interno (PBI) mide el valor de todos los bienes y servicios finales producidos en un país durante un período.",
  html:`<h3>Tres formas de medirlo</h3>
  <ul><li><b>Por el gasto:</b> PBI = C + I + G + (X − M). Consumo de los hogares, inversión, gasto del gobierno y exportaciones netas.</li>
  <li><b>Por la producción:</b> la suma del <b>valor agregado</b> de cada sector (lo que vende cada empresa menos lo que compró a otras). Así se evita contar dos veces el trigo, la harina y el pan.</li>
  <li><b>Por el ingreso:</b> la suma de sueldos, ganancias, rentas e intereses, más impuestos indirectos netos y amortizaciones.</li></ul>
  <h3>Nominal y real</h3>
  <p>El PBI <b>nominal</b> está a precios de cada año; el <b>real</b>, a precios de un año base. Solo el real muestra si se produjo más. La relación entre ambos es el deflactor del PBI.</p>
  <h3>Conceptos relacionados</h3>
  <ul><li><b>PBI per cápita:</b> PBI / población. Aproxima el nivel de vida, aunque no mide la distribución.</li>
  <li><b>PNB:</b> mide lo producido por los residentes del país, estén donde estén. Diferencia con el PBI: los ingresos netos de factores con el exterior (por ejemplo, intereses de deuda externa).</li></ul>
  <p>En Argentina, el INDEC publica las cuentas nacionales trimestrales. El IVA, justamente, es un impuesto sobre el valor agregado (Módulo 20).</p>`,
  ex:[{type:"num",items:[
   {q:"C = 700, I = 150, G = 200, X = 180, M = 160. ¿Cuál es el PBI?",a:1070},
   {q:"Un productor vende trigo por $ 100 al molino; el molino vende harina por $ 250 a la panadería; la panadería vende pan por $ 600. ¿Cuál es el valor agregado total?",a:600,u:"$",hint:"Es igual al valor del bien final."},
   {q:"El PBI nominal creció 60% y los precios 50%. ¿Cuánto creció el PBI real, en %? (dos decimales)",a:6.67,u:"%",tol:0.02,hint:"1,60 / 1,50 − 1"}]}]},
 {lead:"El dinero es lo que se acepta para pagar. El Banco Central regula cuánto hay y los bancos lo multiplican al prestar.",
  html:`<h3>Funciones del dinero</h3><ul><li>Medio de cambio.</li><li>Unidad de cuenta.</li><li>Reserva de valor (la que se pierde con la inflación).</li></ul>
  <h3>Agregados monetarios</h3>
  <ul><li><b>Base monetaria:</b> billetes y monedas en circulación más los depósitos de los bancos en el BCRA.</li>
  <li><b>M1:</b> circulante en poder del público más depósitos a la vista (cuentas corrientes).</li>
  <li><b>M2:</b> M1 más cajas de ahorro. <b>M3:</b> M2 más plazos fijos y otros depósitos.</li></ul>
  <h3>Creación de dinero bancario</h3>
  <p>Los bancos guardan una parte de los depósitos como encaje y prestan el resto, que vuelve a depositarse. Con un encaje del 20%, un depósito inicial de $ 1.000 puede generar hasta 1.000 / 0,20 = $ 5.000 de depósitos totales (multiplicador = 1 / encaje).</p>
  <h3>El BCRA</h3>
  <p>Creado en 1935. Según su Carta Orgánica (Ley 24.144, con reformas), tiene como finalidad promover la estabilidad monetaria y financiera, y con ella el empleo y el desarrollo. Sus herramientas: emisión, tasas de interés de referencia, encajes, operaciones de mercado abierto y regulación del mercado de cambios. También supervisa a las entidades financieras.</p>`,
  ex:[{type:"num",items:[{q:"Con un encaje del 25%, ¿cuál es el multiplicador bancario máximo?",a:4},{q:"Con ese encaje, un depósito inicial de $ 2.000 puede generar hasta ¿cuántos pesos de depósitos totales?",a:8000,u:"$"}]},
   {type:"pick",title:"¿En qué agregado entra por primera vez?",options:["Base monetaria","M1","M2","M3"],items:[
    ["Billetes en tu billetera","Base monetaria"],["Saldo de una cuenta corriente","M1"],["Saldo de una caja de ahorro","M2"],["Un plazo fijo a 30 días","M3"]]}]},
 {lead:"La inflación es el aumento generalizado y sostenido de los precios. Argentina es uno de los casos de inflación crónica más estudiados del mundo.",
  html:`<h3>Cómo se mide</h3><p>Con la variación del IPC (Índice de Precios al Consumidor) que publica el INDEC cada mes, con canastas regionales. Además están el IPIM (mayoristas) y el índice del costo de la construcción.</p>
  <h3>Causas, según distintas escuelas</h3>
  <ul><li><b>Monetaria:</b> emisión de dinero por encima del crecimiento de la demanda de dinero, típicamente para financiar déficit fiscal.</li>
  <li><b>De costos:</b> suba de salarios, tarifas o del tipo de cambio que se traslada a precios.</li>
  <li><b>Inercial:</b> contratos, salarios y precios que se indexan con la inflación pasada.</li>
  <li><b>De expectativas:</b> si todos esperan inflación, remarcan por adelantado.</li></ul>
  <h3>Efectos</h3>
  <ul><li>Pérdida de poder adquisitivo de salarios y jubilaciones.</li><li>Distorsión de precios relativos y dificultad para planificar.</li>
  <li>El <b>impuesto inflacionario</b>: quien tiene pesos pierde valor y el emisor gana (señoreaje).</li>
  <li><b>Distorsión contable:</b> los estados contables en moneda histórica dejan de ser comparables. Por eso las normas contables (hoy la RT 54, que absorbió a la antigua RT 6) exigen el ajuste por inflación (Módulo 14) y el ajuste impositivo en Ganancias (Módulo 21).</li></ul>
  <div class="note"><b>Efecto Olivera-Tanzi.</b> Descripto por el economista argentino Julio Olivera (y luego por Vito Tanzi): con inflación alta, el Estado cobra los impuestos con atraso y recauda menos en términos reales, lo que agranda el déficit.</div>`,
  ex:[{type:"tf",items:[
   ["La inflación beneficia a quienes tienen deudas en pesos a tasa fija","Verdadero","Devuelven pesos que valen menos."],
   ["Si los precios suben 2% un solo mes por una suba de tarifas y después se estabilizan, eso es inflación sostenida","Falso","Es un salto de precios puntual."],
   ["Con inflación alta, los estados contables en moneda histórica pierden comparabilidad","Verdadero"],
   ["El efecto Olivera-Tanzi aumenta la recaudación real","Falso","La reduce, porque el impuesto se cobra con pesos depreciados."],
   ["La inflación es un impuesto implícito sobre quienes tienen dinero en efectivo","Verdadero"]]}]},
 {lead:"El Estado influye en la actividad económica con dos grandes palancas: el presupuesto (política fiscal) y el dinero y las tasas (política monetaria).",
  html:`<h3>Política fiscal</h3>
  <p>Se maneja con el gasto público y los impuestos. Una política <b>expansiva</b> (más gasto o menos impuestos) estimula la demanda; una <b>contractiva</b>, la enfría. El resultado fiscal puede ser:</p>
  <ul><li><b>Primario:</b> ingresos menos gastos, sin contar los intereses de la deuda.</li><li><b>Financiero:</b> después de pagar intereses.</li></ul>
  <p>El déficit se financia con deuda o con emisión monetaria (lo que suele generar inflación).</p>
  <h3>Multiplicador del gasto</h3>
  <p>Un peso de gasto genera ingresos que vuelven a gastarse. Si la propensión marginal a consumir es c, el multiplicador simple es 1 / (1 − c). Con c = 0,8, el multiplicador es 5.</p>
  <h3>Política monetaria</h3>
  <p>El banco central controla la cantidad de dinero o la tasa de interés. Bajar la tasa abarata el crédito y estimula consumo e inversión; subirla frena la demanda y la inflación, y hace más atractivo ahorrar en pesos.</p>
  <h3>Política cambiaria</h3>
  <p>Define el régimen de tipo de cambio: fijo, flotante, o intermedios (bandas, flotación administrada, crawling peg). Lo vemos en la próxima lección.</p>`,
  ex:[{type:"num",items:[{q:"Si la propensión marginal a consumir es 0,75, ¿cuál es el multiplicador simple del gasto?",a:4},{q:"Con ese multiplicador, ¿cuánto aumenta el PBI si el gasto público sube $ 100.000 millones? (en millones)",a:400000,u:"millones"},{q:"Ingresos $ 1.000, gastos primarios $ 950, intereses $ 120. ¿Resultado financiero? (con signo)",a:-70}]},
   {type:"pick",title:"¿Expansiva o contractiva?",options:["Expansiva","Contractiva"],items:[["El BCRA baja la tasa de referencia","Expansiva"],["Se reduce el IVA","Expansiva"],["Se recortan obras públicas","Contractiva"],["Se suben los encajes bancarios","Contractiva"]]}]},
 {lead:"El tipo de cambio es el precio de una moneda extranjera. En Argentina es una de las variables que más afectan a las empresas.",
  html:`<h3>Balanza de pagos</h3>
  <ul><li><b>Cuenta corriente:</b> comercio de bienes y servicios, rentas (intereses, utilidades) y transferencias.</li>
  <li><b>Cuenta capital y financiera:</b> inversiones directas, préstamos, compra de activos.</li>
  <li>La variación de <b>reservas internacionales</b> del BCRA cierra la balanza.</li></ul>
  <h3>Tipo de cambio nominal y real</h3>
  <p>El <b>nominal</b> es cuántos pesos cuesta un dólar. El <b>real</b> ajusta por la inflación de ambos países: si el dólar sube 30% pero la inflación local es 50% y la de EE. UU. 3%, el peso en realidad se <b>apreció</b> en términos reales y el país se encareció.</p>
  <div class="formula">TCR = TCN × P* / P</div>
  <h3>Efectos de una devaluación</h3>
  <ul><li>Abarata las exportaciones y encarece las importaciones.</li><li>Puede trasladarse a precios (<i>pass-through</i>).</li>
  <li>Para la contabilidad: genera diferencias de cambio en activos y pasivos en moneda extranjera (Módulo 13).</li></ul>
  <h3>Comercio exterior</h3>
  <p>Los derechos de exportación (retenciones) y de importación los cobra la Aduana (dentro de ARCA). Las operaciones se rigen por el Código Aduanero (Ley 22.415).</p>`,
  ex:[{type:"num",items:[
   {q:"Una empresa debe US$ 10.000. El tipo de cambio pasa de $ 1.000 a $ 1.200. ¿Cuál es la diferencia de cambio en pesos? (pérdida, sin signo)",a:2000000,u:"$"},
   {q:"El tipo de cambio nominal sube 20%, la inflación local es 30% y la externa 0%. ¿Cuál es la variación del tipo de cambio real en %? (con signo, dos decimales)",a:-7.69,u:"%",tol:0.02,hint:"1,20 / 1,30 − 1"}]},
   {type:"tf",items:[["Una devaluación favorece a los exportadores","Verdadero"],["Las reservas del BCRA aumentan cuando el Banco Central vende dólares","Falso"],["Los intereses que paga el país por su deuda externa se registran en la cuenta corriente","Verdadero","Se registran como renta de la inversión."]]}]},
 {lead:"El INDEC produce las estadísticas oficiales que vas a usar como contador: IPC, salarios, empleo, pobreza y actividad.",
  html:`<h3>Mercado de trabajo (Encuesta Permanente de Hogares, EPH)</h3>
  <ul><li><b>Tasa de actividad:</b> población económicamente activa (ocupados + desocupados) / población total.</li>
  <li><b>Tasa de empleo:</b> ocupados / población total.</li>
  <li><b>Tasa de desocupación:</b> desocupados / población económicamente activa. Un desocupado es alguien que no trabaja y busca activamente trabajo.</li>
  <li><b>Informalidad:</b> asalariados sin descuento jubilatorio. Es un tema central para la liquidación de sueldos y la seguridad social (Módulo 22).</li></ul>
  <h3>Pobreza e indigencia</h3>
  <p>Se miden por ingresos: un hogar es <b>indigente</b> si no cubre la Canasta Básica Alimentaria (CBA) y <b>pobre</b> si no cubre la Canasta Básica Total (CBT), que suma bienes y servicios no alimentarios. Se calculan por adulto equivalente.</p>
  <h3>Otros indicadores útiles</h3>
  <ul><li><b>EMAE:</b> estimador mensual de actividad económica.</li><li><b>Índice de salarios:</b> evolución de salarios registrados y no registrados.</li>
  <li><b>Coeficiente de Gini:</b> desigualdad del ingreso, entre 0 (igualdad total) y 1 (máxima desigualdad).</li></ul>`,
  ex:[{type:"num",items:[

   {q:"Con los mismos datos, ¿tasa de actividad en %?",a:45,u:"%",tol:0.05},

 {lead:"Entender la historia económica argentina explica por qué las normas contables e impositivas del país son como son.",
  html:`<div class="tw"><table><thead><tr><th>Período</th><th>Modelo</th><th>Rasgos</th></tr></thead><tbody>
  <tr><td class="mono">1880 – 1930</td><td><b>Agroexportador</b></td><td>Exportación de carnes y granos a Europa, inmigración masiva, ferrocarriles con capital británico.</td></tr>
  <tr><td class="mono">1930 – 1976</td><td><b>Industrialización por sustitución de importaciones</b></td><td>Tras la crisis de 1930: industria orientada al mercado interno, mayor rol del Estado, creación del BCRA (1935). Ciclos de “stop and go” por falta de divisas.</td></tr>
  <tr><td class="mono">1976 – 1983</td><td><b>Apertura y endeudamiento</b></td><td>Reforma financiera de 1977, apertura comercial, fuerte endeudamiento externo. Crisis de la deuda de 1982.</td></tr>
  <tr><td class="mono">1983 – 1990</td><td><b>Inestabilidad</b></td><td>Plan Austral (1985). Hiperinflación de 1989 y 1990.</td></tr>
  <tr><td class="mono">1991 – 2001</td><td><b>Convertibilidad</b></td><td>Ley 23.928: 1 peso = 1 dólar, prohibición de indexar. Privatizaciones. Termina con la crisis de 2001 y la devaluación de enero de 2002.</td></tr>
  <tr><td class="mono">2002 – hoy</td><td><b>Posconvertibilidad</b></td><td>Pesificación, recuperación con alto precio de las materias primas, regreso de la inflación alta, controles de cambio en distintos períodos, reestructuraciones de deuda y programas de estabilización.</td></tr></tbody></table></div>
  <div class="note"><b>Huella contable.</b> La Convertibilidad prohibió la indexación y por eso el ajuste por inflación contable se suspendió desde 1995 (con una breve vuelta en 2002 y 2003). Recién se restableció con la Ley 27.468 (2018) y la Resolución JG 539/18 de la FACPCE, cuando la inflación acumulada de tres años superó el 100%.</div>`,

CAMPUS.content[6] = {
lessons:[
 {lead:"Una organización es un grupo de personas que coordina recursos para alcanzar objetivos que no lograrían por separado.",
  html:`<h3>Elementos de toda organización</h3><ul><li><b>Personas</b> con roles definidos.</li><li><b>Objetivos</b> compartidos.</li><li><b>Recursos:</b> financieros, materiales, tecnológicos, información.</li><li><b>Estructura</b> que asigna tareas y autoridad.</li><li><b>Contexto</b> con el que interactúa (clientes, proveedores, Estado, competencia).</li></ul>
  <h3>Clasificación</h3>
  <ul><li>Por su fin: <b>con fines de lucro</b> (empresas) o <b>sin fines de lucro</b> (asociaciones civiles, fundaciones, ONG).</li>
  <li>Por su propiedad: <b>privadas</b>, <b>públicas</b> (organismos del Estado, empresas estatales) o <b>mixtas</b>.</li>
  <li>Por su tamaño: en Argentina la categoría <b>MiPyME</b> se define por ventas anuales, actividad y personal, según topes que actualiza la Secretaría de la Pequeña y Mediana Empresa.</li></ul>
  <h3>La organización como sistema</h3>
  <p>Recibe insumos del contexto, los transforma y devuelve productos o servicios. La información contable es uno de sus subsistemas centrales: une las decisiones de todas las áreas en una sola medida, el dinero.</p>
  <h3>Escuelas de la administración</h3>
  <div class="tw"><table><thead><tr><th>Escuela</th><th>Autor</th><th>Idea central</th></tr></thead><tbody>
  <tr><td>Administración científica</td><td>Frederick Taylor</td><td>Estudio de tiempos y métodos para maximizar la eficiencia del trabajo.</td></tr>
  <tr><td>Clásica</td><td>Henri Fayol</td><td>Funciones del administrador: prever, organizar, dirigir, coordinar, controlar.</td></tr>
  <tr><td>Burocrática</td><td>Max Weber</td><td>Reglas formales, jerarquía, autoridad basada en el cargo.</td></tr>
  <tr><td>Relaciones humanas</td><td>Elton Mayo</td><td>La motivación y el grupo influyen en la productividad.</td></tr>
  <tr><td>Sistémica y contingente</td><td>Von Bertalanffy, Lawrence y Lorsch</td><td>No hay una única mejor forma: depende del contexto.</td></tr></tbody></table></div>`,
  ex:[{type:"pick",title:"¿Qué escuela representa cada idea?",options:["Científica","Clásica","Burocrática","Relaciones humanas","Contingente"],items:[
    ["Medir con cronómetro cuánto tarda un operario en cada tarea","Científica"],["Definir las funciones de prever, organizar, dirigir, coordinar y controlar","Clásica"],
    ["Manuales de procedimiento y jerarquías formales","Burocrática"],["Los experimentos de Hawthorne sobre la motivación","Relaciones humanas"],["La estructura ideal depende del contexto de la empresa","Contingente"]]}]},
 {lead:"Planificar es decidir hoy qué se quiere lograr y cómo. Sin un plan, el presupuesto y el control de gestión no tienen contra qué compararse.",
  html:`<h3>Niveles de planeamiento</h3><ul><li><b>Estratégico:</b> largo plazo, toda la organización, a cargo de la dirección. Define misión, visión y estrategia.</li><li><b>Táctico:</b> mediano plazo, por área (comercial, producción, finanzas).</li><li><b>Operativo:</b> corto plazo, tareas y presupuestos concretos.</li></ul>
  <h3>Misión, visión y objetivos</h3><p>La <b>misión</b> dice para qué existe la organización. La <b>visión</b>, qué quiere llegar a ser. Los <b>objetivos</b> deberían ser específicos, medibles, alcanzables, relevantes y con plazo (criterio SMART).</p>
  <h3>Herramientas de análisis</h3>
  <ul><li><b>FODA:</b> Fortalezas y Debilidades (internas), Oportunidades y Amenazas (externas).</li>
  <li><b>Cinco fuerzas de Porter:</b> rivalidad entre competidores, amenaza de nuevos ingresantes, de sustitutos, poder de negociación de clientes y de proveedores.</li>
  <li><b>Estrategias genéricas de Porter:</b> liderazgo en costos, diferenciación o enfoque en un nicho.</li>
  <li><b>PESTEL:</b> factores políticos, económicos, sociales, tecnológicos, ecológicos y legales del contexto.</li></ul>`,
  ex:[{type:"pick",title:"Clasificá en el FODA de un estudio contable",options:["Fortaleza","Debilidad","Oportunidad","Amenaza"],items:[
    ["Equipo con mucha experiencia en impuestos","Fortaleza"],["No tiene un sistema de gestión de clientes","Debilidad"],["Cambios normativos frecuentes que generan demanda de asesoramiento","Oportunidad"],
    ["Software que automatiza liquidaciones simples a bajo costo","Amenaza"],["Dependencia de dos clientes que explican el 60% de los honorarios","Debilidad"],["Crecimiento de emprendedores que necesitan inscribirse","Oportunidad"]]}]},
 {lead:"La estructura organizacional define quién hace qué, quién decide y quién reporta a quién. Se representa con el organigrama.",
  html:`<h3>Conceptos básicos</h3><ul><li><b>Departamentalización:</b> agrupar tareas por función (ventas, producción), por producto, por zona geográfica o por cliente.</li>
  <li><b>Tramo de control:</b> cuántas personas dependen directamente de un jefe.</li><li><b>Centralización:</b> en qué nivel se toman las decisiones.</li>
  <li><b>Línea y staff:</b> la línea tiene autoridad para ordenar; el staff asesora (por ejemplo, el área legal o la auditoría interna).</li></ul>
  <h3>Tipos de estructura</h3><ul><li><b>Funcional:</b> por áreas especializadas. Simple y eficiente, pero puede generar “silos”.</li>
  <li><b>Divisional:</b> por producto o región, cada división casi autónoma.</li><li><b>Matricial:</b> doble dependencia (función y proyecto).</li></ul>
  <div class="note"><b>Oposición de intereses.</b> Un principio del control interno es separar funciones: quien autoriza una compra no debería ser quien registra el pago ni quien custodia el dinero. Esto se diseña desde la estructura y lo vemos en el Módulo 10.</div>
  <h3>Manuales</h3><p>La estructura se documenta en manuales de organización (funciones de cada puesto), de procedimientos (cómo se hace cada tarea) y de políticas (criterios para decidir).</p>`,
  ex:[{type:"tf",items:[["Una estructura funcional agrupa las tareas por especialidad","Verdadero"],["En una matricial cada empleado tiene un único jefe","Falso","Tiene doble dependencia."],["La auditoría interna suele ser un órgano de staff","Verdadero"],["Es buena práctica que la misma persona autorice, pague y registre las compras","Falso","Viola la oposición de intereses."]]}]},
 {lead:"Dirigir es lograr que las personas hagan lo planificado. Implica liderar, motivar, comunicar y decidir.",
  html:`<h3>Teorías de la motivación</h3><ul><li><b>Maslow:</b> pirámide de necesidades (fisiológicas, seguridad, sociales, estima, autorrealización).</li>
  <li><b>Herzberg:</b> factores higiénicos (sueldo, condiciones) evitan la insatisfacción; los motivadores (reconocimiento, desafío) generan satisfacción.</li>
  <li><b>McGregor:</b> Teoría X (las personas evitan el trabajo y necesitan control) frente a Teoría Y (buscan responsabilidad).</li></ul>
  <h3>Estilos de liderazgo</h3><p>Autocrático, democrático o participativo, y <i>laissez-faire</i>. El liderazgo situacional sostiene que el estilo debe adaptarse a la madurez del equipo.</p>
  <h3>El proceso de decisión</h3><ol><li>Identificar el problema.</li><li>Generar alternativas.</li><li>Evaluarlas con criterios (costo, riesgo, tiempo).</li><li>Elegir e implementar.</li><li>Controlar el resultado.</li></ol>
  <p>Herbert Simon mostró que las personas deciden con <b>racionalidad limitada</b>: no buscan la mejor opción posible sino una satisfactoria, porque la información y el tiempo son escasos. La información contable confiable reduce esa limitación.</p>`,
  ex:[{type:"pick",title:"Según Herzberg, ¿es factor higiénico o motivador?",options:["Higiénico","Motivador"],items:[["El sueldo","Higiénico"],["El reconocimiento por un buen trabajo","Motivador"],["Las condiciones de la oficina","Higiénico"],["Tareas desafiantes con responsabilidad","Motivador"],["La relación con el supervisor","Higiénico"]]}]},
 {lead:"Controlar es comparar lo que pasó con lo que se planificó, entender por qué hay diferencias y corregir.",
  html:`<h3>El ciclo de control</h3><ol><li>Fijar estándares o metas.</li><li>Medir el desempeño real.</li><li>Comparar y calcular desvíos.</li><li>Analizar causas y tomar acciones correctivas.</li></ol>
  <h3>Tipos de control</h3><ul><li><b>Preventivo:</b> antes de que ocurra (aprobación previa de una compra).</li><li><b>Concurrente:</b> durante la operación (supervisión).</li><li><b>Posterior:</b> después (comparar el presupuesto con lo real).</li></ul>
  <h3>Indicadores y tablero de comando</h3><p>Un indicador clave de desempeño (KPI) mide un objetivo: margen bruto, días de cobro, rotación de inventario, ventas por empleado. El <b>Balanced Scorecard</b> de Kaplan y Norton organiza los indicadores en cuatro perspectivas: financiera, clientes, procesos internos, y aprendizaje y crecimiento.</p>
  <div class="note"><b>El contador en el control.</b> El presupuesto (Módulo 18), el análisis de desvíos y los indicadores financieros (Módulo 24) son herramientas que normalmente arma y explica el área contable.</div>`,
  ex:[{type:"num",items:[{q:"Se presupuestaron ventas por $ 5.000.000 y se vendieron $ 4.600.000. ¿Desvío en %? (con signo)",a:-8,u:"%",tol:0.05},{q:"Un vendedor tiene meta de 40 clientes nuevos y logró 46. ¿Porcentaje de cumplimiento?",a:115,u:"%",tol:0.05}]},
   {type:"pick",title:"¿Qué tipo de control es?",options:["Preventivo","Concurrente","Posterior"],items:[["El gerente debe firmar toda compra superior a $ 1 millón","Preventivo"],["Un supervisor revisa la línea de producción durante el turno","Concurrente"],["A fin de mes se comparan gastos reales con los presupuestados","Posterior"]]}]},
 {lead:"Antes de emprender hay que elegir una forma jurídica. La elección cambia la responsabilidad, los impuestos y las obligaciones contables.",
  html:`<div class="tw"><table><thead><tr><th>Forma</th><th>Responsabilidad</th><th>Impuestos (en general)</th><th>Para quién</th></tr></thead><tbody>
  <tr><td><b>Monotributo</b> (persona humana)</td><td>Ilimitada con su patrimonio</td><td>Cuota fija mensual que incluye impuestos y seguridad social</td><td>Pequeños contribuyentes que no superan los topes de facturación</td></tr>
  <tr><td><b>Responsable inscripto</b> (persona humana)</td><td>Ilimitada</td><td>IVA, Ganancias (escala progresiva), autónomos</td><td>Quienes superan el Monotributo</td></tr>
  <tr><td><b>SAS</b></td><td>Limitada al capital suscripto</td><td>IVA, Ganancias de sociedades</td><td>Emprendimientos que buscan constitución simple</td></tr>
  <tr><td><b>SRL</b></td><td>Limitada a las cuotas</td><td>IVA, Ganancias de sociedades</td><td>Empresas familiares o de pocos socios (máximo 50)</td></tr>
  <tr><td><b>SA</b></td><td>Limitada a las acciones</td><td>IVA, Ganancias de sociedades</td><td>Empresas medianas y grandes, posibilidad de cotizar</td></tr>
  <tr><td><b>Cooperativa</b></td><td>Limitada</td><td>Régimen especial</td><td>Grupos que se asocian para un fin común (trabajo, consumo, vivienda)</td></tr></tbody></table></div>
  <p>Los detalles de cada tipo societario están en el Módulo 16; los impuestos, en los Módulos 20 y 21.</p>
  <h3>Plan de negocios</h3><p>Antes de empezar conviene armar un plan con: descripción del producto, análisis de mercado y competencia, plan comercial, plan de operaciones, organización y equipo, y proyección económica y financiera (inversión inicial, flujo de fondos, punto de equilibrio).</p>`,
  ex:[{type:"tf",items:[["En el Monotributo, la persona responde con todo su patrimonio personal","Verdadero"],["Una SRL puede tener hasta 50 socios","Verdadero","Art. 146 de la Ley General de Sociedades."],["Una SA nunca paga Impuesto a las Ganancias porque lo pagan los accionistas","Falso","La sociedad tributa Ganancias como sujeto y además se gravan los dividendos."],["La SAS limita la responsabilidad de los socios al capital que suscriben","Verdadero"]]}]},
],

CAMPUS.content[7] = {
lessons:[
 {lead:"La Constitución Nacional es la ley suprema. Todas las demás normas, incluidas las impositivas, tienen que respetarla.",
  html:`<p>La Constitución argentina data de 1853, con reformas en 1860, 1866, 1898, 1957 y 1994. Tiene una parte <b>dogmática</b> (declaraciones, derechos y garantías) y una parte <b>orgánica</b> (organización de los poderes).</p>
  <h3>Pirámide jurídica</h3>
  <ol><li>Constitución Nacional y tratados de derechos humanos con jerarquía constitucional (art. 75 inc. 22).</li><li>Otros tratados internacionales (superiores a las leyes).</li><li>Leyes del Congreso.</li><li>Decretos del Poder Ejecutivo.</li><li>Resoluciones y normas de organismos (por ejemplo, resoluciones generales de ARCA).</li></ol>
  <h3>Derechos clave para la vida económica</h3>
  <ul><li><b>Art. 14:</b> trabajar y ejercer toda industria lícita, comerciar, usar y disponer de la propiedad, asociarse.</li>
  <li><b>Art. 14 bis:</b> derechos del trabajador (jornada limitada, salario mínimo, protección contra el despido arbitrario) y seguridad social.</li>
  <li><b>Art. 16:</b> igualdad ante la ley. “La igualdad es la base del impuesto y de las cargas públicas.”</li>
  <li><b>Art. 17:</b> la propiedad es inviolable; solo el Congreso impone las contribuciones del art. 4; la confiscación está prohibida.</li>
  <li><b>Art. 19:</b> nadie está obligado a hacer lo que la ley no manda ni privado de lo que ella no prohíbe.</li>
  <li><b>Art. 28:</b> las leyes que reglamentan los derechos no pueden alterarlos (principio de razonabilidad).</li></ul>
  <h3>Garantías</h3><p>El <b>amparo</b> (art. 43) protege contra actos que lesionen derechos de manera manifiestamente ilegal o arbitraria. El <b>hábeas data</b> permite acceder a los datos propios en registros públicos o privados y pedir su corrección.</p>`,
  ex:[{type:"pick",title:"¿Qué artículo de la Constitución aplica?",options:["Art. 14","Art. 14 bis","Art. 16","Art. 17","Art. 19"],items:[
   ["Un empleado reclama protección contra el despido arbitrario","Art. 14 bis"],["Se discute si un impuesto trata distinto a contribuyentes en igual situación","Art. 16"],
   ["Un impuesto se creó por decreto en lugar de por ley","Art. 17"],["Una persona quiere abrir un comercio","Art. 14"],["Nadie puede ser obligado a hacer lo que la ley no manda","Art. 19"]]}]},
 {lead:"Argentina adopta la forma representativa, republicana y federal (art. 1). El poder se divide entre tres órganos y entre Nación, provincias y municipios.",
  html:`<h3>División de poderes</h3>
  <div class="tw"><table><thead><tr><th>Poder</th><th>Integración</th><th>Funciones principales</th></tr></thead><tbody>
  <tr><td><b>Legislativo</b></td><td>Congreso: Cámara de Diputados (representa al pueblo) y Senado (3 senadores por provincia y 3 por la Ciudad de Buenos Aires)</td><td>Dictar leyes, crear impuestos, aprobar el presupuesto, controlar al Ejecutivo. La Auditoría General de la Nación lo asiste en el control externo.</td></tr>
  <tr><td><b>Ejecutivo</b></td><td>Presidente, con jefe de gabinete y ministros</td><td>Administrar el país, reglamentar leyes, recaudar.</td></tr>
  <tr><td><b>Judicial</b></td><td>Corte Suprema y tribunales inferiores</td><td>Resolver conflictos y controlar que las normas respeten la Constitución.</td></tr></tbody></table></div>
  <h3>Cómo se hace una ley</h3><ol><li>Se presenta el proyecto en una cámara (las leyes sobre contribuciones deben empezar en Diputados, art. 52).</li><li>La cámara de origen lo aprueba.</li><li>La cámara revisora lo aprueba, lo modifica o lo rechaza.</li><li>El Poder Ejecutivo lo promulga o lo veta.</li><li>Se publica en el Boletín Oficial y entra en vigencia.</li></ol>
  <h3>Decretos</h3><ul><li><b>Reglamentarios</b> (art. 99 inc. 2): detallan cómo se aplica una ley.</li><li><b>Delegados</b> (art. 76): en materias de administración o emergencia, con plazo y bases fijadas por el Congreso.</li>
  <li><b>De necesidad y urgencia</b> (art. 99 inc. 3): en situaciones excepcionales. Están <b>prohibidos en materia penal, tributaria, electoral y de partidos políticos</b>.</li></ul>
  <h3>Niveles de gobierno</h3><p>Las provincias conservan todo el poder no delegado a la Nación (art. 121) y dictan su propia constitución. Los municipios tienen autonomía (art. 123). La Ciudad de Buenos Aires tiene un régimen autónomo (art. 129).</p>`,
  ex:[{type:"order",title:"Ordená la formación de una ley tributaria",items:["Presentación del proyecto en la Cámara de Diputados","Aprobación en la cámara de origen","Aprobación en el Senado","Promulgación por el Poder Ejecutivo","Publicación en el Boletín Oficial"]},
   {type:"tf",items:[["Un decreto de necesidad y urgencia puede crear un impuesto","Falso","El art. 99 inc. 3 lo prohíbe expresamente."],["Las provincias conservan los poderes no delegados a la Nación","Verdadero"]]}]},
 {lead:"El poder del Estado de cobrar impuestos no es ilimitado. La Constitución fija principios que todo tributo debe respetar.",
  html:`<h3>Principios constitucionales de la tributación</h3>
  <ul><li><b>Legalidad o reserva de ley:</b> no hay tributo sin ley (arts. 4, 17, 19, 52, 75 y 99). La ley debe definir los elementos esenciales: hecho imponible, sujetos, base, alícuota y exenciones.</li>
  <li><b>Igualdad:</b> igual tratamiento a quienes están en igualdad de condiciones (art. 16). Permite categorías razonables.</li>
  <li><b>Capacidad contributiva:</b> cada uno debe contribuir según su aptitud económica (ingresos, patrimonio, consumo).</li>
  <li><b>Generalidad:</b> nadie debe quedar exento por privilegios personales.</li>
  <li><b>No confiscatoriedad:</b> el tributo no puede absorber una parte sustancial de la renta o del capital. La Corte Suprema ha tomado como referencia el 33%, según el caso.</li>
  <li><b>Razonabilidad y proporcionalidad.</b></li></ul>
  <h3>Recursos del Tesoro (art. 4)</h3><p>Derechos de importación y exportación, venta o locación de tierras nacionales, renta de correos, demás contribuciones que imponga el Congreso equitativa y proporcionalmente, empréstitos y operaciones de crédito.</p>
  <h3>Reparto de potestades (art. 75 inc. 1 y 2)</h3>
  <ul><li><b>Derechos aduaneros:</b> exclusivos de la Nación.</li><li><b>Impuestos indirectos</b> (como el IVA): concurrentes entre Nación y provincias.</li>
  <li><b>Impuestos directos</b> (como Ganancias o Bienes Personales): en principio son de las provincias. La Nación puede crearlos por tiempo determinado, cuando la defensa, la seguridad común y el bien general lo exijan. Por eso Ganancias se prorroga periódicamente.</li></ul>`,
  ex:[{type:"pick",title:"¿Qué principio se vulnera?",options:["Legalidad","Igualdad","No confiscatoriedad","Capacidad contributiva"],items:[
   ["Una resolución de un organismo fija la alícuota de un impuesto que la ley no estableció","Legalidad"],["Un impuesto absorbe el 70% de la renta de un inmueble","No confiscatoriedad"],
   ["Se grava distinto a dos comercios idénticos solo por el apellido del dueño","Igualdad"],["Se cobra el mismo impuesto sobre el patrimonio a quien no tiene bienes que a quien tiene muchos","Capacidad contributiva"]]}]},
 {lead:"Nación, provincias y municipios recaudan impuestos, pero la mayor parte la cobra la Nación y después la reparte. Ese sistema se llama coparticipación.",
  html:`<h3>Ley 23.548 de Coparticipación Federal</h3><p>Rige desde 1988 como régimen “transitorio”, que sigue vigente. Distribuye la masa coparticipable (principalmente IVA y Ganancias) entre la Nación y las provincias.</p>
  <ul><li><b>Distribución primaria:</b> entre Nación y el conjunto de provincias.</li><li><b>Distribución secundaria:</b> entre las provincias, según porcentajes fijos de la ley.</li></ul>
  <p>Cada provincia, a su vez, coparticipa con sus municipios.</p>
  <h3>Reforma de 1994</h3><p>El art. 75 inc. 2 ordena dictar una nueva <b>ley convenio</b> sobre la base de acuerdos entre la Nación y las provincias, con criterios objetivos y solidarios. La disposición transitoria sexta fijó el plazo de 1996, que no se cumplió.</p>
  <h3>Impuestos por nivel de gobierno</h3>
  <div class="tw"><table><thead><tr><th>Nivel</th><th>Ejemplos</th></tr></thead><tbody>
  <tr><td>Nacional</td><td>IVA, Ganancias, Bienes Personales, Impuesto sobre los Créditos y Débitos bancarios, internos, derechos aduaneros, contribuciones a la seguridad social</td></tr>
  <tr><td>Provincial</td><td>Ingresos Brutos, Sellos, Inmobiliario, Automotor</td></tr>
  <tr><td>Municipal</td><td>Tasas (por ejemplo, de seguridad e higiene, alumbrado, barrido y limpieza)</td></tr></tbody></table></div>
  <div class="note"><b>Impuesto, tasa y contribución.</b> El <b>impuesto</b> se paga sin contraprestación específica. La <b>tasa</b> retribuye un servicio concreto e individualizado. La <b>contribución especial</b> se cobra por un beneficio derivado de una obra pública (por ejemplo, pavimento). Lo profundizamos en el Módulo 20.</div>`,
  ex:[{type:"pick",title:"¿Qué nivel de gobierno lo cobra?",options:["Nacional","Provincial","Municipal"],items:[["IVA","Nacional"],["Ingresos Brutos","Provincial"],["Tasa de seguridad e higiene","Municipal"],["Impuesto de Sellos","Provincial"],["Bienes Personales","Nacional"],["Impuesto Inmobiliario","Provincial"]]}]},
 {lead:"Cuando el Estado decide algo que afecta a una persona o empresa, lo hace mediante un acto administrativo.",
  html:`<p>El acto administrativo es una declaración unilateral de un órgano estatal, en ejercicio de función administrativa, que produce efectos jurídicos directos sobre particulares. Ejemplos: una determinación de deuda de ARCA, una habilitación municipal, una multa.</p>
  <h3>Elementos esenciales (Ley 19.549, art. 7 y 8)</h3>
  <ul><li><b>Competencia:</b> lo dicta el órgano que tiene facultades para hacerlo.</li><li><b>Causa:</b> los hechos y el derecho que lo justifican.</li><li><b>Objeto:</b> lo que decide, que debe ser cierto, física y jurídicamente posible.</li>
  <li><b>Procedimiento:</b> se cumplen los pasos previos (incluido el dictamen jurídico cuando corresponde).</li><li><b>Motivación:</b> se expresan las razones.</li><li><b>Finalidad:</b> la que tuvo en miras la norma que otorga la facultad.</li><li><b>Forma:</b> por escrito, como regla.</li></ul>
  <h3>Caracteres</h3><ul><li><b>Presunción de legitimidad:</b> se presume válido mientras no se declare lo contrario.</li><li><b>Ejecutoriedad:</b> la Administración puede ejecutarlo por sí misma, salvo que la ley exija intervención judicial.</li></ul>
  <h3>Nulidad</h3><p>Un acto con vicios graves en sus elementos es <b>nulo</b> (por ejemplo, dictado por un órgano incompetente). Con vicios leves es <b>anulable</b>.</p>`,
  ex:[{type:"pick",title:"¿Qué elemento del acto está viciado?",options:["Competencia","Causa","Objeto","Motivación","Finalidad"],items:[
   ["Una multa la firma un empleado que no tiene facultades para sancionar","Competencia"],["La resolución no explica por qué se aplica la sanción","Motivación"],
   ["Se clausura un local por una infracción que nunca ocurrió","Causa"],["Se ordena algo imposible de cumplir","Objeto"],["Un funcionario usa una facultad de inspección para perjudicar a un competidor de un amigo","Finalidad"]]}]},
 {lead:"Si un acto administrativo te perjudica, podés cuestionarlo. Saber los plazos es esencial: un recurso presentado tarde se pierde.",
  html:`<h3>Recursos administrativos generales</h3><p>Rigen por la Ley 19.549 y su reglamento (Decreto 1759/72, con sus modificaciones).</p>
  <ul><li><b>Reconsideración:</b> ante el mismo órgano que dictó el acto. Plazo: 10 días hábiles administrativos.</li>
  <li><b>Jerárquico:</b> ante el órgano superior, para que lo revise. Plazo: 15 días hábiles administrativos.</li>
  <li><b>Alzada:</b> contra actos de entes descentralizados, ante el ministerio correspondiente.</li></ul>
  <p>Agotada la vía administrativa, se puede ir a la justicia en el plazo que fija la ley.</p>
  <h3>En materia tributaria nacional</h3><p>La Ley 11.683 tiene un régimen propio. Contra una determinación de oficio o una multa de ARCA se puede optar, dentro de los 15 días hábiles, entre el <b>recurso de reconsideración</b> ante el superior jerárquico o el <b>recurso de apelación ante el Tribunal Fiscal de la Nación</b> (cuando el monto supera el mínimo legal). Lo vemos en detalle en el Módulo 20.</p>
  <div class="note"><b>Días hábiles.</b> En el procedimiento administrativo y tributario los plazos se cuentan en días hábiles administrativos: se excluyen sábados, domingos, feriados y días no laborables para la Administración.</div>`,
  ex:[{type:"tf",items:[["El recurso de reconsideración se presenta ante el mismo órgano que dictó el acto","Verdadero"],["El plazo general del recurso jerárquico es de 15 días hábiles administrativos","Verdadero"],["Contra una determinación de oficio de ARCA se puede apelar ante el Tribunal Fiscal de la Nación","Verdadero","Si el monto supera el mínimo que fija la ley."],["Los plazos administrativos se cuentan en días corridos, incluidos los fines de semana","Falso"]]}]},
],

lessons:[
 {lead:"El Código Civil y Comercial de la Nación (Ley 26.994, vigente desde el 1/8/2015) unificó el derecho civil y el comercial. Es la base legal de casi todo lo que hace un contador.",
  html:`<h3>Persona humana</h3><ul><li><b>Capacidad de derecho:</b> la aptitud para ser titular de derechos. La tiene toda persona.</li><li><b>Capacidad de ejercicio:</b> la aptitud para ejercer esos derechos por sí misma. Se adquiere plenamente a los <b>18 años</b> (art. 25). Puede restringirse por sentencia judicial.</li>
  <li><b>Atributos:</b> nombre, domicilio, estado civil, capacidad y patrimonio.</li></ul>
  <h3>Persona jurídica</h3><p>Es un ente al que el ordenamiento le reconoce aptitud para adquirir derechos y contraer obligaciones (art. 141). Tiene <b>personalidad distinta</b> de la de sus miembros: lo que debe la sociedad no lo deben, en principio, los socios.</p>
  <ul><li><b>Públicas</b> (art. 146): el Estado nacional, las provincias, los municipios, las entidades autárquicas.</li>
  <li><b>Privadas</b> (art. 148): sociedades, asociaciones civiles, simples asociaciones, fundaciones, iglesias, mutuales, cooperativas, consorcios de propiedad horizontal, entre otras.</li></ul>
  <h3>Atributos de la persona jurídica</h3><p>Nombre (denominación), domicilio y sede, objeto, patrimonio y duración. El <b>objeto</b> marca qué actividades puede realizar.</p>
  <div class="note"><b>Inoponibilidad de la personalidad.</b> Si la persona jurídica se usa para fines ajenos a ella, para violar la ley o perjudicar a terceros, los socios o controlantes que lo hicieron posible responden personalmente (art. 144).</div>`,
  ex:[{type:"pick",title:"¿Persona humana, jurídica pública o jurídica privada?",options:["Humana","Jurídica pública","Jurídica privada"],items:[
   ["Un consorcio de propiedad horizontal","Jurídica privada"],["La Provincia de Córdoba","Jurídica pública"],["Un comerciante monotributista","Humana"],["Una fundación","Jurídica privada"],["Una cooperativa de trabajo","Jurídica privada"],["Un municipio","Jurídica pública"]]},
   {type:"tf",items:[["La capacidad de ejercicio plena se adquiere a los 21 años","Falso","A los 18 años, art. 25 del CCyC."],["Las deudas de una SRL son, en principio, deudas personales de sus socios","Falso","La persona jurídica tiene patrimonio propio."]]}]},
 {lead:"No todo lo que pasa tiene efectos jurídicos. El derecho distingue entre hechos, actos voluntarios y actos jurídicos.",
  html:`<ul><li><b>Hecho jurídico</b> (art. 257): todo acontecimiento que produce el nacimiento, modificación o extinción de relaciones jurídicas. Puede ser natural (un granizo que destruye la cosecha) o humano.</li>
  <li><b>Acto voluntario:</b> el ejecutado con discernimiento, intención y libertad (art. 260).</li>
  <li><b>Acto jurídico</b> (art. 259): el acto voluntario lícito que tiene por fin inmediato crear, modificar o extinguir relaciones jurídicas. Ejemplo: firmar un contrato.</li></ul>
  <h3>Vicios de los actos</h3><div class="tw"><table><thead><tr><th>Vicio</th><th>Qué es</th></tr></thead><tbody>
  <tr><td><b>Error</b></td><td>Una falsa noción de la realidad que es esencial y reconocible.</td></tr>
  <tr><td><b>Dolo</b></td><td>Engaño o maniobra para lograr que el otro celebre el acto.</td></tr>
  <tr><td><b>Violencia</b></td><td>Fuerza irresistible o amenazas.</td></tr>
  <tr><td><b>Lesión</b></td><td>Aprovechar la necesidad, debilidad o inexperiencia de otro para obtener una ventaja patrimonial desproporcionada.</td></tr>
  <tr><td><b>Simulación</b></td><td>Encubrir el verdadero carácter del acto (una venta que en realidad es una donación).</td></tr>
  <tr><td><b>Fraude</b></td><td>Actos del deudor para perjudicar a sus acreedores (por ejemplo, transferir bienes para que no se los embarguen).</td></tr></tbody></table></div>
  <h3>Nulidad</h3><p><b>Absoluta:</b> el acto contraviene el orden público; puede declararla el juez de oficio y no se puede confirmar. <b>Relativa:</b> protege a ciertas personas; solo ellas pueden pedirla y se puede confirmar (art. 386 y siguientes).</p>`,
  ex:[{type:"pick",title:"Identificá el vicio",options:["Error","Dolo","Violencia","Lesión","Simulación","Fraude"],items:[
   ["Alguien firma un contrato bajo amenaza de muerte","Violencia"],["El vendedor adultera el cuentakilómetros del auto","Dolo"],["Un deudor dona su casa a un hijo para que sus acreedores no la ejecuten","Fraude"],
   ["Se compra a precio vil el campo de un anciano que necesitaba plata urgente","Lesión"],["Se escritura una venta, pero en realidad nunca se pagó precio: es un regalo","Simulación"],["Se compra un terreno creyendo que es otro lote","Error"]]}]},
 {lead:"Una obligación es una relación jurídica en la que el acreedor puede exigir al deudor una prestación (art. 724).",
  html:`<h3>Elementos</h3><ul><li><b>Sujetos:</b> acreedor y deudor.</li><li><b>Objeto:</b> la prestación, que debe ser material y jurídicamente posible, lícita, determinada o determinable y con interés para el acreedor.</li><li><b>Causa:</b> el hecho que la genera (un contrato, un daño, la ley).</li></ul>
  <h3>Clases</h3><ul><li><b>De dar:</b> cosas ciertas, cosas genéricas o sumas de dinero.</li><li><b>De hacer:</b> prestar un servicio.</li><li><b>De no hacer:</b> abstenerse (por ejemplo, no competir).</li></ul>
  <h3>Obligaciones de dar dinero</h3><p>Si se pactó en moneda extranjera, según los arts. 765 y 766 en su redacción vigente (modificados por el DNU 70/2023), el deudor debe entregar la moneda pactada.</p>
  <h3>Intereses</h3><ul><li><b>Compensatorios</b> (art. 767): el precio por el uso del capital.</li><li><b>Moratorios</b> (art. 768): por el atraso en pagar.</li><li><b>Punitorios</b> (art. 769): sanciones convencionales por incumplimiento.</li></ul>
  <h3>Mora</h3><p>Como regla, la mora es <b>automática</b>: se produce por el solo vencimiento del plazo, sin necesidad de intimación (art. 886).</p>
  <h3>Extinción</h3><p>Pago, compensación, confusión, novación, dación en pago, renuncia, remisión e imposibilidad de cumplimiento.</p>`,
  ex:[{type:"pick",title:"¿Cómo se extinguió la obligación?",options:["Pago","Compensación","Confusión","Novación","Renuncia"],items:[
   ["El cliente transfiere lo que debía","Pago"],["A y B se deben mutuamente $ 100.000 y se cancelan","Compensación"],["El deudor hereda el crédito de su acreedor","Confusión"],
   ["Se reemplaza la deuda vieja por una nueva con otras condiciones y la vieja se extingue","Novación"],["El acreedor declara que no va a cobrar","Renuncia"]]},
   {type:"pick",title:"¿Qué tipo de interés es?",options:["Compensatorio","Moratorio","Punitorio"],items:[["El que paga un préstamo bancario por usar el dinero","Compensatorio"],["El recargo por pagar una factura 20 días tarde","Moratorio"],["Una multa pactada en el contrato por incumplir","Punitorio"]]}]},
 {lead:"El contrato es el acto jurídico mediante el cual dos o más partes manifiestan su consentimiento para crear, regular, modificar, transferir o extinguir relaciones jurídicas patrimoniales (art. 957).",
  html:`<h3>Principios</h3><ul><li><b>Libertad de contratación</b> (art. 958), dentro de la ley, el orden público y la moral.</li><li><b>Fuerza obligatoria</b> (art. 959): el contrato válido obliga a las partes.</li><li><b>Buena fe</b> (art. 961) en la celebración, interpretación y ejecución.</li></ul>
  <h3>Elementos</h3><p><b>Consentimiento</b> (oferta y aceptación), <b>objeto</b> y <b>causa</b>. Algunos contratos exigen además una <b>forma</b> (por ejemplo, escritura pública para la compraventa de inmuebles).</p>
  <h3>Clasificación</h3><div class="tw"><table><thead><tr><th>Criterio</th><th>Clases</th></tr></thead><tbody>
  <tr><td>Obligaciones</td><td><b>Unilaterales</b> (solo una parte se obliga, como la donación) o <b>bilaterales</b> (ambas, como la compraventa)</td></tr>
  <tr><td>Ventajas</td><td><b>Onerosos</b> (prestaciones recíprocas) o <b>gratuitos</b></td></tr>
  <tr><td>Riesgo</td><td><b>Conmutativos</b> (ventajas ciertas) o <b>aleatorios</b> (dependen de un hecho incierto, como el seguro)</td></tr>
  <tr><td>Forma</td><td><b>Formales</b> o <b>no formales</b></td></tr>
  <tr><td>Negociación</td><td><b>Paritarios</b> o <b>por adhesión</b> a cláusulas generales predispuestas</td></tr></tbody></table></div>
  <h3>Contrato de consumo</h3><p>Entre un proveedor y un consumidor final. Tiene protección especial (arts. 1092 y siguientes del CCyC y Ley 24.240 de Defensa del Consumidor): las cláusulas abusivas se tienen por no escritas y en caso de duda se interpreta a favor del consumidor.</p>`,
  ex:[{type:"pick",title:"Clasificá cada contrato",options:["Unilateral gratuito","Bilateral oneroso conmutativo","Bilateral oneroso aleatorio"],items:[
   ["Compraventa de una computadora","Bilateral oneroso conmutativo"],["Donación de dinero a una fundación","Unilateral gratuito"],["Seguro contra incendio","Bilateral oneroso aleatorio"],["Alquiler de un local","Bilateral oneroso conmutativo"]]}]},
 {lead:"Estos son los contratos que más vas a ver en empresas y en sus estados contables.",
  html:`<div class="tw"><table><thead><tr><th>Contrato</th><th>Qué es</th><th>Impacto contable típico</th></tr></thead><tbody>
  <tr><td><b>Compraventa</b> (art. 1123)</td><td>Una parte transfiere la propiedad de una cosa y la otra paga un precio en dinero.</td><td>Ventas, bienes de cambio, créditos</td></tr>
  <tr><td><b>Locación</b> (art. 1187)</td><td>Una parte concede el uso y goce temporal de una cosa a cambio de un precio.</td><td>Alquileres perdidos o ganados, depósitos en garantía</td></tr>
  <tr><td><b>Leasing</b> (art. 1227)</td><td>El dador entrega un bien en uso al tomador por un canon, con opción de compra al final.</td><td>Bienes de uso y pasivo financiero, según las normas</td></tr>
  <tr><td><b>Mutuo</b> (art. 1525)</td><td>Préstamo de dinero o cosas fungibles que se devuelven en igual cantidad y calidad.</td><td>Préstamos e intereses</td></tr>
  <tr><td><b>Fideicomiso</b> (art. 1666)</td><td>El fiduciante transmite bienes a un fiduciario, que los administra en beneficio de un beneficiario.</td><td>El patrimonio fiduciario está separado; lleva su propia contabilidad</td></tr>
  <tr><td><b>Cuenta corriente bancaria</b> (art. 1393)</td><td>El banco cumple los pagos del cliente con los fondos depositados o el crédito acordado.</td><td>Banco c/c, descubiertos</td></tr>
  <tr><td><b>Agencia, concesión y franquicia</b></td><td>Contratos de distribución y colaboración comercial.</td><td>Comisiones, regalías</td></tr></tbody></table></div>
  <h3>Títulos valores</h3><ul><li><b>Cheque</b> (Ley 24.452): orden de pago a un banco. Puede ser común o de pago diferido, y hoy también electrónico (ECHEQ).</li><li><b>Pagaré y letra de cambio</b> (Decreto-ley 5965/63).</li>
  <li><b>Factura de Crédito Electrónica MiPyME</b> (Ley 27.440): obligatoria en ventas de MiPyMEs a grandes empresas por encima de un monto mínimo; se puede negociar en el mercado.</li></ul>`,
  ex:[{type:"pick",title:"¿Qué contrato es?",options:["Compraventa","Locación","Leasing","Mutuo","Fideicomiso"],items:[
   ["El banco le presta $ 10 millones a la empresa a devolver en 24 cuotas","Mutuo"],["La empresa usa una máquina pagando un canon mensual y al final puede comprarla","Leasing"],
   ["Se transfieren terrenos a un administrador para construir y entregar departamentos a inversores","Fideicomiso"],["La empresa alquila un depósito por 3 años","Locación"],["Un cliente compra 100 cajas de mercadería","Compraventa"]]}]},
 {lead:"El paso del tiempo puede hacer que un derecho ya no se pueda reclamar. Para un contador, los plazos de prescripción definen, entre otras cosas, cuánto tiempo guardar documentación.",
  html:`<h3>Prescripción liberatoria</h3><p>Es la pérdida de la acción para exigir un derecho por no ejercerlo durante el plazo legal. La obligación no desaparece: se convierte en obligación natural (si el deudor paga, no puede pedir la devolución).</p>
  <div class="tw"><table><thead><tr><th>Plazo</th><th>Casos (CCyC)</th></tr></thead><tbody>
  <tr><td class="mono">5 años</td><td>Plazo genérico, salvo que la ley fije otro (art. 2560).</td></tr>
  <tr><td class="mono">3 años</td><td>Reclamo de indemnización de daños por responsabilidad civil (art. 2561).</td></tr>
  <tr><td class="mono">2 años</td><td>Entre otros, lo que se devenga por años o plazos periódicos más cortos, como alquileres o intereses (art. 2562).</td></tr>
  <tr><td class="mono">1 año</td><td>Entre otros, reclamos por vicios redhibitorios (art. 2564).</td></tr></tbody></table></div>
  <h3>Suspensión e interrupción</h3><ul><li><b>Suspensión:</b> detiene el cómputo por un tiempo; después sigue contando lo que faltaba. Por ejemplo, la interpelación fehaciente suspende por seis meses (art. 2541).</li>
  <li><b>Interrupción:</b> borra el tiempo transcurrido y empieza a contar de nuevo. Por ejemplo, el reconocimiento de la deuda o la demanda judicial.</li></ul>
  <h3>Caducidad</h3><p>Extingue el derecho no ejercido en el plazo. A diferencia de la prescripción, no se suspende ni se interrumpe, salvo disposición legal (art. 2567).</p>
  <div class="note"><b>Plazos tributarios.</b> En impuestos nacionales, la Ley 11.683 fija su propia prescripción: 5 años para contribuyentes inscriptos y 10 años para no inscriptos (art. 56). Desde la Ley 27.799 de Inocencia Fiscal (2026), el plazo baja a 3 años para el inscripto que presentó sus declaraciones juradas en término y pagó, si ARCA no detecta una “discrepancia significativa”. Por eso, y por el art. 328 del CCyC, se conservan los registros contables y la documentación al menos 10 años.</div>`,
  ex:[{type:"num",items:[{q:"¿Cuál es el plazo genérico de prescripción del CCyC, en años?",a:5,tol:0},{q:"¿Cuántos años prescribe la acción de ARCA contra un contribuyente no inscripto?",a:10,tol:0},{q:"¿Cuántos años se deben conservar los libros contables según el art. 328 del CCyC?",a:10,tol:0}]},
   {type:"tf",items:[["La interrupción de la prescripción borra el tiempo ya transcurrido","Verdadero"],["La caducidad, como regla, se puede interrumpir con una carta documento","Falso"]]}]},
 {lead:"El Código Civil y Comercial regula la contabilidad en los arts. 320 a 331. Es la base legal de los libros que llevás como contador.",
  html:`<div class="tw"><table><thead><tr><th>Artículo</th><th>Contenido</th></tr></thead><tbody>
  <tr><td class="mono">320</td><td><b>Obligados:</b> las personas jurídicas privadas y quienes realizan una actividad económica organizada o son titulares de una empresa o establecimiento comercial, industrial, agropecuario o de servicios. Pueden quedar eximidos quienes tienen un volumen de actividad muy pequeño, según cada jurisdicción.</td></tr>
  <tr><td class="mono">321</td><td><b>Modo de llevarla:</b> sobre una base uniforme, que permita individualizar las operaciones y las cuentas, con respaldo documental.</td></tr>
  <tr><td class="mono">322</td><td><b>Registros indispensables:</b> Diario, Inventario y Balances, los que correspondan a la actividad y los que exijan otras leyes.</td></tr>
  <tr><td class="mono">323</td><td><b>Libros:</b> deben estar encuadernados, foliados e individualizados por el Registro Público.</td></tr>
  <tr><td class="mono">324</td><td><b>Prohibiciones:</b> alterar el orden de los asientos, dejar blancos, interlinear, raspar o enmendar, mutilar o arrancar hojas, alterar la encuadernación.</td></tr>
  <tr><td class="mono">325</td><td><b>Forma de llevar los registros:</b> en idioma y moneda nacional, con orden cronológico.</td></tr>
  <tr><td class="mono">326</td><td><b>Estados contables:</b> al cierre de cada ejercicio el obligado debe confeccionar estados contables.</td></tr>
  <tr><td class="mono">327</td><td><b>Diario:</b> se registran todas las operaciones; se pueden usar resúmenes de períodos no mayores a un mes.</td></tr>
  <tr><td class="mono">328</td><td><b>Conservación:</b> 10 años desde el último asiento para los libros y desde su fecha para la documentación.</td></tr>
  <tr><td class="mono">329</td><td><b>Actos sujetos a autorización:</b> sustituir libros por medios mecánicos o digitales, con autorización del Registro Público.</td></tr>
  <tr><td class="mono">330</td><td><b>Eficacia probatoria:</b> la contabilidad bien llevada hace prueba a favor de quien la lleva en litigios con otros obligados; siempre hace prueba en su contra.</td></tr></tbody></table></div>`,

   <li>Gastos de mantenimiento de cuenta debitados por el banco, no registrados: $ 5.000.</li><li>Una transferencia de un cliente acreditada en el banco, no registrada: $ 60.000.</li></ul><div data-n></div>`;

}

CAMPUS.content[9] = {
lessons:[
 {lead:"Con el inventario permanente, cada venta registra en el momento su costo. Así sabés siempre cuánta mercadería tenés y cuánto ganaste.",
  html:`<p>En el Módulo 1 registramos las ventas sin su costo. Ahora completamos: en el sistema de <b>inventario permanente</b>, cada venta lleva <b>dos asientos</b>.</p>
  <div class="tw"><table><thead><tr><th>Cuenta</th><th class="r">Debe</th><th class="r">Haber</th></tr></thead><tbody>
  <tr><td>Deudores por ventas</td><td class="r num d">12.100</td><td></td></tr><tr><td style="padding-left:32px">a Ventas</td><td></td><td class="r num h">10.000</td></tr><tr><td style="padding-left:32px">a IVA Débito Fiscal</td><td></td><td class="r num h">2.100</td></tr>
  <tr><td>Costo de mercaderías vendidas</td><td class="r num d">6.000</td><td></td></tr><tr><td style="padding-left:32px">a Mercaderías</td><td></td><td class="r num h">6.000</td></tr></tbody></table></div>
  <p>La diferencia entre Ventas (10.000) y CMV (6.000) es la <b>utilidad bruta</b>: 4.000.</p>
  <h3>¿A qué costo sale la mercadería?</h3><p>Cuando compraste a precios distintos, hay que elegir un método para asignar el costo. Se lleva una <b>ficha de stock</b> por artículo:</p>
  <ul><li><b>PEPS (FIFO):</b> lo primero que entró es lo primero que sale. El stock queda valuado a los precios más recientes.</li>
  <li><b>PPP (precio promedio ponderado):</b> después de cada compra se recalcula el costo promedio.</li>
  <li><b>Identificación específica:</b> para bienes únicos (autos, inmuebles).</li></ul>
  <div class="note"><b>Y la norma.</b> Al cierre, las normas contables argentinas miden los bienes de cambio a su costo de reposición o a su valor neto de realización, según el caso (Módulo 13). Para el impuesto a las Ganancias, la ley fija sus propios criterios (Módulo 21). La ficha PEPS o PPP sirve para el día a día y la gestión.</div>`,
  ex:[{type:"custom",title:"Ficha de stock",render:fichaStock},
   {type:"asiento",title:"Registrá la venta del 15/04 con PEPS (cobrada por banco)",accounts:ACC,entries:[
    {t:"15/04 · Se venden 15 unidades a $ 200 cada una más IVA 21%. El cliente paga por transferencia al Banco Nación.",e:[["Banco Nación c/c",3630,0],["Ventas",0,3000],["IVA Débito Fiscal",0,630]]},
    {t:"15/04 · Registrá el costo de esa venta según PEPS.",e:[["Costo de mercaderías vendidas",1650,0],["Mercaderías",0,1650]]}]}]},
 {lead:"Si no llevás inventario permanente, el costo de lo vendido se calcula al final, contando lo que quedó en el depósito.",
  html:`<h3>Inventario periódico o por diferencia</h3><p>Durante el ejercicio las compras se registran en una cuenta <b>Compras</b> y las ventas solo por el precio. Al cierre se hace un recuento físico y se calcula:</p>
  <div class="formula">CMV = Existencia inicial + Compras − Existencia final</div>
  <p>Ejemplo: EI $ 50.000, compras $ 200.000, EF (recuento) $ 70.000 → CMV = <b>$ 180.000</b>. Es simple, pero no permite saber durante el año cuánto stock hay ni detectar faltantes.</p>
  <h3>Faltantes y sobrantes con inventario permanente</h3><p>Aunque lleves fichas, igual hay que hacer recuentos físicos periódicos. Si el recuento da menos que la ficha hay un <b>faltante</b> (robo, rotura, error); si da más, un <b>sobrante</b>.</p>
  <ul><li>Faltante: <span class="mono">Faltante de mercaderías (R−) a Mercaderías</span>.</li><li>Sobrante: <span class="mono">Mercaderías a Sobrante de mercaderías (R+)</span>.</li></ul>
  <p>Antes de registrarlo como pérdida, se investiga: puede ser un remito sin facturar o una devolución no registrada.</p>`,
  ex:[{type:"num",items:[{q:"EI $ 120.000, compras $ 480.000, EF $ 150.000. ¿Cuál es el CMV?",a:450000,u:"$"},{q:"Con esos datos y ventas por $ 700.000, ¿cuál es la utilidad bruta?",a:250000,u:"$"},{q:"Ventas $ 1.000.000 con margen bruto del 40%, EI $ 100.000 y compras $ 650.000. ¿Cuál debería ser la existencia final?",a:150000,u:"$",hint:"CMV = 600.000"}]},
   {type:"asiento",accounts:ACC,entries:[{t:"30/06 · La ficha de stock indica mercaderías por $ 85.000 y el recuento físico da $ 82.000. Se confirma que es un faltante.",e:[["Faltante de mercaderías",3000,0],["Mercaderías",0,3000]]}]}]},
 {lead:"Los resultados se registran cuando se devengan, no cuando se cobran o se pagan. Al cierre hay que ajustar lo que todavía no está bien imputado.",
  html:`<p>El <b>devengamiento</b> dice que los ingresos y gastos se imputan al período en que se generan, sin importar cuándo se mueve el dinero. Al cierre del ejercicio hay cuatro situaciones típicas:</p>
  <div class="tw"><table><thead><tr><th>Situación</th><th>Ejemplo</th><th>Ajuste</th></tr></thead><tbody>
  <tr><td><b>Gasto pagado por adelantado</b></td><td>Se pagaron 6 meses de alquiler y al cierre pasaron 3</td><td>La parte consumida pasa a gasto</td></tr>

  <p>Para registrar un pago anticipado se usa una cuenta de activo (por ejemplo, <i>Alquileres pagados por adelantado</i>). A medida que pasa el tiempo, se transfiere a la cuenta de gasto.</p>`,

   {t:"31/12 · Se devengaron los sueldos de diciembre por $ 900.000, que se pagan en los primeros días de enero (sin cargas sociales).",e:[["Sueldos y jornales",900000,0],["Sueldos a pagar",0,900000]]}]}]},
 {lead:"Los bienes de uso (máquinas, rodados, muebles) se desgastan. La amortización distribuye su costo a lo largo de los años en que se usan.",
  html:`<div class="formula">Amortización anual (método lineal) = (Valor de origen − Valor residual) / Vida útil</div>
  <p>Ejemplo: un rodado de $ 12.000.000, con valor residual estimado de $ 2.000.000 y vida útil de 5 años, se amortiza $ 2.000.000 por año.</p>
  <div class="tw"><table><thead><tr><th>Cuenta</th><th class="r">Debe</th><th class="r">Haber</th></tr></thead><tbody>
  <tr><td>Amortización rodados (R−)</td><td class="r num d">2.000.000</td><td></td></tr><tr><td style="padding-left:32px">a Amortización acumulada rodados</td><td></td><td class="r num h">2.000.000</td></tr></tbody></table></div>
  <p>La <b>amortización acumulada</b> es una cuenta <b>regularizadora del activo</b>: tiene saldo acreedor y se resta del valor de origen. El <b>valor residual contable</b> (o valor de libros) es origen menos amortización acumulada.</p>
  <h3>Otros métodos</h3><ul><li><b>Por unidades de producción:</b> según horas de uso o kilómetros recorridos.</li><li><b>Decrecientes:</b> más amortización los primeros años (por ejemplo, suma de dígitos).</li></ul>
  <h3>Criterios prácticos</h3><ul><li>Los <b>terrenos no se amortizan</b>: no tienen vida útil limitada.</li><li>Las <b>mejoras</b> que aumentan la vida útil o la capacidad se suman al valor del bien; las reparaciones comunes son gasto.</li>
  <li>En el año de alta se puede amortizar por meses de uso o, por convención de la empresa, el año completo. Para Ganancias, la ley permite computar el año de alta completo (Módulo 21).</li></ul>`,
  ex:[{type:"num",items:[
   {q:"Una máquina cuesta $ 8.000.000, valor residual $ 800.000, vida útil 6 años. ¿Amortización anual lineal?",a:1200000,u:"$"},
   {q:"¿Cuál es el valor residual contable de esa máquina al final del año 4?",a:3200000,u:"$",hint:"8.000.000 − 4 × 1.200.000"},
   {q:"Un camión de $ 30.000.000 tiene vida útil de 500.000 km, sin valor residual. Este año recorrió 60.000 km. ¿Amortización del año?",a:3600000,u:"$"},
   {q:"Unos muebles de $ 1.200.000 (sin residual, 10 años) se compran el 1/10 y el cierre es el 31/12. Amortizando por meses, ¿cuánto corresponde al primer ejercicio?",a:30000,u:"$",hint:"120.000 por año × 3/12"}]},
   {type:"asiento",accounts:ACC,entries:[{t:"31/12 · Registrá la amortización anual de muebles y útiles por $ 120.000.",e:[["Amortización muebles y útiles",120000,0],["Amortización acumulada muebles y útiles",0,120000]]}]}]},
 {lead:"No todos los clientes van a pagar. La prudencia exige reconocer esa pérdida probable antes de que se confirme.",
  html:`<p>Una <b>previsión</b> es una estimación de una pérdida probable. La <b>Previsión para deudores incobrables</b> es una cuenta regularizadora del activo: se resta de Deudores por ventas.</p>
  <h3>Cómo se calcula</h3><ul><li><b>Porcentaje sobre el saldo:</b> por experiencia, se estima que un % de los créditos no se cobrará.</li><li><b>Análisis por antigüedad:</b> se aplican porcentajes mayores a los créditos más vencidos.</li><li><b>Análisis individual</b> de los clientes en mora o en gestión judicial.</li></ul>
  <h3>Registración</h3><ol><li>Al cierre, se ajusta la previsión al importe estimado: <span class="mono">Deudores incobrables (R−) a Previsión para deudores incobrables</span>, por la diferencia con el saldo que ya tenía.</li>
  <li>Cuando un cliente se atrasa, se reclasifica: <span class="mono">Deudores morosos a Deudores por ventas</span>.</li>
  <li>Cuando se confirma que no va a pagar, se usa la previsión: <span class="mono">Previsión para deudores incobrables a Deudores morosos</span>. No se toca el resultado de nuevo, porque ya se reconoció.</li></ol>
  <div class="note"><b>Previsión y provisión.</b> En la terminología argentina, una <b>previsión</b> cubre algo incierto (incobrables, juicios) y una <b>provisión</b> es un pasivo cierto de importe estimado (por ejemplo, la provisión para impuesto a las Ganancias). En las NIIF se usa “provisión” para ambos.</div>`,
  ex:[{type:"num",items:[{q:"Saldo de Deudores por ventas $ 5.000.000. Se estima incobrable el 4%. ¿Qué saldo debe tener la previsión?",a:200000,u:"$"},{q:"La previsión ya tenía un saldo de $ 50.000. ¿Por cuánto se registra el ajuste del año?",a:150000,u:"$"}]},

    {t:"20/05 · Se confirma que Pérez no va a pagar. Dá de baja el crédito usando la previsión.",e:[["Previsión para deudores incobrables",80000,0],["Deudores morosos",0,80000]]}]}]},
 {lead:"El saldo del banco en tus libros casi nunca coincide con el extracto. La conciliación bancaria explica las diferencias y detecta errores.",
  html:`<h3>Causas de las diferencias</h3><div class="tw"><table><thead><tr><th>Partida</th><th>Está en</th><th>Qué hacer</th></tr></thead><tbody>
  <tr><td>Cheques emitidos no debitados</td><td>Libros, no en el banco</td><td>Se esperan; no se registra nada</td></tr>
  <tr><td>Depósitos en tránsito</td><td>Libros, no en el banco</td><td>Se esperan; no se registra nada</td></tr>
  <tr><td>Débitos bancarios no registrados (comisiones, impuesto a los débitos y créditos, débitos automáticos)</td><td>Banco, no en libros</td><td>Registrarlos en libros</td></tr>
  <tr><td>Créditos bancarios no registrados (transferencias recibidas, intereses)</td><td>Banco, no en libros</td><td>Registrarlos en libros</td></tr>
  <tr><td>Errores</td><td>Cualquiera</td><td>Corregir donde esté el error</td></tr></tbody></table></div>
  <h3>Método de los saldos ajustados</h3><p>Se ajusta por separado el saldo de libros (con lo que falta registrar) y el saldo del extracto (con las partidas en tránsito). Los dos ajustados deben dar lo mismo.</p>
  <div class="note"><b>Signo del extracto.</b> El banco muestra tu saldo a favor como saldo <b>acreedor</b>, porque para el banco es una deuda con vos. En tus libros es deudor.</div>`,
  ex:[{type:"custom",title:"Conciliá el Banco Nación al 30/06",render:conciliacion},
   {type:"asiento",title:"Registrá en libros lo que faltaba",accounts:ACC,entries:[
    {t:"30/06 · Gastos de mantenimiento de cuenta debitados por el banco: $ 5.000 (ignorá el IVA).",e:[["Gastos bancarios",5000,0],["Banco Nación c/c",0,5000]]},
    {t:"30/06 · Transferencia de un cliente para cancelar su factura: $ 60.000.",e:[["Banco Nación c/c",60000,0],["Deudores por ventas",0,60000]]}]}]},
 {lead:"Al terminar el ejercicio se cierran las cuentas de resultado y se determina la ganancia o pérdida del año.",
  html:`<h3>Pasos del cierre</h3><ol><li>Balance de sumas y saldos de comprobación.</li><li>Asientos de ajuste (devengamientos, amortizaciones, previsiones, inventario, diferencias de cambio, ajuste por inflación si corresponde).</li>
  <li>Balance de sumas y saldos ajustado.</li><li><b>Refundición de las cuentas de resultado:</b> se cancela cada cuenta de resultado contra <i>Resultado del ejercicio</i>.</li>
  <li>Se transfiere el resultado a <i>Resultados no asignados</i>, dentro del patrimonio neto.</li><li>Se preparan los estados contables (Módulo 15) y se transcriben al Libro de Inventarios y Balances.</li>
  <li><b>Asiento de cierre:</b> se cancelan todas las cuentas patrimoniales.</li><li>Al inicio del ejercicio siguiente, <b>asiento de apertura</b> con los mismos saldos.</li></ol>
  <h3>Refundición, paso a paso</h3><p>Las cuentas de resultado positivo tienen saldo acreedor: se debitan. Las de resultado negativo tienen saldo deudor: se acreditan. La diferencia va a Resultado del ejercicio. Si los ingresos superan a los gastos, Resultado del ejercicio queda con saldo acreedor (ganancia).</p>
  <div class="note"><b>Qué pasa después.</b> La asamblea de socios decide qué hacer con los Resultados no asignados: reservas, dividendos o dejarlos sin asignar (Módulo 16).</div>`,
  ex:[{type:"asiento",title:"Refundí los resultados de Comercial Del Sur SRL",accounts:ACC,entries:[
   {t:"31/12 · Saldos de resultados: Ventas $ 900.000 (acreedor), Costo de mercaderías vendidas $ 500.000, Sueldos y jornales $ 200.000 y Alquileres perdidos $ 100.000 (deudores). Refundilos en Resultado del ejercicio.",

],
