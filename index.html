<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14201c">
<title>Campus Contable</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: libro contable — barra lateral con el plan, hoja principal con renglones; Debe en tinta azul, Haber en tinta roja */
:root{
  --paper:#F5F7F3; --sheet:#FFFFFF; --ink:#1A2A2C; --muted:#5B6B69; --rule:#D9E1DC;
  --accent:#1E6B57; --accent-soft:#E2EFE9; --debe:#2453A0; --haber:#A63D2A;
  --ok:#227A45; --ok-soft:#E3F3E8; --bad:#B23A2B; --bad-soft:#FBE7E3; --warn:#9A6A00;
  --f-display:"Zilla Slab", Georgia, serif; --f-body:"Source Sans 3", system-ui, sans-serif; --f-mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111816; --sheet:#18211F; --ink:#E4ECE8; --muted:#9AABA6; --rule:#2C3A37;
  --accent:#5FC2A2; --accent-soft:#1D332D; --debe:#7FA8F0; --haber:#F08A72;
  --ok:#6BD08F; --ok-soft:#183324; --bad:#F08A72; --bad-soft:#3A1F1A; --warn:#E3B651; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111816; --sheet:#18211F; --ink:#E4ECE8; --muted:#9AABA6; --rule:#2C3A37;
  --accent:#5FC2A2; --accent-soft:#1D332D; --debe:#7FA8F0; --haber:#F08A72;
  --ok:#6BD08F; --ok-soft:#183324; --bad:#F08A72; --bad-soft:#3A1F1A; --warn:#E3B651; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.15rem}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;text-decoration:none;color:var(--ink);display:flex;gap:8px;align-items:baseline}
.brand small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);font-weight:400;letter-spacing:.06em;text-transform:uppercase}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.bar{width:140px;height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.menu-btn{display:none;border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:4px 10px;cursor:pointer}

.wrap{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100% - 60px)}
nav.side{background:var(--sheet);border-right:1px solid var(--rule);padding:20px 14px 40px;position:sticky;top:57px;align-self:start;max-height:calc(100vh - 57px);overflow:auto}
.side h4{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 8px 6px;font-weight:500}
.side a{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.95rem;line-height:1.35}
.side a:hover{background:var(--accent-soft)}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side a .dot{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--rule);margin-top:1px;display:grid;place-items:center;font-size:.7rem}
.side a.done .dot{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.side .locked{color:var(--muted);font-size:.9rem;padding:4px 8px;display:flex;gap:10px}
.side .locked span.n{font-family:var(--f-mono);font-size:.75rem;width:18px;flex:none}

main{padding-block:32px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.page{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.lead{font-size:1.12rem;color:var(--muted);max-width:65ch}
.prose{display:flex;flex-direction:column;gap:14px;max-width:68ch}
.prose ul,.prose ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 6px 6px 0;font-size:.95rem}
.note b{color:var(--accent)}
.src{font-size:.85rem;color:var(--muted)}

.box{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.box > .tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--sheet);padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fb{padding:10px 14px;border-radius:6px;font-size:.95rem}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.pill{display:inline-block;font-family:var(--f-mono);font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid var(--rule);color:var(--muted)}
.pill.ok{border-color:var(--ok);color:var(--ok)}

/* plan */
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mod{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.mod .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.mod ul{margin:0;padding-left:1.1em;font-size:.9rem;color:var(--muted)}
.mod.open{border-color:var(--accent)}
.mod a.go{margin-top:auto;font-weight:600}

/* ecuación */
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:end;text-align:center}
.eq .col{display:flex;flex-direction:column;gap:6px;align-items:center}
.eq .stack{height:140px;width:100%;max-width:120px;display:flex;align-items:flex-end;background:repeating-linear-gradient(to top,var(--rule) 0 1px,transparent 1px 28px)}
.eq .fill{width:100%;transition:height .5s;border-radius:4px 4px 0 0}
.eq .sym{font-family:var(--f-display);font-size:2rem;padding-bottom:30px}
.eq .lbl{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.trx{display:flex;flex-direction:column;gap:10px}
.trx-q{display:grid;grid-template-columns:repeat(3,auto);gap:8px 14px;justify-content:start;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 12px;cursor:pointer;font-family:var(--f-mono)}
.seg button.sel{background:var(--ink);color:var(--sheet)}

/* clasificación */
.cls{display:flex;flex-direction:column;gap:6px}
.cls .it{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--rule);border-radius:6px}
.cls .it.ok{border-color:var(--ok);background:var(--ok-soft)}
.cls .it.bad{border-color:var(--bad);background:var(--bad-soft)}
.opts{display:flex;gap:4px;flex-wrap:wrap}
.opts button{border:1px solid var(--rule);background:var(--sheet);border-radius:5px;padding:3px 9px;cursor:pointer;font-size:.85rem}
.opts button.sel{border-color:var(--ink);background:var(--ink);color:var(--sheet)}

/* tablas */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:left}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
.d{color:var(--debe)}.h{color:var(--haber)}
tfoot td{font-weight:700;border-top:2px solid var(--ink)}

/* asiento */
.asi{display:flex;flex-direction:column;gap:6px}
.asi .ln{display:grid;grid-template-columns:minmax(0,1fr) 120px 120px 32px;gap:6px}
.asi select,.asi input,.inp{border:1px solid var(--rule);background:var(--paper);border-radius:5px;padding:6px 8px;min-width:0;width:100%}
.asi input{text-align:right;font-family:var(--f-mono)}
.asi .hd{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:1.1rem}

/* T */
.ts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.t{font-size:.88rem}
.t .tt{text-align:center;font-weight:700;border-bottom:2px solid var(--ink);padding-bottom:4px;font-family:var(--f-display)}
.t .tb{display:grid;grid-template-columns:1fr 1fr}
.t .tb > div{padding:4px 6px;min-height:60px;display:flex;flex-direction:column;gap:2px}
.t .tb > div:first-child{border-right:2px solid var(--ink);text-align:right}
.t .sal{border-top:1px dashed var(--rule);text-align:center;padding-top:4px;color:var(--muted)}

/* quiz */
.q{display:flex;flex-direction:column;gap:8px}
.q .ch{display:flex;flex-direction:column;gap:6px}
.q label{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--rule);border-radius:6px;cursor:pointer;background:var(--sheet)}
.q label.ok{border-color:var(--ok);background:var(--ok-soft)}
.q label.bad{border-color:var(--bad);background:var(--bad-soft)}
.q .ex{font-size:.9rem;color:var(--muted)}
.score{font-family:var(--f-display);font-size:3rem;color:var(--accent)}

.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:18px}
.pager a{text-decoration:none;font-weight:600}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  nav.side{position:fixed;inset:57px 0 0 0;max-height:none;z-index:4;display:none;border-right:0;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  nav.side.open{display:block}
  .menu-btn{display:inline-block}
  .bar{width:80px}
  h1{font-size:1.6rem}
  .asi .ln{grid-template-columns:minmax(0,1fr) 90px 90px 28px}
  .eq .stack{height:100px}
}
@media (max-width:480px){
  .asi .ln{grid-template-columns:1fr 1fr 28px}
  .asi .ln select{grid-column:1 / -1}
  .asi .hd.acc{display:none}
  .prog span.t{display:none}
  header.top{flex-wrap:nowrap;gap:10px}
  .brand{font-size:1.1rem;white-space:nowrap}
  .brand small{display:none}
  .bar{width:48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- v2 ---- */
.side a .dot{width:22px;height:22px;font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.side a.done .dot{color:var(--sheet)}
.side a.soon{color:var(--muted)}
.side a small{font-family:var(--f-mono);font-size:.7rem;color:var(--accent);font-weight:400}
.side .sub{display:flex;flex-direction:column;margin:2px 0 8px 18px;border-left:1px solid var(--rule);padding-left:6px}
.side .sub a{font-size:.88rem;padding:5px 8px}
.side .sub a .dot{width:16px;height:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stats > div{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column}
.stats b{font-size:1.8rem;font-family:var(--f-display);line-height:1.1;color:var(--accent)}
.stats span{font-size:.85rem;color:var(--muted)}
.cycle{display:flex;flex-direction:column;gap:10px;margin-top:10px}
a.mod{text-decoration:none;color:var(--ink)}
a.mod:hover{border-color:var(--accent)}
.mod:not(.open){background:transparent;border-style:dashed}
.eq-tag{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.02em}
.pill.av{border-color:var(--accent);color:var(--accent)}
.bar.mini{width:100%;height:5px}
ol.lessons{margin:0;padding-left:1.5em;display:flex;flex-direction:column;gap:8px;font-size:1.02rem}
ol.lessons li.ev{list-style:"★  "}
.nums{display:flex;flex-direction:column;gap:14px}
.nq{display:flex;flex-direction:column;gap:6px}
.nq .inp{max-width:220px}
.ord{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:6px}
.ord li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet)}
.ord li.ok{border-color:var(--ok);background:var(--ok-soft)}
.ord li.bad{border-color:var(--bad);background:var(--bad-soft)}
.mv{border:1px solid var(--rule);background:var(--paper);border-radius:4px;width:30px;height:28px;cursor:pointer}
.mv:disabled{opacity:.3;cursor:default}
.formula{font-family:var(--f-mono);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px 14px;overflow-x:auto;white-space:nowrap}
.prose h3{margin-top:6px}
.prose table{font-size:.92rem}
.q b{font-weight:600}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* v3: programa, fuentes, glosario */
.prog-sec{margin-top:28px;padding-top:8px;border-top:1px solid var(--rule)}
.prog-sec h3{margin-top:18px}
.srcl,.bib{padding-left:1.2em}
.srcl li,.bib li{margin:4px 0}
.srcbox{margin:18px 0;border:1px solid var(--rule);border-radius:8px;padding:10px 14px;background:var(--sheet)}
.srcbox summary{cursor:pointer;font-weight:600}
.gloss dt{font-weight:700;margin-top:14px}
.gloss dd{margin:4px 0 0 0;color:var(--ink)}

/* ayuda al equivocarse */
.help{margin-top:6px;padding:8px 10px;border-left:3px solid var(--bad);background:var(--bad-soft);border-radius:4px;font-size:.92rem;line-height:1.45;color:var(--ink)}
.help ol{margin:6px 0 0 18px;padding:0}
.cls .it .why{flex-basis:100%}
.ch label.right{outline:2px solid var(--ok);border-radius:6px}
</style>
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-label="Abrir plan de estudios">Plan ☰</button>
  <a class="brand" href="#inicio">Campus Contable <small>Contador Público · AR</small></a>
  <div class="prog"><span class="t">Tu progreso</span><div class="bar"><i id="progBar"></i></div><span class="num" id="progTxt">0%</span></div>
</header>
<div class="wrap">
  <nav class="side" id="side"></nav>
  <main><div class="page" id="view"></div></main>
</div>
<script>
/* Plan de estudios: estructura modelada sobre la carrera de Contador Público (UBA y otras universidades nacionales) */
const CAMPUS = { content: {} };
CAMPUS.cycles = [
  {id:"basico", t:"Ciclo Básico", d:"Las bases que en la facultad se ven en el CBC y los primeros años: la lógica contable, matemática, estadística, economía, administración y derecho."},
  {id:"general", t:"Ciclo General", d:"El oficio contable completo y las herramientas de trabajo: ciclo contable, circuitos administrativos, cálculo financiero y sistemas."},
  {id:"profesional", t:"Ciclo Profesional", d:"Las materias que definen al Contador Público: normas y estados contables, sociedades, costos, impuestos, sueldos, finanzas, auditoría y actuación judicial."},
  {id:"integracion", t:"Integración", d:"Un caso completo de principio a fin que junta todo lo aprendido."},
];
CAMPUS.modules = [
 {n:1,c:"basico",t:"Introducción a la contabilidad",eq:"Teoría Contable (247)",d:"El patrimonio, la partida doble y la registración básica.",l:["Qué es la contabilidad","La ecuación patrimonial","Cuentas y plan de cuentas","Partida doble: Debe y Haber","El asiento y el Libro Diario","Mayor y balance de sumas y saldos"]},
 {n:2,c:"basico",t:"Matemática para la gestión",eq:"Análisis Matemático I y Álgebra (CBC)",d:"La matemática que usa un contador: porcentajes, funciones, derivadas y optimización aplicadas a costos e ingresos.",l:["Porcentajes, proporciones y regla de tres","Ecuaciones y sistemas lineales","Funciones lineales: costo, ingreso y beneficio","Funciones cuadráticas y exponenciales","Derivadas y análisis marginal","Optimización: máximo beneficio","Matrices aplicadas a la gestión"]},
 {n:3,c:"basico",t:"Estadística",eq:"Estadística I (248)",d:"Describir datos, medir riesgo y entender muestras e índices de precios.",l:["Datos, variables y tablas de frecuencia","Medidas de posición","Medidas de dispersión","Probabilidad","Distribución normal","Muestreo e inferencia","Números índice e inflación"]},
 {n:4,c:"basico",t:"Microeconomía",eq:"Economía (CBC) y Microeconomía I (250)",d:"Cómo deciden consumidores y empresas, y cómo se forman los precios.",l:["El problema económico","Oferta, demanda y equilibrio","Elasticidad","Producción y costos de la empresa","Estructuras de mercado","Fallas de mercado"]},
 {n:5,c:"basico",t:"Macroeconomía y economía argentina",eq:"Macroeconomía y Política Económica (278); Historia Económica y Social (CBC y 249)",d:"PBI, dinero, inflación, tipo de cambio y la historia económica del país.",l:["PBI y cuentas nacionales","Dinero, bancos y el BCRA","Inflación","Política fiscal y monetaria","Sector externo y tipo de cambio","Empleo, pobreza y estadísticas del INDEC","Historia económica argentina"]},
 {n:6,c:"basico",t:"Administración general",eq:"Administración General (252)",d:"Cómo se planifica, organiza, dirige y controla una organización.",l:["Las organizaciones","Planeamiento estratégico","Estructura organizacional","Dirección, liderazgo y decisiones","Control de gestión","Formas jurídicas y emprendimiento"]},
 {n:7,c:"basico",t:"Derecho público",eq:"Instituciones de Derecho Público (251)",d:"La Constitución, el Estado y los límites al poder de cobrar impuestos.",l:["Constitución Nacional y derechos","Organización del Estado","Poder tributario y sus principios","Federalismo fiscal y coparticipación","Acto administrativo","Procedimiento administrativo y recursos"]},
 {n:8,c:"basico",t:"Derecho privado",eq:"Instituciones de Derecho Privado (273)",d:"El Código Civil y Comercial: personas, actos, obligaciones y contratos.",l:["Personas humanas y jurídicas","Hechos y actos jurídicos","Obligaciones","Contratos: parte general","Contratos comerciales","Prescripción y caducidad","La contabilidad en el Código Civil y Comercial"]},
 {n:9,c:"general",t:"Contabilidad II: el ciclo contable completo",eq:"Sistemas Contables (351)",d:"Del primer asiento al cierre del ejercicio.",l:["Inventario permanente y CMV","Diferencias de inventario","Devengamiento y asientos de ajuste","Amortizaciones de bienes de uso","Previsiones y deudores incobrables","Conciliación bancaria","Refundición de resultados y cierre"]},
 {n:10,c:"general",t:"Sistemas administrativos y control interno",eq:"Sistemas Administrativos (274)",d:"Los circuitos que generan la información contable y cómo controlarlos.",l:["Procesos y circuitos administrativos","Documentación comercial","Circuito de compras y pagos","Circuito de ventas y cobranzas","Tesorería y fondos fijos","Control interno: el modelo COSO"]},
 {n:11,c:"general",t:"Cálculo financiero",eq:"Cálculo Financiero (276)",d:"El valor del dinero en el tiempo: tasas, préstamos, inversiones e inflación.",l:["Interés simple","Interés compuesto","Tasas: TNA, TEM, TEA","Descuento de documentos","Rentas","Sistemas de amortización: francés y alemán","VAN y TIR","Inflación y tasa real"]},

(function(){
const CUENTAS = [
  ["Caja","Activo"],["Banco Nación c/c","Activo"],["Mercaderías","Activo"],["Deudores por ventas","Activo"],["Rodados","Activo"],["Inmuebles","Activo"],["IVA Crédito Fiscal","Activo"],
  ["Proveedores","Pasivo"],["Préstamos bancarios","Pasivo"],["Documentos a pagar","Pasivo"],["IVA Débito Fiscal","Pasivo"],["Sueldos a pagar","Pasivo"],
  ["Capital social","PN"],["Resultados no asignados","PN"],
  ["Ventas","R+"],["Intereses ganados","R+"],["Alquileres ganados","R+"],
  ["Costo de mercaderías vendidas","R−"],["Sueldos y jornales","R−"],["Alquileres perdidos","R−"],["Intereses perdidos","R−"],
];
const ASIENTOS = [
  {t:"01/03 · Los socios constituyen la empresa aportando $ 500.000: $ 200.000 en efectivo y $ 300.000 depositados en el Banco Nación.",
   e:[["Caja",200000,0],["Banco Nación c/c",300000,0],["Capital social",0,500000]]},
  {t:"05/03 · Se compran mercaderías por $ 100.000 más IVA 21% (factura A). Se paga con transferencia desde el Banco Nación.",
   e:[["Mercaderías",100000,0],["IVA Crédito Fiscal",21000,0],["Banco Nación c/c",0,121000]]},
  {t:"12/03 · Se vende mercadería a un cliente por $ 80.000 más IVA 21%, en cuenta corriente (a cobrar en 30 días).",
   e:[["Deudores por ventas",96800,0],["Ventas",0,80000],["IVA Débito Fiscal",0,16800]]},
  {t:"31/03 · Se pagan sueldos del mes por $ 60.000 en efectivo.",
   e:[["Sueldos y jornales",60000,0],["Caja",0,60000]]},
];

function simulador(el, done){
  const T = [
    {t:"Los socios aportan $ 1.000.000 en efectivo para iniciar la empresa.",e:{A:1e6,P:0,N:1e6},why:"Entra plata (Activo ↑) y crece lo que es de los dueños (PN ↑)."},
    {t:"Se compran mercaderías por $ 300.000 pagando en efectivo.",e:{A:0,P:0,N:0},why:"Un activo sube (Mercaderías) y otro baja (Caja) por el mismo importe: el total no cambia. Se llama permutación de activos."},
    {t:"Se compra un rodado por $ 800.000 a pagar en 6 meses.",e:{A:8e5,P:8e5,N:0},why:"Entra un bien (Activo ↑) y nace una deuda (Pasivo ↑)."},
    {t:"Se paga $ 200.000 de la deuda del rodado.",e:{A:-2e5,P:-2e5,N:0},why:"Sale plata (Activo ↓) y se reduce la deuda (Pasivo ↓)."},
    {t:"Se cobra en efectivo un servicio de asesoramiento prestado: $ 150.000.",e:{A:1.5e5,P:0,N:1.5e5},why:"Es una ganancia: entra plata y el PN crece a través del resultado."},
    {t:"Se paga el alquiler del mes: $ 120.000 en efectivo.",e:{A:-1.2e5,P:0,N:-1.2e5},why:"Es un gasto (pérdida): sale plata y el PN baja."},
  ];
  el.innerHTML = `<div class="eq" aria-live="polite">
      <div class="col"><div class="stack"><div class="fill" data-b="A" style="background:var(--debe)"></div></div><span class="lbl">Activo</span><b class="num" data-v="A"></b></div>
      <div class="sym">=</div>
      <div class="col"><div class="stack"><div class="fill" data-b="P" style="background:var(--haber)"></div></div><span class="lbl">Pasivo</span><b class="num" data-v="P"></b></div>
      <div class="sym">+</div>
      <div class="col"><div class="stack"><div class="fill" data-b="N" style="background:var(--accent)"></div></div><span class="lbl">Patr. Neto</span><b class="num" data-v="N"></b></div>
    </div><div class="trx"></div>`;
  let step=0, cur={A:0,P:0,N:0};
  const sign = x => x>0?"↑":x<0?"↓":"=";
  const box = $(".trx",el);
  function draw(){
    const max = Math.max(cur.A,1);
    ["A","P","N"].forEach(k=>{ $(`[data-b=${k}]`,el).style.height=(cur[k]/max*100)+"%"; $(`[data-v=${k}]`,el).textContent=fmt(cur[k]); });
    if(step>=T.length){ box.innerHTML = fbHTML(true,`Después de 6 operaciones, Activo (${fmt(cur.A)}) sigue igual a Pasivo + PN (${fmt(cur.P+cur.N)}).`)+`<div class="row"><button class="btn ghost" type="button" data-r>Reiniciar simulador</button></div>`; $("[data-r]",box).onclick=()=>{step=0;cur={A:0,P:0,N:0};draw();}; done(); return; }
    const tr = T[step]; const pick={};
    box.innerHTML = `<p><span class="pill">Operación ${step+1} de ${T.length}</span></p><p><b>${tr.t}</b></p>
      <p class="src">Antes de aplicarla: ¿qué le pasa a cada parte de la ecuación?</p>
      <div class="trx-q">${["A","P","N"].map(k=>`<span>${{A:"Activo",P:"Pasivo",N:"Patrimonio Neto"}[k]}</span><div class="seg" data-k="${k}">${["↑","=","↓"].map(s=>`<button type="button" data-s="${s}">${s}</button>`).join("")}</div><span></span>`).join("")}</div>
      <div class="row"><button class="btn" type="button" data-ap>Comprobar y aplicar</button></div><div data-f></div>`;
    box.querySelectorAll(".seg").forEach(sg=>sg.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;pick[sg.dataset.k]=b.dataset.s;sg.querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x===b));}));
    const ap = $("[data-ap]",box);
    ap.onclick=()=>{
      const good = ["A","P","N"].every(k=>pick[k]===sign(tr.e[k]));
      if(!good){ $("[data-f]",box).innerHTML=fbHTML(false,"No es así. Pensá: ¿entra o sale algo del activo? ¿aparece o se cancela una deuda? ¿la empresa ganó o perdió?"); return; }
      $("[data-f]",box).innerHTML=fbHTML(true,"Correcto. "+tr.why);
      ap.textContent="Siguiente operación"; ap.onclick=()=>{ cur={A:cur.A+tr.e.A,P:cur.P+tr.e.P,N:cur.N+tr.e.N}; step++; draw(); };
    };
  }
  draw();
}

function mayorEx(el, done){
  const M = {};
  ASIENTOS.forEach((a,i)=>a.e.forEach(([c,d,h])=>{ (M[c] ||= {d:[],h:[]}); if(d) M[c].d.push([i+1,d]); if(h) M[c].h.push([i+1,h]); }));
  const L = Object.entries(M).map(([c,v])=>{ const D=v.d.reduce((a,x)=>a+x[1],0), H=v.h.reduce((a,x)=>a+x[1],0); return {c,...v,D,H,s:D-H}; });
  const tD=L.reduce((a,m)=>a+m.D,0), tH=L.reduce((a,m)=>a+m.H,0), sD=L.reduce((a,m)=>a+Math.max(m.s,0),0), sH=L.reduce((a,m)=>a+Math.max(-m.s,0),0);
  const hide = ["Caja","Banco Nación c/c","Capital social"];
  el.innerHTML = `<p class="src">Libro Mayor de los asientos de Marzo (lección 1.5). El número chico indica de qué asiento viene cada importe.</p>
    <div class="ts">${L.map(m=>`<div class="t"><div class="tt">${esc(m.c)}</div><div class="tb"><div>${m.d.map(x=>`<span class="num d"><sup>${x[0]}</sup> ${nf(x[1])}</span>`).join("")}</div><div>${m.h.map(x=>`<span class="num h">${nf(x[1])} <sup>${x[0]}</sup></span>`).join("")}</div></div><div class="sal">Saldo ${hide.includes(m.c)?"<b>?</b>":`<span class="num">${nf(Math.abs(m.s))}</span> ${m.s>=0?"deudor":"acreedor"}`}</div></div>`).join("")}</div>
    <p><b>Completá los saldos que faltan y el total de saldos deudores:</b></p><div data-n></div>
    <div data-bss hidden><div class="tw"><table><thead><tr><th>Cuenta</th><th class="r">Sumas Debe</th><th class="r">Sumas Haber</th><th class="r">Saldo deudor</th><th class="r">Saldo acreedor</th></tr></thead><tbody>
      ${L.map(m=>`<tr><td>${esc(m.c)}</td><td class="r num">${nf(m.D)}</td><td class="r num">${nf(m.H)}</td><td class="r num d">${m.s>0?nf(m.s):""}</td><td class="r num h">${m.s<0?nf(-m.s):""}</td></tr>`).join("")}
      </tbody><tfoot><tr><td>Totales</td><td class="r num">${nf(tD)}</td><td class="r num">${nf(tH)}</td><td class="r num">${nf(sD)}</td><td class="r num">${nf(sH)}</td></tr></tfoot></table></div></div>`;
  const s = c => Math.abs(L.find(m=>m.c===c).s);
  const n = $("[data-n]",el); n.id = nid("mx");
  EX.num({items:[
    {q:"Saldo de Caja",a:s("Caja"),u:"$",hint:"Sumá el Debe, sumá el Haber y restá."},
    {q:"Saldo de Banco Nación c/c",a:s("Banco Nación c/c"),u:"$",hint:"300.000 entró, 121.000 salió."},
    {q:"Saldo de Capital social",a:s("Capital social"),u:"$"},
    {q:"Total de saldos deudores del balance",a:sD,u:"$",hint:"Sumá todos los saldos deudores, incluidos los que ya ves."},
  ]}, n, ()=>{ $("[data-bss]",el).hidden=false; done(); });
}

 {lead:"La contabilidad es el sistema que registra lo que le pasa al patrimonio de un ente y lo convierte en información útil para decidir.",
  html:`<p>Cada vez que una empresa compra, vende, paga o cobra, su patrimonio cambia. La contabilidad <b>capta</b> esos hechos, los <b>mide</b> en dinero, los <b>registra</b> con un método ordenado y los <b>resume</b> en informes llamados estados contables.</p>
    <h3>Conceptos clave</h3>
    <ul>
      <li><b>Ente:</b> la organización cuyo patrimonio se registra (una SRL, una SA, un monotributista, una cooperativa). El patrimonio del ente es distinto del de sus dueños.</li>
      <li><b>Patrimonio:</b> el conjunto de bienes, derechos y obligaciones del ente en un momento dado.</li>
      <li><b>Hecho económico:</b> cualquier suceso que modifica el patrimonio: una compra, una venta, un incendio, un aporte de los socios.</li>

    <ul>
      <li><b>Patrimonial o financiera:</b> informa a terceros sobre el patrimonio y sus resultados. Se rige por normas profesionales.</li>

      <li><b>Gubernamental:</b> registra el patrimonio y el presupuesto del Estado.</li>

 {lead:"Todo lo que la empresa tiene fue financiado por alguien: por terceros (deudas) o por sus dueños.",
  html:`<p class="formula" style="text-align:center;font-size:1.2rem">Activo = Pasivo + Patrimonio Neto</p>

    <div class="note"><b>Ojo con el IVA.</b> El <i>IVA Crédito Fiscal</i> (el IVA que pagás al comprar) es un activo, porque lo podés descontar. El <i>IVA Débito Fiscal</i> (el IVA que cobrás al vender) es un pasivo, porque se lo debés a ARCA. La alícuota general es 21%.</div>`,

 {lead:"Todo hecho económico se registra en al menos dos cuentas, y lo que se anota en el Debe siempre es igual a lo que se anota en el Haber.",
  html:`<p>Este método, descripto por Luca Pacioli en 1494, se basa en que todo hecho tiene un origen y un destino. Si entra plata al banco (destino) es porque alguien la aportó, la prestó o la pagó (origen).</p>
    <p>Cada cuenta tiene dos columnas: <b class="d">Debe</b> (izquierda) y <b class="h">Haber</b> (derecha). Las reglas salen de la ecuación patrimonial:</p>
    <div class="tw"><table><thead><tr><th>Tipo de cuenta</th><th class="r">Aumenta en</th><th class="r">Disminuye en</th><th class="r">Saldo normal</th></tr></thead><tbody>
      <tr><td>Activo</td><td class="r d">Debe</td><td class="r h">Haber</td><td class="r">Deudor</td></tr>
      <tr><td>Pasivo</td><td class="r h">Haber</td><td class="r d">Debe</td><td class="r">Acreedor</td></tr>
      <tr><td>Patrimonio Neto</td><td class="r h">Haber</td><td class="r d">Debe</td><td class="r">Acreedor</td></tr>
      <tr><td>Resultado positivo</td><td class="r h">Haber</td><td class="r">—</td><td class="r">Acreedor</td></tr>
      <tr><td>Resultado negativo</td><td class="r d">Debe</td><td class="r">—</td><td class="r">Deudor</td></tr>
    </tbody></table></div>
    <div class="note"><b>Truco para recordar.</b> Lo que está a la izquierda de la ecuación (Activo) aumenta a la izquierda (Debe). Lo que está a la derecha (Pasivo y PN) aumenta a la derecha (Haber). Las ganancias aumentan el PN, entonces van al Haber; las pérdidas lo disminuyen, entonces van al Debe.</div>
    <p>“Debe” y “Haber” son solo nombres de columnas. No significan que alguien deba algo.</p>`,
  ex:[{type:"pick",title:"¿Debe o Haber?",options:["Debe","Haber"],items:[
    ["Aumenta Caja","Debe"],["Disminuye Banco c/c","Haber"],["Aumenta Proveedores","Haber"],["Se cancela un Préstamo bancario","Debe"],
    ["Aumenta Capital social","Haber"],["Se registran Ventas","Haber"],["Se registran Sueldos y jornales","Debe"],["Aumenta Deudores por ventas","Debe"],
    ["Se devengan Intereses ganados","Haber"],["Aumenta IVA Débito Fiscal","Haber"],["Aumenta IVA Crédito Fiscal","Debe"],["Disminuye Mercaderías","Haber"]]}]},
 {lead:"El asiento es la forma de registrar un hecho económico. El Libro Diario los reúne en orden cronológico.",
  html:`<p>Cada asiento tiene: número, fecha, las cuentas que se <b class="d">debitan</b> (primero), las que se <b class="h">acreditan</b> (después, con sangría y precedidas por “a”) y una breve explicación (la <i>leyenda</i>). La suma del Debe tiene que ser igual a la del Haber.</p>
    <div class="tw"><table><thead><tr><th>Fecha</th><th>Cuenta</th><th class="r">Debe</th><th class="r">Haber</th></tr></thead><tbody>
      <tr><td class="mono">10/03</td><td>Rodados</td><td class="r num d">800.000</td><td></td></tr>
      <tr><td></td><td style="padding-left:32px">a Documentos a pagar</td><td></td><td class="r num h">800.000</td></tr>
      <tr><td></td><td colspan="3" class="src"><i>Compra de utilitario, firmamos pagarés a 6 meses.</i></td></tr>
    </tbody></table></div>
    <h3>Cómo pensar un asiento en 3 pasos</h3>
    <ol>
      <li>¿Qué cuentas se mueven? Identificá qué entra, qué sale, qué deuda nace o se cancela, si hay ganancia o gasto.</li>
      <li>¿Cada una aumenta o disminuye?</li>
      <li>Aplicá las reglas de la lección anterior para saber si va al Debe o al Haber. Verificá que Debe = Haber.</li>
    </ol>
    <p>El art. 324 del Código Civil y Comercial prohíbe alterar el orden de los asientos, dejar espacios en blanco, hacer interlineaciones o raspaduras, y arrancar hojas. Los errores se corrigen con un <b>contraasiento</b>.</p>
    <div class="note"><b>Simplificación.</b> En este módulo registramos las ventas sin el costo de la mercadería vendida, que vemos en el Módulo 9. Los sueldos van sin cargas sociales, que vemos en el Módulo 22.</div>`,
  ex:[{type:"asiento",title:"Armá los asientos de Marzo",accounts:CUENTAS.map(c=>c[0]),entries:ASIENTOS}]},
 {lead:"El Diario ordena por fecha; el Mayor ordena por cuenta. El balance de sumas y saldos controla que todo esté bien pasado.",
  html:`<p><b>Mayorizar</b> es pasar cada renglón del Diario a la ficha de su cuenta. La ficha se dibuja como una “T”: a la izquierda los débitos, a la derecha los créditos.</p>
    <p>El <b>saldo</b> es la diferencia entre lo que suma el Debe y lo que suma el Haber. Si el Debe es mayor, el saldo es <b class="d">deudor</b>; si el Haber es mayor, es <b class="h">acreedor</b>.</p>
    <p>El <b>balance de sumas y saldos</b> (o balance de comprobación) lista todas las cuentas con sus sumas y su saldo. Tiene dos controles: el total de sumas del Debe es igual al del Haber, y el total de saldos deudores es igual al de saldos acreedores. Si no da, hay un error de registración o de pase. Ojo: que dé no garantiza que no haya errores (por ejemplo, si se usó una cuenta equivocada).</p>`,
  ex:[{type:"custom",title:"Mayorización y balance",render:mayorEx}]},

lessons:[
 {lead:"El porcentaje es la herramienta que más vas a usar como contador: IVA, márgenes, aumentos, descuentos, alícuotas e inflación.",
  html:`<p>Un porcentaje es una fracción de 100: 21% = 21/100 = 0,21. Para calcular el 21% de 50.000 multiplicás 50.000 × 0,21 = 10.500.</p>
  <h3>Aumentos y descuentos con un solo factor</h3>
  <ul><li>Aumentar un 15%: multiplicar por <b>1,15</b>.</li><li>Descontar un 15%: multiplicar por <b>0,85</b>.</li>
  <li>Porcentajes sucesivos se <b>multiplican</b>, no se suman: dos aumentos del 10% dan 1,10 × 1,10 = 1,21, o sea 21%.</li></ul>
  <h3>Sacar el IVA de un precio final</h3>
  <p>Si un precio de $ 121.000 incluye IVA 21%, el neto <b>no</b> es 121.000 × 0,79. Es 121.000 / 1,21 = <b>100.000</b>, y el IVA es 21.000.</p>
  <h3>Margen y markup</h3>
  <p>El <b>markup</b> se calcula sobre el costo: costo 1.000 con markup 25% → precio 1.250. El <b>margen</b> se calcula sobre el precio de venta: precio 1.250 y costo 1.000 dan un margen de 250/1.250 = 20%. Es el mismo negocio expresado de dos formas distintas.</p>
  <div class="formula">Precio = Costo / (1 − margen)  ·  Precio = Costo × (1 + markup)</div>
  <h3>Regla de tres</h3>
  <p><b>Directa:</b> si 4 kg cuestan $ 2.000, 10 kg cuestan 2.000 × 10/4 = 5.000. <b>Inversa:</b> si 3 empleados tardan 12 días, 4 empleados tardan 12 × 3/4 = 9 días (más gente, menos tiempo).</p>`,
  ex:[{type:"num",items:[
   {q:"¿Cuánto es el 15% de $ 80.000?",a:12000,u:"$"},
   {q:"Un precio final con IVA 21% es $ 121.000. ¿Cuál es el precio neto?",a:100000,u:"$",hint:"Dividí por 1,21."},
   {q:"Un producto aumenta 10% en enero y 10% en febrero. ¿Cuál fue el aumento total en %?",a:21,u:"%",tol:0.05,hint:"1,10 × 1,10"},
   {q:"Un producto cuesta $ 1.000 y querés un margen del 20% sobre el precio de venta. ¿A qué precio vendés?",a:1250,u:"$",hint:"Costo / (1 − 0,20)"},
   {q:"Un precio baja 20% y después sube 20%. ¿Cuál es la variación total en %? (usá signo negativo si baja)",a:-4,u:"%",tol:0.05,hint:"0,80 × 1,20"},
   {q:"3 empleados cargan facturas en 12 días. ¿Cuántos días tardan 4 empleados?",a:9,u:"días"}]}]},
 {lead:"Plantear una ecuación es traducir un problema en palabras a una igualdad con una incógnita.",
  html:`<p>Una ecuación lineal tiene la forma <span class="mono">ax + b = c</span>. Se resuelve despejando: lo que suma pasa restando, lo que multiplica pasa dividiendo.</p>
  <div class="formula">2x + 3 = 15  →  2x = 12  →  x = 6</div>
  <h3>Sistemas de dos ecuaciones</h3>
  <p>Cuando hay dos incógnitas necesitás dos ecuaciones. Ejemplo: un comercio vendió 100 unidades entre dos productos, A a $ 3 y B a $ 5, y facturó $ 380. ¿Cuántas de cada uno?</p>
  <div class="formula">x + y = 100  ·  3x + 5y = 380</div>
  <p>Por <b>sustitución</b>: x = 100 − y. Reemplazo: 3(100 − y) + 5y = 380 → 300 + 2y = 380 → y = 40, x = 60.</p>
  <p>Otros métodos: <b>igualación</b> (despejar la misma incógnita en las dos y se igualan), <b>reducción</b> (sumar o restar ecuaciones para eliminar una incógnita) y <b>determinantes</b> (regla de Cramer, que vemos en la lección 2.7).</p>
  <h3>Inecuaciones</h3>
  <p>Sirven para preguntas como “¿cuántas unidades tengo que vender para no perder?”. Se resuelven igual que una ecuación, con una regla extra: si multiplicás o dividís por un número negativo, el signo se invierte.</p>`,
  ex:[{type:"num",items:[
   {q:"Resolvé: 5x − 20 = 30. ¿Cuánto vale x?",a:10},
   {q:"Un sueldo bruto menos 17% de aportes da un neto de $ 830.000. ¿Cuál es el bruto?",a:1000000,u:"$",hint:"0,83 × B = 830.000"},
   {q:"En el ejemplo de la lección, si se hubieran facturado $ 420 con 100 unidades, ¿cuántas unidades de B se vendieron?",a:60,hint:"300 + 2y = 420"},
   {q:"Dos socios aportan $ 900.000 en total. Uno aporta el doble que el otro. ¿Cuánto aporta el que pone menos?",a:300000,u:"$"}]}]},
 {lead:"Las funciones lineales modelan los costos y los ingresos de casi cualquier negocio simple.",
  html:`<p>Una función lineal es <span class="mono">y = m·x + b</span>, donde <b>m</b> es la pendiente (cuánto cambia y por cada unidad de x) y <b>b</b> es la ordenada al origen (el valor de y cuando x = 0).</p>
  <h3>El modelo costo, ingreso y beneficio</h3>
  <div class="formula">CT(q) = CF + cv·q  ·  IT(q) = p·q  ·  B(q) = IT − CT = (p − cv)·q − CF</div>
  <ul><li><b>CF</b>, costo fijo: no depende de cuánto produzcas (alquiler, sueldos administrativos).</li>
  <li><b>cv</b>, costo variable unitario: crece con cada unidad (materia prima, comisiones).</li>
  <li><b>p − cv</b> es la <b>contribución marginal unitaria</b>: lo que cada unidad aporta para cubrir los fijos.</li></ul>
  <h3>Punto de equilibrio</h3>
  <p>Es la cantidad donde B = 0, o sea donde no ganás ni perdés:</p>
  <div class="formula">q* = CF / (p − cv)</div>
  <p>Ejemplo: CF = $ 200.000, cv = $ 300, p = $ 500. Cada unidad aporta $ 200, entonces necesitás 200.000 / 200 = <b>1.000 unidades</b>. Este concepto se profundiza en el Módulo 18 de Costos.</p>`,
  ex:[{type:"num",items:[
   {q:"CF = $ 200.000, cv = $ 300, p = $ 500. ¿Cuál es el punto de equilibrio en unidades?",a:1000},
   {q:"Con los mismos datos, ¿cuál es el beneficio si vendés 1.500 unidades?",a:100000,u:"$",hint:"(500 − 300) × 1.500 − 200.000"},
   {q:"Un taxi cobra $ 1.500 de bajada y $ 400 por km. ¿Cuánto cuesta un viaje de 12 km?",a:6300,u:"$"},
   {q:"Si el costo total de producir 100 unidades es $ 50.000 y el de 200 unidades es $ 80.000, ¿cuál es el costo variable unitario?",a:300,u:"$",hint:"Es la pendiente: (80.000 − 50.000) / (200 − 100)"},
   {q:"Con los datos anteriores, ¿cuál es el costo fijo?",a:20000,u:"$"}]}]},
 {lead:"Cuando el precio depende de la cantidad, o cuando el dinero crece con interés, aparecen curvas.",
  html:`<h3>Función cuadrática</h3>
  <p>Tiene la forma <span class="mono">y = a·x² + b·x + c</span> y su gráfico es una parábola. Si <b>a</b> es negativo, la parábola tiene un máximo en el vértice:</p>
  <div class="formula">x_vértice = −b / (2a)</div>
  <p>Aparece cuando la demanda es lineal: si para vender más tenés que bajar el precio, p = 200 − 2q, el ingreso es IT = p·q = 200q − 2q². El ingreso máximo está en q = −200 / (2·(−2)) = <b>50 unidades</b>.</p>
  <h3>Función exponencial</h3>
  <p>Modela el crecimiento a una tasa constante: un capital que gana 5% por período durante t períodos vale <span class="mono">C · (1,05)^t</span>. Es la base del interés compuesto (Módulo 11) y de la inflación acumulada.</p>
  <h3>Logaritmos</h3>
  <p>El logaritmo responde “¿a qué exponente tengo que elevar?”. Sirve para despejar el tiempo: ¿en cuántos períodos se duplica un capital al 5%?</p>
  <div class="formula">1,05^t = 2  →  t = ln 2 / ln 1,05 ≈ 14,21 períodos</div>`,
  ex:[{type:"num",items:[
   {q:"La demanda es p = 300 − 3q. ¿Con qué cantidad se maximiza el ingreso total?",a:50,hint:"IT = 300q − 3q². Vértice: −300 / (2·(−3))"},
   {q:"Con esa cantidad, ¿cuál es el ingreso máximo?",a:7500,u:"$",hint:"Precio = 300 − 3·50 = 150"},
   {q:"$ 100.000 crecen al 10% por año durante 3 años (compuesto). ¿Cuánto valen al final?",a:133100,u:"$"},
   {q:"¿En cuántos años se duplica un capital al 10% anual compuesto? (con dos decimales)",a:7.27,tol:0.02,u:"años",hint:"ln 2 / ln 1,1"}]}]},
 {lead:"La derivada mide cuánto cambia una función cuando su variable cambia un poquito. En economía se llama análisis marginal.",
  html:`<p>Si CT(q) es el costo total de producir q unidades, la derivada CT'(q) es el <b>costo marginal</b>: lo que cuesta, aproximadamente, producir una unidad más. Lo mismo vale para el ingreso marginal (IMg) y el beneficio marginal.</p>
  <h3>Reglas básicas de derivación</h3>
  <div class="tw"><table><thead><tr><th>Función</th><th>Derivada</th></tr></thead><tbody>
   <tr><td class="mono">k (constante)</td><td class="mono">0</td></tr>
   <tr><td class="mono">a·x</td><td class="mono">a</td></tr>
   <tr><td class="mono">xⁿ</td><td class="mono">n·xⁿ⁻¹</td></tr>
   <tr><td class="mono">f + g</td><td class="mono">f' + g'</td></tr>
   <tr><td class="mono">eˣ</td><td class="mono">eˣ</td></tr>
   <tr><td class="mono">ln x</td><td class="mono">1/x</td></tr>
  </tbody></table></div>
  <p>Ejemplo: CT(q) = 0,5q² + 20q + 1.000. Entonces CMg(q) = q + 20. Producir la unidad 50 cuesta aproximadamente 50 + 20 = <b>$ 70</b>. El costo fijo (1.000) desaparece al derivar, porque no cambia con la cantidad.</p>
  <h3>Costo medio</h3>
  <p>El costo medio es CT/q. Cuando el costo marginal es menor que el medio, el medio baja; cuando es mayor, el medio sube. Por eso el costo medio es mínimo justo donde CMg = CMe.</p>`,
  ex:[{type:"num",items:[
   {q:"Si CT(q) = 0,5q² + 20q + 1.000, ¿cuál es el costo marginal en q = 80?",a:100,u:"$"},
   {q:"Derivá f(x) = 3x² + 5x − 7 y evaluá en x = 2.",a:17,hint:"f'(x) = 6x + 5"},
   {q:"IT(q) = 200q − 2q². ¿Cuál es el ingreso marginal en q = 30?",a:80,u:"$",hint:"IMg = 200 − 4q"},
   {q:"Con CT(q) = 0,5q² + 20q + 1.000, ¿en qué cantidad el costo medio es mínimo? (CMe = CMg)",a:44.72,tol:0.05,hint:"0,5q + 20 + 1.000/q = q + 20 → 1.000/q = 0,5q → q² = 2.000"}]}]},
 {lead:"Una empresa maximiza su beneficio donde el ingreso de una unidad más es igual a su costo.",
  html:`<p>Para encontrar el máximo (o mínimo) de una función se busca dónde la derivada vale cero. Para saber si es máximo, la segunda derivada tiene que ser negativa.</p>
  <div class="formula">B(q) = IT(q) − CT(q)  →  B'(q) = 0  →  IMg = CMg</div>
  <h3>Ejemplo completo</h3>
  <p>Demanda: p = 200 − 2q. Costo: CT = 1.000 + 40q.</p>
  <ol><li>IT = 200q − 2q², entonces IMg = 200 − 4q.</li>
  <li>CMg = 40.</li><li>IMg = CMg → 200 − 4q = 40 → <b>q = 40</b>.</li>
  <li>Precio: p = 200 − 80 = <b>$ 120</b>.</li>
  <li>Beneficio: IT = 4.800, CT = 2.600, B = <b>$ 2.200</b>.</li>
  <li>B''(q) = −4 &lt; 0, confirma que es un máximo.</li></ol>
  <div class="note"><b>Para qué le sirve a un contador.</b> No vas a derivar todos los días, pero la idea de “decidir en el margen” está en todas las decisiones de costos: aceptar un pedido especial, agregar un turno de producción o fijar un precio.</div>`,
  ex:[{type:"num",items:[
   {q:"Demanda p = 300 − 3q y CT = 2.000 + 60q. ¿Qué cantidad maximiza el beneficio?",a:40,hint:"IMg = 300 − 6q; CMg = 60"},
   {q:"¿A qué precio se vende esa cantidad?",a:180,u:"$"},
   {q:"¿Cuál es el beneficio máximo?",a:2800,u:"$",hint:"IT = 180 × 40; CT = 2.000 + 60 × 40"}]}]},
 {lead:"Una matriz es una tabla de números. Sirve para trabajar con muchos productos, sucursales o períodos a la vez.",
  html:`<p>Una matriz de 2 × 3 tiene 2 filas y 3 columnas. Si las filas son sucursales y las columnas productos, cada número es la cantidad vendida.</p>
  <div class="tw"><table><thead><tr><th></th><th class="r">Prod. A</th><th class="r">Prod. B</th><th class="r">Prod. C</th></tr></thead><tbody>
  <tr><td>Sucursal 1</td><td class="r num">10</td><td class="r num">5</td><td class="r num">2</td></tr>
  <tr><td>Sucursal 2</td><td class="r num">4</td><td class="r num">8</td><td class="r num">6</td></tr></tbody></table></div>
  <p>Si los precios son A = 100, B = 200, C = 500, la facturación de cada sucursal es el <b>producto</b> de la matriz por el vector de precios: fila por columna, multiplicando y sumando.</p>
  <div class="formula">Sucursal 1: 10·100 + 5·200 + 2·500 = 3.000  ·  Sucursal 2: 4·100 + 8·200 + 6·500 = 5.000</div>
  <h3>Determinante y regla de Cramer</h3>

lessons:[
 {lead:"La estadística ordena datos para describir una situación y sacar conclusiones con un margen de error conocido.",
  html:`<ul><li><b>Población:</b> el conjunto completo que querés estudiar (todas las facturas del año).</li>
  <li><b>Muestra:</b> una parte de la población (200 facturas elegidas al azar).</li>
  <li><b>Variable:</b> la característica que medís en cada elemento.</li></ul>
  <h3>Tipos de variables</h3>
  <div class="tw"><table><thead><tr><th>Tipo</th><th>Ejemplo</th></tr></thead><tbody>
  <tr><td><b>Cualitativa nominal</b>: categorías sin orden</td><td>Provincia del cliente, tipo de factura (A, B, C)</td></tr>
  <tr><td><b>Cualitativa ordinal</b>: categorías con orden</td><td>Calificación crediticia (alta, media, baja)</td></tr>
  <tr><td><b>Cuantitativa discreta</b>: se cuenta</td><td>Cantidad de empleados, unidades vendidas</td></tr>
  <tr><td><b>Cuantitativa continua</b>: se mide</td><td>Importe de una factura, días de atraso promedio, peso</td></tr></tbody></table></div>
  <h3>Tabla de frecuencias</h3>
  <p>Días de atraso en el pago de 20 clientes:</p>
  <div class="tw"><table><thead><tr><th>Días</th><th class="r">Frecuencia absoluta (f)</th><th class="r">Relativa (f/n)</th><th class="r">Acumulada (F)</th></tr></thead><tbody>

  <p>Leés: el 70% de los clientes paga con menos de 20 días de atraso (0,40 + 0,30). Los gráficos típicos son el histograma (cuantitativas), el de barras y el de sectores (cualitativas).</p>`,

 {lead:"Las medidas de posición resumen un conjunto de datos en un solo valor representativo.",
  html:`<ul><li><b>Media aritmética:</b> la suma de los datos dividida por la cantidad. Datos 4, 8, 6, 10, 12 → media 40/5 = 8.</li>
  <li><b>Mediana:</b> el valor del medio con los datos ordenados. 4, 6, <b>8</b>, 10, 12 → mediana 8. Si la cantidad es par, es el promedio de los dos centrales.</li>
  <li><b>Moda:</b> el valor que más se repite.</li></ul>
  <div class="note"><b>Media o mediana.</b> La media se deja arrastrar por valores extremos. Si cuatro empleados ganan $ 1 millón y el dueño $ 11 millones, la media es $ 3 millones pero la mediana es $ 1 millón. Para sueldos o precios de viviendas, la mediana suele representar mejor.</div>
  <h3>Media ponderada</h3>
  <p>Cuando cada dato tiene un peso distinto. Es exactamente el método del <b>precio promedio ponderado (PPP)</b> que se usa para valuar inventarios:</p>
  <div class="formula">Compra 1: 100 u a $ 50 · Compra 2: 300 u a $ 60 → PPP = (5.000 + 18.000) / 400 = $ 57,50</div>
  <h3>Cuartiles y percentiles</h3>
  <p>Dividen los datos ordenados en partes iguales. El primer cuartil (Q1) deja por debajo el 25% de los datos; el percentil 90 deja por debajo el 90%. La mediana es el Q2.</p>`,
  ex:[{type:"num",items:[
   {q:"Ventas diarias: 120, 150, 90, 200, 140. ¿Cuál es la media?",a:140},
   {q:"Con esos mismos datos, ¿cuál es la mediana?",a:140,hint:"Ordená: 90, 120, 140, 150, 200"},
   {q:"Sueldos: 800, 900, 900, 1.000, 1.200, 5.000 (en miles). ¿Cuál es la mediana?",a:950,hint:"Hay 6 datos: promediá el 3.º y el 4.º"},
   {q:"Compraste 200 u a $ 40 y 50 u a $ 70. ¿Cuál es el precio promedio ponderado?",a:46,u:"$"}]}]},
 {lead:"Dos empresas pueden tener la misma venta promedio y riesgos muy distintos. La dispersión mide cuánto se alejan los datos del promedio.",
  html:`<ul><li><b>Rango:</b> máximo menos mínimo.</li>
  <li><b>Varianza:</b> el promedio de los desvíos al cuadrado respecto de la media.</li>
  <li><b>Desvío estándar (σ):</b> la raíz cuadrada de la varianza. Está en las mismas unidades que los datos.</li>
  <li><b>Coeficiente de variación (CV):</b> σ / media. Permite comparar dispersión entre series de distinto tamaño.</li></ul>
  <div class="formula">σ² = Σ (xᵢ − media)² / n   ·   σ = √σ²   ·   CV = σ / media</div>
  <p>Ejemplo con 2, 4, 4, 4, 5, 5, 7, 9: media = 5. Desvíos al cuadrado: 9, 1, 1, 1, 0, 0, 4, 16 → suma 32 → varianza 32/8 = 4 → σ = 2 → CV = 40%.</p>
  <p>Si los datos son una <b>muestra</b> y querés estimar la varianza de la población, se divide por <b>n − 1</b> en lugar de n (varianza muestral corregida).</p>
  <div class="note"><b>Aplicación.</b> En finanzas, el desvío estándar de los rendimientos es la medida clásica de riesgo (Módulo 23). En auditoría, un desvío grande en una cuenta respecto de su comportamiento habitual es una señal para investigar.</div>`,
  ex:[{type:"num",items:[
   {q:"Datos 10, 20, 30. ¿Cuál es la varianza poblacional?",a:66.67,tol:0.05,hint:"Media 20; desvíos² 100, 0, 100"},
   {q:"Con los mismos datos, ¿cuál es el desvío estándar? (dos decimales)",a:8.16,tol:0.02},
   {q:"Una serie tiene media 200 y σ = 30. ¿Cuál es su coeficiente de variación en %?",a:15,u:"%",tol:0.1},
   {q:"Sucursal A: media 1.000, σ 100. Sucursal B: media 500, σ 75. ¿Qué CV tiene la sucursal B en %?",a:15,u:"%",tol:0.1,ex:"A tiene CV 10%: es relativamente más estable que B."}]}]},
 {lead:"La probabilidad mide qué tan posible es que ocurra algo, entre 0 (imposible) y 1 (seguro).",
  html:`<p><b>Probabilidad clásica:</b> casos favorables / casos posibles. La probabilidad de sacar un número par con un dado es 3/6 = 0,5.</p>
  <h3>Reglas</h3>
  <ul><li><b>Complemento:</b> P(no A) = 1 − P(A).</li>
  <li><b>Suma:</b> P(A o B) = P(A) + P(B) − P(A y B). Si son excluyentes, el último término es 0.</li>
  <li><b>Producto (independientes):</b> P(A y B) = P(A) · P(B).</li>
  <li><b>Condicional:</b> P(A | B) = P(A y B) / P(B), la probabilidad de A sabiendo que ocurrió B.</li></ul>
  <h3>Valor esperado</h3>
  <p>Es el promedio de los resultados posibles ponderado por su probabilidad. Se usa para decidir con riesgo y para estimar previsiones.</p>
  <div class="formula">Proyecto: 60% gana $ 100.000 · 40% pierde $ 50.000 → VE = 0,6·100.000 + 0,4·(−50.000) = $ 40.000</div>
  <div class="note"><b>Aplicación contable.</b> Las normas piden registrar una previsión cuando una pérdida es <b>probable</b> y se puede estimar. Para un juicio con 70% de probabilidad de perderse por $ 1.000.000 se registra la mejor estimación del importe, no el valor esperado mecánico. Lo vemos en el Módulo 13.</div>`,
  ex:[{type:"num",items:[
   {q:"De 200 clientes, 30 están en mora. Si elegís uno al azar, ¿cuál es la probabilidad (en %) de que esté al día?",a:85,u:"%",tol:0.1},
   {q:"Dos controles independientes detectan un error con probabilidad 0,8 y 0,7. ¿Cuál es la probabilidad de que ninguno lo detecte? (decimal)",a:0.06,tol:0.001,hint:"0,2 × 0,3"},
   {q:"Una inversión: 50% gana $ 200.000, 30% gana $ 50.000, 20% pierde $ 300.000. ¿Valor esperado?",a:55000,u:"$"},

 {lead:"Muchas variables (pesos, errores de medición, rendimientos promedio) se distribuyen con forma de campana: la distribución normal.",
  html:`<p>La normal queda definida por su media (μ) y su desvío (σ). Es simétrica: la media, la mediana y la moda coinciden.</p>
  <h3>Regla empírica 68 · 95 · 99,7</h3>
  <ul><li>Entre μ ± 1σ cae aproximadamente el <b>68%</b> de los datos.</li>
  <li>Entre μ ± 2σ, el <b>95%</b> (exactamente ±1,96σ).</li>
  <li>Entre μ ± 3σ, el <b>99,7%</b>.</li></ul>
  <h3>Estandarizar: el valor z</h3>
  <div class="formula">z = (x − μ) / σ</div>
  <p>z dice a cuántos desvíos de la media está un valor. Con μ = 100 y σ = 15, el valor 130 tiene z = 2: está en el 2,5% superior.</p>
  <p>Para valores exactos se usa una tabla de la normal estándar o la función <span class="mono">DISTR.NORM.ESTAND.N</span> de la hoja de cálculo. Algunos valores útiles: P(Z &lt; 1) = 0,8413; P(Z &lt; 1,645) = 0,95; P(Z &lt; 1,96) = 0,975.</p>`,
  ex:[{type:"num",items:[
   {q:"μ = 500, σ = 50. ¿Cuál es el z de x = 600?",a:2},
   {q:"Con esa distribución, ¿qué % de los datos cae entre 450 y 550 (regla empírica)?",a:68,u:"%",tol:0.5},
   {q:"¿Qué % cae por encima de 600 (regla empírica)?",a:2.5,u:"%",tol:0.1,hint:"95% está entre ±2σ; el 5% restante se reparte en las dos colas."},
   {q:"Con P(Z < 1) = 0,8413, ¿qué probabilidad (en %) hay de superar μ + 1σ?",a:15.87,u:"%",tol:0.02}]}]},
 {lead:"Revisar una muestra bien elegida permite opinar sobre toda la población con un error controlado. Es la base del muestreo de auditoría.",
  html:`<h3>Tipos de muestreo</h3>
  <ul><li><b>Aleatorio simple:</b> cada elemento tiene la misma probabilidad de ser elegido.</li>
  <li><b>Sistemático:</b> se elige un punto de partida al azar y después uno cada k elementos (una factura cada 50).</li>
  <li><b>Estratificado:</b> se divide la población en grupos homogéneos (por monto, por sucursal) y se muestrea en cada uno.</li>
  <li><b>Por unidad monetaria:</b> cada peso tiene la misma probabilidad, así las partidas grandes tienen más chance de entrar. Muy usado en auditoría.</li></ul>
  <h3>Intervalo de confianza para la media</h3>
  <div class="formula">media muestral ± z · σ / √n     (z = 1,96 para 95% de confianza)</div>
  <p>Ejemplo: 400 facturas, promedio $ 500, σ = $ 100. Error estándar = 100/√400 = 5. Intervalo al 95%: 500 ± 9,8 → <b>[490,2 ; 509,8]</b>.</p>
  <p>Para reducir el error a la mitad hay que <b>cuadruplicar</b> la muestra, porque el error depende de √n.</p>
  <h3>Prueba de hipótesis</h3>
  <p>Se plantea una hipótesis nula (H₀, “no hay diferencia”) y se rechaza si los datos muestran algo muy improbable bajo H₀. El nivel de significación (α, típicamente 5%) es el riesgo aceptado de rechazar H₀ siendo verdadera.</p>`,
  ex:[{type:"pick",title:"¿Qué tipo de muestreo es?",options:["Aleatorio simple","Sistemático","Estratificado"],items:[
     ["Se sortean 60 legajos de empleados con números al azar","Aleatorio simple"],["Se revisa una factura cada 100, empezando por la n.º 37","Sistemático"],
     ["Se separan las cuentas a cobrar en mayores y menores a $ 1 millón y se muestrea cada grupo","Estratificado"]]},
   {type:"num",items:[{q:"Muestra de 100 partidas, media $ 2.000, σ $ 500. ¿Cuál es el error estándar?",a:50,u:"$"},{q:"¿Cuál es el límite superior del intervalo al 95%?",a:2098,u:"$",hint:"2.000 + 1,96 × 50"}]}]},
 {lead:"Un número índice compara un valor con el de un período base. Es la herramienta para medir y corregir la inflación.",
  html:`<div class="formula">Índice = Valor actual / Valor base × 100   ·   Variación % = (I₁ / I₀ − 1) × 100</div>
  <p>El <b>IPC</b> del INDEC mide la evolución de los precios de una canasta de consumo (base diciembre 2016 = 100). Para el ajuste por inflación contable se usa un índice combinado definido por la FACPCE (IPIM hasta 2016 e IPC desde 2017), como vemos en el Módulo 14.</p>
  <h3>Inflación acumulada</h3>
  <p>Las tasas mensuales se <b>componen</b>: 3% mensual durante 12 meses no es 36% sino 1,03¹² − 1 = <b>42,58%</b>.</p>
  <h3>Deflactar: pasar de valores nominales a reales</h3>
  <p>Si un sueldo subió 30% y la inflación fue 40%, la variación real es 1,30 / 1,40 − 1 = <b>−7,14%</b>: perdió poder adquisitivo.</p>
  <h3>Coeficiente de reexpresión</h3>
  <p>Para expresar un importe de una fecha pasada en moneda de cierre: <span class="mono">importe × índice cierre / índice de origen</span>. Un bien comprado a $ 1.000.000 con índice 200, al cierre con índice 260, se reexpresa a 1.000.000 × 1,30 = $ 1.300.000.</p>`,
  ex:[{type:"num",items:[
   {q:"El índice pasó de 250 a 300. ¿Cuál fue la variación en %?",a:20,u:"%",tol:0.05},
   {q:"Inflación mensual del 2% durante 12 meses. ¿Inflación anual acumulada en %? (dos decimales)",a:26.82,u:"%",tol:0.02},
   {q:"Un sueldo sube 50% y la inflación del período es 25%. ¿Variación real en %?",a:20,u:"%",tol:0.05},
   {q:"Un terreno se compró a $ 2.000.000 con índice 400. Al cierre el índice es 520. ¿Importe reexpresado?",a:2600000,u:"$"}]}]},
],

/* Módulo 4 · Microeconomía */
CAMPUS.content[4] = {
lessons:[
 {lead:"La economía estudia cómo se usan recursos escasos para satisfacer necesidades que no tienen límite.",
  html:`<p>Como los recursos (trabajo, tierra, capital, capacidad empresarial) son escasos, toda decisión implica renunciar a algo. Eso que se resigna es el <b>costo de oportunidad</b>: el valor de la mejor alternativa que dejaste de lado.</p>
  <div class="note"><b>Ejemplo.</b> Si tenés $ 10 millones ociosos en la cuenta corriente, aunque no veas un gasto, estás perdiendo el interés que podrías haber ganado en un plazo fijo. Ese interés es el costo de oportunidad de tener plata parada, y es clave en finanzas (Módulo 23).</div>
  <h3>Las tres preguntas básicas</h3>
  <ul><li>¿Qué producir y cuánto?</li><li>¿Cómo producirlo?</li><li>¿Para quién?</li></ul>
  <p>Las economías de mercado responden con precios; las planificadas, con decisiones del Estado; las mixtas, como la argentina, combinan ambas.</p>
  <h3>Frontera de posibilidades de producción</h3>
  <p>Muestra las combinaciones máximas de dos bienes que se pueden producir con los recursos disponibles. Un punto dentro de la frontera indica recursos desaprovechados (desempleo); un punto fuera es inalcanzable hoy. El crecimiento económico corre la frontera hacia afuera.</p>
  <h3>Micro y macro</h3>
  <p>La <b>microeconomía</b> estudia decisiones individuales: consumidores, empresas, mercados. La <b>macroeconomía</b> estudia agregados: PBI, inflación, desempleo (Módulo 5).</p>`,
  ex:[{type:"tf",items:[
   ["El costo de oportunidad de estudiar es solo lo que pagás de cuota","Falso","También incluye lo que dejás de ganar trabajando en ese tiempo."],
   ["Un punto dentro de la frontera de posibilidades indica recursos ociosos","Verdadero"],
   ["La inflación es un tema de microeconomía","Falso","Es un fenómeno agregado: macroeconomía."],
   ["La escasez existe porque los recursos son limitados frente a necesidades ilimitadas","Verdadero"],
   ["Tener efectivo sin invertir no tiene ningún costo","Falso","Tiene costo de oportunidad: el rendimiento resignado."]]}]},
 {lead:"El precio de un bien se forma donde la cantidad que los compradores quieren comprar coincide con la que los vendedores quieren vender.",
  html:`<h3>Demanda</h3>
  <p>Relación entre el precio y la cantidad que los consumidores quieren comprar. Con todo lo demás constante, si el precio sube, la cantidad demandada baja (pendiente negativa). La demanda se <b>desplaza</b> por cambios en el ingreso, en los precios de bienes relacionados, en los gustos o en las expectativas.</p>
  <h3>Oferta</h3>
  <p>Relación entre el precio y la cantidad que las empresas quieren vender. Si el precio sube, conviene producir más (pendiente positiva). La oferta se desplaza por cambios en los costos, la tecnología o los impuestos.</p>
  <h3>Equilibrio</h3>
  <p>Si Qd = 100 − 2p y Qo = −20 + 4p, se igualan: 100 − 2p = −20 + 4p → <b>p = 20</b>, Q = 60.</p>
  <ul><li>Si el precio está por encima del equilibrio, hay <b>exceso de oferta</b> y el precio tiende a bajar.</li>
  <li>Si está por debajo (por ejemplo, un precio máximo fijado por el Estado), hay <b>exceso de demanda</b>: faltantes.</li></ul>
  <div class="note"><b>Movimiento sobre la curva o desplazamiento.</b> Si cambia el precio del propio bien, te movés por la curva. Si cambia otra cosa (ingreso, costos), la curva entera se desplaza.</div>`,
  ex:[{type:"num",items:[
   {q:"Qd = 200 − 5p y Qo = 20 + 4p. ¿Cuál es el precio de equilibrio?",a:20},
   {q:"¿Y la cantidad de equilibrio?",a:100},
   {q:"Si el Estado fija un precio máximo de 10, ¿cuál es el exceso de demanda (Qd − Qo)?",a:90,hint:"Qd = 150; Qo = 60"}]},
   {type:"pick",title:"¿Qué curva se desplaza y hacia dónde?",options:["Demanda ↑","Demanda ↓","Oferta ↑","Oferta ↓"],items:[
    ["Sube el ingreso de los consumidores (bien normal)","Demanda ↑"],["Aumenta el precio de la harina para las panaderías","Oferta ↓"],
    ["Una nueva máquina reduce el costo de producción","Oferta ↑"],["Baja el precio de un bien sustituto","Demanda ↓"]]}]},
 {lead:"La elasticidad mide cuánto reacciona la cantidad demandada cuando cambia el precio. Decide si una suba de precios aumenta o reduce la facturación.",
  html:`<div class="formula">Elasticidad precio = variación % de la cantidad / variación % del precio</div>
  <p>Se suele expresar en valor absoluto.</p>
  <ul><li><b>Elástica (&gt; 1):</b> la cantidad cambia proporcionalmente más que el precio. Si subís el precio, la facturación <b>baja</b>.</li>
  <li><b>Inelástica (&lt; 1):</b> la cantidad cambia menos. Si subís el precio, la facturación <b>sube</b>. Típico de bienes necesarios sin sustitutos (medicamentos, combustible a corto plazo).</li>
  <li><b>Unitaria (= 1):</b> la facturación no cambia.</li></ul>
  <p>Ejemplo: el precio sube 10% y las ventas caen 25%. Elasticidad = 25/10 = 2,5, elástica: la suba fue mala idea.</p>
  <h3>Otras elasticidades</h3>
  <ul><li><b>Ingreso:</b> positiva en bienes normales, negativa en bienes inferiores, mayor a 1 en bienes de lujo.</li>
  <li><b>Cruzada:</b> positiva entre sustitutos (manteca y margarina), negativa entre complementarios (impresora y cartuchos).</li></ul>
  <div class="note"><b>Y los impuestos.</b> Un impuesto recae más sobre el lado del mercado que es más inelástico, porque tiene menos opciones para escapar. Por eso los impuestos a los combustibles o al tabaco recaudan mucho. Esto se llama incidencia y se ve en el Módulo 19.</div>`,
  ex:[{type:"num",items:[
   {q:"El precio baja 5% y la cantidad sube 15%. ¿Cuál es la elasticidad precio (en valor absoluto)?",a:3},
   {q:"Un producto con elasticidad 0,4 sube 10% su precio. ¿Cuánto cae la cantidad, en %?",a:4,u:"%",tol:0.05}]},
   {type:"pick",title:"Si la empresa sube el precio, ¿qué pasa con su facturación?",options:["Sube","Baja","No cambia"],items:[
    ["Elasticidad 0,3","Sube"],["Elasticidad 1,8","Baja"],["Elasticidad 1","No cambia"],["Medicamento sin sustituto","Sube"],["Una marca de gaseosa entre muchas parecidas","Baja"]]}]},
 {lead:"La teoría de la producción explica cómo combina una empresa sus recursos y por qué sus costos tienen la forma que tienen.",
  html:`<h3>Corto y largo plazo</h3>
  <p>En el <b>corto plazo</b> hay al menos un factor fijo (la planta). En el <b>largo plazo</b> todos los factores se pueden cambiar.</p>
  <h3>Rendimientos decrecientes</h3>
  <p>Si agregás trabajadores a una planta fija, llega un punto en que cada trabajador adicional produce menos que el anterior (se estorban, faltan máquinas). Por eso el costo marginal termina subiendo.</p>
  <h3>Costos de la empresa</h3>
  <div class="tw"><table><thead><tr><th>Concepto</th><th>Fórmula</th></tr></thead><tbody>
  <tr><td>Costo total (CT)</td><td class="mono">CF + CV</td></tr><tr><td>Costo medio (CMe)</td><td class="mono">CT / q</td></tr>
  <tr><td>Costo variable medio (CVMe)</td><td class="mono">CV / q</td></tr><tr><td>Costo marginal (CMg)</td><td class="mono">ΔCT / Δq</td></tr></tbody></table></div>
  <h3>Costo económico y costo contable</h3>
  <p>El costo contable incluye lo que efectivamente se pagó o devengó. El <b>costo económico</b> suma además los costos de oportunidad, como el sueldo que el dueño no se paga o el rendimiento del capital propio. Una empresa puede tener <b>ganancia contable</b> y <b>pérdida económica</b>.</p>
  <h3>Economías de escala</h3>
  <p>En el largo plazo, si al crecer baja el costo medio, hay economías de escala (compras por volumen, especialización). Si sube, deseconomías (burocracia, coordinación).</p>`,
  ex:[{type:"num",items:[
   {q:"CF = $ 50.000, CV de 1.000 unidades = $ 150.000. ¿Costo medio?",a:200,u:"$"},
   {q:"Producir 1.000 u cuesta $ 200.000 en total y 1.001 u cuesta $ 200.180. ¿Costo marginal de la unidad 1.001?",a:180,u:"$"},
   {q:"Un negocio tuvo ganancia contable de $ 3.000.000 en el año. El dueño podría ganar $ 4.000.000 trabajando en relación de dependencia. ¿Ganancia económica? (con signo)",a:-1000000,u:"$"}]}]},
 {lead:"Cuánto poder tiene una empresa para fijar precios depende de cuántos competidores tiene y de qué tan parecidos son sus productos.",
  html:`<div class="tw"><table><thead><tr><th>Estructura</th><th>Empresas</th><th>Producto</th><th>Poder sobre el precio</th><th>Ejemplo</th></tr></thead><tbody>
  <tr><td><b>Competencia perfecta</b></td><td>Muchas</td><td>Homogéneo</td><td>Ninguno: es tomadora de precio</td><td>Soja, trigo</td></tr>
  <tr><td><b>Competencia monopolística</b></td><td>Muchas</td><td>Diferenciado</td><td>Algo, por la marca</td><td>Restaurantes, ropa</td></tr>
  <tr><td><b>Oligopolio</b></td><td>Pocas</td><td>Homogéneo o diferenciado</td><td>Alto, con interdependencia</td><td>Telefonía, cemento</td></tr>
  <tr><td><b>Monopolio</b></td><td>Una</td><td>Sin sustitutos cercanos</td><td>Máximo, limitado por la demanda</td><td>Distribución eléctrica en una zona</td></tr></tbody></table></div>
  <h3>Regla de decisión</h3>
  <p>Toda empresa maximiza su beneficio produciendo donde <b>IMg = CMg</b>. En competencia perfecta el ingreso marginal es igual al precio, entonces produce donde <b>p = CMg</b>. El monopolista produce menos y cobra más que en competencia.</p>
  <h3>Cerrar o seguir</h3>
  <p>En el corto plazo, una empresa con pérdidas sigue produciendo mientras el precio cubra el <b>costo variable medio</b>, porque los fijos los paga igual. Si el precio no cubre ni los variables, conviene cerrar temporalmente.</p>
  <div class="note"><b>Defensa de la competencia.</b> En Argentina la Ley 27.442 prohíbe acuerdos entre competidores para fijar precios y el abuso de posición dominante. La aplica la Autoridad Nacional de la Competencia.</div>`,
  ex:[{type:"pick",title:"Identificá la estructura de mercado",options:["Competencia perfecta","Comp. monopolística","Oligopolio","Monopolio"],items:[
    ["Miles de productores de maíz venden al precio de Chicago","Competencia perfecta"],["Tres empresas concentran casi toda la telefonía móvil","Oligopolio"],
    ["Cientos de peluquerías en una ciudad, cada una con su estilo","Comp. monopolística"],["Una única empresa con concesión de agua potable en la región","Monopolio"]]},
   {type:"tf",items:[["Una empresa en competencia perfecta puede subir su precio sin perder clientes","Falso","Si cobra más que el mercado, nadie le compra."],
    ["En el corto plazo, conviene seguir produciendo si el precio cubre el costo variable medio","Verdadero"]]}]},
 {lead:"A veces el mercado por sí solo no llega a un resultado eficiente. Ahí aparece la justificación económica de la intervención del Estado.",
  html:`<ul><li><b>Externalidades:</b> efectos sobre terceros que no se reflejan en el precio. Negativas: una fábrica que contamina un río. Positivas: la educación o la vacunación. Se corrigen con impuestos, subsidios o regulación.</li>
  <li><b>Bienes públicos:</b> no rivales (que lo use uno no impide que lo use otro) y no excluibles (no se puede impedir que alguien lo use). Ejemplos: defensa, alumbrado público. Nadie quiere pagarlos voluntariamente (problema del <i>free rider</i>), por eso los financia el Estado con impuestos.</li>
  <li><b>Información asimétrica:</b> una parte sabe más que la otra. <i>Selección adversa</i>: en el mercado de autos usados, el vendedor conoce los defectos. <i>Riesgo moral</i>: alguien asegurado se cuida menos. Por eso existen auditorías, garantías y regulación de seguros y bancos.</li>
  <li><b>Poder de mercado:</b> monopolios y carteles que restringen la producción.</li></ul>
  <div class="note"><b>Por qué importa para un contador.</b> La auditoría existe justamente por la información asimétrica entre quienes administran una empresa y quienes ponen el dinero (accionistas, bancos). El auditor reduce esa asimetría (Módulo 25).</div>`,
  ex:[{type:"pick",title:"¿Qué falla de mercado es?",options:["Externalidad","Bien público","Info. asimétrica","Poder de mercado"],items:[
    ["Una curtiembre vuelca residuos al Riachuelo","Externalidad"],["El faro que guía a todos los barcos de la costa","Bien público"],
    ["Un gerente conoce los problemas de la empresa y los accionistas no","Info. asimétrica"],["Dos cementeras acuerdan subir los precios juntas","Poder de mercado"],
    ["Un vecino planta árboles que embellecen la cuadra","Externalidad"]]}]},
],
